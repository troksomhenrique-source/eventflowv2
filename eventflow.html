<script>
/* ================= FROTA E LOGÍSTICA ================= */
const TIPOS_VEIC=["Carreta","Truck baú","VUC 3/4","Van de equipe","Munck","Utilitário de apoio"];
const FUNCOES=["Coordenação","Rigger","Montagem","Operação de som","Operação de luz","Operação de vídeo","Cenografia","Motorista","Apoio"];
function seedFrota(){
  const V=(cod,nome,tipo,placa,capKg,capCases,lugares,obs)=>({cod,nome,tipo,placa,capKg,capCases,lugares,obs,manut:false});
  return [
    V("VEI-01","Carreta sider 15 m","Carreta","QAX-2B09",24000,180,2,"Só entra em doca nivelada. Precisa de pátio para manobra."),
    V("VEI-02","Truck baú 8 t","Truck baú","PLK-7E42",12000,90,3,""),
    V("VEI-03","Truck baú 8 t","Truck baú","RTM-4C17",12000,90,3,""),
    V("VEI-04","VUC 3/4 baú","VUC 3/4","SBG-9J55",3500,28,3,"Acessa garagem com 2,90 m de altura."),
    V("VEI-05","Van de equipe","Van de equipe","HJU-1D80",800,4,9,"Transporte de pessoal, sem carga pesada."),
    V("VEI-06","Munck 12 t","Munck","TQP-6F31",6000,10,2,"Para içamento de torre e gerador."),
    V("VEI-07","Fiorino de apoio","Utilitário de apoio","MZK-2A44",650,4,2,"Compras de última hora e reposição.")
  ];
}
function ensureFrota(){
  if(!S.frota||!S.frota.length) S.frota=seedFrota();
  S.os.forEach(o=>{ if(!o.logistica) o.logistica={viagens:[],obs:""}; });
  const b=osById("OSV-2026-0150");
  if(b && !b.logistica.viagens.length){
    b.logistica.viagens=[
      {id:"V1",cod:"VEI-01",motorista:"Jonas Pereira",saida:"2026-09-28",hora:"05:00",retorno:"2026-10-02",
       obs:"Doca 4, nivelada. Credenciamento pela portaria de serviço até 26/09.",
       equipe:[{nome:"Jonas Pereira",funcao:"Motorista"},{nome:"Diego Sartori",funcao:"Coordenação"}]},
      {id:"V2",cod:"VEI-05",motorista:"Camila Rocha",saida:"2026-09-28",hora:"07:30",retorno:"2026-10-02",
       obs:"Leva a equipe técnica e o material de escritório.",
       equipe:[{nome:"Camila Rocha",funcao:"Motorista"},{nome:"Sérgio Lemos",funcao:"Operação de som"},{nome:"Tati Moraes",funcao:"Operação de vídeo"},{nome:"Rubens Maia",funcao:"Rigger"},{nome:"Equipe B · 12 montadores",funcao:"Montagem"}]}
    ];
  }
}
const veic = cod => (S.frota||[]).find(v=>v.cod===cod) || {cod,nome:cod,tipo:"—",placa:"—",capKg:0,capCases:0,lugares:0};
const icVeic = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4h8v7h-8zM9.5 6.5h2.7L14.5 9v2h-5z"/><circle cx="4.4" cy="12.4" r="1.4"/><circle cx="11.4" cy="12.4" r="1.4"/></svg>`;
/* um veículo alocado numa OS fica indisponível na janela dela */
function frotaOcupada(cod,de,ate,excluiOs){
  const out=[];
  S.os.forEach(o=>{
    if(excluiOs && o.id===excluiOs) return;
    if(o.status==="Encerrada") return;
    if(!o.logistica||!o.logistica.viagens) return;
    if(!overlap(o.montagem,o.desmontagem,de,ate)) return;
    if(o.logistica.viagens.some(v=>v.cod===cod)) out.push(o);
  });
  return out;
}
const veicLivre = (cod,de,ate,excluiOs) => !veic(cod).manut && frotaOcupada(cod,de,ate,excluiOs).length===0;

/* ---- inventário · aba Frota ---- */
function vFrota(){
  const {de,ate}=S.per;
  const fs=S.frota||[];
  return `<p class="muted" style="font-size:12px;margin:0 2px 12px">A frota usa a mesma janela de datas do inventário: <b class="mono">${dtl(de)} → ${dtl(ate)}</b>. Um veículo alocado na logística de uma OS aparece aqui como ocupado, e some da lista de disponíveis para os outros produtores.</p>
  <div class="card"><div class="tblwrap"><table><thead><tr>
    <th>Veículo</th><th>Placa</th><th>Tipo</th><th class="r">Carga (kg)</th><th class="r">Cases</th><th class="r">Lugares</th><th>Situação na janela</th><th></th></tr></thead><tbody>
  ${fs.map(v=>{const oc=frotaOcupada(v.cod,de,ate);
    return `<tr class="clickable" data-act="editarVeic" data-id="${v.cod}">
      <td><b style="font-weight:600">${esc(v.nome)}</b>${v.obs?`<br><span class="muted" style="font-size:11px">${esc(v.obs)}</span>`:""}</td>
      <td><span class="plate">${esc(v.placa)}</span></td>
      <td class="muted" style="font-size:12px">${esc(v.tipo)}</td>
      <td class="r num">${kg(v.capKg)}</td><td class="r num">${v.capCases}</td><td class="r num">${v.lugares}</td>
      <td>${v.manut?`<span class="pill warn"><span class="dot"></span>em manutenção</span>`
        :oc.length?`<span class="pill crit"><span class="dot"></span>${esc(oc[0].evento)}</span>${oc.length>1?`<span class="muted" style="font-size:11px"> +${oc.length-1}</span>`:""}`
        :`<span class="pill ok"><span class="dot"></span>livre</span>`}</td>
      <td class="r">${can("editar_inventario")?`<span class="muted" style="font-size:11px">editar</span>`:""}</td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}
function formVeic(cod){
  const v=cod?veic(cod):null;
  const f=(id,l,val,tipo,attrs,cls)=>`<div class="field ${cls||""}"><label for="${id}">${l}</label><input id="${id}" type="${tipo||"text"}" value="${esc(String(val==null?"":val))}" ${attrs||""}></div>`;
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${v?"Veículo · "+esc(v.placa):"Novo veículo da frota"}</h4><div style="flex:1"></div>
      <button class="btn sm ghost" type="button" data-act="fecharVeicForm">Fechar</button></div>
    <div class="rowf">
      ${f("vfCod","Código",v?v.cod:"","text",v?"disabled":'placeholder="VEI-08"',"s")}
      ${f("vfNome","Descrição",v?v.nome:"","text",'placeholder="Ex.: Truck baú 8 t"',"w")}
      <div class="field"><label for="vfTipo">Tipo</label><select id="vfTipo">${TIPOS_VEIC.map(t=>`<option ${v&&v.tipo===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
      ${f("vfPlaca","Placa",v?v.placa:"","text",'placeholder="ABC-1D23"',"s")}
    </div>
    <div class="rowf">
      ${f("vfKg","Carga útil (kg)",v?v.capKg:0,"number",'step="100" min="0"',"s")}
      ${f("vfCases","Cases que cabem",v?v.capCases:0,"number",'step="1" min="0"',"s")}
      ${f("vfLug","Lugares",v?v.lugares:2,"number",'step="1" min="1"',"s")}
      ${f("vfObs","Observações",v?v.obs:"","text",'placeholder="Restrição de acesso, altura, manobra…"',"w")}
      <label class="flex" style="gap:7px;font-size:12px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="vfManut" ${v&&v.manut?"checked":""} style="width:auto"> Em manutenção</label>
      <button class="btn pri go" type="submit" data-act="salvarVeic" data-id="${cod||""}">${v?"Salvar veículo":"Cadastrar veículo"}</button>
    </div>
    <p class="hint">Enter salva. Veículo em manutenção não aparece como disponível para nenhuma OS.</p></form>`;
}

/* ---- produção · aba Logística ---- */
function abaLogistica(o,ed){
  const lg=o.logistica||{viagens:[],obs:""}, t=somaTecnica(o.itens);
  const capKg=lg.viagens.reduce((s,v)=>s+veic(v.cod).capKg,0);
  const capCs=lg.viagens.reduce((s,v)=>s+veic(v.cod).capCases,0);
  const pessoas=lg.viagens.reduce((s,v)=>s+v.equipe.length,0);
  const lugares=lg.viagens.reduce((s,v)=>s+veic(v.cod).lugares,0);
  const livres=(S.frota||[]).filter(v=>!lg.viagens.some(x=>x.cod===v.cod));
  return `
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="v">${lg.viagens.length}</div><div class="k">veículos alocados</div><div class="d muted">${lugares} lugares</div></div>
    <div class="kpi"><div class="v">${pessoas}</div><div class="k">pessoas escaladas</div>
      <div class="d" style="color:${pessoas>lugares?"var(--crit)":"var(--ink3)"}">${pessoas>lugares?"faltam "+(pessoas-lugares)+" lugares":"cabe todo mundo"}</div></div>
    <div class="kpi"><div class="v">${t.cases}</div><div class="k">cases a transportar</div>
      <div class="d" style="color:${t.cases>capCs?"var(--crit)":"var(--ok)"}">${capCs} de capacidade</div></div>
    <div class="kpi"><div class="v">${kg(t.peso)}</div><div class="k">kgf de carga</div>
      <div class="d" style="color:${t.peso>capKg?"var(--crit)":"var(--ok)"}">${kg(capKg)} kg de carga útil</div></div>
  </div>
  ${lg.viagens.length&&(t.cases>capCs||t.peso>capKg||pessoas>lugares)?`<div class="verdict crit" style="margin-bottom:14px"><div><b>Frota apertada</b>
    ${t.cases>capCs?"Faltam "+(t.cases-capCs)+" cases de espaço. ":""}${t.peso>capKg?"A carga excede a capacidade em "+kg(t.peso-capKg)+" kg. ":""}${pessoas>lugares?"Faltam "+(pessoas-lugares)+" lugares para a equipe.":""}</div></div>`:""}

  ${ed?`<div style="margin-bottom:14px"><form class="addform" autocomplete="off">
    <div class="top"><h4>Alocar veículo</h4><div style="flex:1"></div>
      <span class="hint">Só aparecem os que estão livres em ${dt(o.montagem)} → ${dt(o.desmontagem)}.</span></div>
    <div class="rowf">
      <div class="field w"><label for="lgVeic">Veículo</label><select id="lgVeic">
        ${livres.map(v=>{const livre=veicLivre(v.cod,o.montagem,o.desmontagem,o.id);
          return `<option value="${v.cod}" ${livre?"":"disabled"}>${esc(v.nome)} · ${esc(v.placa)} — ${v.capCases} cases, ${v.lugares} lugares${livre?"":v.manut?" (em manutenção)":" (ocupado)"}</option>`;}).join("")||`<option value="">Todos os veículos já estão nesta OS</option>`}
      </select></div>
      <div class="field"><label for="lgMot">Motorista</label><input id="lgMot" list="dlPessoas" placeholder="Quem dirige"></div>
      <div class="field"><label for="lgSaida">Saída do galpão</label><input id="lgSaida" type="date" value="${o.montagem}"></div>
      <div class="field s"><label for="lgHora">Hora</label><input id="lgHora" type="time" value="06:00"></div>
      <button class="btn pri go" type="submit" data-act="addViagem" data-id="${o.id}">Alocar</button>
    </div><p class="hint">Enter aloca o veículo. Depois monte a equipe de cada carro abaixo.</p></form></div>`:""}
  <datalist id="dlPessoas">${USERS.map(u=>`<option value="${esc(u.nome)}">`).join("")}<option value="Equipe A · 6 montadores"><option value="Equipe B · 12 montadores"><option value="Equipe C · 8 montadores"></datalist>

  ${lg.viagens.map((v,ix)=>{const vv=veic(v.cod), excede=v.equipe.length>vv.lugares;
    return `<div class="viagem"><header>
      <span class="veic" style="border:0;padding:0"><span class="ic">${icVeic}</span></span>
      <span><h4>${esc(vv.nome)}</h4><span class="muted" style="font-size:11px">${esc(vv.tipo)} · ${vv.capCases} cases · ${kg(vv.capKg)} kg · ${vv.lugares} lugares</span></span>
      <span class="plate">${esc(vv.placa)}</span>
      <div style="flex:1"></div>
      <span class="pill ${excede?"crit":""}">${v.equipe.length}/${vv.lugares} a bordo</span>
      ${ed?`<button class="btn sm ghost" data-act="rmViagem" data-id="${o.id}" data-ix="${ix}">remover veículo</button>`:""}</header>
      <div class="pad" style="display:grid;gap:10px">
        <div class="rowf" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="flex:1;min-width:150px"><label>Motorista</label>
            <input value="${esc(v.motorista||"")}" list="dlPessoas" data-vg="${ix}" data-f="motorista" ${ed?"":"disabled"}></div>
          <div class="field" style="flex:0 0 140px"><label>Saída</label><input type="date" value="${v.saida||""}" data-vg="${ix}" data-f="saida" ${ed?"":"disabled"}></div>
          <div class="field" style="flex:0 0 100px"><label>Hora</label><input type="time" value="${v.hora||""}" data-vg="${ix}" data-f="hora" ${ed?"":"disabled"}></div>
          <div class="field" style="flex:2;min-width:180px"><label>Observação da viagem</label>
            <input value="${esc(v.obs||"")}" data-vg="${ix}" data-f="obs" placeholder="Doca, credenciamento, restrição de horário…" ${ed?"":"disabled"}></div>
        </div>
        ${ed?`<form class="addform" autocomplete="off" style="padding:10px">
          <div class="rowf">
            <div class="field w"><label for="pv${ix}n">Quem vai neste carro</label><input id="pv${ix}n" list="dlPessoas" placeholder="Nome ou equipe"></div>
            <div class="field"><label for="pv${ix}f">O que vai fazer</label><select id="pv${ix}f">${FUNCOES.map(f=>`<option>${esc(f)}</option>`).join("")}</select></div>
            <button class="btn go" type="submit" data-act="addPessoa" data-id="${o.id}" data-ix="${ix}">Embarcar</button>
          </div></form>`:""}
      </div>
      ${v.equipe.length?`<div>${v.equipe.map((p,pi)=>{const u=USERS.find(x=>x.nome===p.nome);
        return `<div class="pessoa">${u?av(u,24):`<span class="av" style="background:var(--ink3);color:#FFF;width:24px;height:24px;font-size:10px">${esc(p.nome.slice(0,2).toUpperCase())}</span>`}
        <span>${esc(p.nome)}</span><span class="fn">${esc(p.funcao)}</span>
        ${ed?`<button class="btn sm ghost" data-act="rmPessoa" data-id="${o.id}" data-ix="${ix}" data-pi="${pi}">×</button>`:""}</div>`;}).join("")}</div>`
        :`<div class="empty" style="padding:14px;font-size:12px">Ninguém embarcado ainda.</div>`}
    </div>`;}).join("")||`<div class="empty">Nenhum veículo alocado. A ordem de carga sai sem frota definida.</div>`}

  <div class="card"><header><h3>Observações da logística</h3></header><div class="pad">
    <textarea rows="3" style="font-family:var(--sans)" data-lgobs="1" ${ed?"":"disabled"}
      placeholder="Ordem de carregamento, o que sobe primeiro, retorno parcial, estacionamento da equipe…">${esc(lg.obs||"")}</textarea>
    <p class="muted" style="font-size:11.5px;margin:9px 0 0;line-height:1.55">Os veículos alocados aqui vão junto na Ordem de Carga, para o barracão saber o que encostar na doca — e ficam marcados como ocupados na frota, para os outros produtores não contarem com eles no mesmo período.</p>
  </div></div>`;
}
</script>
<script>
/* ---- ações de frota e logística ---- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(!["novoVeic","editarVeic","salvarVeic","fecharVeicForm","addViagem","rmViagem","addPessoa","rmPessoa"].includes(a)) return;
  switch(a){
    case "novoVeic": if(can("editar_inventario")){ S.veicForm=""; save(); render(); foco("vfCod"); } break;
    case "editarVeic": if(can("editar_inventario")){ S.estTab="frota"; S.veicForm=id; save(); render(); foco("vfNome"); } break;
    case "fecharVeicForm": S.veicForm=null; save(); render(); break;
    case "salvarVeic": {
      if(!can("editar_inventario")) break;
      const g=x=>document.getElementById(x).value;
      const cod=(id||g("vfCod")).trim().toUpperCase();
      if(!cod) return toast("Informe um código para o veículo.");
      if(!g("vfNome").trim()) return toast("Informe a descrição do veículo.");
      const dados={nome:g("vfNome").trim(),tipo:g("vfTipo"),placa:g("vfPlaca").trim().toUpperCase(),
        capKg:Number(g("vfKg"))||0,capCases:Number(g("vfCases"))||0,lugares:Math.max(1,Number(g("vfLug"))||1),
        obs:g("vfObs"),manut:document.getElementById("vfManut").checked};
      const ex=(S.frota||[]).find(v=>v.cod===cod);
      if(ex) Object.assign(ex,dados); else S.frota.push(Object.assign({cod},dados));
      S.veicForm=null; save(); render(); toast("Veículo "+cod+" salvo."); break;}
    case "addViagem": {
      if(!can("editar_memorial")) break;
      const o=osById(id); if(!o) break;
      const cod=document.getElementById("lgVeic").value; if(!cod) return toast("Não há veículo livre para alocar.");
      if(!veicLivre(cod,o.montagem,o.desmontagem,o.id)) return toast("Esse veículo não está livre nesta janela.");
      o.logistica.viagens.push({id:"V"+Date.now().toString(36),cod,
        motorista:document.getElementById("lgMot").value.trim(),
        saida:document.getElementById("lgSaida").value,hora:document.getElementById("lgHora").value,
        retorno:o.desmontagem,obs:"",equipe:[]});
      save(); render(); foco("lgVeic"); toast(veic(cod).nome+" alocado para esta OS."); break;}
    case "rmViagem": {if(!can("editar_memorial")) break; const o=osById(id);
      o.logistica.viagens.splice(Number(t.dataset.ix),1); save(); render(); break;}
    case "addPessoa": {
      if(!can("editar_memorial")) break;
      const o=osById(id), ix=Number(t.dataset.ix);
      const nome=document.getElementById("pv"+ix+"n").value.trim();
      if(!nome) return toast("Informe quem vai neste carro.");
      o.logistica.viagens[ix].equipe.push({nome,funcao:document.getElementById("pv"+ix+"f").value});
      save(); render(); foco("pv"+ix+"n"); break;}
    case "rmPessoa": {if(!can("editar_memorial")) break; const o=osById(id);
      o.logistica.viagens[Number(t.dataset.ix)].equipe.splice(Number(t.dataset.pi),1); save(); render(); break;}
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target; if(!can("editar_memorial")) return;
  const o=osById(S.sel); if(!o||!o.logistica) return;
  if(el.dataset && el.dataset.vg!==undefined){
    const v=o.logistica.viagens[Number(el.dataset.vg)]; if(v){ v[el.dataset.f]=el.value; save(); } }
  if(el.dataset && el.dataset.lgobs!==undefined){ o.logistica.obs=el.value; save(); }
});
</script>
<script>
/* ---------------- render ---------------- */
function render(){
  if(!podeVer(S.view)) S.view="painel";
  renderShell();
  const V={painel:vPainel,crm:vCRM,clientes:vClientes,vendas:()=>S.sel?vOSV():vVendas(),producao:vProducao,
    cargas:vCargas,estoque:vEstoque,movimentos:vMovs,agenda:vAgenda,equipe:vEquipe};
  Object.assign(V, window.VEXTRA||{});
  $("#view").innerHTML = (V[S.view]||vPainel)();
  if(S.view==="chat"){ const c=S.chats.filter(visivelPraMim); const sel=chatById(S.chatSel)&&visivelPraMim(chatById(S.chatSel))?S.chatSel:(c[0]&&c[0].id);
    if(sel){ S.chatSel=sel; marcarLido(sel); } requestAnimationFrame(rolarChat); }
}

/* ---------------- modal ---------------- */
let tmpItens=[];
function modal(title, body, footer){
  $("#modalHost").innerHTML = `<div class="ovl" data-act="fecharModal"><div class="modal" data-stop="1">
    <header><h3>${esc(title)}</h3><button class="x" data-act="fecharModal" aria-label="Fechar">×</button></header>
    <div class="body">${body}</div><footer>${footer}</footer></div></div>`;
}
const fecharModal = ()=>{ $("#modalHost").innerHTML=""; };

function mRetorno(c){
  modal("Registrar descarga · "+c.id, `
    <p style="margin:0;font-size:12.5px;color:var(--ink2)">Conferência de retorno em <b class="mono">${dtl(c.descarga)}</b>. Informe as avarias — as peças avariadas entram em manutenção e não voltam ao saldo disponível.</p>
    <div class="tblwrap" style="border:1px solid var(--line);border-radius:var(--r2)"><table style="min-width:420px"><thead><tr><th>Item</th><th class="r">Enviado</th><th class="r" style="width:110px">Avarias</th></tr></thead><tbody>
    ${c.itens.map(i=>`<tr><td>${esc(item(i.cod).nome)}<br><span class="tag">${i.cod}</span></td><td class="r num">${i.qtd}</td>
      <td class="r"><input type="number" min="0" max="${i.qtd}" value="0" data-av="${i.cod}" style="width:82px;text-align:right"></td></tr>`).join("")}
    </tbody></table></div>`,
    `<button class="btn" data-act="fecharModal">Cancelar</button><button class="btn pri" data-act="confirmarRetorno" data-id="${c.id}">Dar entrada no estoque</button>`);
}

function mMov(m){
  modal("Lançamento "+m.id, `
    <div class="flex"><span class="pill ${m.tipo==="SAÍDA"?"warn":"ok"}"><span class="dot"></span>${m.tipo}</span>
    <span class="tag">${dtl(m.data)}</span><span class="tag">${esc(m.oscId||"")}</span></div>
    <div style="font-size:13px"><b>${esc(m.ref)}</b><br><span class="muted" style="font-size:11.5px">Responsável: ${esc(m.user)}</span></div>
    <div class="tblwrap" style="border:1px solid var(--line);border-radius:var(--r2)"><table style="min-width:400px"><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Peso (kgf)</th></tr></thead><tbody>
    ${m.linhas.map(l=>`<tr><td>${esc(item(l[0]).nome)}<br><span class="tag">${l[0]}</span></td><td class="r num">${l[1]}</td><td class="r num muted">${kg(item(l[0]).peso*l[1])}</td></tr>`).join("")}
    </tbody></table></div>
    ${m.avarias?`<div class="verdict warn"><div><b>Avarias registradas</b>${m.avarias.map(a=>esc(item(a[0]).nome)+" ("+a[1]+")").join(", ")} — enviadas à manutenção.</div></div>`:""}`,
    `<button class="btn" data-act="fecharModal">Fechar</button>`);
}

/* ---------------- ações ---------------- */
function gerarOSC(osId){
  const o=osById(osId); if(!o) return;
  if(!prontoParaOSC(o)) return toast("Conclua os dois memoriais e o descritivo antes de gerar a carga.");
  if(oscDaOS(osId)) return toast("Esta OS já possui ordem de carga.");
  S.seq.osc++;
  const id="OSC-2026-0"+S.seq.osc;
  S.cargas.push({id,osId,status:"Liberada",carga:o.montagem,horaCarga:"07:00",descarga:o.desmontagem,
    veiculo:(o.logistica&&o.logistica.viagens.length)?o.logistica.viagens.map(v=>veic(v.cod).nome+" · "+veic(v.cod).placa).join(" + "):"A definir na roteirização",
    equipe:(o.logistica&&o.logistica.viagens.length)?o.logistica.viagens.reduce((s,v)=>s+v.equipe.length,0)+" pessoas em "+o.logistica.viagens.length+" veículo(s)":"A escalar",
    conferente:PERFIS.estoque.nome,
    itens:o.itens.map(i=>({...i})),obs:"Gerada automaticamente a partir de "+o.id+" pela produção."});
  o.status="Liberada"; o.etapaAtual="pronto";
  fluxo(osId, "Ordem de carga "+id+" emitida a partir de "+o.id+". Carga em "+dtl(o.montagem)+", descarga em "+dtl(o.desmontagem)+".",
    ["gerencia","estoque","producao"], "cargas", id, false);
  save(); toast("Ordem de carga "+id+" emitida para o estoque."); go("cargas",id);
}
function confirmarCarga(id){
  const c=oscById(id); if(!c) return;
  const falta=c.itens.filter(i=>{const it=item(i.cod);return it.total-it.manut-reservado(i.cod,c.carga,c.descarga,c.id)<i.qtd;});
  if(falta.length) return toast("Sem saldo para "+item(falta[0].cod).nome+" nesta janela.");
  c.status="Carregada";
  S.seq.mov++;
  const o=c.osId?osById(c.osId):null;
  S.movs.push({id:"M-"+S.seq.mov,data:c.carga,tipo:"SAÍDA",oscId:c.id,ref:o?o.evento:c.evento||c.id,
    linhas:c.itens.map(i=>[i.cod,i.qtd]),user:PERFIS[S.role].nome});
  fluxo(c.osId, "Carga confirmada em "+dtl(c.carga)+": "+c.itens.reduce((s,i)=>s+i.qtd,0)+" peças baixadas do estoque pela ordem "+c.id+".",
    ["gerencia","producao","estoque"], "cargas", c.id, false);
  save(); render(); toast("Baixa lançada em "+dtl(c.carga)+" · "+c.itens.reduce((s,i)=>s+i.qtd,0)+" peças saíram do galpão.");
}
function confirmarRetorno(id){
  const c=oscById(id); if(!c) return;
  const av=[];
  document.querySelectorAll("[data-av]").forEach(el=>{const q=Math.max(0,Math.min(Number(el.value)||0, (c.itens.find(i=>i.cod===el.dataset.av)||{qtd:0}).qtd)); if(q>0) av.push([el.dataset.av,q]);});
  av.forEach(a=>{const it=S.cat.find(x=>x.cod===a[0]); if(it) it.manut+=a[1];});
  c.status="Retornada";
  S.seq.mov++;
  const o=c.osId?osById(c.osId):null;
  S.movs.push({id:"M-"+S.seq.mov,data:c.descarga,tipo:"ENTRADA",oscId:c.id,ref:o?o.evento:c.evento||c.id,
    linhas:c.itens.map(i=>[i.cod,i.qtd-((av.find(a=>a[0]===i.cod)||[0,0])[1])]),user:PERFIS[S.role].nome, avarias:av.length?av:undefined});
  if(o) o.status="Encerrada";
  fluxo(c.osId, "Descarga registrada em "+dtl(c.descarga)+" pela ordem "+c.id+"."+(av.length?" "+av.reduce((s,a)=>s+a[1],0)+" peça(s) seguiram para manutenção.":" Retorno sem avarias."),
    ["gerencia","producao","estoque"], "movimentos", null, av.length>0);
  fecharModal(); save(); render();
  toast("Entrada registrada em "+dtl(c.descarga)+(av.length?" · "+av.reduce((s,a)=>s+a[1],0)+" peça(s) em manutenção.":"."));
}
function salvarOSV(){
  const ev=$("#fEv").value.trim(); if(!ev) return toast("Informe o nome do evento.");
  if(!tmpItens.length) return toast("Inclua ao menos um equipamento no escopo.");
  const mont=$("#fMont").value, desm=$("#fDesm").value;
  if(!mont||!desm||desm<mont) return toast("A descarga precisa ser igual ou posterior à carga.");
  S.seq.osv++;
  const id="OSV-2026-0"+S.seq.osv;
  S.os.push({id,cliente:$("#fCli").value,evento:ev,local:$("#fLoc").value||"A definir",cidade:$("#fCid").value,
    publico:Number($("#fPub").value)||0,area:Number($("#fArea").value)||100,
    montagem:mont,evIni:addDays(mont,1),evFim:addDays(mont,1),desmontagem:desm,
    valor:Number($("#fVal").value)||0,produtor:PERFIS.producao.nome,status:"Aguardando produção",criada:HOJE,
    itens:tmpItens.map(i=>({...i,aereo:item(i.cod).rig==="aereo"?i.qtd:0})),
    solo:{area:Number($("#fArea").value)||100,adm:500,admPont:600,publicoKgm2:300,torres:false,apoios:4,feito:false},
    aereo:{pontos:8,wllPonto:750,fd:1.2,fdes:1.25,wllAcess:2000,fsMin:5,vao:10,feito:false},
    descritivo:"",etapaAtual:"escopo"});
  if(S._negOrigem){const n=S.negocios.find(x=>x.id===S._negOrigem); if(n) n.osId=id; S._negOrigem=null;}
  fluxo(id, "OS "+id+" emitida e encaminhada à produção. Montagem em "+dtl(mont)+", desmontagem em "+dtl(desm)+".",
    ["gerencia","producao"], "vendas", id, true);
  S.osvForm=false; save(); toast("OS "+id+" emitida e encaminhada à produção."); go("vendas",id);
}

/* ---------------- recálculo ao vivo ---------------- */
function liveCalc(el){
  const o=osById(S.sel); if(!o) return;
  const grupo=el.dataset.calc, k=el.dataset.k;
  const val = el.type==="checkbox" ? el.checked : Number(el.value);
  o[grupo][k]=val;
  o[grupo].feito=false;
  if(grupo==="solo"&&k==="area") o.area=val;
  if(grupo==="solo"){ const r=calcSolo(o); $("#soloRes").innerHTML=soloRes(r,o.solo); $("#soloVer").innerHTML=soloVer(r); }
  else { const r=calcAereo(o); $("#aeRes").innerHTML=aeRes(r,o.aereo); $("#aeVer").innerHTML=aeVer(r,o.aereo); }
  if(el.type==="checkbox"){ save(); render(); return; }
  save();
}

/* ---------------- eventos ---------------- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]");
  if(!t){ return; }
  if(t.dataset.act==="fecharModal" && ev.target.closest("[data-stop]") && ev.target.closest("[data-act]")!==t) return;
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case "go": go(t.dataset.view, id||null); break;
    case "role": S.role=t.dataset.role; S.sel=null; if(!podeVer(S.view)) S.view="painel"; save(); render(); toast("Perfil ativo: "+PERFIS[S.role].label); break;
    case "menu": $("#side").classList.toggle("open"); $("#scrim").classList.toggle("on"); break;
    case "tema": aplicarTema(t.dataset.m); break;
    case "reset": S=seed(); ensureComms(); ensureCRM(); ensureOrc(); ensureKits(); ensureProd(); ensureFrota(); save(); render(); toast("Dados de demonstração restaurados."); break;
    case "osv": go("vendas",id); break;
    case "irOSV": fecharModal(); go("vendas",id); break;
    case "prod": go("producao",id); S.aba="escopo"; render(); break;
    case "osc": fecharModal(); go("cargas",id); break;
    case "aba": S.aba=t.dataset.aba; save(); render(); break;
    case "novaOSV": tmpItens=[]; S.osvForm=true; save(); render(); pintarPick(); foco("fEv"); break;
    case "fecharOSVForm": S.osvForm=false; save(); render(); break;
    case "addItem": {const cod=$("#fItem").value, q=Math.max(1,Number($("#fQtd").value)||1);
      const ex=tmpItens.find(i=>i.cod===cod); if(ex) ex.qtd+=q; else tmpItens.push({cod,qtd:q});
      pintarPick(); foco("fItem"); break;}
    case "rmItem": tmpItens.splice(Number(t.dataset.ix),1); pintarPick(); break;
    case "salvarOSV": salvarOSV(); break;
    case "fecharSolo": {const o=osById(id); const r=calcSolo(o);
      if(pendentes(o).length) return toast(pendentes(o).length+" linha(s) do escopo ainda sem aplicação definida.");
      if(!r.ok) return toast("Memorial reprovado — ajuste os apoios antes de concluir.");
      o.solo.feito=true; if(o.status==="Aguardando produção") o.status="Em produção";
      fluxo(o.id,"Memorial de cálculo de solo concluído: "+dec(r.dTot,1)+" kgf/m² sobre limite de "+dec(o.solo.adm,0)+" kgf/m² ("+(r.util*100).toFixed(0)+"%).",["gerencia","producao"],"producao",o.id,false);
      save(); render(); toast("Memorial de solo concluído."); break;}
    case "fecharAereo": {const o=osById(id); const r=calcAereo(o);
      if(pendentes(o).length) return toast(pendentes(o).length+" linha(s) do escopo ainda sem aplicação definida.");
      if(!r.apoiadoSolo && !r.n) return toast("Cadastre os pontos de ancoragem antes de concluir o memorial aéreo.");
      if(!r.ok && !r.apoiadoSolo) return toast("Rigging reprovado — ajuste pontos, WLL ou acessórios.");
      o.aereo.feito=true; if(o.status==="Aguardando produção") o.status="Em produção";
      fluxo(o.id, r.apoiadoSolo?"Memorial aéreo concluído: grid apoiado em torres de solo, sem içamento em pontos do local."
        :"Memorial aéreo concluído: "+dec(r.porPonto,0)+" kgf por ponto em "+r.n+" pontos ("+(r.util*100).toFixed(0)+"% do WLL) · FS "+dec(r.fs,1)+":1.",
        ["gerencia","producao"],"producao",o.id,false);
      save(); render(); toast("Memorial aéreo concluído."); break;}
    case "modelo": {const o=osById(id); $("#descTxt").value=MODELO(o); break;}
    case "salvarDesc": {const o=osById(id); o.descritivo=$("#descTxt").value;
      if(o.status==="Aguardando produção") o.status="Em produção"; save(); render();
      toast(o.descritivo.trim().length>40?"Descritivo salvo.":"Salvo, mas ainda curto para concluir a etapa."); break;}
    case "gerarOSC": gerarOSC(id); break;
    case "separar": {const c=oscById(id); c.status="Em separação";
      fluxo(c.osId,"Separação iniciada para a ordem "+c.id+". Romaneio liberado para conferência no galpão.",["gerencia","estoque","producao"],"cargas",c.id,false);
      save(); render(); toast("Separação iniciada — romaneio liberado para conferência."); break;}
    case "confirmarCarga": confirmarCarga(id); break;
    case "registrarRetorno": mRetorno(oscById(id)); break;
    case "confirmarRetorno": confirmarRetorno(id); break;
    case "verMov": mMov(S.movs.find(m=>m.id===id)); break;
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset && el.dataset.rig!==undefined && can("editar_memorial")){
    const o=osById(S.sel); if(o){ const i=o.itens[Number(el.dataset.rig)];
      if(i){ i.aereo=Math.max(0,Math.min(i.qtd,Number(el.value)||0));
        o.solo.feito=false; o.aereo.feito=false; save(); } } }
  if(el.dataset && el.dataset.calc) liveCalc(el);
  if(el.dataset && el.dataset.per){ S.per[el.dataset.per]=el.value;
    if(S.per.ate<S.per.de) S.per.ate=S.per.de; save(); render(); }
  if(el.dataset && el.dataset.filtro==="cat"){ S.filtroCat=el.value; save(); render(); }
});
document.addEventListener("change", ev=>{ if(ev.target.type==="checkbox" && ev.target.dataset.calc) liveCalc(ev.target);
  if(ev.target.dataset && ev.target.dataset.rig!==undefined) render(); });
$("#scrim").addEventListener("click",()=>{$("#side").classList.remove("open");$("#scrim").classList.remove("on");});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecharModal(); });

/* ---------------- Enter envia os formulários da página ---------------- */
function foco(id){ requestAnimationFrame(()=>{ const e=document.getElementById(id); if(e){ e.focus(); if(e.select) try{e.select();}catch(x){} } }); }
function focarAdicao(){ ["aeItem","ikKit","axNome"].some(id=>{ if(document.getElementById(id)){ foco(id); return true; } return false; }); }
document.addEventListener("submit", ev=>{
  const f=ev.target.closest("form.addform"); if(!f) return;
  ev.preventDefault();
  const b=f.querySelector('button[type="submit"][data-act]'); if(b) b.click();
});
document.addEventListener("keydown", ev=>{
  if(ev.key!=="Enter"||ev.shiftKey) return;
  const el=ev.target;
  if(!el.closest||!el.closest("form.addform")) return;
  if(el.tagName==="TEXTAREA") return;
  /* campos de composição: Enter inclui a linha em vez de salvar o conjunto */
  const par={ktQtd:"addKitItem",ktItem:"addKitItem",fQtd:"addItem",fItem:"addItem"}[el.id];
  if(par){ ev.preventDefault(); const bt=document.querySelector('[data-act="'+par+'"]'); if(bt) bt.click(); }
});

/* ---------------- boot ---------------- */
function temaAtual(){ try{ return localStorage.getItem(KEY+".theme")||"auto"; }catch(e){ return "auto"; } }
function aplicarTema(modo){
  if(modo==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",modo);
  try{ localStorage.setItem(KEY+".theme", modo==="auto"?"":modo); }catch(e){}
  pintarTema();
  if(modo!=="auto") toast("Tema "+(modo==="dark"?"escuro":"claro")+" fixado.");
}
function pintarTema(){
  const m=temaAtual();
  document.querySelectorAll("#themeSel button").forEach(b=>b.classList.toggle("on", b.dataset.m===m));
}
(function(){ const m=temaAtual(); if(m!=="auto") document.documentElement.setAttribute("data-theme",m); pintarTema(); })();
load();
ensureComms();
ensureCRM();
ensureOrc();
ensureKits();
ensureProd();
ensureFrota();
render();
</script>
