/* ================= edição e ações ================= */
const GRUPOS_BRIEF=["sala","led","palco","estrutura","som","luz","transmissao","extras"];
function setPath(n,path,val){
  if(!path.includes(".")){ n[path]=val; return; }
  const [g,f]=path.split(".");
  if(GRUPOS_BRIEF.includes(g)) n.brief[g][f]=val; else n[g][f]=val;
}
function bindNeg(el){
  const n=neg(S.sel); if(!n) return;
  const aba=S.crmAba||"qualificacao";
  if(!podeEditarCRM(aba)) return;
  const path=el.dataset.neg||el.dataset.negb;
  const val = el.type==="checkbox"?el.checked : (el.type==="number"?(Number(el.value)||0) : el.value);
  if(path.endsWith(".porte")){ aplicarPorte(n.brief, path.split(".")[0], val); save(); render(); return; }
  if(path==="sala.nome"){
    /* renomear a plenária é renomear a sala que já existe; só não pode
       colidir com o nome de uma B.U. do mesmo evento */
    const repetido = String(val).trim() && (n.brief.ambientes||[]).some(x=>
      x.nome.trim().toLowerCase()===String(val).trim().toLowerCase());
    el.style.borderColor = repetido ? "var(--crit)" : "";
    el.title = repetido ? "Já existe uma sala com esse nome neste evento." : "";
    if(repetido) return;
    n.brief.sala.nome=val; save(); return;
  }
  if(path==="sala.ancoragem"){
    n.brief.sala.ancoragem=val;
    if(val==="sim" && !n.brief.sala.pontos) n.brief.sala.pontos=12;
    if(val!=="sim") n.brief.sala.pontos=0;
    save(); render(); return;
  }
  setPath(n,path,val);
  if(path==="valor"||path==="neg.proposta") n.valor = path==="valor"?val:Math.round(val*(1-(n.neg.desconto||0)/100));
  save();
  const bc=document.getElementById("briefCalc"); if(bc) bc.innerHTML=escopoHTML(n);
  const qc=document.getElementById("qualCalc"); if(qc) qc.innerHTML=qualCalc(n);
  if(el.dataset.sw){ sec.classList.toggle("off", !el.checked); }
}
function travarCRM(){
  const aba=S.crmAba||"qualificacao";
  if(podeEditarCRM(aba)) return;
  document.querySelectorAll("#view input,#view select,#view textarea").forEach(e=>{ if(e.id!=="crmQ") e.disabled=true; });
}
const _vNegocioBase = vNegocio;
vNegocio = function(){ const h=_vNegocioBase(); requestAnimationFrame(travarCRM); return h; };

/* ---- fotos da VT ---- */
function saveGuard(){ save(); return true; }
function lerFotos(negId, files){
  const arr=[...files].filter(f=>f.type.startsWith("image/")).slice(0,12);
  if(!arr.length) return;
  let feitas=0;
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const max=1000, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        const n=neg(negId); if(!n) return;
        n.vt.fotos.push({id:"f"+Date.now()+Math.random().toString(36).slice(2,6),nome:f.name.slice(0,40),src:cv.toDataURL("image/jpeg",0.72),legenda:""});
        if(++feitas===arr.length){
          const ok=saveGuard(); render();
          toast(ok?arr.length+" foto(s) anexada(s) à visita técnica.":"Fotos anexadas, mas o navegador ficou sem espaço para guardá-las entre sessões.");
        }
      };
      img.onerror=()=>{ if(++feitas===arr.length){ save(); render(); } };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  });
}
function mFoto(negId,fid){
  const n=neg(negId), f=n.vt.fotos.find(x=>x.id===fid); if(!f) return;
  modal(f.nome, `<img src="${f.src}" alt="${esc(f.legenda||f.nome)}" style="width:100%;border-radius:var(--r2);border:1px solid var(--line)">
    <div class="field"><label for="fotoLeg">Legenda</label><input id="fotoLeg" value="${esc(f.legenda)}" placeholder="Ex.: Quadro de energia a 60 m do palco"></div>`,
    `<button class="btn" data-act="rmFoto" data-id="${negId}" data-f="${fid}" style="margin-right:auto;color:var(--crit)">Remover</button>
     <button class="btn" data-act="fecharModal">Fechar</button>
     <button class="btn pri" data-act="salvarLegenda" data-id="${negId}" data-f="${fid}">Salvar legenda</button>`);
}

/* ---- gerar OS a partir do negócio ---- */
function gerarOSVdeNegocio(negId){
  const n=neg(negId); if(!n) return;
  if(n.osId) return toast("Este negócio já gerou a OS "+n.osId+".");
  if(!n.montagem||!n.desmontagem) return toast("Defina montagem e desmontagem na Qualificação antes de gerar a OS.");
  if(n.desmontagem<n.montagem) return toast("A desmontagem não pode ocorrer antes da montagem.");
  if((n.orc?.linhas||[]).some(l=>!Number.isInteger(Number(l.qtd))||Number(l.qtd)<=0)) return toast("Para gerar a OS, use quantidades inteiras maiores que zero em cada linha do orçamento.");
  if(!n.fech.aprovado) return toast("A reunião de fechamento precisa ser aprovada antes de emitir a OS.");
  if(!(n.produtores||[]).length) return toast("Defina ao menos um produtor na Finalização antes de emitir a OS.");
  const e=(n.orc&&n.orc.linhas.length)?escopoDaOS(n):escopoDoBriefing(n);
  if(!e.length) return toast("O orçamento não tem nenhum item de estoque — não há escopo para transferir.");
  const externos=(n.orc?n.orc.linhas:[]).filter(l=>l.tipo==="externo");
  const b=n.brief, torres = b.sala.pontos<=0;
  const id=S._novoOsId||uid(), codigo=S._novoOsCodigo||proximoCodigo("OSV",S.os);
  S._novoOsId=null; S._novoOsCodigo=null;
  const valor=(n.orc&&n.orc.linhas.length)?Math.round(orcTotais(n).total):(Math.round(n.neg.proposta*(1-(n.neg.desconto||0)/100))||n.valor);
  const desc=[
    "1. OBJETO","Fornecimento, montagem, operação e desmontagem para "+n.titulo+", em "+n.local+(n.sala?" · "+n.sala:"")+", "+n.cidade+".","",
    "2. LEVANTAMENTO DA VISITA TÉCNICA", n.vt.resumo||"Visita técnica pendente na data de emissão desta OS.","",
    "3. PARÂMETROS DO LOCAL",
    "Área útil de "+dec(b.sala.area,0)+" m², pé-direito livre de "+dec(b.sala.peDireito,2)+" m, carga admissível do piso de "+b.sala.cargaPiso+" kgf/m².",
    b.sala.pontos>0?b.sala.pontos+" pontos de ancoragem disponíveis na estrutura do local.":"Local sem pontos de ancoragem liberados — grid apoiado em torres de solo.","",
    "4. ESCOPO CONFORME BRIEFING",
    [b.estrutura.tem?"Estrutura · "+b.estrutura.porte:"",b.palco.tem?"Palco · "+b.palco.porte:"",
     b.som.tem?"Som · "+b.som.porte:"",b.luz.tem?"Luz · "+b.luz.porte:"",
     b.led.tem?"Vídeo · painel "+b.led.porte:"",
     b.transmissao&&b.transmissao.tem?"Vídeo · transmissão "+b.transmissao.porte:"",
     b.cenografia&&b.cenografia.tem?"Cenografia · "+b.cenografia.porte:"",
     b.internet&&b.internet.tem?"Internet · "+b.internet.porte:""].filter(Boolean).map(x=>"— "+x).join("\n"),
    "Perfis de treliça, medidas finais e quantidades a serem definidos pela produção nesta OS.","",
    externos.length?"5. FORNECIMENTO FORA DO ESTOQUE":"",
    externos.length?externos.map(l=>"— "+l.cat+": "+l.nome+(l.fornecedor?" ("+l.fornecedor+")":"")+(l.obs?" — "+l.obs:"")).join("\n"):"",
    externos.length?"":"",
    "6. SEPARAÇÃO POR CATEGORIA",
    porCategoria(e).map(([c,its])=>"— "+c+": "+its.reduce((s,i)=>s+i.qtd,0)+" peças em "+its.length+" linha(s)").join("\n"),"",
    "7. PRODUÇÃO",
    "Responsável: "+usr(n.produtores[0]).nome+(n.produtores.length>1?" · Equipe: "+n.produtores.slice(1).map(u=>usr(u).nome).join(", "):""),"",
    "8. CRONOGRAMA",
    "Montagem "+dtl(n.montagem)+" às "+n.montagemHora+" · Evento "+dtl(n.evIni)+" às "+n.evIniHora+" · Desmontagem "+dtl(n.desmontagem)+" às "+n.desmontagemHora+".","",
    "9. RESPONSABILIDADE TÉCNICA","ART de execução a ser emitida pelo engenheiro responsável junto ao CREA antes do início da montagem."
  ].join("\n");
  const ambs=ambientes(n), pubKg=n.tipoEvento==="Social"?250:300;
  /* os itens de fora do estoque viram linha avulsa na OS: o produtor precisa
     enxergar a sublocação e o serviço que foram vendidos, sem preço */
  const avulsos=externos.map(l=>({id:uid(),cod:null,nome:l.nome,cat:l.cat,qtd:Number(l.qtd)||1,
    amb:ambDaLinha(l), aereo:null, obs:[l.fornecedor?"Fornecedor: "+l.fornecedor:"",l.obs||""].filter(Boolean).join(" · ")}));
  S.os.push({id,codigo,cliente:n.cliente,evento:n.titulo,local:n.local+(n.sala?" · "+n.sala:""),cidade:n.cidade,
    publico:n.publico||0,area:b.sala.area||200,
    montagem:n.montagem,evIni:n.evIni||n.montagem,evFim:n.evFim||n.evIni||n.montagem,desmontagem:n.desmontagem,
    valor,produtores:[...n.produtores],produtor:usr(n.produtores[0]).nome,status:"Aguardando produção",criada:HOJE,negId:n.id,
    ambientes:ambs.map(a=>({id:a.id,nome:a.nome,principal:!!a.principal})),
    itens:[...e.map(i=>({...i,id:uid(),aereo:item(i.cod).rig==="aereo"?i.qtd:0})), ...avulsos],
    solo:{area:b.sala.area||200,adm:b.sala.cargaPiso||500,admPont:600,publicoKgm2:pubKg,torres,apoios:4,feito:false},
    aereo:{pontos:b.sala.pontos||8,wllPonto:750,fd:1.2,fdes:1.25,wllAcess:2000,fsMin:5,vao:b.estrutura.vao||10,feito:false},
    /* cada sala de B.U. começa com os números que o briefing anotou para ela */
    mem:Object.fromEntries(ambs.filter(a=>!a.principal).map(a=>[a.id,{
      solo:{area:a.area||100,adm:a.cargaPiso||500,admPont:600,publicoKgm2:pubKg,torres:!(a.pontos>0),apoios:4,feito:false},
      aereo:{pontos:a.pontos||0,wllPonto:750,fd:1.2,fdes:1.25,wllAcess:2000,fsMin:5,vao:10,feito:false},
      ancoragens:null}])),
    descritivo:desc,etapaAtual:"escopo"});
  n.osId=id; n.etapa="finalizacao"; n.valor=valor;
  /* a OS nova precisa das estruturas de produção e de logística prontas */
  ensureProd(); ensureFrota();
  const ch=canalDaOS(id); if(ch){ ch.nome=n.titulo; ch.membros=[...new Set([...ch.membros,...n.produtores])]; }
  fluxo(id,"OS "+codigo+" gerada a partir do negócio "+n.codigo+" e atribuída a "+n.produtores.map(u=>usr(u).nome).join(", ")+". Escopo, datas e parâmetros do local herdados do briefing e da visita técnica.",
    ["gerencia","producao"],"vendas",id,true);
  if(n.vt.fotos.length) fluxo(id,n.vt.fotos.length+" foto(s) da visita técnica ficaram anexadas ao negócio "+n.codigo+".",["producao"],"crm",n.id,false);
  save(); toast("OS "+codigo+" emitida com o escopo do briefing."); go("vendas",id);
}

function acaoCRM(a, id, t){
  t = t || {dataset:{}};
  const CRM=["lead","aprovarFech","reabrirFech","setAnc","negocio","crmAba","avancar","novoNegocio","gerarOSVdeNegocio","addNota","usarSugerido","st3d","addFotos","verFoto","rmFoto","salvarLegenda","salvarCliente","editarCliente","fecharCliForm","addAmbiente","rmAmbiente"];
  if(!CRM.includes(a)) return;
  switch(a){
    case "lead": {if(S.role!=="gerencia") break; const n=neg(id), u=t.dataset.u;
      n.produtores=[u,...(n.produtores||[]).filter(x=>x!==u)]; save(); render(); toast(usr(u).nome+" agora responde pela OS."); break;}
    case "aprovarFech": {if(S.role!=="gerencia") break; const n=neg(id);
      n.fech.aprovado=true; n.fech.aprovadoPor=me().id; n.fech.aprovadoEm=nowTs();
      if(!n.fech.reuniao){ n.fech.reuniao=HOJE; n.fech.hora=tsHora(nowTs()); }
      if(etapaIx(n.etapa)<etapaIx("finalizacao")) n.etapa="finalizacao";
      S.crmAba="finalizacao"; save(); render();
      avisar("Fechamento de "+n.titulo+" aprovado na reunião de gerência. Liberado para emissão da Ordem de Serviço.",["gerencia","producao"],"crm",n.id,"fluxo");
      toast("Fechamento aprovado — pode gerar a OS."); break;}
    case "reabrirFech": {if(S.role!=="gerencia") break; const n=neg(id);
      n.fech.aprovado=false; n.fech.aprovadoPor=""; n.fech.aprovadoEm="";
      if(!n.osId && n.etapa==="finalizacao") n.etapa="fechamento";
      save(); render(); toast("Fechamento reaberto para revisão."); break;}
    case "setAnc": {if(!podeEditarCRM("briefing")) break; const n=neg(id), v=t.dataset.v;
      n.brief.sala.ancoragem=v;
      if(v==="sim" && !n.brief.sala.pontos) n.brief.sala.pontos=12; if(v!=="sim") n.brief.sala.pontos=0;
      save(); render(); break;}
    case "negocio": S.crmAba="qualificacao"; go("crm",id); break;
    case "crmAba": S.crmAba=t.dataset.a; save(); render(); break;
    case "avancar": {const n=neg(id), i=etapaIx(n.etapa);
      if(i<ETAPAS.length-1){ n.etapa=ETAPAS[i+1][0]; S.crmAba=n.etapa; save(); render();
        toast("Negócio movido para "+ETAPAS[i+1][1]+".");
        if(n.etapa==="vt") avisar("Visita técnica pendente em "+n.local+" para o negócio "+n.id+".",["gerencia","producao"],"crm",n.id,"info");
        if(n.etapa==="tresd"&&n.tresd.necessario) avisar("Projeto 3D solicitado para "+n.titulo+".",["gerencia","producao"],"crm",n.id,"info"); }
      break;}
    case "novoNegocio": {
      if(!S.clientes.length){ go("clientes");
        return toast("Cadastre o cliente primeiro — o negócio nasce ligado a ele."); }
      const n=Object.assign({id:uid(),codigo:proximoCodigo("N",S.negocios),titulo:"Nova oportunidade",cliente:S.clientes[0].id,etapa:"qualificacao",valor:0,resp:me().id,
        temp:"morno",recorrente:false,eventosAnteriores:0,tipoEvento:"Corporativo",local:"",sala:"",endereco:"",cidade:"São Paulo · SP",
        publico:0,origem:"Inbound",prazoDecisao:"",montagem:addDays(HOJE,30),montagemHora:"07:00",evIni:addDays(HOJE,32),evIniHora:"19:00",
        evFim:addDays(HOJE,32),evFimHora:"23:00",desmontagem:addDays(HOJE,33),desmontagemHora:"22:00",osId:null,
        brief:vazioBrief(),vt:vazioVT(),tresd:vazio3D(),briefNotas:[],
        neg:{proposta:0,desconto:0,condicoes:"50% na assinatura · 50% até 5 dias antes da montagem",concorrentes:"",probabilidade:50,previsao:""}});
      S.negocios.push(n);
      /* os normalizadores dão ao negócio novo o orçamento, o fechamento e o
         resto das estruturas que as abas esperam encontrar prontas */
      ensureCRM(); ensureOrc();
      S.crmAba="qualificacao"; save(); go("crm",n.id); toast("Negócio "+n.codigo+" criado. Comece pela qualificação."); break;}
    case "addAmbiente": {
      if(!podeEditarCRM("briefing")) break;
      const el=document.getElementById("ambNome"); const nome=(el?el.value:"").trim();
      if(!nome) return toast("Dê um nome à sala — B.U. Vendas, Credenciamento, o que for.");
      const n=neg(id); n.brief.ambientes=n.brief.ambientes||[];
      if(ambientes(n).some(a=>a.nome.toLowerCase()===nome.toLowerCase()))
        return toast("Já existe uma sala com esse nome neste evento.");
      n.brief.ambientes.push(Object.assign(vazioAmbiente(nome),{cargaPiso:n.brief.sala.cargaPiso||500}));
      save(); render(); foco("ambNome"); toast(nome+" entrou no evento."); break;}
    case "rmAmbiente": {
      if(!podeEditarCRM("briefing")) break;
      const n=neg(id), aid=t.dataset.a, alvo=(n.brief.ambientes||[]).find(a=>a.id===aid);
      if(!alvo) break;
      const usadas=(n.orc?n.orc.linhas:[]).filter(l=>ambDaLinha(l)===aid).length;
      /* o que estava naquela sala volta para a plenária em vez de sumir do orçamento */
      (n.orc?n.orc.linhas:[]).forEach(l=>{ if(ambDaLinha(l)===aid) l.amb=PLENARIA; });
      n.brief.ambientes=n.brief.ambientes.filter(a=>a.id!==aid);
      save(); render();
      toast(usadas?alvo.nome+" removida — "+usadas+" linha(s) voltaram para a plenária.":alvo.nome+" removida."); break;}
    case "editarCliente": if(can("criar_negocio")){ S.cliEdit=id; render(); foco("clNome"); } break;
    case "fecharCliForm": S.cliEdit=null; render(); break;
    case "salvarCliente": {
      if(!can("criar_negocio")) break;
      const g=x=>(document.getElementById(x)||{value:""}).value;
      const nome=g("clNome").trim();
      if(!nome) return toast("O nome do cliente é obrigatório.");
      const dados={nome, tipo:g("clTipo"), doc:g("clDoc").trim(), contato:g("clContato").trim(),
                   tel:g("clTel").trim(), cidade:g("clCidade").trim()};
      const ex=id?S.clientes.find(c=>c.id===id):null;
      if(ex) Object.assign(ex,dados);
      else S.clientes.push(Object.assign({id:uid(),desde:HOJE.slice(0,4)},dados));
      S.cliEdit=null; save(); render(); foco("clNome");
      toast(ex?"Cliente atualizado.":nome+" entrou na carteira."); break;}
    case "gerarOSVdeNegocio": gerarOSVdeNegocio(id); break;
    case "addNota": {const el=document.getElementById("briefNota"); if(!el||!el.value.trim()) break;
      neg(id).briefNotas.push({id:uid(),ts:nowTs(),autor:me().id,txt:el.value.trim()}); el.value="";
      save(); document.getElementById("notasLista").innerHTML=notasHTML(neg(id)); break;}
    case "usarSugerido": {const n=neg(id); n.valor=valorSugerido(n); n.neg.proposta=n.valor; save(); render(); toast("Valor atualizado para "+brl(n.valor)+"."); break;}
    case "st3d": {const n=neg(id); n.tresd.status=t.dataset.s; n.tresd.necessario=true;
      if(t.dataset.s==="Enviado ao cliente") n.tresd.revisoes++;
      save(); render(); toast("Projeto 3D: "+t.dataset.s.toLowerCase()+"."); break;}
    case "addFotos": {const i=document.getElementById("vtInput"); if(i) i.click(); break;}
    case "verFoto": mFoto(S.sel,id); break;
    case "rmFoto": {const n=neg(id); n.vt.fotos=n.vt.fotos.filter(f=>f.id!==t.dataset.f); fecharModal(); save(); render(); toast("Foto removida."); break;}
    case "salvarLegenda": {const n=neg(id), f=n.vt.fotos.find(x=>x.id===t.dataset.f);
      if(f) f.legenda=document.getElementById("fotoLeg").value; fecharModal(); saveGuard(); render(); break;}
  }
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  acaoCRM(t.dataset.act, t.dataset.id, t);
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset && (el.dataset.neg!==undefined||el.dataset.negb!==undefined)) bindNeg(el);
  if(el.dataset && el.dataset.crmq!==undefined){ S.crmQ=el.value; const p=el.selectionStart; render();
    const f=document.getElementById("crmQ"); if(f){ f.focus(); f.setSelectionRange(p,p); } }
  if(el.id==="vtInput"&&el.files) lerFotos(S.sel, el.files);
  if(el.dataset && el.dataset.amb!==undefined) bindAmbiente(el);
});
/* edição direta dos campos de cada sala, sem redesenhar a tela a cada tecla */
function bindAmbiente(el){
  if(!podeEditarCRM("briefing")) return;
  const n=neg(S.sel); if(!n) return;
  const a=(n.brief.ambientes||[]).find(x=>x.id===el.dataset.amb); if(!a) return;
  const f=el.dataset.f;
  if(f!=="nome"){ a[f]=Number(el.value)||0; save(); return; }
  /* duas salas com o mesmo nome no mesmo evento não passam; avisa em vez
     de deixar a gravação quebrar lá na frente */
  const novo=el.value;
  const repetido = novo.trim() && ambientes(n).some(x=>x.id!==a.id &&
    x.nome.trim().toLowerCase()===novo.trim().toLowerCase());
  el.style.borderColor = repetido ? "var(--crit)" : "";
  if(repetido){ el.title="Já existe uma sala com esse nome neste evento."; return; }
  el.title=""; a.nome=novo; save();
}
document.addEventListener("change", ev=>{
  const el=ev.target, n=neg(S.sel);
  if(el.type==="checkbox" && el.dataset && (el.dataset.neg!==undefined||el.dataset.negb!==undefined)) bindNeg(el);
  if(el.tagName==="SELECT" && el.dataset && (el.dataset.neg!==undefined||el.dataset.negb!==undefined)) bindNeg(el);
  if(!n) return;
  if(el.dataset && el.dataset.prod!==undefined && S.role==="gerencia"){
    const u=el.dataset.prod; n.produtores=n.produtores||[];
    n.produtores = el.checked? [...new Set([...n.produtores,u])] : n.produtores.filter(x=>x!==u);
    save(); render(); }
  if(el.dataset && el.dataset.fechchk!==undefined && S.role==="gerencia"){ n.fech.pauta[+el.dataset.fechchk].ok=el.checked; save(); render(); }
  if(el.dataset && el.dataset.fechp!==undefined && S.role==="gerencia"){
    const u=el.dataset.fechp; n.fech.participantes = el.checked? [...new Set([...n.fech.participantes,u])] : n.fech.participantes.filter(x=>x!==u); save(); render(); }
  if(el.dataset && el.dataset.vtchk!==undefined && podeEditarCRM("vt")){ n.vt.checklist[+el.dataset.vtchk].ok=el.checked; save(); render(); }
  if(el.dataset && el.dataset.vtq!==undefined && podeEditarCRM("vt")){
    const u=el.dataset.vtq; n.vt.quem = el.checked? [...new Set([...n.vt.quem,u])] : n.vt.quem.filter(x=>x!==u); save(); render(); }
  if(el.id==="vtInput"&&el.files&&el.files.length) lerFotos(S.sel, el.files);
});

<script>
/* ================= ORÇAMENTO ================= */
const CATORC=[...CATEGORIAS,"Serviços","Logística"];
const vazioOrc = () => ({linhas:[],desconto:0,condicoes:"50% na assinatura · 50% até 5 dias antes da montagem",
  validade:"",obsGeral:"",probabilidade:50,previsao:"",concorrentes:""});
let _orcSeq=0;
const novaLinhaId = () => uid();

function ensureOrc(){
  S.negocios.forEach(n=>{
    if(!n.orc){
      n.orc=vazioOrc();
      const g=n.neg||{};
      n.orc.desconto=g.desconto||0; n.orc.condicoes=g.condicoes||n.orc.condicoes;
      n.orc.probabilidade=g.probabilidade||50; n.orc.previsao=g.previsao||""; n.orc.concorrentes=g.concorrentes||"";
      if(n.brief && n.brief.sala.area) puxarBriefing(n,true);
      /* negócios já fechados ganham as linhas externas que apareceram na prática */
      if(n.osId){
        const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
        n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cat:"Serviços",nome:"Equipe de montagem e operação",
          qtd:1,dias,unit:Math.round((n.neg.proposta||60000)*0.12/dias),modo:"diaria",fornecedor:"Equipe própria",obs:"Montadores, operadores de som/luz e coordenação em campo."});
        n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cat:"Logística",nome:"Frete ida e volta",
          qtd:1,dias:1,unit:Math.round((n.neg.proposta||60000)*0.04),modo:"fechado",fornecedor:"Frota própria",obs:"Carreta ou truck conforme volume."});
        n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cat:"Serviços",nome:"ART de execução · CREA",
          qtd:1,dias:1,unit:780,modo:"fechado",fornecedor:"Eng. Rubens Maia",obs:"Emissão antes do início da montagem."});
      }
    }
    if(!n.orc.linhas) n.orc.linhas=[];
  });
}
function puxarBriefing(n,silencioso){
  const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
  const e=escopoDoBriefing(n);
  const jaTem=new Set(n.orc.linhas.filter(l=>l.tipo==="estoque").map(l=>l.cod));
  let add=0;
  e.forEach(i=>{ if(jaTem.has(i.cod)) return;
    const it=item(i.cod);
    n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod:i.cod,nome:it.nome,cat:it.cat,
      qtd:i.qtd,dias,unit:it.diaria,modo:"diaria",obs:""});
    add++; });
  if(!silencioso) toast(add?add+" linha(s) trazida(s) do briefing.":"O orçamento já contém tudo que o briefing sugere.");
  return add;
}
function orcTotais(n){
  const o=n.orc, porCat={}, sub={estoque:0,externo:0};
  o.linhas.forEach(l=>{
    const v=(Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0);
    porCat[l.cat]=(porCat[l.cat]||0)+v; sub[l.tipo]+=v;
  });
  const subtotal=sub.estoque+sub.externo;
  const descV=subtotal*(Number(o.desconto)||0)/100;
  return {porCat,subEstoque:sub.estoque,subExterno:sub.externo,subtotal,descV,total:subtotal-descV};
}
const linhasEstoque = n => (n.orc?n.orc.linhas:[]).filter(l=>l.tipo==="estoque");
/* o escopo leva a sala e a observação junto — é o que o produtor precisa ver */
const escopoDaOS = n => linhasEstoque(n).map(l=>({cod:l.cod,qtd:Number(l.qtd)||0,
  amb:ambDaLinha(l), obs:l.obs||""})).filter(i=>i.qtd>0);

/* ---- seleção múltipla do orçamento ---- */
let SELO = new Set(), SELO_ANC = null;
const selOrc = id => SELO.has(id);
function limparSelOrc(){ SELO=new Set(); SELO_ANC=null; }
function ordemOrc(n){
  const out=[], ambs=ambientes(n);
  ambs.forEach(a=>CATORC.forEach(c=>
    n.orc.linhas.filter(l=>ambDaLinha(l)===a.id && l.cat===c).forEach(l=>out.push(l.id))));
  n.orc.linhas.forEach(l=>{ if(!out.includes(l.id)) out.push(l.id); });
  return out;
}
function marcarOrc(n, id, comShift){
  const ordem=ordemOrc(n);
  if(comShift && SELO_ANC && ordem.includes(SELO_ANC)){
    const a=ordem.indexOf(SELO_ANC), b=ordem.indexOf(id);
    if(b>=0){ const [de,ate]=a<b?[a,b]:[b,a];
      for(let k=de;k<=ate;k++) SELO.add(ordem[k]);
      return; }
  }
  if(SELO.has(id)) SELO.delete(id); else SELO.add(id);
  SELO_ANC=id;
}
function barraSelOrc(n){
  if(!SELO.size) return "";
  const ambs=ambientes(n), sel=n.orc.linhas.filter(l=>SELO.has(l.id));
  const total=sel.reduce((t,l)=>t+(Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0),0);
  return `<div class="selbar">
    <b>${SELO.size} linha(s)</b><span class="muted" style="font-size:11.5px">${brl(total)}</span>
    ${ambs.length>1?`<label>mover para<select data-loteorc="amb">
      <option value="">…</option>${ambs.map(a=>`<option value="${a.id}">${esc(a.nome)}</option>`).join("")}</select></label>`:""}
    <label>diárias<input type="number" min="1" placeholder="…" data-loteorc="dias" style="width:66px"></label>
    <div style="flex:1"></div>
    <button class="btn sm ghost" data-act="loteOrcRm" data-id="${n.id}">Remover</button>
    <button class="btn sm ghost" data-act="loteOrcNada">Limpar seleção</button>
  </div>`;
}

    <div style="border-top:1px solid var(--line2);margin-top:6px;padding-top:6px">

    </div>`;
}
function orcTotalHTML(n){

  return `<div class="totrow"><span>Subtotal</span><b>${brl(t.subtotal)}</b></div>

function repintarOrc(n,ix){
  const t=orcTotais(n);
  if(ix!=null){ const l=n.orc.linhas[ix], c=document.getElementById("sub"+ix);
    if(l&&c) c.textContent=brl((Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0)); }
  const r=document.getElementById("orcResumo"); if(r) r.innerHTML=orcResumoHTML(n);

/* ---- eventos ---- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(!["orcModo","puxarBrief","rmLinha","salvarEstoque","salvarExterno","loteOrcRm","loteOrcNada"].includes(a)) return;
  if(S.role!=="gerencia") return;
  const n=neg(id);
  switch(a){
    case "loteOrcNada": limparSelOrc(); render(); break;
    case "loteOrcRm": {
      const alvo=n.orc.linhas.filter(l=>SELO.has(l.id)); if(!alvo.length) break;
      n.orc.linhas=n.orc.linhas.filter(l=>!SELO.has(l.id));
      limparSelOrc(); sincOrc(n); save(); render();
      toast(alvo.length+" linha(s) removida(s) do orçamento."); break;}
    case "orcModo": S.orcModo=t.dataset.m; save(); render(); focarAdicao(); break;
    case "puxarBrief": puxarBriefing(n); sincOrc(n); save(); render(); break;
    case "rmLinha": n.orc.linhas.splice(Number(t.dataset.ix),1); sincOrc(n); save(); render(); break;
    case "salvarEstoque": {
      const esc0=document.getElementById("aeItem").value;
      const qtd=Math.max(1,Number(document.getElementById("aeQtd").value)||1);
      const dias=Math.max(1,Number(document.getElementById("aeDias").value)||1);
      const obs=document.getElementById("aeObs").value;
      const amb=(document.getElementById("aeAmb")||{}).value||PLENARIA;
      /* o kit entra aberto: o estoque separa peça a peça e a disponibilidade é conferida item a item */
      if(esc0.startsWith("KIT:")){
        const k=kitById(esc0.slice(4)); if(!k) break;
        k.itens.forEach(x=>{ const it=item(x.cod);
          const ex=n.orc.linhas.find(l=>l.tipo==="estoque"&&l.cod===x.cod&&ambDaLinha(l)===amb);
          if(ex) ex.qtd+=x.qtd*qtd;
          else n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod:x.cod,nome:it.nome,cat:it.cat,amb,
            qtd:x.qtd*qtd,dias,unit:it.diaria,modo:"diaria",obs:obs||k.nome}); });
        sincOrc(n); save(); render(); focarAdicao();
        toast(k.nome+" aberto em "+k.itens.length+" linhas."); break;
      }
      const it=item(esc0);
      const ex=n.orc.linhas.find(l=>l.tipo==="estoque"&&l.cod===esc0&&ambDaLinha(l)===amb);
      if(ex){ ex.qtd+=qtd; }
      else n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod:esc0,nome:it.nome,cat:it.cat,amb,qtd,
        dias,unit:it.diaria,modo:"diaria",obs});
      sincOrc(n); save(); render(); focarAdicao(); toast(it.nome+" adicionado ao orçamento."); break;}
    case "salvarExterno": {
      const nome=document.getElementById("axNome").value.trim();
      if(!nome) return toast("Descreva o item antes de adicionar.");
      n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cod:null,nome,cat:document.getElementById("axCat").value,
        qtd:Math.max(1,Number(document.getElementById("axQtd").value)||1),
        dias:Math.max(1,Number(document.getElementById("axDias").value)||1),
        unit:Number(document.getElementById("axUnit").value)||0,
        modo:document.getElementById("axModo").value,
        amb:(document.getElementById("axAmb")||{}).value||PLENARIA,
        fornecedor:document.getElementById("axForn").value,obs:document.getElementById("axObs").value});
      sincOrc(n); save(); render(); focarAdicao(); toast("Item externo incluído."); break;}
  }
});
/* clique nas caixas do orçamento: shift marca o intervalo */
document.addEventListener("click", ev=>{
  const el=ev.target;
  if(!el.dataset || el.dataset.selorc===undefined) return;
  if(S.role!=="gerencia") return;
  const n=neg(S.sel); if(!n||!n.orc) return;
  marcarOrc(n, el.dataset.selorc, ev.shiftKey);
  render();
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(S.role==="gerencia" && el.dataset && el.dataset.selorctudo!==undefined){
    const n=neg(S.sel); if(!n||!n.orc) return;
    const todos=n.orc.linhas.every(l=>SELO.has(l.id));
    n.orc.linhas.forEach(l=>{ if(todos) SELO.delete(l.id); else SELO.add(l.id); });
    if(!todos && n.orc.linhas.length) SELO_ANC=n.orc.linhas[n.orc.linhas.length-1].id;
    render(); return;
  }
  if(S.role==="gerencia" && el.dataset && el.dataset.loteorc!==undefined && el.value){
    const n=neg(S.sel); if(!n||!n.orc) return;
    const campo=el.dataset.loteorc, alvo=n.orc.linhas.filter(l=>SELO.has(l.id));
    alvo.forEach(l=>{ l[campo] = campo==="dias" ? Math.max(1,Number(el.value)||1) : el.value; });
    sincOrc(n); save(); render();
    toast(alvo.length+" linha(s) atualizada(s)."); return;
  }
  if(S.role==="gerencia" && el.dataset && el.dataset.orc!==undefined && el.dataset.f==="amb"){
    const n=neg(S.sel); if(!n||!n.orc) return;
    const l=n.orc.linhas[Number(el.dataset.orc)]; if(!l) return;
    l.amb=el.value; sincOrc(n); save(); render();
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target; if(S.role!=="gerencia") return;
  const n=neg(S.sel); if(!n||!n.orc) return;
  if(el.dataset && el.dataset.orc!==undefined){
    const l=n.orc.linhas[Number(el.dataset.orc)]; if(!l) return;
    const f=el.dataset.f;
    if(f==="amb"){ l.amb=el.value; sincOrc(n); save(); render(); return; }
    l[f] = f==="obs" ? el.value : (Number(el.value)||0);
    sincOrc(n); save(); repintarOrc(n,Number(el.dataset.orc));
  }
  if(el.dataset && el.dataset.orcg!==undefined){
    const f=el.dataset.orcg;
    n.orc[f] = (f==="desconto"||f==="probabilidade") ? (Number(el.value)||0) : el.value;
    sincOrc(n); save(); repintarOrc(n,null);
  }
});
document.addEventListener("change", ev=>{
  const el=ev.target; if(S.role!=="gerencia") return;
  if(el.dataset && (el.dataset.orc!==undefined||el.dataset.orcg!==undefined)) render();
});

/* mantém os campos antigos em sincronia com o orçamento */
function sincOrc(n){
  const t=orcTotais(n);
  n.neg.proposta=Math.round(t.subtotal); n.neg.desconto=n.orc.desconto;
  n.neg.condicoes=n.orc.condicoes; n.neg.probabilidade=n.orc.probabilidade;
  n.neg.previsao=n.orc.previsao; n.neg.concorrentes=n.orc.concorrentes;
  n.valor=Math.round(t.total);
}
</script>

.spec b{color:var(--ink);font-weight:600}
</style>
<script>
/* ================= KITS E FICHA DE ITEM ================= */
function seedKits(){ return []; }
function ensureKits(){ if(!S.kits) S.kits=[];
  S.cat.forEach(c=>{ const o=CAT.find(x=>x.cod===c.cod);
    if(c.porCase===undefined) c.porCase=o?o.porCase:1;
    if(c.watts===undefined) c.watts=o?o.watts:0; }); }
const kitById = cod => (S.kits||[]).find(k=>k.cod===cod);
const cases = (cod,qtd) => { const it=item(cod); const pc=Number(it.porCase)||1; return Math.ceil(qtd/pc); };
function somaTecnica(itens){
  let peso=0,w=0,cs=0,pecas=0;
  itens.forEach(i=>{ if(!i.cod) return;   /* linha avulsa não pesa nem ocupa case */
    const it=item(i.cod);
    peso+=(it.peso||0)*i.qtd; w+=(it.watts||0)*i.qtd; cs+=cases(i.cod,i.qtd); pecas+=i.qtd; });
  return {peso,w,cases:cs,pecas,kva:w/1000/0.8};
}
const kwFmt = w => w>=1000? dec(w/1000,1)+" kW" : kg(w)+" W";

/* ---- inventário: abas, colunas novas e kits ---- */
function vEstoqueNovo(){
  const tab=S.estTab||"itens";
  const ed=can("editar_inventario");
  const head=`<div class="between" style="margin-bottom:12px"><div class="tabs">
      <button class="${tab==="itens"?"on":""}" data-act="estTab" data-t="itens">Itens</button>
      <button class="${tab==="kits"?"on":""}" data-act="estTab" data-t="kits">Kits</button>
      <button class="${tab==="frota"?"on":""}" data-act="estTab" data-t="frota">Frota</button></div>
    ${ed?`<div class="flex" style="gap:7px">
      ${tab==="itens"?`<button class="btn ${S.itemForm!=null?"":"pri"}" data-act="${S.itemForm!=null?"fecharItemForm":"novoItem"}">${S.itemForm!=null?"Fechar formulário":"+ Novo item"}</button>`
        :tab==="kits"?`<button class="btn ${S.kitForm!=null?"":"pri"}" data-act="${S.kitForm!=null?"fecharKitForm":"novoKit"}">${S.kitForm!=null?"Fechar formulário":"+ Novo kit"}</button>`
        :`<button class="btn ${S.veicForm!=null?"":"pri"}" data-act="${S.veicForm!=null?"fecharVeicForm":"novoVeic"}">${S.veicForm!=null?"Fechar formulário":"+ Novo veículo"}</button>`}</div>`:""}</div>`;
  const painel = tab==="itens" ? (ed && S.itemForm!=null ? `<div style="margin-bottom:14px">${formItem(S.itemForm)}</div>` : "")
    : tab==="kits" ? (ed && S.kitForm!=null ? `<div style="margin-bottom:14px">${formKit(S.kitForm)}</div>` : "")
    : (ed && S.veicForm!=null ? `<div style="margin-bottom:14px">${formVeic(S.veicForm)}</div>` : "");
  const corpo = tab==="kits" ? vKits() : tab==="frota" ? vFrota() : vEstoque();
  const janela = tab==="frota" ? `<div class="card" style="margin-bottom:14px"><div class="pad"><div class="flex" style="gap:12px;align-items:flex-end">
      <div class="field" style="width:150px"><label for="perDe">Data da carga</label><input id="perDe" type="date" value="${S.per.de}" data-per="de"></div>
      <div class="field" style="width:150px"><label for="perAte">Data da descarga</label><input id="perAte" type="date" value="${S.per.ate}" data-per="ate"></div>
      <div style="flex:1"></div>
      <span class="pill">${(S.frota||[]).filter(v=>veicLivre(v.cod,S.per.de,S.per.ate)).length} de ${(S.frota||[]).length} livres na janela</span>
    </div></div></div>` : "";
  return head + painel + janela + corpo;
}
function vKits(){
  const ks=S.kits||[];
  return `<p class="muted" style="font-size:12px;margin:0 2px 12px">Um kit é uma composição pronta. Ao entrar num orçamento ele se abre nos itens que o formam, e o estoque continua controlado peça a peça.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start">
  ${ks.map(k=>{const t=somaTecnica(k.itens);
    const sem=k.itens.filter(i=>{const it=item(i.cod);return it.total-it.manut<i.qtd;});
    return `<div class="kitcard"><header><h4>${esc(k.nome)}</h4><span class="tag" style="margin-left:auto">${k.cod}</span></header>
      <div class="pad" style="padding:10px 12px;display:grid;gap:8px">
        <div class="flex" style="gap:6px"><span class="pill">${esc(k.cat)}</span>
          <span class="spec"><b>${t.pecas}</b> peças</span><span class="spec"><b>${t.cases}</b> cases</span>
          <span class="spec"><b>${kg(t.peso)}</b> kgf</span>${t.w?`<span class="spec"><b>${kwFmt(t.w)}</b></span>`:""}</div>
        ${k.obs?`<p style="margin:0;font-size:12px;color:var(--ink2);line-height:1.45">${esc(k.obs)}</p>`:""}
      </div>
      <div class="comp">${k.itens.map(i=>{const it=item(i.cod);
        return `<div><b>${i.qtd}×</b><span>${esc(it.nome)}</span><u>${cases(i.cod,i.qtd)} case${cases(i.cod,i.qtd)>1?"s":""}${it.watts?" · "+kwFmt(it.watts*i.qtd):""}</u></div>`;}).join("")}</div>
      <footer>${can("ver_valores")?`<span class="num" style="font-weight:600">${brl(k.itens.reduce((s,i)=>s+item(i.cod).diaria*i.qtd,0))}<span class="muted" style="font-weight:400;font-size:11px">/diária</span></span>`:""}
        ${sem.length?`<span class="pill crit">${sem.length} item(ns) sem saldo</span>`:`<span class="pill ok">completo no galpão</span>`}
        <div style="flex:1"></div>
        ${can("editar_inventario")?`<button class="btn sm" data-act="editarKit" data-id="${k.cod}">Editar</button>`:""}</footer>
    </div>`;}).join("")||`<div class="empty">Nenhum kit cadastrado.</div>`}</div>`;
}

/* ---- ficha do item, embutida na página ---- */
let tmpKit=[];
function formItem(cod){
  const i=cod?item(cod):null;
  const f=(id,l,v,tipo,attrs,cls)=>`<div class="field ${cls||""}"><label for="${id}">${l}</label><input id="${id}" type="${tipo||"text"}" value="${esc(String(v==null?"":v))}" ${attrs||""}></div>`;
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${i?"Ficha do item · "+esc(i.cod):"Novo item de estoque"}</h4>
      <div style="flex:1"></div>
      ${i?`<span class="spec">em campo <b>${emCampo(i.cod)}</b></span>
        <span class="spec">estoque cheio <b>${cases(i.cod,i.total)}</b> cases</span>
        <span class="spec">tudo em uso <b>${kwFmt((i.watts||0)*i.total)}</b></span>`:""}
      <button class="btn sm ghost" type="button" data-act="fecharItemForm">Fechar</button></div>
    <div class="rowf">
      ${f("itCod","Código",i?i.cod:"","text",i?"disabled":'placeholder="Ex.: PAS-SDI"',"s")}
      <div class="field"><label for="itCat">Categoria</label><select id="itCat">${CATEGORIAS.map(c=>`<option ${i&&i.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      ${f("itNome","Descrição",i?i.nome:"","text",'placeholder="Como aparece no romaneio"',"w")}
      <div class="field s"><label for="itUn">Unidade</label><select id="itUn">${["pç","cj","rolo","m","kg"].map(u=>`<option ${i&&i.un===u?"selected":""}>${u}</option>`).join("")}</select></div>
    </div>
    <div class="rowf">
      ${f("itPeso","Peso un. (kg)",i?i.peso:0,"number",'step="0.1" min="0"',"s")}
      ${f("itCase","Un. por case",i?i.porCase:1,"number",'step="1" min="1"',"s")}
      ${f("itW","Consumo (W)",i?i.watts:0,"number",'step="5" min="0"',"s")}
      ${f("itDiaria","Diária (R$)",i?i.diaria:0,"number",'step="5" min="0"',"s")}
      ${f("itTotal","Em estoque",i?i.total:0,"number",'step="1" min="0"',"s")}
      ${f("itManut","Manutenção",i?i.manut:0,"number",'step="1" min="0"',"s")}
      <button class="btn pri go" type="submit" data-act="salvarItem" data-id="${cod||""}">${i?"Salvar alterações":"Cadastrar item"}</button>
    </div>
    <p class="hint">Enter salva. Clique em qualquer linha da tabela abaixo para abrir a ficha daquele item aqui mesmo. Se a peça vai suspensa ou apoiada é decidido na OS, linha a linha — um moving pode ir no grid num evento e no chão no outro.</p></form>`;
}
function formKit(cod){
  const k=cod?kitById(cod):null;
  const porCat={}; S.cat.forEach(c=>{(porCat[c.cat]=porCat[c.cat]||[]).push(c);});
  const t=somaTecnica(tmpKit);
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${k?"Editar kit · "+esc(k.cod):"Novo kit"}</h4><div style="flex:1"></div>
      <button class="btn sm ghost" type="button" data-act="fecharKitForm">Fechar</button></div>
    <div class="rowf">
      <div class="field s"><label for="ktCod">Código</label><input id="ktCod" value="${k?esc(k.cod):""}" ${k?"disabled":""} placeholder="KIT-VID-03"></div>
      <div class="field"><label for="ktCat">Categoria</label><select id="ktCat">${CATEGORIAS.map(c=>`<option ${k&&k.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field w"><label for="ktNome">Nome do kit</label><input id="ktNome" value="${k?esc(k.nome):""}" placeholder="Ex.: Kit de Vídeo · corte simples"></div>
      <div class="field w"><label for="ktObs">Para que serve</label><input id="ktObs" value="${k?esc(k.obs||""):""}" placeholder="Quando usar este kit"></div>
      <button class="btn pri go" type="submit" data-act="salvarKit" data-id="${cod||""}">${k?"Salvar kit":"Criar kit"}</button>
    </div>
    <div class="rowf" style="border-top:1px solid var(--line);padding-top:10px">
      <div class="field w"><label for="ktItem">Adicionar à composição</label><select id="ktItem">
        ${CATEGORIAS.filter(c=>porCat[c]).map(c=>`<optgroup label="${esc(c)}">${porCat[c].map(x=>`<option value="${x.cod}">${esc(x.cod)} · ${esc(x.nome)}</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      <div class="field s"><label for="ktQtd">Qtd</label><input id="ktQtd" type="number" value="1" min="1"></div>
      <button class="btn go" type="button" data-act="addKitItem">Incluir no kit</button>
      ${k?`<button class="btn go" type="button" data-act="apagarKit" data-id="${k.cod}" style="color:var(--crit)">Apagar kit</button>`:""}
    </div>
    <div class="picklist" id="kitList"></div>
    <div class="calcout" id="kitTot"></div>
    <p class="hint">Enter no campo de quantidade inclui o item no kit. Enter nos campos de cima salva o kit.</p></form>`;
}
function pintarKit(){
  const el=document.getElementById("kitList"); if(!el) return;
  el.innerHTML = tmpKit.length? tmpKit.map((x,i)=>`<div class="it"><span class="tag">${x.cod}</span>
    <span>${esc(item(x.cod).nome)}</span><span class="q">${x.qtd}×</span>
    <button class="btn sm ghost" type="button" data-act="rmKitItem" data-ix="${i}">remover</button></div>`).join("")
    : `<div class="empty" style="padding:12px">Nenhum item no kit.</div>`;
  const t=somaTecnica(tmpKit), tt=document.getElementById("kitTot");
  if(tt) tt.innerHTML = tmpKit.length
    ? `<span><b>${t.pecas}</b> peças</span><span>·</span><span><b>${t.cases}</b> cases</span><span>·</span><span><b>${kg(t.peso)}</b> kgf</span><span>·</span><span>Consumo <b>${kwFmt(t.w)}</b>${t.w?` ≈ <b>${dec(t.kva,1)} kVA</b>`:""}</span>`
    : `<span>Inclua itens para ver peso, cases e consumo.</span>`;
}

/* ---- eventos ---- */
function acaoEstoque(a, id, t){
  t = t || {dataset:{}};
  const L=["estTab","novoItem","editarItem","salvarItem","fecharItemForm","fecharKitForm","novoKit","editarKit","salvarKit","apagarKit","addKitItem","rmKitItem","inserirKit"];
  if(!L.includes(a)) return;
  switch(a){
    case "estTab": S.estTab=t.dataset.t; save(); render(); break;
    case "novoItem": if(can("editar_inventario")){ S.itemForm=""; save(); render(); foco("itCod"); } break;
    case "editarItem": if(can("editar_inventario")){ S.estTab="itens"; S.itemForm=id; save(); render(); foco("itNome"); } break;
    case "fecharItemForm": S.itemForm=null; save(); render(); break;
    case "fecharKitForm": S.kitForm=null; save(); render(); break;
    case "salvarItem": {
      if(!can("editar_inventario")) break;
      const g=x=>document.getElementById(x).value;
      const cod=(id||g("itCod")).trim().toUpperCase();
      if(!cod) return toast("Informe um código para o item.");
      if(!g("itNome").trim()) return toast("Informe a descrição do item.");
      const dados={nome:g("itNome").trim(),cat:g("itCat"),un:g("itUn"),
        peso:Number(g("itPeso"))||0,porCase:Math.max(1,Number(g("itCase"))||1),watts:Number(g("itW"))||0,
        diaria:Number(g("itDiaria"))||0,
        total:Number(g("itTotal"))||0,manut:Number(g("itManut"))||0};
      if([dados.peso,dados.watts,dados.diaria,dados.total,dados.manut].some(v=>!Number.isFinite(v)||v<0)) return toast("Use valores positivos ou zero nos campos do item.");
      if([dados.porCase,dados.watts,dados.total,dados.manut].some(v=>!Number.isInteger(v))) return toast("Case, consumo e quantidades precisam ser números inteiros.");
      if(dados.manut>dados.total) return toast("A quantidade em manutenção não pode superar o estoque total.");
      const ex=S.cat.find(x=>x.cod===cod);
      if(ex&&!id) return toast("Esse código já existe. Abra o item para editar ou escolha outro código.");
      if(ex) Object.assign(ex,dados);
      else { if(id) return; S.cat.push(Object.assign({cod,rig:"solo"},dados)); }
      S.itemForm=null; save(); render(); toast("Item "+cod+" na fila de gravação. Confira a confirmação no topo."); break;}
    case "novoKit": if(can("editar_inventario")){ tmpKit=[]; S.kitForm=""; save(); render(); pintarKit(); foco("ktCod"); } break;
    case "editarKit": if(can("editar_inventario")){ const kk=kitById(id); tmpKit=kk?kk.itens.map(x=>({...x})):[];
      S.estTab="kits"; S.kitForm=id; save(); render(); pintarKit(); foco("ktNome"); } break;
    case "addKitItem": {const c=document.getElementById("ktItem").value, q=Math.max(1,Number(document.getElementById("ktQtd").value)||1);
      const e=tmpKit.find(x=>x.cod===c); if(e) e.qtd+=q; else tmpKit.push({cod:c,qtd:q});
      document.getElementById("ktQtd").value=1; pintarKit(); foco("ktItem"); break;}
    case "rmKitItem": tmpKit.splice(Number(t.dataset.ix),1); pintarKit(); break;
    case "salvarKit": {
      if(!can("editar_inventario")) break;
      const g=x=>document.getElementById(x).value;
      const cod=(id||g("ktCod")).trim().toUpperCase();
      if(!cod) return toast("Informe um código para o kit.");
      if(!g("ktNome").trim()) return toast("Dê um nome ao kit.");
      if(!tmpKit.length) return toast("Um kit precisa de pelo menos um item.");
      const dados={nome:g("ktNome").trim(),cat:g("ktCat"),obs:g("ktObs"),itens:tmpKit.map(x=>({...x}))};
      const ex=kitById(cod);
      if(ex) Object.assign(ex,dados); else S.kits.push(Object.assign({cod},dados));
      S.kitForm=null; save(); render(); toast("Kit "+cod+" salvo."); break;}
    case "apagarKit": S.kits=S.kits.filter(k=>k.cod!==id); S.kitForm=null; save(); render(); toast("Kit removido."); break;
    case "inserirKit": {
      const n=neg(id), k=kitById(document.getElementById("ikKit").value);
      if(!n||!k) break;
      const mult=Math.max(1,Number(document.getElementById("ikMult").value)||1);
      const dias=Math.max(1,Number(document.getElementById("ikDias").value)||1);
      k.itens.forEach(x=>{ const it=item(x.cod);
        const ex=n.orc.linhas.find(l=>l.tipo==="estoque"&&l.cod===x.cod);
        if(ex) ex.qtd+=x.qtd*mult;
        else n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod:x.cod,nome:it.nome,cat:it.cat,
          qtd:x.qtd*mult,dias,unit:it.diaria,modo:"diaria",obs:k.nome}); });
      sincOrc(n); save(); render(); focarAdicao(); toast(k.nome+" aberto em "+k.itens.length+" linhas."); break;}
  }
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  acaoEstoque(t.dataset.act, t.dataset.id, t);
});
Object.assign(window.VEXTRA||(window.VEXTRA={}),{estoque:vEstoqueNovo});
</script>

.estr>header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 11px;background:var(--surface2);border-bottom:1px solid var(--line2)}
.estr>header b{font-family:var(--disp);font-size:12.5px;font-weight:600}
.estr>header .nm{width:auto;min-width:150px;font-family:var(--disp);font-weight:600;font-size:12.5px;padding:3px 8px}
.estr .corpo .calcout{margin:0;border-radius:0}
.selbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;border:1px solid var(--ink3);border-radius:var(--r);background:var(--accentSoft);box-shadow:var(--shadow)}
