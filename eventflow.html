/* ---------------- recálculo ao vivo ---------------- */
/* com várias salas, a mensagem diz quantas ainda faltam em vez de dar por encerrado */
function faltaMemorial(o,k){
  const as=ambsOS(o); if(as.length<2) return "";
  const faltam=as.filter(a=>!memAmb(o,a.id)[k].feito);
  if(!faltam.length) return (k==="solo"?"Memorial de solo":"Memorial aéreo")+" fechado nas "+as.length+" salas.";
  return "Falta "+(k==="solo"?"o memorial de solo":"o memorial aéreo")+" de "+faltam.map(a=>a.nome).join(", ")+".";
}
function liveCalc(el){
  const o=osById(S.sel); if(!o) return;
  const A=ambAtiva(o), m=memAmb(o,A.id);
  const grupo=el.dataset.calc, k=el.dataset.k;
  const val = el.type==="checkbox" ? el.checked : Number(el.value);
  m[grupo][k]=val;
  m[grupo].feito=false;
  if(grupo==="solo"&&k==="area"&&A.id===ambsOS(o)[0].id) o.area=val;
  /* os coeficientes valem para a sala toda, então vários blocos mudam de uma vez;
     redesenha e devolve o cursor onde estava, para dar para continuar digitando */
  const foco=el.id, pos=(el.type==="number"||el.type==="text")?el.selectionStart:null;
  save(); render();
  const volta=foco&&document.getElementById(foco);
  if(volta){ volta.focus(); try{ if(pos!=null) volta.setSelectionRange(pos,pos); }catch(e){} }
}

/* ---------------- eventos ---------------- */
function acaoPrincipal(a, id, t){
  t = t || {dataset:{}};
  switch(a){
    case "go": go(t.dataset.view, id||null); break;
    case "menu": $("#side").classList.toggle("open"); $("#scrim").classList.toggle("on"); break;
    case "tema": aplicarTema(t.dataset.m); break;
    case "osv": go("vendas",id); break;
    case "irOSV": fecharModal(); go("vendas",id); break;
    case "prod": go("producao",id); S.aba="escopo"; render(); break;
    case "osc": fecharModal(); go("cargas",id); break;
    case "aba": S.aba=t.dataset.aba; save(); render(); break;
    case "novaOSV": tmpItens=[]; S.osvForm=true; save(); render(); pintarPick(); foco("fEv"); break;
    case "fecharOSVForm": S.osvForm=false; save(); render(); break;
    case "addItem": {const cod=$("#fItem").value, q=Math.max(1,Number($("#fQtd").value)||1);
      const ex=tmpItens.find(i=>i.cod===cod); if(ex) ex.qtd+=q; else tmpItens.push({cod,qtd:q});
      pintarPick(); foco("fItem"); break;}
    case "rmItem": tmpItens.splice(Number(t.dataset.ix),1); pintarPick(); break;
    case "salvarOSV": salvarOSV(); break;
    case "fecharSolo": {const o=osById(id); const A=ambAtiva(o), m=memAmb(o,A.id);
      const sufixo=ambsOS(o).length>1?" · "+A.nome:"";
      const pend=itensAmb(o,A.id).filter(indefinida);
      if(pend.length) return toast(pend.length+" linha(s) do escopo ainda sem aplicação definida"+(sufixo?" em "+A.nome:"")+".");
      const rs=zonasDe(o,A.id).map(z=>calcZona(o,A.id,z.id)).filter(r=>r.linhas||r.transf);
      const ruins=rs.filter(r=>!r.ok);
      if(ruins.length) return toast("Reprovado em "+ruins.map(r=>r.nome).join(", ")+" — ajuste a área ou redistribua o peso.");
      m.solo.feito=true; if(o.status==="Aguardando produção") o.status="Em produção";
      fluxo(o.id,"Memorial de cálculo de solo concluído"+sufixo+": "+
        (rs.length?rs.map(r=>r.nome+" "+dec(r.dTot,1)+" kgf/m² de "+dec(r.adm,0)+" ("+(r.util*100).toFixed(0)+"%)").join(" · ")
                  :"nenhum equipamento apoiado")+".",["gerencia","producao"],"producao",o.id,false);
      save(); render();
      toast(faltaMemorial(o,"solo")||"Memorial de solo concluído"+sufixo+"."); break;}
    case "fecharAereo": {const o=osById(id); const A=ambAtiva(o), m=memAmb(o,A.id);
      const sufixo=ambsOS(o).length>1?" · "+A.nome:"";
      const pend=itensAmb(o,A.id).filter(indefinida);
      if(pend.length) return toast(pend.length+" linha(s) do escopo ainda sem aplicação definida"+(sufixo?" em "+A.nome:"")+".");
      const rs=estruturasDe(o,A.id).map(e=>calcEstr(o,A.id,e.id)).filter(r=>r.linhas);
      const semPontos=rs.filter(r=>!r.torres && !r.n);
      if(semPontos.length) return toast("Cadastre os pontos de "+semPontos.map(r=>r.nome).join(", ")+" antes de concluir.");
      const ruins=rs.filter(r=>!r.ok);
      if(ruins.length) return toast("Rigging reprovado em "+ruins.map(r=>r.nome).join(", ")+" — ajuste pontos, WLL ou acessórios.");
      m.aereo.feito=true; if(o.status==="Aguardando produção") o.status="Em produção";
      fluxo(o.id,"Memorial aéreo concluído"+sufixo+": "+
        (rs.length?rs.map(r=>r.torres?r.nome+" em torre de solo"
                    :r.nome+" "+dec(r.porPonto,0)+" kgf por ponto em "+r.n+" ("+(r.util*100).toFixed(0)+"% do WLL, FS "+dec(r.fs,1)+":1)").join(" · ")
                  :"nada suspenso")+".",["gerencia","producao"],"producao",o.id,false);
      save(); render();
      toast(faltaMemorial(o,"aereo")||"Memorial aéreo concluído"+sufixo+"."); break;}
    case "modelo": {const o=osById(id); $("#descTxt").value=MODELO(o); break;}
    case "salvarDesc": {const o=osById(id); o.descritivo=$("#descTxt").value;
      if(o.status==="Aguardando produção") o.status="Em produção"; save(); render();
      toast(o.descritivo.trim().length>40?"Descritivo salvo.":"Salvo, mas ainda curto para concluir a etapa."); break;}
    case "gerarOSC": gerarOSC(id); break;
    case "separar": {const c=oscById(id); c.status="Em separação";
      fluxo(c.osId,"Separação iniciada para a ordem "+c.id+". Romaneio liberado para conferência no galpão.",["gerencia","estoque","producao"],"cargas",c.id,false);
      save(); render(); toast("Separação iniciada — romaneio liberado para conferência."); break;}

function temaAtual(){ try{ return localStorage.getItem(KEY+".tema")||"auto"; }catch(e){ return "auto"; } }
function aplicarTema(modo){
  if(modo==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",modo);
  try{ localStorage.setItem(KEY+".tema", modo==="auto"?"":modo); }catch(e){}

}

}
(function(){ const m=temaAtual(); if(m!=="auto") document.documentElement.setAttribute("data-theme",m); })();

 finally{ONLINE.busy=false;ONLINE.loaded=true;if(S.view==="equipe"&&S.role==="gerencia")render();}

 if(S.role!=="gerencia")return txtConta("Esta área é exclusiva da gerência.");

 return `<div class="card"><header><h3>${ONLINE.rows.length} pessoa(s) online</h3><button class="btn sm" data-act="onlineAtualizar" ${ONLINE.busy?"disabled":""}>Atualizar agora</button></header>
 <div class="pad"><p class="conta-info">Conexão confirmada nos últimos 90 segundos. A lista atualiza a cada 30 segundos; ao fechar o navegador, a pessoa pode levar até 90 segundos para desaparecer. Isso indica conexão recente, não comprova atividade diante da tela.</p>${ONLINE.error?txtConta(ONLINE.error):""}</div>

 </tbody></table></div><div class="pad hint">${ONLINE.at?"Última consulta: "+esc(quandoConta(ONLINE.at)):""} · Painel somente de visualização.</div></div>`;

async function carregarAuditoria(mais=false){
 if(S.role!=="gerencia"||AUD.busy)return;
 AUD.busy=true;AUD.error="";
 try{
  const f=AUD.filter;let ate=null;
  if(f.ate){const d=new Date(f.ate+"T00:00:00");d.setDate(d.getDate()+1);ate=d.toISOString();}
  const r=await sb.rpc("listar_auditoria",{p_tabela:f.tabela||null,p_acao:f.acao||null,p_busca:f.busca||null,
   p_antes:mais&&AUD.rows.length?AUD.rows.at(-1).id:null,p_de:f.de?new Date(f.de+"T00:00:00").toISOString():null,p_ate:ate});
  if(r.error)throw r.error;
  AUD.rows=mais?[...AUD.rows,...(r.data||[])]:r.data||[];AUD.more=(r.data||[]).length===100;
 }catch(e){AUD.error=erroConta(e);}finally{AUD.busy=false;AUD.loaded=true;if(S.view==="auditoria"&&S.role==="gerencia")render();}
}
function vAuditoria(){
 if(S.role!=="gerencia")return txtConta("Esta área é exclusiva da gerência.");
 if(!AUD.loaded&&!AUD.busy)queueMicrotask(()=>carregarAuditoria());
 const f=AUD.filter;
 return `<div class="grid" style="gap:14px"><div class="card"><header><h3>Consultar registros</h3></header><div class="pad">
 <form id="auditForm" class="audit-filters"><div class="field"><label for="auditBusca">Pessoa, registro ou descrição</label><input id="auditBusca" maxlength="120" value="${esc(f.busca)}" placeholder="Buscar no histórico"></div>
 <div class="field"><label for="auditTabela">Área</label><select id="auditTabela"><option value="">Todas</option>${Object.entries(ADMIN_TABLES).map(([k,n])=>`<option value="${k}" ${k===f.tabela?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
 <div class="field"><label for="auditAcao">Ação</label><select id="auditAcao"><option value="">Todas</option>${Object.entries(AUD_ACTION).map(([k,n])=>`<option value="${k}" ${k===f.acao?"selected":""}>${n}</option>`).join("")}</select></div>
 <div class="field"><label for="auditDe">De</label><input id="auditDe" type="date" value="${esc(f.de)}"></div><div class="field"><label for="auditAte">Até</label><input id="auditAte" type="date" value="${esc(f.ate)}"></div>
 <button class="btn pri" type="submit" ${AUD.busy?"disabled":""}>${AUD.busy?"Consultando…":"Filtrar"}</button></form>
 <p class="conta-info">Inclusões, alterações e exclusões confirmadas após a ativação da auditoria. Abra um registro para comparar os dados. Uma gravação da OS pode gerar várias linhas na mesma transação.</p>${AUD.error?txtConta(AUD.error):""}</div></div>
 <div class="card"><div class="tblwrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Área / registro</th><th></th></tr></thead><tbody>
 ${AUD.rows.map(r=>`<tr><td>${esc(quandoConta(r.ocorrido_em))}</td><td><b>${esc(r.autor_nome)}</b><br><span class="hint">${esc(PERFIS[r.autor_papel]?.label||r.autor_papel||"Operação do banco")}</span></td><td><span class="pill ${r.operacao==="DELETE"?"warn":""}">${AUD_ACTION[r.operacao]||esc(r.operacao)}</span></td><td>${esc(ADMIN_TABLES[r.tabela]||r.tabela)}<br><span class="hint">${esc(r.resumo||r.registro)}</span></td><td><button class="btn sm" data-act="auditDetalhe" data-id="${r.id}">Ver alterações</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">${AUD.busy||!AUD.loaded?"Carregando histórico…":"Nenhum registro encontrado para este filtro."}</td></tr>`}
 </tbody></table></div><div class="pad flex"><span class="hint">${AUD.rows.length} registro(s) exibido(s)</span>${AUD.more?`<button class="btn" data-act="auditMais" ${AUD.busy?"disabled":""}>Carregar mais antigos</button>`:""}</div></div></div>`;
}
function detalheAuditoria(id){
 if(S.role!=="gerencia")return;const r=AUD.rows.find(r=>String(r.id)===String(id));if(!r)return;
 const a=r.antes||{},d=r.depois||{},keys=[...new Set([...Object.keys(a),...Object.keys(d)])].filter(k=>JSON.stringify(a[k])!==JSON.stringify(d[k]));
 const val=v=>v===undefined?"—":v===null?"Vazio":typeof v==="object"?JSON.stringify(v,null,2):String(v);
 modal("Detalhes da alteração",`<p class="conta-info"><b>${esc(r.autor_nome)}</b> · ${esc(quandoConta(r.ocorrido_em))}<br>${esc(ADMIN_TABLES[r.tabela]||r.tabela)} · ${AUD_ACTION[r.operacao]}<br>Registro: ${esc(r.registro)} · Transação: ${esc(r.transacao)}</p>
 <div class="tblwrap"><table><thead><tr><th>Campo</th><th>Antes</th><th>Depois</th></tr></thead><tbody>${keys.map(k=>`<tr><td>${esc(k.replaceAll("_"," "))}</td><td><div class="audit-before">${esc(val(a[k]))}</div></td><td><div class="audit-after">${esc(val(d[k]))}</div></td></tr>`).join("")}</tbody></table></div>`,
 `<button class="btn" data-act="fecharModal">Fechar</button>`);
}
const CAMPOS_CONTA=[['telefone','Telefone','tel',40],['whatsapp','WhatsApp','tel',40],['nascimento','Data de nascimento','date',null],['cep','CEP','text',12],['endereco','Endereço','text',200],['numero','Número','text',20],['complemento','Complemento','text',120],['bairro','Bairro','text',100],['cidade','Cidade','text',100],['estado','UF','text',2]];
function limparPreview(){if(MP.preview)URL.revokeObjectURL(MP.preview);MP.preview="";}
async function carregarMeuPerfil(redesenhar=true){
 if(MP.loading||!S.perfilId)return;MP.loading=true;MP.error="";
 try{
  const r=await sb.rpc("meu_perfil_completo");if(r.error)throw r.error;if(!r.data?.id)throw new Error("Não foi possível consultar seu perfil.");
  MP.data=r.data;if(!MP.dirty)MP.draft={...r.data};
  MP.photoUrl="";
  if(r.data.avatar_path){const foto=await sb.storage.from("avatares").createSignedUrl(r.data.avatar_path,28800);if(foto.data)MP.photoUrl=foto.data.signedUrl;}
 }catch(e){MP.error=erroConta(e);}finally{MP.loading=false;if(redesenhar&&S.view==="perfil")render();else if(MP.data)renderShell();}
}
function vMeuPerfil(){
 if(!MP.data&&!MP.loading&&!MP.error)queueMicrotask(()=>carregarMeuPerfil());
 if(!MP.data)return `<div class="card pad">${MP.error?txtConta(MP.error)+`<button class="btn" data-act="perfilRecarregar">Tentar novamente</button>`:"Carregando seu perfil…"}</div>`;
 const d=MP.draft||MP.data,foto=MP.preview||(d.avatar_path?MP.photoUrl:"");
 const field=(key,label,type="text",max=120,extra="")=>`<div class="field ${key==="endereco"?"wide":""}"><label for="mp_${key}">${label}</label><input id="mp_${key}" name="${key}" data-conta="${key}" type="${type}" value="${esc(d[key]||"")}" ${max?'maxlength="'+max+'"':''} ${extra}></div>`;
 return `<form id="meuPerfilForm"><fieldset style="border:0;padding:0;min-width:0" ${MP.busy||MP.photoBusy?"disabled":""}><div class="conta-grid">
 <div class="card pad" style="text-align:center">${foto?`<img class="foto-conta" src="${esc(foto)}" alt="Sua foto de perfil">`:`<div class="foto-conta" style="color:${esc(d.cor||'#1B1B1E')}">${esc(ini(d.nome))}</div>`}
 <button class="btn" type="button" data-act="perfilEscolherFoto" style="justify-content:center">${MP.photoBusy?"Preparando foto…":"Trocar foto"}</button><input id="perfilFoto" type="file" accept="image/jpeg,image/png,image/webp" hidden aria-label="Selecionar foto do perfil">
 ${(foto||MP.photoBlob)?`<button class="btn ghost" type="button" data-act="perfilRemoverFoto">Remover foto</button>`:""}
 <p class="conta-info">JPG, PNG ou WebP, até 5 MB. A foto é atualizada ao salvar.</p>
 <span class="pill">${esc(PERFIS[d.papel]?.label||d.papel)}</span><p class="conta-info">${esc(d.cargo||"Cargo não informado")}<br>O cargo e o acesso são definidos pela gerência.</p></div>
 <div class="card"><header><h3>Seus dados</h3></header><div class="pad"><div class="conta-fields">
 ${field('nome','Nome completo','text',120,'required minlength="2" autocomplete="name"')}
 <div class="field"><label for="mp_email">E-mail de acesso</label><input id="mp_email" value="${esc(d.email||'')}" readonly><span class="hint">E-mail vinculado à conta de acesso.</span></div>
 ${CAMPOS_CONTA.map(([k,l,t,m])=>field(k,l,t,m,k==='nascimento'?'max="'+new Date().toLocaleDateString('en-CA')+'"':'')).join('')}
 <div class="field wide"><label for="mp_bio">Sobre você</label><textarea id="mp_bio" data-conta="bio" maxlength="500" rows="3" placeholder="Especialidades, funções e uma breve apresentação">${esc(d.bio||'')}</textarea></div>
 ${field('cor','Cor das iniciais','color',null)}
 </div><div class="conta-message" id="perfilMensagem" role="status" data-error="${!!MP.error}">${esc(MP.error||(MP.dirty?'Você tem alterações para salvar.':'Seus dados de contato e endereço ficam disponíveis somente para você e a gerência.'))}</div>
 <div class="flex"><button type="submit" class="btn pri">${MP.busy?'Salvando…':'Salvar perfil'}</button><button type="button" class="btn" data-act="perfilCancelar">Descartar alterações</button></div></div></div>
 </div></fieldset></form>`;
}
async function prepararFoto(file){
 if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){MP.error="Escolha uma imagem JPG, PNG ou WebP de até 5 MB.";render();return;}
 MP.photoBusy=true;MP.error="";render();
 try{
  const img=await createImageBitmap(file);const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
  const ctx=canvas.getContext('2d'),side=Math.min(img.width,img.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,512,512);
  ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,512,512);img.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.86));if(!blob)throw new Error('Não foi possível preparar a foto.');
  limparPreview();MP.photoBlob=blob;MP.preview=URL.createObjectURL(blob);MP.dirty=true;
 }catch(e){MP.error="Não foi possível abrir esta imagem. Escolha outro arquivo.";}finally{MP.photoBusy=false;if(S.view==='perfil')render();}
}
async function salvarMeuPerfil(){
 if(MP.busy||MP.photoBusy||!MP.draft)return false;
 const form=document.getElementById('meuPerfilForm');if(form&&!form.reportValidity())return false;
 MP.busy=true;MP.error="";render();let novoPath=null,confirmado=false;
 try{
  const d=MP.draft,payload={nome:(d.nome||'').trim(),cor:d.cor||'#1B1B1E',bio:d.bio||'',avatar_path:d.avatar_path||null};
  CAMPOS_CONTA.forEach(([k])=>payload[k]=d[k]||null);
  if(MP.photoBlob){novoPath=S.perfilId+'/'+uid()+'.jpg';const up=await sb.storage.from('avatares').upload(novoPath,MP.photoBlob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;payload.avatar_path=novoPath;}
  const r=await sb.rpc('salvar_meu_perfil',{p_dados:payload});if(r.error)throw r.error;
  confirmado=true;const antigo=MP.data.avatar_path;MP.data={...MP.data,...payload};MP.draft={...MP.data};MP.dirty=false;MP.photoBlob=null;limparPreview();
  const eu=S.perfis.find(p=>p.id===S.perfilId);if(eu)Object.assign(eu,{nome:payload.nome,cor:payload.cor,ini:ini(payload.nome)});
  if(antigo&&antigo!==payload.avatar_path){const rm=await sb.storage.from('avatares').remove([antigo]);if(rm.error)console.warn('Foto anterior não removida',rm.error.code);}
  MP.photoUrl='';if(payload.avatar_path){const foto=await sb.storage.from('avatares').createSignedUrl(payload.avatar_path,28800);MP.photoUrl=foto.data?.signedUrl||'';}
  toast('Perfil salvo.');return true;
 }catch(e){
  if(novoPath&&!confirmado)await sb.storage.from('avatares').remove([novoPath]).catch(()=>{});
  MP.error=confirmado?'Perfil salvo, mas a foto não pôde ser atualizada na tela. Abra seu perfil novamente.':erroConta(e);return confirmado;
 }finally{MP.busy=false;if(S.view==='perfil')render();else renderShell();}
}
document.addEventListener('input',ev=>{const k=ev.target.dataset?.conta;if(k&&MP.draft){MP.draft[k]=ev.target.value;MP.dirty=true;MP.error='';const el=document.getElementById('perfilMensagem');if(el){el.textContent='Você tem alterações para salvar.';el.dataset.error='false';}}});
document.addEventListener('change',ev=>{if(ev.target.id==='perfilFoto')prepararFoto(ev.target.files[0]);});
document.addEventListener('submit',ev=>{
 if(ev.target.id==='meuPerfilForm'){ev.preventDefault();salvarMeuPerfil();}
 if(ev.target.id==='auditForm'){ev.preventDefault();if(AUD.busy)return;
  const g=id=>document.getElementById(id).value;const de=g('auditDe'),ate=g('auditAte');
  if(de&&ate&&ate<de)return toast('A data final precisa ser igual ou posterior à inicial.');
  AUD.filter={tabela:g('auditTabela'),acao:g('auditAcao'),busca:g('auditBusca').trim(),de,ate};carregarAuditoria();}
});
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t)return;
 if(t.dataset.act==='onlineAtualizar')carregarOnline();
 if(t.dataset.act==='perfilEscolherFoto')document.getElementById('perfilFoto')?.click();
 if(t.dataset.act==='auditMais')carregarAuditoria(true);
 if(t.dataset.act==='auditDetalhe')detalheAuditoria(t.dataset.id);
 if(t.dataset.act==='perfilRecarregar')carregarMeuPerfil();
 if(t.dataset.act==='perfilCancelar'&&!MP.busy){MP.draft={...MP.data};MP.dirty=false;MP.error='';MP.photoBlob=null;limparPreview();render();}
 if(t.dataset.act==='perfilRemoverFoto'&&!MP.busy){MP.draft.avatar_path=null;MP.photoBlob=null;limparPreview();MP.dirty=true;render();}
});
window.addEventListener('beforeunload',e=>{if(MP.dirty||MP.busy){e.preventDefault();e.returnValue='';}});
</script>

<script>
/* Chat é salvo por RPCs independentes da fila de gravação do ERP. */
const WC={chats:[],messages:[],selected:null,loaded:false,loading:false,sending:false,error:'',q:'',search:'',searchInput:'',drafts:{},reply:null,file:null,fileUrl:null,pendingId:null,urls:{},more:false,rec:null,recStream:null,recTimer:null,recording:false,recSeconds:0,poll:null};
const WIC={plus:'<path d="M8 2v12M2 8h12"/>',phone:'<path d="M3 2l3 3-2 2c1 2 3 4 5 5l2-2 3 3c-3 4-13-6-11-11z"/>',video:'<rect x="1" y="3" width="9" height="10" rx="2"/><path d="M10 6l5-3v10l-5-3"/>',file:'<path d="M5 9l5-5a3 3 0 014 4l-7 7a4 4 0 01-6-6l7-7"/>',mic:'<rect x="6" y="1" width="4" height="9" rx="2"/><path d="M3 7v1a5 5 0 0010 0V7M8 13v3M5 16h6"/>',send:'<path d="M1 1l14 7-14 7 3-7zM4 8h11"/>',back:'<path d="M11 2L5 8l6 6"/>',group:'<circle cx="6" cy="5" r="3"/><path d="M0 15v-2a6 6 0 0112 0v2M11 2a3 3 0 010 6M13 10a4 4 0 013 4"/>'};
const wi=(name)=>`<svg viewBox="0 0 16 18" aria-hidden="true">${WIC[name]||WIC.plus}</svg>`;
const wbtn=(action,label,icon,extra='')=>`<button type="button" class="wa-icon ${extra}" data-wa="${action}" title="${label}" aria-label="${label}">${wi(icon)}</button>`;
const wcName=c=>c?.tipo==='dm'?usr(c.membros.find(x=>x.perfil_id!==S.perfilId)?.perfil_id).nome:c?.nome||'Conversa';
const wcCurrent=()=>WC.chats.find(c=>c.id===WC.selected);
const wcError=e=>['PGRST202','42P01','42703'].includes(e?.code)?'Aplique a atualização 0009 no banco para ativar o novo chat.':e?.message||'Falha de conexão. Tente novamente.';
async function wrpc(name,args){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data;}
function wcStatus(text,error=false){const el=document.getElementById('waStatus');if(el){el.textContent=text;el.classList.toggle('error',error);}}
function wcDraw(){if(S.view==='chat'){const media=[...document.querySelectorAll('[data-wa-media]')].map(el=>[el.dataset.waMedia,[...el.childNodes]]),scroll=document.getElementById('waBody')?.scrollTop;const active=document.activeElement,id=active?.id,start=active?.selectionStart,end=active?.selectionEnd;render();for(const [key,nodes] of media){const host=document.querySelector(`[data-wa-media="${key}"]`);if(host)host.append(...nodes);}if(scroll!==undefined&&document.getElementById('waBody'))document.getElementById('waBody').scrollTop=scroll;if(id&&['waText','waSearch','waMessageSearch'].includes(id)){const el=document.getElementById(id);el?.focus();if(typeof start==='number')el?.setSelectionRange(start,end);}}}
async function wcList(draw=true){if(WC.loading)return;WC.loading=true;try{const before=JSON.stringify(WC.chats);WC.chats=await wrpc('chat_listar')||[];const changed=before!==JSON.stringify(WC.chats);WC.loaded=true;WC.error='';if(WC.selected&&!wcCurrent()){WC.selected=null;WC.messages=[];}if(draw)wcDraw();return changed;}catch(e){WC.error=wcError(e);if(draw)wcDraw();}finally{WC.loading=false;}}
async function wcRead(older=false,background=false){const id=WC.selected;if(!id)return;try{
 const rows=await wrpc('chat_mensagens',{p_canal:id,p_antes:older?WC.messages[0]?.criado_em:null,p_busca:WC.search||null,p_cursor:older?WC.messages[0]?.id:null});if(id!==WC.selected)return;
 const sorted=(rows||[]).reverse(),changed=JSON.stringify(older?[]:WC.messages.slice(-100))!==JSON.stringify(sorted);
 WC.more=rows.length===100;
 if(older){const map=new Map([...sorted,...WC.messages].map(m=>[m.id,m]));WC.messages=[...map.values()].sort((a,b)=>a.criado_em.localeCompare(b.criado_em)||a.id.localeCompare(b.id));}
 else if(!background||changed){WC.messages=sorted;}
 WC.error='';if(!background||changed){const body=document.getElementById('waBody'),near=!body||body.scrollHeight-body.scrollTop-body.clientHeight<100;wcDraw();await wcMedia();if(!older&&near)wcBottom();}
 if(!document.hidden&&S.view==='chat'&&!WC.search){const r=await sb.from('canal_membros').update({lido_em:new Date().toISOString()}).eq('canal_id',id).eq('perfil_id',S.perfilId);if(r.error)console.warn('Leitura não confirmada',r.error.code);}
 }catch(e){WC.error=wcError(e);if(!background)wcDraw();else wcStatus(WC.error,true);}}
function wcBottom(){const b=document.getElementById('waBody');if(b)b.scrollTop=b.scrollHeight;}
async function wcOpen(id){if(id===WC.selected){await wcRead();return;}if(WC.file&&!confirm('O anexo ainda não foi enviado. Descartar e trocar de conversa?'))return;if(WC.recording)return toast('Pare a gravação antes de trocar de conversa.');WC.selected=id;WC.messages=[];WC.reply=null;WC.search='';WC.searchInput='';wcDiscardFile();wcDraw();await wcRead();}
function wcTime(t){return new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function wcBubble(m){const mine=m.autor_id===S.perfilId,c=wcCurrent(),reply=WC.messages.find(x=>x.id===m.resposta_id),a=m.apagado?null:m.anexo;
 const read=mine&&c?.membros.filter(x=>x.perfil_id!==S.perfilId).every(x=>new Date(x.lido_em)>=new Date(m.criado_em));
 return `<div class="wa-message ${mine?'mine':''}"><div class="wa-bubble"><div class="wa-author">${mine?'Você':esc(usr(m.autor_id).nome)}</div>
 ${m.resposta_id?`<div class="wa-quote">${esc(reply?(reply.apagado?'Mensagem apagada':reply.texto||reply.anexo?.nome):'Resposta a uma mensagem anterior')}</div>`:''}
 <div class="wa-text">${m.apagado?'<i>Mensagem apagada</i>':linkify(m.texto)}</div>
 ${a?`<div data-wa-media="${m.id}"></div><button class="btn sm" data-wa="download" data-id="${m.id}">${esc(a.nome)} · ${(a.bytes/1024/1024).toFixed(1)} MB ↓</button>`:''}
 <div class="wa-meta">${wcTime(m.criado_em)} ${m.editado_em&&!m.apagado?'· editada':''} ${mine?`<span title="${read?'Lida por todos':'Salva no servidor'}">${read?'✓✓':'✓'}</span>`:''}
 ${!m.apagado?`<button data-wa="reply" data-id="${m.id}">Responder</button>${mine?`<button data-wa="edit" data-id="${m.id}">Editar</button><button data-wa="delete" data-id="${m.id}">Apagar</button>`:''}`:''}</div></div></div>`;
}
function vWhatsChat(){if(!WC.loaded&&!WC.loading&&!WC.error)queueMicrotask(()=>wcList());const c=wcCurrent();
 const filtered=WC.chats.filter(c=>wcName(c).toLocaleLowerCase().includes(WC.q.toLocaleLowerCase())).sort((a,b)=>(b.ultima?.criado_em||b.criado_em).localeCompare(a.ultima?.criado_em||a.criado_em));
 return `<div class="wa ${c?'has-chat':''}"><aside class="wa-side"><div class="wa-bar"><h3 class="grow">Conversas</h3>${wbtn('new','Nova conversa','plus')}${wbtn('group','Criar grupo','group')}</div>
 <div class="wa-search"><input id="waSearch" aria-label="Buscar conversa" placeholder="Buscar conversa" value="${esc(WC.q)}"></div><div class="wa-list">${filtered.map(x=>`<button class="wa-conv ${x.id===c?.id?'on':''}" data-wa="open" data-id="${x.id}"><span class="wa-avatar">${esc(ini(wcName(x)))}</span><span class="wa-conv-text"><b>${esc(wcName(x))}</b><small>${esc(x.ultima?(x.ultima.apagado?'Mensagem apagada':x.ultima.texto||x.ultima.anexo?.nome||'Arquivo'):'Comece a conversa')}</small></span>${x.novas?`<span class="wa-count">${x.novas}</span>`:''}</button>`).join('')||`<div class="empty">${WC.error?esc(WC.error):WC.loaded?'Nenhuma conversa. Use + para começar.':'Carregando…'}</div>`}</div><button class="btn ghost" data-wa="refresh">Atualizar conversas</button></aside>
 <section class="wa-main">${c?`<div class="wa-bar">${wbtn('back','Voltar às conversas','back','wa-back')}<span class="wa-avatar">${esc(ini(wcName(c)))}</span><div class="grow"><h3>${esc(wcName(c))}</h3><small>${c.tipo==='dm'?'Conversa individual':c.membros.length+' participantes'}</small></div>${wbtn('voice','Chamada de voz','phone')}${wbtn('video','Chamada de vídeo','video')}${c.tipo!=='dm'?wbtn('manage','Dados do grupo','group'):''}</div>
 <form id="waSearchForm" class="wa-search" style="display:flex;gap:7px"><input id="waMessageSearch" aria-label="Buscar mensagens" maxlength="120" placeholder="Buscar nesta conversa" value="${esc(WC.searchInput)}"><button class="btn sm">Buscar</button></form>
 <div class="wa-body" id="waBody">${WC.more?'<button class="btn sm" data-wa="older">Carregar anteriores</button>':''}${WC.messages.map(wcBubble).join('')||'<div class="wa-center">Nenhuma mensagem para exibir.</div>'}</div>
 <div class="wa-compose">${WC.reply?`<div class="wa-pending">Respondendo: ${esc(WC.reply.texto||WC.reply.anexo?.nome||'Mensagem')} <button class="btn sm" data-wa="cancelReply">Cancelar</button></div>`:''}
 ${WC.file?`<div class="wa-pending">${esc(WC.file.name)} · ${(WC.file.size/1024/1024).toFixed(1)} MB <button class="btn sm" data-wa="discardFile">Remover</button>${WC.file.type.startsWith('audio/')?`<audio controls src="${esc(WC.fileUrl)}" style="max-width:100%"></audio>`:''}</div>`:''}
 ${WC.recording?`<div class="wa-pending" role="status">● Gravando <span id="waRecTime">${WC.recSeconds}s</span> · limite 5 min <button class="btn sm" data-wa="stopAudio">Parar e ouvir</button><button class="btn sm" data-wa="cancelAudio">Cancelar</button></div>`:''}
 <div class="wa-compose-row">${wbtn('attach','Anexar arquivo','file')}<input hidden type="file" id="waFile"><textarea id="waText" maxlength="10000" rows="1" aria-label="Mensagem" placeholder="Escreva uma mensagem" ${WC.sending?'disabled':''}>${esc(WC.drafts[c.id]||'')}</textarea>${wbtn('record','Gravar áudio','mic')}${wbtn('send','Enviar mensagem','send','wa-send')}</div></div><div id="waStatus" class="wa-status ${WC.error?'error':''}" role="status">${esc(WC.error||(WC.sending?'Enviando…':'Enter envia · Shift+Enter quebra linha · anexos até 25 MB'))}</div>`:`<div class="wa-center"><h2>Chat da equipe</h2><p>Converse sobre seus eventos, compartilhe arquivos<br>e reúna a equipe por voz ou vídeo.</p><button class="btn pri" data-wa="new">Iniciar conversa</button></div>`}</section></div>`;
}
window.VEXTRA.chat=vWhatsChat;TITLES.chat=['Chat','Equipe conectada à operação'];
function wcDiscardFile(){if(WC.fileUrl)URL.revokeObjectURL(WC.fileUrl);WC.file=null;WC.fileUrl=null;WC.pendingId=null;}
function wcFile(file){if(!file)return;if(WC.sending||WC.recording)return toast('Aguarde o envio ou termine a gravação.');if(file.size>25*1024*1024||file.size===0)return toast('Escolha um arquivo de até 25 MB, não vazio.');wcDiscardFile();WC.file=file;WC.fileUrl=URL.createObjectURL(file);wcDraw();}
async function wcMedia(){for(const m of WC.messages){const a=m.anexo;if(!a||m.apagado)continue;const el=document.querySelector('[data-wa-media="'+m.id+'"]');if(!el||el.childNodes.length)continue;try{
 const url=await wcURL(a);if(!el.isConnected)continue;let media;if(a.tipo==='audio')media=document.createElement('audio');else if(a.tipo==='imagem'&&/^image\/(png|jpeg|webp|gif)$/.test(a.mime))media=document.createElement('img');else if(a.tipo==='video')media=document.createElement('video');if(media){media.className='wa-media';media.controls=true;media.preload='metadata';media.src=url;if(media.tagName==='IMG'){media.alt=a.nome;media.loading='lazy';}el.appendChild(media);}
 }catch{el.textContent='Anexo indisponível. Tente atualizar.';}}}
async function wcURL(a,download=false){const cached=WC.urls[a.path];if(!download&&cached?.until>Date.now())return cached.url;const r=await sb.storage.from('chat-arquivos').createSignedUrl(a.path,300,download?{download:a.nome}:undefined);if(r.error)throw r.error;if(!download)WC.urls[a.path]={url:r.data.signedUrl,until:Date.now()+240000};return r.data.signedUrl;}
async function wcSend(){if(WC.sending||WC.recording||!WC.selected)return;const channel=WC.selected,text=(WC.drafts[channel]||'').trim(),file=WC.file,reply=WC.reply?.id;if(!text&&!file)return;WC.sending=true;WC.error='';WC.pendingId=WC.pendingId||uid();const id=WC.pendingId;wcDraw();let uploaded=null;
 try{let attachment=null;if(file){const path=channel+'/'+S.perfilId+'/'+id+'/'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-100);const up=await sb.storage.from('chat-arquivos').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(up.error&&String(up.error.statusCode)!=='409')throw up.error;uploaded=path;attachment={path,nome:file.name.slice(0,180),bytes:file.size,mime:file.type,tipo:file.type.startsWith('audio/')?'audio':file.type.startsWith('video/')?'video':/^image\/(png|jpeg|webp|gif)$/.test(file.type)?'imagem':'arquivo'};}
 await wrpc('chat_enviar',{p_id:id,p_canal:channel,p_texto:text,p_anexo:attachment,p_resposta:reply||null});WC.drafts[channel]='';WC.reply=null;wcDiscardFile();await wcList(false);await wcRead();wcBottom();
 }catch(e){if(e.code==='22000')WC.pendingId=null;WC.error=wcError(e);}finally{WC.sending=false;wcDraw();wcMedia();if(!WC.error)wcBottom();}}
function wcPeople(group){modal(group?'Criar grupo':'Nova conversa',`<form id="waCreateForm"><input type="hidden" id="waGroupMode" value="${group?'1':'0'}">${group?'<div class="field"><label for="waGroupName">Nome do grupo</label><input id="waGroupName" required minlength="2" maxlength="80" placeholder="Ex.: Produção · Evento Roche"></div>':''}<p>Selecione ${group?'os participantes':'uma pessoa'}.</p><div class="wa-people">${USERS.filter(p=>p.id!==S.perfilId).map(p=>`<div class="wa-person"><input id="person_${p.id}" type="${group?'checkbox':'radio'}" name="waPerson" value="${p.id}"><label for="person_${p.id}"><b>${esc(p.nome)}</b><br><small>${esc(p.cargo||PERFIS[p.role]?.label||'')}</small></label></div>`).join('')}</div><div class="wa-modalerr" id="waModalError" role="alert"></div><button class="btn pri" type="submit">${group?'Criar grupo':'Conversar'}</button></form>`,'');}
async function wcCreate(form){const button=form.querySelector('button');button.disabled=true;try{const group=document.getElementById('waGroupMode').value==='1',members=[...form.querySelectorAll('input[name=waPerson]:checked')].map(x=>x.value);if(!members.length)throw new Error('Selecione pelo menos uma pessoa.');const id=await wrpc('chat_criar',{p_nome:group?document.getElementById('waGroupName').value:null,p_membros:members,p_direta:!group});fecharModal();await wcList(false);await wcOpen(id);}catch(e){document.getElementById('waModalError').textContent=wcError(e);}finally{button.disabled=false;}}
function wcManage(){const c=wcCurrent();if(!c||c.tipo==='dm')return;const admin=c.membros.some(m=>m.perfil_id===S.perfilId&&m.admin);modal('Dados do grupo',`<div class="field"><label for="waRename">Nome</label><input id="waRename" value="${esc(c.nome)}" maxlength="80" ${admin?'':'readonly'}></div>${admin?'<button class="btn sm" data-wa="rename">Salvar nome</button>':''}<div class="wa-people">${c.membros.map(m=>`<div class="wa-person"><span style="flex:1">${esc(usr(m.perfil_id).nome)} ${m.admin?'<small>· Admin</small>':''}</span>${admin?`<button class="btn sm" data-wa="member" data-id="${m.perfil_id}" data-op="${m.admin?'rebaixar':'promover'}">${m.admin?'Retirar admin':'Tornar admin'}</button>${m.perfil_id!==S.perfilId?`<button class="btn sm" data-wa="member" data-id="${m.perfil_id}" data-op="remover">Remover</button>`:''}`:''}</div>`).join('')}</div>${admin?`<div class="field"><label for="waAddPerson">Adicionar participante</label><select id="waAddPerson"><option value="">Selecione</option>${USERS.filter(p=>!c.membros.some(m=>m.perfil_id===p.id)).map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select><button class="btn sm" data-wa="addMember">Adicionar</button></div>`:''}<div id="waModalError" class="wa-modalerr" role="alert"></div><button class="btn" data-wa="leave">Sair do grupo</button>`,'<button class="btn" data-act="fecharModal">Fechar</button>');}
async function wcManageDo(op,person=null,name=null){try{await wrpc('chat_gerenciar',{p_canal:WC.selected,p_acao:op,p_pessoa:person,p_nome:name});await wcList(false);if(op==='sair'){WC.selected=null;fecharModal();wcDraw();}else wcManage();}catch(e){document.getElementById('waModalError').textContent=wcError(e);}}
async function wcRecord(){const recordingChannel=WC.selected;if(WC.recording||WC.sending)return;if(CALL.id)return toast('Encerre a chamada antes de gravar uma mensagem.');try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Gravação de áudio requer HTTPS e um navegador compatível.');const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(WC.selected!==recordingChannel||S.view!=='chat'){stream.getTracks().forEach(t=>t.stop());return;}const mime=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));WC.recStream=stream;const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];WC.rec=rec;WC.recording=true;WC.recSeconds=0;WC.cancelRecording=false;rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.onerror=()=>{WC.cancelRecording=true;wcStopAudio(true);toast('Não foi possível gravar o áudio.');};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(WC.recTimer);WC.recording=false;WC.rec=null;WC.recStream=null;if(!WC.cancelRecording){const type=rec.mimeType||mime||'audio/webm',ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';wcFile(new File(chunks,'Audio-'+Date.now()+'.'+ext,{type}));}else wcDraw();};rec.start(1000);WC.recTimer=setInterval(()=>{WC.recSeconds++;const el=document.getElementById('waRecTime');if(el)el.textContent=WC.recSeconds+'s';if(WC.recSeconds>=300)wcStopAudio();},1000);wcDraw();}catch(e){WC.error=e.name==='NotAllowedError'?'Permita o microfone para gravar áudio.':wcError(e);wcDraw();}}
function wcStopAudio(cancel=false){WC.cancelRecording=cancel;if(WC.rec?.state!=='inactive')WC.rec?.stop();}
/* Chamadas WebRTC: malha de até seis participantes; sinalização autenticada no banco. */
const CALL={id:null,stream:null,peers:new Map(),cursor:0,polling:false,incoming:null,config:null,video:false,busy:false};
function callHosts(){if(!document.getElementById('waCall')){const h=document.createElement('div');h.innerHTML='<section id="waCall" class="wa-call" hidden aria-label="Chamada em andamento"><div class="wa-call-head"><b id="waCallTitle">Chamada</b><span id="waCallState" role="status">Conectando…</span></div><div id="waVideos" class="wa-videos"></div><div class="wa-call-actions"><button data-wa="mute" id="waMute">Silenciar microfone</button><button data-wa="camera" id="waCamera">Desligar câmera</button><button data-wa="playCall">Ouvir chamada</button><button class="hangup" data-wa="hangup">Encerrar</button></div></section><aside id="waIncoming" class="wa-incoming" hidden><b id="waIncomingTitle"></b><p>Chamada recebida</p><button class="btn pri" data-wa="accept">Atender</button> <button class="btn" data-wa="decline">Recusar</button></aside>';document.body.appendChild(h);}}
async function callConfig(){const r=await sb.functions.invoke('chat-ice',{body:{}});if(r.error||!r.data?.iceServers?.length)throw new Error('Chamadas precisam da função chat-ice e do serviço TURN configurados. Consulte o guia de instalação.');return {iceServers:r.data.iceServers};}
function callTile(id,name,stream,local=false){let tile=document.getElementById('call_'+id);if(!tile){tile=document.createElement('div');tile.id='call_'+id;tile.className='wa-tile';const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=local;tile.appendChild(v);const label=document.createElement('span');label.textContent=name;tile.appendChild(label);document.getElementById('waVideos').appendChild(tile);}const v=tile.querySelector('video');if(v.srcObject!==stream)v.srcObject=stream;v.play().catch(()=>{document.getElementById('waCallState').textContent='Toque em Ouvir chamada para ativar o som.';});}
async function callStart(video,accept=false){const target=WC.selected,invitation=CALL.incoming;if(CALL.busy||CALL.id)return;if(WC.recording)return toast('Pare a gravação de áudio primeiro.');CALL.busy=true;let stream=null,id=null;try{if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)throw new Error('Chamadas exigem HTTPS e navegador com câmera/microfone.');CALL.config=await callConfig();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:video?{width:{ideal:640},height:{ideal:360},facingMode:'user'}:false});if(accept){id=invitation.id;await wrpc('chat_chamada_acao',{p_id:id,p_acao:'entrar'});}else id=await wrpc('chat_ligar',{p_canal:target,p_video:video});CALL.id=id;CALL.video=video;CALL.stream=stream;CALL.cursor=0;callHosts();document.getElementById('waIncoming').hidden=true;document.getElementById('waCall').hidden=false;document.getElementById('waCallTitle').textContent=video?'Chamada de vídeo':'Chamada de voz';document.getElementById('waCamera').hidden=!video;document.getElementById('waMute').textContent='Silenciar microfone';document.getElementById('waCamera').textContent='Desligar câmera';document.getElementById('waCallState').textContent=accept?'Conectando…':'Chamando…';callTile(S.perfilId,'Você',stream,true);await callPoll();}catch(e){stream?.getTracks().forEach(t=>t.stop());toast(e.name==='NotAllowedError'?'Permita acesso ao microfone e à câmera para continuar.':wcError(e));}finally{CALL.busy=false;}}
async function callSignal(to,data){await wrpc('chat_sinal',{p_id:CALL.id,p_para:to,p_dados:data});}
function callPeer(id){if(CALL.peers.has(id))return CALL.peers.get(id);const pc=new RTCPeerConnection(CALL.config),entry={pc,ice:[],offered:false};CALL.peers.set(id,entry);CALL.stream.getTracks().forEach(t=>pc.addTrack(t,CALL.stream));pc.onicecandidate=e=>{if(e.candidate&&CALL.id)callSignal(id,{type:'ice',candidate:e.candidate.toJSON()}).catch(()=>{});};pc.ontrack=e=>callTile(id,usr(id).nome,e.streams[0]||new MediaStream([e.track]));pc.onconnectionstatechange=()=>{const el=document.getElementById('waCallState');if(el)el.textContent=pc.connectionState==='connected'?'Em chamada':pc.connectionState==='failed'?'Falha de conexão. Encerre e tente novamente.':'Conectando…';};return entry;}
async function callPoll(){if(CALL.polling||!S.perfilId)return;CALL.polling=true;try{const data=await wrpc('chat_telefonia',{p_id:CALL.id,p_cursor:CALL.cursor});callHosts();if(!CALL.id){const invite=(data.chamadas||[]).find(c=>c.estado!=='encerrada'&&c.participantes.some(p=>p.perfil_id===S.perfilId&&p.estado==='convidado'));CALL.incoming=invite||null;document.getElementById('waIncoming').hidden=!invite;if(invite)document.getElementById('waIncomingTitle').textContent=usr(invite.autor_id).nome+' · '+(invite.video?'Vídeo':'Voz');return;}
 const c=data.chamadas.find(x=>x.id===CALL.id);if(!c||c.estado==='encerrada'||!c.participantes.some(p=>p.perfil_id===S.perfilId&&p.estado==='entrou')){callCleanup();toast('Chamada encerrada.');return;}
 const peers=c.participantes.filter(p=>p.perfil_id!==S.perfilId&&p.estado==='entrou').map(p=>p.perfil_id);
 for(const [id,entry] of CALL.peers){if(!peers.includes(id)){entry.pc.close();CALL.peers.delete(id);document.getElementById('call_'+id)?.remove();}}
 for(const id of peers){const e=callPeer(id);if(S.perfilId<id&&!e.offered){e.offered=true;await e.pc.setLocalDescription(await e.pc.createOffer());await callSignal(id,{type:'offer',sdp:e.pc.localDescription.sdp});}}
 for(const s of data.sinais||[]){if(!peers.includes(s.de)){CALL.cursor=s.id;continue;}const e=callPeer(s.de),d=s.dados;if(d.type==='offer'){await e.pc.setRemoteDescription({type:'offer',sdp:d.sdp});for(const ice of e.ice)await e.pc.addIceCandidate(ice);e.ice=[];await e.pc.setLocalDescription(await e.pc.createAnswer());await callSignal(s.de,{type:'answer',sdp:e.pc.localDescription.sdp});}else if(d.type==='answer'){if(e.pc.signalingState==='have-local-offer')await e.pc.setRemoteDescription({type:'answer',sdp:d.sdp});for(const ice of e.ice)await e.pc.addIceCandidate(ice);e.ice=[];}else if(d.type==='ice'){if(e.pc.remoteDescription)await e.pc.addIceCandidate(d.candidate);else e.ice.push(d.candidate);}CALL.cursor=s.id;}
 }catch(e){console.warn('Falha na sinalização da chamada',e.message);if(CALL.id)document.getElementById('waCallState').textContent='Conexão instável. Tentando novamente…';}finally{CALL.polling=false;}}
function callCleanup(){CALL.peers.forEach(e=>e.pc.close());CALL.peers.clear();CALL.stream?.getTracks().forEach(t=>t.stop());CALL.stream=null;CALL.id=null;CALL.cursor=0;CALL.incoming=null;const el=document.getElementById('waCall');if(el)el.hidden=true;const videos=document.getElementById('waVideos');if(videos)videos.replaceChildren();}
async function callEnd(){const id=CALL.id;callCleanup();if(id)try{await wrpc('chat_chamada_acao',{p_id:id,p_acao:'sair'});}catch{toast('Chamada encerrada neste dispositivo. A sessão remota expira automaticamente.');}}
async function callDecline(){const id=CALL.incoming?.id;if(!id)return;try{await wrpc('chat_chamada_acao',{p_id:id,p_acao:'recusar'});CALL.incoming=null;document.getElementById('waIncoming').hidden=true;}catch(e){toast(wcError(e));}}
function iniciarChatCompleto(){clearInterval(WC.poll);WC.poll=setInterval(async()=>{callPoll();if(S.view==='chat'&&!document.hidden&&!WC.sending){const changed=await wcList(false);if(changed){wcDraw();wcMedia();}await wcRead(false,true);}},2500);}
const iniciarContaChat=iniciarConta;iniciarConta=function(){iniciarContaChat();iniciarChatCompleto();};
window.addEventListener('beforeunload',e=>{if(CALL.id||WC.recording||WC.sending||WC.file||Object.values(WC.drafts).some(Boolean)){e.preventDefault();e.returnValue='';}});
document.addEventListener('input',e=>{if(e.target.id==='waText')WC.drafts[WC.selected]=e.target.value;if(e.target.id==='waMessageSearch')WC.searchInput=e.target.value;if(e.target.id==='waSearch'){WC.q=e.target.value;wcDraw();wcMedia();}});
document.addEventListener('change',e=>{if(e.target.id==='waFile')wcFile(e.target.files[0]);});
document.addEventListener('keydown',e=>{if(e.target.id==='waText'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();wcSend();}});
document.addEventListener('submit',e=>{if(e.target.id==='waCreateForm'){e.preventDefault();wcCreate(e.target);}if(e.target.id==='waSearchForm'){e.preventDefault();WC.search=document.getElementById('waMessageSearch').value;wcRead();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-wa]');if(!b)return;const action=b.dataset.wa,id=b.dataset.id;
 try{switch(action){
 case 'new':wcPeople(false);break;case 'group':wcPeople(true);break;case 'open':if(!WC.sending)await wcOpen(id);break;
 case 'refresh':await wcList();await wcRead();break;case 'back':if(!WC.recording&&!WC.sending){WC.selected=null;wcDraw();}break;
 case 'send':await wcSend();break;case 'attach':document.getElementById('waFile')?.click();break;case 'discardFile':if(!WC.sending){wcDiscardFile();wcDraw();}break;
 case 'record':await wcRecord();break;case 'stopAudio':wcStopAudio();break;case 'cancelAudio':wcStopAudio(true);break;
 case 'reply':WC.reply=WC.messages.find(m=>m.id===id);wcDraw();document.getElementById('waText')?.focus();break;case 'cancelReply':WC.reply=null;wcDraw();break;
 case 'older':await wcRead(true);break;case 'download':{const m=WC.messages.find(m=>m.id===id);if(m?.anexo){const url=await wcURL(m.anexo,true);const a=document.createElement('a');a.href=url;a.rel='noopener';a.target='_blank';a.download=m.anexo.nome;a.click();}break;}
 case 'edit':{const m=WC.messages.find(m=>m.id===id);const text=prompt('Editar mensagem',m.texto);if(text!==null){await wrpc('chat_editar',{p_id:id,p_texto:text,p_apagar:false});await wcRead();}break;}
 case 'delete':if(confirm('Apagar esta mensagem da conversa? O registro de auditoria será preservado.')){await wrpc('chat_editar',{p_id:id,p_apagar:true});await wcRead();}break;
 case 'manage':wcManage();break;case 'rename':await wcManageDo('nome',null,document.getElementById('waRename').value);break;
 case 'member':await wcManageDo(b.dataset.op,id);break;case 'addMember':await wcManageDo('adicionar',document.getElementById('waAddPerson').value||null);break;
 case 'leave':if(confirm('Sair deste grupo?'))await wcManageDo('sair');break;
 case 'voice':await callStart(false);break;case 'video':await callStart(true);break;case 'accept':if(CALL.incoming)await callStart(CALL.incoming.video,true);break;case 'decline':await callDecline();break;case 'hangup':await callEnd();break;
 case 'mute':{const tracks=CALL.stream?.getAudioTracks()||[];tracks.forEach(t=>t.enabled=!t.enabled);b.textContent=tracks[0]?.enabled?'Silenciar microfone':'Ativar microfone';break;}
 case 'camera':{const tracks=CALL.stream?.getVideoTracks()||[];tracks.forEach(t=>t.enabled=!t.enabled);b.textContent=tracks[0]?.enabled?'Desligar câmera':'Ligar câmera';break;}
 case 'playCall':document.querySelectorAll('#waVideos video').forEach(v=>v.play().catch(()=>{}));break;
 }}catch(err){WC.error=wcError(err);wcStatus(WC.error,true);toast(WC.error);}
});
</script>
<style>
.integracao-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.7fr);gap:18px}.integracao-passos{padding-left:22px;line-height:1.7}.integracao-passos li{margin:10px 0}.integracao-link{display:flex;gap:8px;align-items:center}.integracao-link input{min-width:0;flex:1;font-family:var(--mono);font-size:11px}.integracao-info{padding:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.6}.integracao-status{min-height:24px;margin-top:12px;font-size:12px}.integracao-status.erro{color:var(--crit)}.miro-shell{height:calc(100dvh - 195px);min-height:480px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.miro-shell iframe{display:block;width:100%;height:100%;border:0}.miro-empty{padding:65px 24px;text-align:center;max-width:700px;margin:auto}.miro-empty .miro-icon{display:grid;place-items:center;width:70px;height:70px;border-radius:18px;background:#fff1a8;color:#292824;font-size:32px;margin:0 auto 18px}.miro-empty p{color:var(--ink2);line-height:1.7}.miro-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.miro-head .grow{flex:1}.miro-head h2{margin:0 0 4px}.miro-foot{font-size:12px;line-height:1.5;color:var(--ink3);margin-top:10px}

<script>
/* Integrações: assinatura de calendário e quadro Miro. Nenhum segredo de servidor no HTML. */
const GAGENDA={status:null,busy:false,message:'',error:false};
const MIRO={config:null,loaded:false,busy:false,error:'',loadingBoard:false};
const integracaoErro=e=>['PGRST202','42P01','42703'].includes(e?.code)?'Aplique a atualização 0010 no Supabase para ativar esta área.':e?.message||'Não foi possível concluir. Tente novamente.';
async function integracaoRpc(name,args){const r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data;}
const agendaHeadIntegracoes=agendaHead;
agendaHead=function(){return `<div class="between agenda-integracao-head">${agendaHeadIntegracoes()}<button class="btn" data-integ="googleAbrir" style="margin-bottom:12px">Google Agenda ↗</button></div>`;};
const navOperacao= NAV.find(g=>g.g==='Operação');if(navOperacao){const ag=navOperacao.items.find(x=>x.id==='agenda');if(ag)ag.t='Agenda';navOperacao.items.push({id:'organograma',t:'Organograma',roles:['gerencia','producao','estoque'],ic:'users'});}
TITLES.organograma=['Organograma','Estrutura da equipe · quadro Miro'];
window.VEXTRA.organograma=()=>vOrganograma();
Object.assign(ADMIN_TABLES,{agenda_assinaturas:'Integração · Google Agenda',organograma_miro:'Organograma · Miro'});
function googleFeedURL(){const token=GAGENDA.status?.token;if(!/^[0-9a-f]{64}$/.test(token||''))return '';return SUPABASE_URL.replace(/\/$/,'')+'/functions/v1/agenda-feed?token='+encodeURIComponent(token);}
function googleAgendaModal(){const s=GAGENDA.status,active=!!s?.ativa,url=googleFeedURL(),role=S.role;
 modal('Conectar ao Google Agenda',`<div class="integracao-grid"><div><p>Veja seus compromissos do EventFlow também no Google Agenda. As alterações continuam sendo feitas no ERP.</p>
 <div class="field"><label for="gaEscopo">O que aparece no Google</label><select id="gaEscopo" ${GAGENDA.busy?'disabled':''}><option value="meus" ${s?.escopo!=='equipe'?'selected':''}>Meus compromissos e operações</option>${role==='gerencia'?`<option value="equipe" ${s?.escopo==='equipe'?'selected':''}>Agenda de toda a equipe</option>`:''}</select></div>
 <p class="hint">Compromissos criados por você ou atribuídos a você, etapas das suas OS e cargas relacionadas. Para estoque, inclui a agenda de cargas do setor. Período: últimos 90 dias e próximos 2 anos.</p>
 <button class="btn pri" data-integ="googleAtivar" ${GAGENDA.busy?'disabled':''}>${GAGENDA.busy?'Aguarde…':active?'Aplicar seleção':'Gerar link privado'}</button>
 ${active?`<div style="margin-top:20px"><span class="pill ok">Link ativo</span><ol class="integracao-passos"><li>Copie o link privado abaixo.<div class="integracao-link"><input id="gaLink" value="${esc(url)}" readonly aria-label="Link privado da agenda"><button class="btn sm" data-integ="googleCopiar">Copiar link</button></div></li><li>Abra o Google Agenda no computador e escolha <b>Outras agendas → + → Do URL</b>.<br><a class="btn sm" href="https://calendar.google.com/calendar/u/0/r/settings/addbyurl" target="_blank" rel="noopener noreferrer">Abrir Google Agenda ↗</a></li><li>Cole o link e clique em <b>Adicionar agenda</b>. Ela também aparecerá no aplicativo do celular.</li></ol></div>`:''}
 </div><div><div class="integracao-info"><b>Como as atualizações funcionam</b><p>O Google consulta o link periodicamente. A atualização pode demorar e não é controlada pelo EventFlow. Editar no Google não altera o ERP.</p><p>OS e cargas usam janelas de referência de 1 hora, iguais aos horários operacionais exibidos na agenda. Confira a ordem para a programação completa.</p><b>Seu link é privado</b><p>Quem tiver esse link poderá consultar os eventos exportados. Não compartilhe em grupos nem publique no GitHub.</p></div>
 ${active?`<p class="hint" style="margin-top:15px">Última consulta ao link: ${s.ultima_consulta?esc(new Date(s.ultima_consulta).toLocaleString('pt-BR')):'nenhuma registrada'}. Uma consulta não confirma a assinatura no Google.</p><div class="flex" style="flex-wrap:wrap"><button class="btn sm" data-integ="googleTestar" ${GAGENDA.busy?'disabled':''}>Testar conexão</button><button class="btn sm" data-integ="googleDownload" ${GAGENDA.busy?'disabled':''}>Baixar cópia .ics</button><button class="btn sm" data-integ="googleRenovar" ${GAGENDA.busy?'disabled':''}>Trocar link</button><button class="btn sm" data-integ="googleDesativar" ${GAGENDA.busy?'disabled':''}>Desativar link</button></div>`:''}

}
function mapOS(o){

  const idPlen=(ambs.find(a=>a.principal)||ambs[0]||{}).id;

  const estrDe=id=>(o.os_estruturas||[]).filter(x=>x.ambiente_id===id)
    .sort((a,b)=>a.ordem-b.ordem)

      pontos:(o.os_ancoragens||[]).filter(x=>x.estrutura_id===e.id)
        .map(a=>({id:a.id,nome:a.nome,qtd:a.quantidade,wll:num(a.wll_kgf)}))}));
  const zonaDe=id=>(o.os_zonas||[]).filter(x=>x.ambiente_id===id)
    .sort((a,b)=>a.ordem-b.ordem)
    .map(z=>({id:z.id,nome:z.nome,area:num(z.area_m2),adm:num(z.carga_admissivel)}));
  const soloDe=x=>({area:num(x.area_apoio),adm:num(x.carga_admissivel),admPont:num(x.carga_pontual_admissivel),

  const aereoDe=x=>({pontos:0,wllPonto:0,fd:num(x.fator_dinamico)||1.2,fdes:num(x.fator_desbalanceamento)||1.25,
    wllAcess:num(x.wll_acessorio)||2000,fsMin:num(x.fs_minimo)||5,vao:num(x.vao_livre)||10,
    feito:!!x.aereo_concluido});
  /* no app a plenária tem id fixo; as B.U. ficam com o uuid do banco */
  const appId=id=>id===idPlen?PLENARIA:id;
  const m=memDe(idPlen);
  return {id:o.id, principalDb:idPlen, codigo:o.codigo, negId:o.negocio_id, cliente:o.cliente_id, evento:o.evento,
    local:o.local_nome||"", cidade:o.cidade||"", publico:o.publico||0, area:num(o.area_m2),

    desmontagem:o.desmontagem, valor:num(o.valor), status:o.status, descritivo:o.descritivo||"",
    criada:(o.criado_em||"").slice(0,10),
    produtores:(o.os_produtores||[]).sort((a,b)=>(b.responsavel?1:0)-(a.responsavel?1:0)).map(p=>p.perfil_id),
    produtor:"",
    itens:(o.os_itens||[]).map(i=>({id:i.id,cod:i.item_cod,qtd:i.quantidade,

    ambientes:(ambs.length?ambs:[{id:idPlen,nome:"Plenária",principal:true}])

      estruturas:estrDe(a.id), zonas:zonaDe(a.id)}])),
    solo:{area:num(m.area_apoio),adm:num(m.carga_admissivel),admPont:num(m.carga_pontual_admissivel),
          publicoKgm2:num(m.sobrecarga_publico),apoios:m.apoios_por_equipamento||4,

async function carregarTudo(){
  const inicioRevisao=revisaoLocal;
  const q = async(t,sel)=>{
    const data=[], tamanho=200, chave=["v_itens","kits","frota"].includes(t)?"cod":"id";
    for(let de=0;;de+=tamanho){
      const r=await sb.from(t).select(sel||"*").order(chave).range(de,de+tamanho-1);
      if(r.error){r.error.message=t+": "+r.error.message;return r;}
      data.push(...(r.data||[])); if((r.data||[]).length<tamanho) return {data,error:null};
    }
  };
  const [perfis, clientes, itens, kits, frota, negocios, os, cargas, movs,
         canais, msgs, posts, notas, comps, notifs, freelas, reembolsos] = await Promise.all([
    q("perfis"), q("clientes"), q("v_itens"),
    q("kits","*, kit_itens(item_cod, quantidade)"), q("frota"),
    q("v_negocios").then(async r=>{
      if(r.error||!r.data.length) return r;
      const det=await q("negocios", `id, negocio_sala(*), negocio_ambientes(*), briefing_blocos(*), briefing_notas(*),
        visitas_tecnicas(*), vt_participantes(perfil_id), vt_checklist(*), vt_fotos(*),
        projetos_3d(*), orcamentos(*), orcamento_linhas(*),
        fechamentos(*), fechamento_participantes(perfil_id), fechamento_pauta(*)`);
      if(det.error) return det;
      const byId=porId(det.data); r.data.forEach(n=>Object.assign(n,byId[n.id]||{})); return r;
    }),
    q("v_ordens_venda").then(async r=>{
      if(r.error||!r.data.length) return r;
      const ids=r.data.map(x=>x.id);
      const det = await q("ordens_venda",
        `id, os_produtores(perfil_id,responsavel), os_ambientes(*), os_estruturas(*), os_zonas(*),
         os_itens(*), os_ancoragens(*), os_memorial(*),
         os_logistica(observacao), os_veiculo_dias(*), os_escala(*)`);
      if(det.error) return det;
      const byId={}; det.data.forEach(d=>byId[d.id]=d);
      r.data.forEach(o=>Object.assign(o, byId[o.id]||{}));
      return r;
    }),
    q("ordens_carga","*, osc_itens(item_cod, descricao, quantidade, observacao)"),
    q("movimentos","*, movimento_linhas(item_cod, quantidade, avaria)"),
    q("canais","*, canal_membros(perfil_id, lido_em)"), q("mensagens"),
    q("posts","*, post_curtidas(perfil_id), post_comentarios(*)"),
    q("notas","*, nota_checklist(*)"),
    q("compromissos","*, compromisso_responsaveis(perfil_id)"),
    q("notificacoes","*, notificacao_leituras(perfil_id)"),
    q("v_freelancers"), q("reembolsos")
  ]);
  for(const r of [perfis,clientes,itens,kits,frota,negocios,os,cargas,movs,canais,msgs,posts,notas,comps,notifs,freelas,reembolsos])
    if(r.error) throw r.error;

  if(inicioRevisao!==revisaoLocal || temAlteracoes()) return false;
  S.perfis   = perfis.data.map(mapPerfil);
  S.clientes = clientes.data.map(mapCliente);
  S.cat      = itens.data.map(mapItem);
  S.kits     = kits.data.map(k=>({cod:k.cod,nome:k.nome,cat:k.categoria,obs:k.observacao||"",
                 itens:(k.kit_itens||[]).map(x=>({cod:x.item_cod,qtd:x.quantidade}))}));
  S.frota    = frota.data.map(mapVeic);
  S.negocios = negocios.data.map(mapNegocio);
  S.os       = os.data.map(mapOS);
  S.cargas   = cargas.data.map(mapCarga);
  S.movs     = movs.data.map(mapMov);
  S.freelas  = freelas.data.map(mapFreela);
  S.reembolsos = reembolsos.data.map(mapReembolso);

  /* liga produtores e nomes que as telas esperam */
  S.os.forEach(o=>{ o.produtor = o.produtores.length? usr(o.produtores[0]).nome : ""; });
  S.negocios.forEach(n=>{ const o=S.os.find(x=>x.id===n.osId); n.produtores = o? o.produtores : []; });
  S.cargas.forEach(c=>{ c.conferente = usr(S.perfilId).nome; });
  S.movs.forEach(m=>{ m.user = m.quem ? usr(m.quem).nome : "—"; });

  const eu = S.perfilId;
  S.chats = canais.data.map(c=>({id:c.id,tipo:c.tipo,nome:c.nome||"",desc:c.descricao||"",osId:c.os_id,
              membros:(c.canal_membros||[]).map(m=>m.perfil_id)}));
  S.lidos = {[S.role]:{}};
  canais.data.forEach(c=>{ const m=(c.canal_membros||[]).find(x=>x.perfil_id===eu);
    if(m) S.lidos[S.role][c.id]=m.lido_em; });
  S.msgs  = msgs.data.map(m=>({id:m.id,chat:m.canal_id,autor:m.autor_id,txt:m.texto,sys:m.sistema,ts:m.criado_em}));
  S.posts = posts.data.sort((a,b)=>a.criado_em<b.criado_em?1:-1).map(p=>({id:p.id,autor:p.autor_id,ts:p.criado_em,
              txt:p.texto,sys:p.sistema,likes:(p.post_curtidas||[]).map(x=>x.perfil_id),
              coments:(p.post_comentarios||[]).sort((a,b)=>a.criado_em<b.criado_em?-1:1)
                       .map(c=>({id:c.id,autor:c.autor_id,ts:c.criado_em,txt:c.texto}))}));
  S.notas = notas.data.map(n=>({id:n.id,titulo:n.titulo,txt:n.conteudo||"",tags:n.etiquetas||[],cor:n.cor||"",
              fixada:n.fixada,escopo:n.escopo,autor:n.autor_id,osId:n.os_id,ts:n.criado_em,
              checklist:(n.nota_checklist||[]).sort((a,b)=>a.ordem-b.ordem).map(c=>({id:c.id,t:c.texto,ok:c.concluido}))}));
  S.compromissos = comps.data.map(c=>({id:c.id,titulo:c.titulo,data:c.data,hora:c.hora||"",dur:c.duracao_min||0,
              tipo:c.tipo,osId:c.os_id,negId:c.negocio_id,local:c.local||"",obs:c.observacao||"",
              resp:(c.compromisso_responsaveis||[]).map(r=>r.perfil_id)}));
  S.notifs = notifs.data.map(n=>({id:n.id,ts:n.criado_em,txt:n.texto,tipo:n.tipo,para:n.destino,
              view:n.tela||"painel",sel:n.referencia,
              lida:Object.fromEntries((n.notificacao_leituras||[]).filter(l=>l.perfil_id===eu).map(()=>[S.role,true]))}));
  return true;
}

<script>
/* =============================================================
   3 · GRAVAÇÃO
   Todo o app chama save() depois de mexer em S. Aqui isso vira
   uma comparação com o último estado conhecido, e só o que mudou
   sobe para o banco.
   ============================================================= */
let ultimo = null;
let pendente = null;
let gravando = false;
let promessaSync = null;
let revisaoLocal = 0;
let carregandoDados = false;
const clone = o => JSON.parse(JSON.stringify(o));
const igual = (a,b) => JSON.stringify(a)===JSON.stringify(b);
const porId = arr => Object.fromEntries((arr||[]).map(x=>[x.id||x.cod, x]));
const MODULOS = ["cat","kits","frota","clientes","freelas","negocios","os","cargas",
  "chats","notas","compromissos","msgs","posts","notifs","reembolsos"];
function marcarSincronizado(){ ultimo=Object.fromEntries(MODULOS.map(k=>[k,clone(S[k]||[])])); }
function temAlteracoes(){ return !!ultimo && MODULOS.some(k=>!igual(S[k]||[],ultimo[k])); }
function statusSync(txt, falha=false){
  const e=document.getElementById("syncStatus"); if(e){ e.textContent=txt; e.dataset.erro=String(falha); }
  const b=document.getElementById("btnSync"); if(b){ b.textContent=falha?"Tentar novamente":"Atualizar"; b.disabled=gravando||carregandoDados; }
}
function agendarSync(){
  ensureProd(); ensureFrota();
  revisaoLocal++;
  clearTimeout(pendente);
  if(!temAlteracoes()) return;
  statusSync("Alterações pendentes");
  pendente=setTimeout(()=>{pendente=null;sincronizar();},500);
}
save=agendarSync;
load=()=>{};
async function passo(chave,fn,estado){
  if(igual(estado[chave]||[],ultimo[chave])) return;
  try { await fn(estado); ultimo[chave]=clone(estado[chave]||[]); }
  catch(e){ e.modulo=chave; throw e; }
}
function sincronizar(){
  clearTimeout(pendente); pendente=null;
  if(promessaSync) return promessaSync;
  if(!ultimo) return Promise.resolve(false);
  gravando=true; statusSync("Salvando…");
  promessaSync=(async()=>{
    try{
      do {
        const estado=clone(S);
        // Pais antes dos filhos. A OS e o vínculo de volta são concluídos depois do negócio.
        for(const [k,fn] of [["cat",syncItens],["kits",syncKits],["frota",syncFrota],
          ["clientes",syncClientes],["freelas",syncFreelas],["negocios",syncNegocios],
          ["os",syncOS],["cargas",syncCargas],["chats",syncChats],["notas",syncNotas],
          ["compromissos",syncCompromissos],["msgs",syncMsgs],["posts",syncPosts],
          ["notifs",syncNotifs],["reembolsos",syncReembolsos]]) await passo(k,fn,estado);
      } while(temAlteracoes());
      statusSync("Todas as alterações salvas");
      return true;
    }catch(e){
      erro(e,"Não foi possível salvar"+(e.modulo?" · "+e.modulo:""));
      statusSync("Alterações não salvas. "+mensagemErro(e),true);
      return false;
    }finally{
      gravando=false; promessaSync=null;
      const b=document.getElementById("btnSync"); if(b) b.disabled=carregandoDados;
    }
  })();
  return promessaSync;
}
window.addEventListener("beforeunload",e=>{ if(temAlteracoes()||gravando){e.preventDefault();e.returnValue="";} });
// INSERT/UPDATE separados: UPSERT exige SELECT inclusive das colunas sigilosas.
async function gravarRegistro(tabela,dados,chave,existe){
  const q=sb.from(tabela);
  const r=existe ? await q.update(dados).eq(chave,dados[chave]).select(chave).single()
    : await q.insert(dados).select(chave).single();
  if(r.error) throw r.error;
}
async function substituirRelacoes(tabela,chave,valor,linhas){
  const r=await sb.rpc("substituir_relacoes",{p_tabela:tabela,p_chave:chave,p_valor:String(valor),p_linhas:linhas});
  if(r.error) throw r.error;
}

/* ---------- inventário ---------- */
async function syncItens(estado){
  const antes=porId(ultimo.cat), agora=porId(estado.cat);
  const up=estado.cat.filter(i=>!igual(i,antes[i.cod])).map(i=>({cod:i.cod,nome:i.nome,categoria:i.cat,
    unidade:i.un,peso_kg:i.peso,por_case:i.porCase,watts:i.watts,diaria:i.diaria,
    quantidade_total:i.total,em_manutencao:i.manut}));
  const del=Object.keys(antes).filter(c=>!agora[c]);
  for(const d of up){
    if(estado.role!=="gerencia") delete d.diaria;
    const ex=await sb.from("itens").select("cod").eq("cod",d.cod).maybeSingle(); if(ex.error) throw ex.error;
    await gravarRegistro("itens",d,"cod",!!ex.data);
  }
  if(del.length){ const r=await sb.from("itens").delete().in("cod",del); if(r.error) throw r.error; }
}
async function syncKits(estado){
  const antes=porId(ultimo.kits), agora=porId(estado.kits);
  for(const k of estado.kits){
    if(igual(k,antes[k.cod])) continue;
    let r=await sb.from("kits").upsert({empresa_id:S.empresaId,cod:k.cod,nome:k.nome,categoria:k.cat,observacao:nz(k.obs)},{onConflict:"empresa_id,cod"});
    if(r.error) throw r.error;
    await substituirRelacoes("kit_itens","kit_cod",k.cod,k.itens.map(x=>({kit_cod:k.cod,item_cod:x.cod,quantidade:x.qtd})));
  }
  const del=Object.keys(antes).filter(c=>!agora[c]);
  if(del.length){ const r=await sb.from("kits").delete().in("cod",del); if(r.error) throw r.error; }
}
async function syncFrota(estado){
  const antes=porId(ultimo.frota), agora=porId(estado.frota);
  const up=estado.frota.filter(v=>!igual(v,antes[v.cod])).map(v=>({cod:v.cod,nome:v.nome,tipo:v.tipo,placa:nz(v.placa),
    capacidade_kg:v.capKg,capacidade_cases:v.capCases,lugares:v.lugares,observacao:nz(v.obs),em_manutencao:!!v.manut}));
  const del=Object.keys(antes).filter(c=>!agora[c]);
  if(up.length){ const r=await sb.from("frota").upsert(up.map(x=>({...x,empresa_id:S.empresaId})),{onConflict:"empresa_id,cod"}); if(r.error) throw r.error; }
  if(del.length){ const r=await sb.from("frota").delete().in("cod",del); if(r.error) throw r.error; }
}
async function syncClientes(estado){
  const antes=porId(ultimo.clientes);
  const up=estado.clientes.filter(c=>!igual(c,antes[c.id]));
  if(!up.length) return;
  const r=await sb.from("clientes").upsert(up.map(c=>({id:c.id,nome:c.nome,tipo:c.tipo,documento:c.doc,
    contato:c.contato,telefone:c.tel,cidade:c.cidade,desde:c.desde})));
  if(r.error) throw r.error;
}

/* ---------- pipeline ---------- */
async function syncNegocios(estado){
  const antes=porId(ultimo.negocios);
  for(const n of estado.negocios){

    }
    if(r.error) throw r.error;

    if(!a || !igual(n.brief.sala,a.brief.sala) || !igual(n.brief.ambientes,a.brief.ambientes)){
      const dadosPlen={negocio_id:n.id,nome:n.brief.sala.nome||"Plenária",principal:true,

        pontos:n.brief.sala.pontos,observacao:nz(n.brief.sala.obs),ordem:0};
      /* A plenária é achada por negocio_id + principal, nunca pelo nome: dar
         nome à sala no briefing é renomear a que existe, não criar outra.
         Pelo nome, um upsert com nome novo inseria uma segunda principal e
         batia em um_principal_por_negocio. */
      const jaPlen=await sb.from("negocio_ambientes").select("id")
        .eq("negocio_id",n.id).eq("principal",true).limit(1);
      if(jaPlen.error) throw jaPlen.error;
      if(jaPlen.data && jaPlen.data.length){
        r=await sb.from("negocio_ambientes").update(dadosPlen).eq("id",jaPlen.data[0].id);
      } else {
        r=await sb.from("negocio_ambientes").insert(dadosPlen);
      }
      if(r.error) throw r.error;

      const extras=(n.brief.ambientes||[]);
      if(extras.length){
        r=await sb.from("negocio_ambientes").upsert(extras.map((x,i)=>({id:x.id,negocio_id:n.id,nome:x.nome||("Sala "+(i+2)),
          principal:false,area_m2:x.area||0,pe_direito:x.peDireito||0,carga_piso:x.cargaPiso||500,
          energia_kva:x.energia||0,pontos:x.pontos||0,observacao:nz(x.obs),ordem:i+1})),
          {onConflict:"id"});
        if(r.error) throw r.error;
      }
      /* sala apagada no app sai do banco também */
      const vivos=extras.map(x=>x.id).filter(Boolean);
      r=await sb.from("negocio_ambientes").delete().eq("negocio_id",n.id).eq("principal",false)
        .not("id","in","("+(vivos.length?vivos.join(","):"00000000-0000-0000-0000-000000000000")+")");
      if(r.error) throw r.error;
      r=await sb.from("negocio_sala").upsert({negocio_id:n.id,area_m2:n.brief.sala.area,
        pe_direito:n.brief.sala.peDireito,ancoragem:n.brief.sala.ancoragem,carga_piso:n.brief.sala.cargaPiso,
        energia_kva:n.brief.sala.energia,pontos:n.brief.sala.pontos,acesso:nz(n.brief.sala.acesso),
        elevador:!!n.brief.sala.elevador,observacao:nz(n.brief.sala.obs)});
      if(r.error) throw r.error;
    }
    const blocos=["led","palco","estrutura","som","luz","transmissao","cenografia","internet"];
    const mudou = blocos.filter(x=>!a||!igual(n.brief[x],a.brief[x]));
    if(estado.role==="gerencia" && mudou.length){
      r=await sb.from("briefing_blocos").upsert(mudou.map(x=>({negocio_id:n.id,bloco:x,
        incluso:!!n.brief[x].tem,porte:nz(n.brief[x].porte),observacao:nz(n.brief[x].obs)})));
      if(r.error) throw r.error;
    }
    if(estado.role==="gerencia" && (!a || !igual(n.briefNotas,a.briefNotas))){
      const antesNotas=porId((a&&a.briefNotas)||[]);
      const novas=n.briefNotas.filter(x=>!antesNotas[x.id]);
      if(novas.length){ r=await sb.from("briefing_notas").upsert(novas.map(x=>({id:x.id,negocio_id:n.id,
        autor_id:pid(x.autor),texto:x.txt})), {onConflict:"id",ignoreDuplicates:true}); if(r.error) throw r.error; }
    }
    if(!a || !igual(n.vt,a.vt)) await syncVT(n,a?.vt);
    if(!a || !igual(n.tresd,a.tresd)){
      r=await sb.from("projetos_3d").upsert({negocio_id:n.id,necessario:!!n.tresd.necessario,
        status:n.tresd.status,responsavel_id:pid(n.tresd.resp),prazo:nz(n.tresd.prazo),
        revisoes:n.tresd.revisoes||0,arquivo:nz(n.tresd.link),retorno:nz(n.tresd.obs)});
      if(r.error) throw r.error;
    }
    if(estado.role==="gerencia" && (!a || !igual(n.orc,a.orc))) await syncOrcamento(n);
    if(estado.role==="gerencia" && (!a || !igual(n.fech,a.fech))) await syncFechamento(n);
  }
}
async function syncVT(n,antesVT){
  let r=await sb.from("visitas_tecnicas").upsert({negocio_id:n.id,realizada:!!n.vt.feita,
    data:nz(n.vt.data),hora:nz(n.vt.hora),resumo:nz(n.vt.resumo)});

  const vtQuem=pids(n.vt.quem);
  await substituirRelacoes("vt_participantes","negocio_id",n.id,vtQuem.map(p=>({negocio_id:n.id,perfil_id:p})));
  await substituirRelacoes("vt_checklist","negocio_id",n.id,
      n.vt.checklist.map((c,i)=>({negocio_id:n.id,ordem:i,texto:c.t,concluido:!!c.ok})));
  const removidas=(antesVT?.fotos||[]).filter(f=>!n.vt.fotos.some(x=>x.id===f.id));
  if(removidas.length){
    const del=await sb.from("vt_fotos").delete().eq("negocio_id",n.id).in("id",removidas.map(f=>f.id));
    if(del.error) throw del.error;
    const paths=removidas.map(f=>f.path).filter(Boolean);
    if(paths.length){const rm=await sb.storage.from("vt-fotos").remove(paths);if(rm.error) throw rm.error;}
  }
  /* A foto já foi enviada; apenas as legendas precisam de atualização. */
  for(const f of n.vt.fotos){
    if(!f.path) continue;
    r=await sb.from("vt_fotos").update({legenda:nz(f.legenda)}).eq("id",f.id);
    if(r.error) throw r.error;
  }
}

async function syncOS(estado){
  const antes=porId(ultimo.os);
  for(const o of estado.os){
    const a=antes[o.id]; if(igual(o,a)) continue;
    const as=ambsOS(o);
    const reg=await sb.from("os_ambientes").select("id,principal").eq("os_id",o.id);
    if(reg.error) throw reg.error;
    const principal=(reg.data||[]).find(x=>x.principal);
    const ids=Object.fromEntries(as.map((x,i)=>[x.id,i===0?(principal?.id||o.principalDb||uid()):x.id]));
    const grafo={os_ambientes:[],os_zonas:[],os_estruturas:[],os_ancoragens:[],os_memorial:[],
      os_itens:[],os_veiculo_dias:[],os_escala:[]};
    for(const [ordem,x] of as.entries()){
      const bid=ids[x.id], m=memAmb(o,x.id), zs=zonasDe(o,x.id), es=estruturasDe(o,x.id);
      grafo.os_ambientes.push({id:bid,os_id:o.id,nome:x.nome,principal:ordem===0,ordem});
      zs.forEach((z,k)=>grafo.os_zonas.push({id:z.id,os_id:o.id,ambiente_id:bid,nome:z.nome,
        area_m2:z.area??0,carga_admissivel:z.adm??500,ordem:k}));
      es.forEach((e,k)=>{
        grafo.os_estruturas.push({id:e.id,os_id:o.id,ambiente_id:bid,nome:e.nome,
          torre_solo:!!e.torres,zona_id:e.zona||zs[0]?.id||null,ordem:k});
        (e.pontos||[]).forEach(pt=>grafo.os_ancoragens.push({id:pt.id||uid(),os_id:o.id,
          ambiente_id:bid,estrutura_id:e.id,nome:pt.nome,quantidade:pt.qtd,wll_kgf:pt.wll}));
      });
      grafo.os_memorial.push({ambiente_id:bid,os_id:o.id,area_apoio:m.solo.area,
        carga_admissivel:m.solo.adm,carga_pontual_admissivel:m.solo.admPont,
        sobrecarga_publico:m.solo.publicoKgm2,apoios_por_equipamento:m.solo.apoios,
        torre_solo:!!m.solo.torres,solo_concluido:!!m.solo.feito,
        fator_dinamico:m.aereo.fd,fator_desbalanceamento:m.aereo.fdes,wll_acessorio:m.aereo.wllAcess,
        fs_minimo:m.aereo.fsMin,vao_livre:m.aereo.vao,aereo_concluido:!!m.aereo.feito});
    }
    grafo.os_itens=o.itens.map(i=>{
      const amb=i.amb||as[0].id;
      if(!ids[amb]) throw new Error("Há um item vinculado a uma sala removida. Revise o escopo da OS.");
      const e=i.cod?estrDaLinha(o,amb,i):null,z=i.cod?zonaDaLinha(o,amb,i):null;
      return {id:i.id||uid(),os_id:o.id,ambiente_id:ids[amb],estrutura_id:e?.id||null,zona_id:z?.id||null,
        item_cod:i.cod||null,descricao:i.cod?null:(i.nome||"Linha avulsa"),categoria:i.cod?null:nz(i.cat),
        quantidade:i.qtd,quantidade_aerea:i.aereo??null,observacao:nz(i.obs)};
    });
    const lg=o.logistica||{};
    grafo.os_veiculo_dias=(lg.veicDias||[]).map(v=>({id:v.id,os_id:o.id,veiculo_cod:v.cod,
      data:v.data,hora:nz(v.hora),motorista:nz(v.motorista),observacao:nz(v.obs)}));
    grafo.os_escala=(lg.escala||[]).map(e=>({id:e.id,os_id:o.id,data:e.data,
      freelancer_id:pid(e.freela),perfil_id:pid(e.perfil),nome:e.nome,funcao:e.funcao||"Apoio",
      veiculo_cod:e.cod||null,hora:nz(e.hora),observacao:nz(e.obs)}));
    const cab={id:o.id,codigo:o.codigo,negocio_id:nz(o.negId),cliente_id:nz(o.cliente),evento:o.evento,
      local_nome:nz(o.local),cidade:nz(o.cidade),publico:o.publico||0,area_m2:o.area||0,
      montagem:o.montagem,evento_inicio:nz(o.evIni),evento_fim:nz(o.evFim),desmontagem:o.desmontagem,
      status:o.status,descritivo:nz(o.descritivo)};
    if(estado.role==="gerencia") cab.valor=o.valor||0;
    const produtores=estado.role==="gerencia"?pids(o.produtores).map((p,i)=>({os_id:o.id,perfil_id:p,responsavel:i===0})):null;
    const r=await sb.rpc("salvar_os_completa",{p_cab: cab,p_grafo:grafo,p_produtores:produtores,p_obs:nz(lg.obs)});
    if(r.error) throw r.error;
  }
}

async function syncFreelas(estado){

  const mudou=(estado.freelas||[]).filter(f=>!igual(f,antes[f.id]));
  if(mudou.length){
    const linhas=mudou.map(f=>{
      const base={id:f.id,nome:f.nome,apelido:nz(f.apelido),telefone:nz(f.tel),email:nz(f.email),
        cidade:nz(f.cidade),especialidades:f.especialidades||[],
        veiculo_proprio:!!f.veicProprio,veiculo_desc:nz(f.veicDesc),
        observacao:nz(f.obs),ativo:f.ativo!==false};
      /* quem não vê valores não manda as colunas fechadas: o grant de coluna
         recusaria a gravação inteira, e o cadastro perderia o resto junto */
      if(can("ver_valores")) Object.assign(base,{cache_diaria:Number(f.cache)||0,
        cpf:nz(f.cpf),rg:nz(f.rg),nascimento:nz(f.nasc),banco:nz(f.banco),agencia:nz(f.agencia),
        conta:nz(f.conta),tipo_conta:nz(f.tipoConta),titular:nz(f.titular),pix:nz(f.pix)});
      return base;
    });
    for(const d of linhas){
      const ex=await sb.from("freelancers").select("id").eq("id",d.id).maybeSingle(); if(ex.error) throw ex.error;
      await gravarRegistro("freelancers",d,"id",!!ex.data);
    }
  }
  const del=Object.keys(antes).filter(i=>!agora[i]);
  if(del.length){ const r=await sb.from("freelancers").delete().in("id",del); if(r.error) throw r.error; }
}
