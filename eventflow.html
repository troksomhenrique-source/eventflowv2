<script>
/* ================= ORÇAMENTO ================= */
const CATORC=[...CATEGORIAS,"Serviços","Logística"];
const vazioOrc = () => ({linhas:[],desconto:0,condicoes:"50% na assinatura · 50% até 5 dias antes da montagem",
  validade:"",obsGeral:"",probabilidade:50,previsao:"",concorrentes:""});
let _orcSeq=0;
const novaLinhaId = () => "L"+(Date.now()%1e7)+(_orcSeq++);

function ensureOrc(){
  S.negocios.forEach(n=>{
    if(!n.orc){
      n.orc=vazioOrc();
      const g=n.neg||{};
      n.orc.desconto=g.desconto||0; n.orc.condicoes=g.condicoes||n.orc.condicoes;
      n.orc.probabilidade=g.probabilidade||50; n.orc.previsao=g.previsao||""; n.orc.concorrentes=g.concorrentes||"";
      if(n.brief && n.brief.sala.area) puxarBriefing(n,true);
      /* negócios já fechados ganham as linhas externas que apareceram na prática */
      if(n.osId){
        const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
        n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cat:"Serviços",nome:"Equipe de montagem e operação",
          qtd:1,dias,unit:Math.round((n.neg.proposta||60000)*0.12/dias),modo:"diaria",fornecedor:"Equipe própria",obs:"Montadores, operadores de som/luz e coordenação em campo."});
        n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cat:"Logística",nome:"Frete ida e volta",
          qtd:1,dias:1,unit:Math.round((n.neg.proposta||60000)*0.04),modo:"fechado",fornecedor:"Frota própria",obs:"Carreta ou truck conforme volume."});
        n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cat:"Serviços",nome:"ART de execução · CREA",
          qtd:1,dias:1,unit:780,modo:"fechado",fornecedor:"Eng. Rubens Maia",obs:"Emissão antes do início da montagem."});
      }
    }
    if(!n.orc.linhas) n.orc.linhas=[];
  });
}
function puxarBriefing(n,silencioso){
  const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
  const e=escopoDoBriefing(n);
  const jaTem=new Set(n.orc.linhas.filter(l=>l.tipo==="estoque").map(l=>l.cod));
  let add=0;
  e.forEach(i=>{ if(jaTem.has(i.cod)) return;
    const it=item(i.cod);
    n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod:i.cod,nome:it.nome,cat:it.cat,
      qtd:i.qtd,dias,unit:it.diaria,modo:"diaria",obs:""});
    add++; });
  if(!silencioso) toast(add?add+" linha(s) trazida(s) do briefing.":"O orçamento já contém tudo que o briefing sugere.");
  return add;
}
function orcTotais(n){
  const o=n.orc, porCat={}, sub={estoque:0,externo:0};
  o.linhas.forEach(l=>{
    const v=(Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0);
    porCat[l.cat]=(porCat[l.cat]||0)+v; sub[l.tipo]+=v;
  });
  const subtotal=sub.estoque+sub.externo;
  const descV=subtotal*(Number(o.desconto)||0)/100;
  return {porCat,subEstoque:sub.estoque,subExterno:sub.externo,subtotal,descV,total:subtotal-descV};
}
const linhasEstoque = n => (n.orc?n.orc.linhas:[]).filter(l=>l.tipo==="estoque");
const escopoDaOS = n => linhasEstoque(n).map(l=>({cod:l.cod,qtd:Number(l.qtd)||0})).filter(i=>i.qtd>0);

/* ---- tela ---- */
function abaNeg(n){
  if(!can("ver_valores")) return `<div class="verdict warn"><div><b>Sem acesso</b>O orçamento é visível apenas para a gerência.</div></div>`;
  const ed=S.role==="gerencia", o=n.orc, t=orcTotais(n);
  const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
  const ordem=[...CATORC];
  const grupos=ordem.map(c=>[c,o.linhas.filter(l=>l.cat===c)]).filter(x=>x[1].length);
  const inp=(ix,campo,v,cls,tipo)=>`<input class="${cls}" type="${tipo||"number"}" value="${esc(String(v))}" data-orc="${ix}" data-f="${campo}" ${ed?"":"disabled"} step="${campo==="unit"?"10":"1"}" min="0">`;
  return `${ro("orcamento")}
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:14px;align-items:start">
    <div class="card">
      <div class="orcbar">
        ${ed?`<div class="modes">
          ${[["estoque","Item do estoque"],["kit","Kit"],["externo","Fora do estoque"]].map(m=>`<button class="${(S.orcModo||"estoque")===m[0]?"on":""}" data-act="orcModo" data-m="${m[0]}">${m[1]}</button>`).join("")}
        </div>
        <button class="btn sm ghost" data-act="puxarBrief" data-id="${n.id}">Puxar escopo do briefing</button>`:""}
        <div style="flex:1"></div>
        <span class="pill">${o.linhas.length} linha(s)</span>
        <span class="pill">janela de ${dias} diária${dias>1?"s":""}</span>
      </div>
      ${ed?`<div style="padding:12px">${formAdicao(n,dias)}</div>`:""}
      ${o.linhas.length?`<div class="tblwrap"><table class="orctbl"><thead><tr>
        <th>Item</th><th class="r">Qtd</th><th class="r">Diárias</th><th class="r">Valor unit.</th><th class="r">Subtotal</th><th>Observação</th><th></th></tr></thead><tbody>
        ${grupos.map(([c,ls])=>`<tr class="cat"><td colspan="7">${esc(c)} · ${brl(t.porCat[c]||0)}</td></tr>`+
          ls.map(l=>{ const ix=o.linhas.indexOf(l);
            const v=(Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0);
            const disp=l.tipo==="estoque"&&n.montagem&&n.desmontagem?disponivel(l.cod,n.montagem,n.desmontagem):null;
            const falta=disp!==null&&disp<l.qtd;
            return `<tr class="${l.tipo==="externo"?"ext":""}">
              <td><b style="font-weight:500;font-size:12.5px">${esc(l.nome)}</b><br>
                ${l.tipo==="estoque"?`<span class="tag">${l.cod}</span>${falta?`<span class="pill crit" style="margin-left:5px">só ${disp} na janela</span>`:disp!==null?`<span class="muted" style="font-size:10.5px;margin-left:5px">${disp} disponíveis</span>`:""}`
                  :`<span class="pill">fora do estoque</span>${l.fornecedor?`<span class="muted" style="font-size:10.5px;margin-left:5px">${esc(l.fornecedor)}</span>`:""}`}</td>
              <td class="r">${inp(ix,"qtd",l.qtd,"qi")}</td>
              <td class="r">${l.modo==="diaria"?inp(ix,"dias",l.dias,"di"):`<span class="muted" style="font-size:11px">fechado</span>`}</td>
              <td class="r">${inp(ix,"unit",l.unit,"vi")}</td>
              <td class="r num" id="sub${ix}" style="font-weight:600;white-space:nowrap">${brl(v)}</td>
              <td>${inp(ix,"obs",l.obs||"","oi","text")}</td>
              <td class="r">${ed?`<button class="btn sm ghost" data-act="rmLinha" data-id="${n.id}" data-ix="${ix}">×</button>`:""}</td></tr>`;}).join("")).join("")}
      </tbody></table></div>`
      :`<div class="empty">Orçamento vazio. Traga o escopo do briefing ou adicione os itens à mão.</div>`}
    </div>

    <div class="grid" style="gap:12px">
      <div class="card"><header><h3>Resumo</h3><span class="hint">por categoria</span></header>
        <div class="pad" id="orcResumo">${orcResumoHTML(n)}</div></div>

      <div class="card"><header><h3>Condições</h3></header><div class="pad" style="display:grid;gap:11px">
        <div class="row2">
          <div class="field"><label for="f_orc_desconto">Desconto (%)</label>
            <input id="f_orc_desconto" type="number" step="0.5" min="0" value="${o.desconto}" data-orcg="desconto" ${ed?"":"disabled"}></div>
          <div class="field"><label for="f_orc_validade">Validade da proposta</label>
            <input id="f_orc_validade" type="date" value="${o.validade}" data-orcg="validade" ${ed?"":"disabled"}></div>
        </div>
        <div class="field"><label for="f_orc_condicoes">Condições de pagamento</label>
          <textarea id="f_orc_condicoes" rows="2" style="font-family:var(--sans)" data-orcg="condicoes" ${ed?"":"disabled"}>${esc(o.condicoes)}</textarea></div>
        <div class="row2">
          <div class="field"><label for="f_orc_prob">Probabilidade (%)</label>
            <input id="f_orc_prob" type="number" step="5" min="0" max="100" value="${o.probabilidade}" data-orcg="probabilidade" ${ed?"":"disabled"}></div>
          <div class="field"><label for="f_orc_prev">Previsão de fechamento</label>
            <input id="f_orc_prev" type="date" value="${o.previsao}" data-orcg="previsao" ${ed?"":"disabled"}></div>
        </div>
        <div class="field"><label for="f_orc_conc">Concorrentes</label>
          <input id="f_orc_conc" value="${esc(o.concorrentes)}" data-orcg="concorrentes" ${ed?"":"disabled"} placeholder="Separe por vírgula"></div>
        <div class="field"><label for="f_orc_obs">Observações da proposta</label>
          <textarea id="f_orc_obs" rows="3" style="font-family:var(--sans)" data-orcg="obsGeral" ${ed?"":"disabled"}
            placeholder="O que está incluso, o que não está, premissas de acesso e horário…">${esc(o.obsGeral)}</textarea></div>
      </div></div>

      <div class="card"><header><h3>Total da proposta</h3></header>
        <div class="pad" id="orcTotal">${orcTotalHTML(n)}</div></div>
    </div>
  </div>`;
}

function formAdicao(n,dias){
  const modo=S.orcModo||"estoque";
  const porCat={}; S.cat.forEach(c=>{(porCat[c.cat]=porCat[c.cat]||[]).push(c);});
  if(modo==="estoque") return `<form class="addform" autocomplete="off">
    <div class="rowf">
      <div class="field w"><label for="aeItem">Item do estoque</label><select id="aeItem">
        ${CATEGORIAS.filter(c=>porCat[c]).map(c=>`<optgroup label="${esc(c)}">${porCat[c].map(i=>`<option value="${i.cod}">${esc(i.cod)} · ${esc(i.nome)} — ${brl(i.diaria)}/diária</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      <div class="field s"><label for="aeQtd">Qtd</label><input id="aeQtd" type="number" value="1" min="1"></div>
      <div class="field s"><label for="aeDias">Diárias</label><input id="aeDias" type="number" value="${dias}" min="1"></div>
      <div class="field w"><label for="aeObs">Observação</label><input id="aeObs" placeholder="Ex.: 4 unidades de reserva"></div>
      <button class="btn pri go" type="submit" data-act="salvarEstoque" data-id="${n.id}">Adicionar</button>
    </div><p class="hint">Enter adiciona e devolve o foco para o item, para lançar um atrás do outro.</p></form>`;
  if(modo==="kit") return `<form class="addform" autocomplete="off">
    <div class="rowf">
      <div class="field w"><label for="ikKit">Kit</label><select id="ikKit">
        ${CATEGORIAS.filter(c=>(S.kits||[]).some(k=>k.cat===c)).map(c=>`<optgroup label="${esc(c)}">${S.kits.filter(k=>k.cat===c).map(k=>`<option value="${k.cod}">${esc(k.nome)} — ${k.itens.length} itens</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      <div class="field s"><label for="ikMult">Quantos</label><input id="ikMult" type="number" value="1" min="1"></div>
      <div class="field s"><label for="ikDias">Diárias</label><input id="ikDias" type="number" value="${dias}" min="1"></div>
      <button class="btn pri go" type="submit" data-act="inserirKit" data-id="${n.id}">Abrir kit</button>
    </div><p class="hint">O kit entra aberto, linha por linha — é assim que o estoque separa e a disponibilidade é conferida.</p></form>`;
  return `<form class="addform" autocomplete="off">
    <div class="rowf">
      <div class="field w"><label for="axNome">Descrição</label><input id="axNome" placeholder="Ex.: Sublocação de 40 módulos de LED P2.6"></div>
      <div class="field"><label for="axCat">Categoria</label><select id="axCat">${CATORC.map(c=>`<option ${c==="Serviços"?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label for="axForn">Fornecedor</label><input id="axForn" placeholder="Ex.: Ledway"></div>
    </div>
    <div class="rowf">
      <div class="field"><label for="axModo">Cobrança</label><select id="axModo"><option value="diaria">Por diária</option><option value="fechado">Valor fechado</option></select></div>
      <div class="field s"><label for="axQtd">Qtd</label><input id="axQtd" type="number" value="1" min="1"></div>
      <div class="field s"><label for="axDias">Diárias</label><input id="axDias" type="number" value="${dias}" min="1"></div>
      <div class="field s"><label for="axUnit">Valor un.</label><input id="axUnit" type="number" value="0" step="50" min="0"></div>
      <div class="field w"><label for="axObs">Observação</label><input id="axObs" placeholder="Prazo de confirmação, condição do fornecedor…"></div>
      <button class="btn pri go" type="submit" data-act="salvarExterno" data-id="${n.id}">Adicionar</button>
    </div><p class="hint">Sublocação, serviço de terceiro, mão de obra, frete, taxa — tudo que entra na proposta mas não sai do galpão.</p></form>`;
}
function orcResumoHTML(n){
  const t=orcTotais(n);
  return `${Object.entries(t.porCat).length?Object.entries(t.porCat).map(([c,v])=>`<div class="totrow"><span>${esc(c)}</span><b>${brl(v)}</b></div>`).join(""):`<span class="muted" style="font-size:12px">Sem linhas.</span>`}
    <div style="border-top:1px solid var(--line2);margin-top:6px;padding-top:6px">
      <div class="totrow"><span>Equipamento do estoque</span><b>${brl(t.subEstoque)}</b></div>
      <div class="totrow"><span>Itens fora do estoque</span><b>${brl(t.subExterno)}</b></div>
      <div class="totrow"><span><b style="color:var(--ink)">Subtotal</b></span><b>${brl(t.subtotal)}</b></div>
    </div>`;
}
function orcTotalHTML(n){
  const t=orcTotais(n), o=n.orc;
  return `<div class="totrow"><span>Subtotal</span><b>${brl(t.subtotal)}</b></div>
    <div class="totrow"><span>Desconto ${dec(o.desconto,1)}%</span><b>−${brl(t.descV)}</b></div>
    <div class="totrow big" style="border-top:1px solid var(--line2);margin-top:4px;padding-top:8px"><span><b style="color:var(--ink)">Valor final</b></span><b>${brl(t.total)}</b></div>
    <div class="totrow"><span class="muted">Ponderado por ${o.probabilidade}%</span><b class="muted">${brl(t.total*(o.probabilidade||0)/100)}</b></div>
    ${t.subtotal>0&&t.subExterno/t.subtotal>0.4?`<div class="verdict warn" style="margin-top:9px"><div><b>Muita coisa de fora</b>${dec(t.subExterno/t.subtotal*100,0)}% do orçamento é item que não está no galpão. Confirme fornecedores antes de fechar.</div></div>`:""}`;
}
function repintarOrc(n,ix){
  const t=orcTotais(n);
  if(ix!=null){ const l=n.orc.linhas[ix], c=document.getElementById("sub"+ix);
    if(l&&c) c.textContent=brl((Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0)); }
  const r=document.getElementById("orcResumo"); if(r) r.innerHTML=orcResumoHTML(n);
  const g=document.getElementById("orcTotal"); if(g) g.innerHTML=orcTotalHTML(n);
}

/* ---- eventos ---- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(!["orcModo","puxarBrief","rmLinha","salvarEstoque","salvarExterno"].includes(a)) return;
  if(S.role!=="gerencia") return;
  const n=neg(id);
  switch(a){
    case "orcModo": S.orcModo=t.dataset.m; save(); render(); focarAdicao(); break;
    case "puxarBrief": puxarBriefing(n); sincOrc(n); save(); render(); break;
    case "rmLinha": n.orc.linhas.splice(Number(t.dataset.ix),1); sincOrc(n); save(); render(); break;
    case "salvarEstoque": {
      const cod=document.getElementById("aeItem").value, it=item(cod);
      const qtd=Math.max(1,Number(document.getElementById("aeQtd").value)||1);
      const ex=n.orc.linhas.find(l=>l.tipo==="estoque"&&l.cod===cod);
      if(ex){ ex.qtd+=qtd; }
      else n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod,nome:it.nome,cat:it.cat,qtd,
        dias:Math.max(1,Number(document.getElementById("aeDias").value)||1),unit:it.diaria,modo:"diaria",
        obs:document.getElementById("aeObs").value});
      sincOrc(n); save(); render(); focarAdicao(); toast(it.nome+" adicionado ao orçamento."); break;}
    case "salvarExterno": {
      const nome=document.getElementById("axNome").value.trim();
      if(!nome) return toast("Descreva o item antes de adicionar.");
      n.orc.linhas.push({id:novaLinhaId(),tipo:"externo",cod:null,nome,cat:document.getElementById("axCat").value,
        qtd:Math.max(1,Number(document.getElementById("axQtd").value)||1),
        dias:Math.max(1,Number(document.getElementById("axDias").value)||1),
        unit:Number(document.getElementById("axUnit").value)||0,
        modo:document.getElementById("axModo").value,
        fornecedor:document.getElementById("axForn").value,obs:document.getElementById("axObs").value});
      sincOrc(n); save(); render(); focarAdicao(); toast("Item externo incluído."); break;}
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target; if(S.role!=="gerencia") return;
  const n=neg(S.sel); if(!n||!n.orc) return;
  if(el.dataset && el.dataset.orc!==undefined){
    const l=n.orc.linhas[Number(el.dataset.orc)]; if(!l) return;
    const f=el.dataset.f;
    l[f] = f==="obs" ? el.value : (Number(el.value)||0);
    sincOrc(n); save(); repintarOrc(n,Number(el.dataset.orc));
  }
  if(el.dataset && el.dataset.orcg!==undefined){
    const f=el.dataset.orcg;
    n.orc[f] = (f==="desconto"||f==="probabilidade") ? (Number(el.value)||0) : el.value;
    sincOrc(n); save(); repintarOrc(n,null);
  }
});
document.addEventListener("change", ev=>{
  const el=ev.target; if(S.role!=="gerencia") return;
  if(el.dataset && (el.dataset.orc!==undefined||el.dataset.orcg!==undefined)) render();
});

/* mantém os campos antigos em sincronia com o orçamento */
function sincOrc(n){
  const t=orcTotais(n);
  n.neg.proposta=Math.round(t.subtotal); n.neg.desconto=n.orc.desconto;
  n.neg.condicoes=n.orc.condicoes; n.neg.probabilidade=n.orc.probabilidade;
  n.neg.previsao=n.orc.previsao; n.neg.concorrentes=n.orc.concorrentes;
  n.valor=Math.round(t.total);
}
</script>
<style>
.kitcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadowUp);overflow:hidden;display:flex;flex-direction:column}
.kitcard>header{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.kitcard>header h4{font-size:13px;font-weight:600;line-height:1.25}
.kitcard .comp{display:grid;gap:1px;background:var(--line2)}
.kitcard .comp div{background:var(--surface);display:flex;gap:9px;align-items:baseline;padding:6px 12px;font-size:12px}
.kitcard .comp div b{font-family:var(--mono);font-weight:600;width:34px;text-align:right;flex:none}
.kitcard .comp div span{color:var(--ink2);min-width:0;flex:1}
.kitcard .comp div u{text-decoration:none;color:var(--ink3);font-family:var(--mono);font-size:10.5px}
.kitcard footer{margin-top:auto;border-top:1px solid var(--line2);background:var(--surface2);padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.specs{display:flex;gap:5px;flex-wrap:wrap}
.spec{font-family:var(--mono);font-size:10.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}
.spec b{color:var(--ink);font-weight:600}
</style>
<script>
/* ================= KITS E FICHA DE ITEM ================= */
function seedKits(){
  const K=(cod,nome,cat,obs,itens)=>({cod,nome,cat,obs,itens:itens.map(x=>({cod:x[0],qtd:x[1]}))});
  return [
    K("KIT-VID-01","Kit de Vídeo · corte simples","Vídeo","Palestra com uma tela e gravação. Vai em 4 cases.",
      [["SWT-4K",1],["PAS-SDI",2],["MON-REF",2],["ENC-STR",1],["INT-WL",1],["LNK-FIB",2]]),
    K("KIT-VID-02","Kit de Vídeo · multicâmera","Vídeo","Corte ao vivo com PTZ e 4K, para transmissão.",
      [["SWT-4K",1],["PAS-SDI",4],["CAM-PTZ",2],["CAM-4K",2],["TRI-PRO",3],["MON-REF",4],["ENC-STR",1],["INT-WL",2],["LNK-FIB",2]]),
    K("KIT-SOM-01","Kit de Som · fala","Som","Palestra, congresso e cerimônia sem banda.",
      [["CON-M32",1],["MIC-SF",2],["LNA-VT",2],["MON-P12",2]]),
    K("KIT-SOM-02","Kit de Som · show","Som","Line array completo com monitoração de palco.",
      [["LNA-VT",12],["SUB-218",8],["CON-M32",2],["MON-P12",6],["MIC-SF",6]]),
    K("KIT-LUZ-01","Kit de Luz · cênica","Luz","Wash e realce para palco de palestra.",
      [["PAR-18",36],["MOV-W575",8],["MES-AVO",1],["RCK-DIM",1]]),
    K("KIT-LUZ-02","Kit de Luz · show","Luz","Beam, wash e PAR para show e festival.",
      [["MOV-B230",16],["MOV-W575",12],["PAR-18",40],["MES-AVO",1],["RCK-DIM",2]]),
    K("KIT-RIG-01","Kit de Rigging · 8 pontos","Estrutura","Acessórios de içamento para um grid de 8 pontos.",
      [["TAL-1T",8],["SLG-2T",24],["MAN-3T",28]]),
    K("KIT-NET-01","Kit de Internet · público","Internet","Wi-Fi para plateia, com link dedicado.",
      [["NET-LNK",1],["NET-RTR",1],["NET-APX",8],["NET-SWT",1],["NET-CAB",2]])
  ];
}
function ensureKits(){ if(!S.kits||!S.kits.length) S.kits=seedKits();
  S.cat.forEach(c=>{ const o=CAT.find(x=>x.cod===c.cod);
    if(c.porCase===undefined) c.porCase=o?o.porCase:1;
    if(c.watts===undefined) c.watts=o?o.watts:0; }); }
const kitById = cod => (S.kits||[]).find(k=>k.cod===cod);
const cases = (cod,qtd) => { const it=item(cod); const pc=Number(it.porCase)||1; return Math.ceil(qtd/pc); };
function somaTecnica(itens){
  let peso=0,w=0,cs=0,pecas=0;
  itens.forEach(i=>{ const it=item(i.cod);
    peso+=(it.peso||0)*i.qtd; w+=(it.watts||0)*i.qtd; cs+=cases(i.cod,i.qtd); pecas+=i.qtd; });
  return {peso,w,cases:cs,pecas,kva:w/1000/0.8};
}
const kwFmt = w => w>=1000? dec(w/1000,1)+" kW" : kg(w)+" W";

/* ---- inventário: abas, colunas novas e kits ---- */
function vEstoqueNovo(){
  const tab=S.estTab||"itens";
  const ed=can("editar_inventario");
  const head=`<div class="between" style="margin-bottom:12px"><div class="tabs">
      <button class="${tab==="itens"?"on":""}" data-act="estTab" data-t="itens">Itens</button>
      <button class="${tab==="kits"?"on":""}" data-act="estTab" data-t="kits">Kits</button>
      <button class="${tab==="frota"?"on":""}" data-act="estTab" data-t="frota">Frota</button></div>
    ${ed?`<div class="flex" style="gap:7px">
      ${tab==="itens"?`<button class="btn ${S.itemForm!=null?"":"pri"}" data-act="${S.itemForm!=null?"fecharItemForm":"novoItem"}">${S.itemForm!=null?"Fechar formulário":"+ Novo item"}</button>`
        :tab==="kits"?`<button class="btn ${S.kitForm!=null?"":"pri"}" data-act="${S.kitForm!=null?"fecharKitForm":"novoKit"}">${S.kitForm!=null?"Fechar formulário":"+ Novo kit"}</button>`
        :`<button class="btn ${S.veicForm!=null?"":"pri"}" data-act="${S.veicForm!=null?"fecharVeicForm":"novoVeic"}">${S.veicForm!=null?"Fechar formulário":"+ Novo veículo"}</button>`}</div>`:""}</div>`;
  const painel = tab==="itens" ? (ed && S.itemForm!=null ? `<div style="margin-bottom:14px">${formItem(S.itemForm)}</div>` : "")
    : tab==="kits" ? (ed && S.kitForm!=null ? `<div style="margin-bottom:14px">${formKit(S.kitForm)}</div>` : "")
    : (ed && S.veicForm!=null ? `<div style="margin-bottom:14px">${formVeic(S.veicForm)}</div>` : "");
  const corpo = tab==="kits" ? vKits() : tab==="frota" ? vFrota() : vEstoque();
  const janela = tab==="frota" ? `<div class="card" style="margin-bottom:14px"><div class="pad"><div class="flex" style="gap:12px;align-items:flex-end">
      <div class="field" style="width:150px"><label for="perDe">Data da carga</label><input id="perDe" type="date" value="${S.per.de}" data-per="de"></div>
      <div class="field" style="width:150px"><label for="perAte">Data da descarga</label><input id="perAte" type="date" value="${S.per.ate}" data-per="ate"></div>
      <div style="flex:1"></div>
      <span class="pill">${(S.frota||[]).filter(v=>veicLivre(v.cod,S.per.de,S.per.ate)).length} de ${(S.frota||[]).length} livres na janela</span>
    </div></div></div>` : "";
  return head + painel + janela + corpo;
}
function vKits(){
  const ks=S.kits||[];
  return `<p class="muted" style="font-size:12px;margin:0 2px 12px">Um kit é uma composição pronta. Ao entrar num orçamento ele se abre nos itens que o formam, e o estoque continua controlado peça a peça.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start">
  ${ks.map(k=>{const t=somaTecnica(k.itens);
    const sem=k.itens.filter(i=>{const it=item(i.cod);return it.total-it.manut<i.qtd;});
    return `<div class="kitcard"><header><h4>${esc(k.nome)}</h4><span class="tag" style="margin-left:auto">${k.cod}</span></header>
      <div class="pad" style="padding:10px 12px;display:grid;gap:8px">
        <div class="flex" style="gap:6px"><span class="pill">${esc(k.cat)}</span>
          <span class="spec"><b>${t.pecas}</b> peças</span><span class="spec"><b>${t.cases}</b> cases</span>
          <span class="spec"><b>${kg(t.peso)}</b> kgf</span>${t.w?`<span class="spec"><b>${kwFmt(t.w)}</b></span>`:""}</div>
        ${k.obs?`<p style="margin:0;font-size:12px;color:var(--ink2);line-height:1.45">${esc(k.obs)}</p>`:""}
      </div>
      <div class="comp">${k.itens.map(i=>{const it=item(i.cod);
        return `<div><b>${i.qtd}×</b><span>${esc(it.nome)}</span><u>${cases(i.cod,i.qtd)} case${cases(i.cod,i.qtd)>1?"s":""}${it.watts?" · "+kwFmt(it.watts*i.qtd):""}</u></div>`;}).join("")}</div>
      <footer>${can("ver_valores")?`<span class="num" style="font-weight:600">${brl(k.itens.reduce((s,i)=>s+item(i.cod).diaria*i.qtd,0))}<span class="muted" style="font-weight:400;font-size:11px">/diária</span></span>`:""}
        ${sem.length?`<span class="pill crit">${sem.length} item(ns) sem saldo</span>`:`<span class="pill ok">completo no galpão</span>`}
        <div style="flex:1"></div>
        ${can("editar_inventario")?`<button class="btn sm" data-act="editarKit" data-id="${k.cod}">Editar</button>`:""}</footer>
    </div>`;}).join("")||`<div class="empty">Nenhum kit cadastrado.</div>`}</div>`;
}

/* ---- ficha do item, embutida na página ---- */
let tmpKit=[];
function formItem(cod){
  const i=cod?item(cod):null;
  const f=(id,l,v,tipo,attrs,cls)=>`<div class="field ${cls||""}"><label for="${id}">${l}</label><input id="${id}" type="${tipo||"text"}" value="${esc(String(v==null?"":v))}" ${attrs||""}></div>`;
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${i?"Ficha do item · "+esc(i.cod):"Novo item de estoque"}</h4>
      <div style="flex:1"></div>
      ${i?`<span class="spec">em campo <b>${emCampo(i.cod)}</b></span>
        <span class="spec">estoque cheio <b>${cases(i.cod,i.total)}</b> cases</span>
        <span class="spec">tudo em uso <b>${kwFmt((i.watts||0)*i.total)}</b></span>`:""}
      <button class="btn sm ghost" type="button" data-act="fecharItemForm">Fechar</button></div>
    <div class="rowf">
      ${f("itCod","Código",i?i.cod:"","text",i?"disabled":'placeholder="Ex.: PAS-SDI"',"s")}
      <div class="field"><label for="itCat">Categoria</label><select id="itCat">${CATEGORIAS.map(c=>`<option ${i&&i.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      ${f("itNome","Descrição",i?i.nome:"","text",'placeholder="Como aparece no romaneio"',"w")}
      <div class="field s"><label for="itUn">Unidade</label><select id="itUn">${["pç","cj","rolo","m","kg"].map(u=>`<option ${i&&i.un===u?"selected":""}>${u}</option>`).join("")}</select></div>
    </div>
    <div class="rowf">
      ${f("itPeso","Peso un. (kg)",i?i.peso:0,"number",'step="0.1" min="0"',"s")}
      ${f("itCase","Un. por case",i?i.porCase:1,"number",'step="1" min="1"',"s")}
      ${f("itW","Consumo (W)",i?i.watts:0,"number",'step="5" min="0"',"s")}
      ${f("itDiaria","Diária (R$)",i?i.diaria:0,"number",'step="5" min="0"',"s")}
      ${f("itTotal","Em estoque",i?i.total:0,"number",'step="1" min="0"',"s")}
      ${f("itManut","Manutenção",i?i.manut:0,"number",'step="1" min="0"',"s")}
      <button class="btn pri go" type="submit" data-act="salvarItem" data-id="${cod||""}">${i?"Salvar alterações":"Cadastrar item"}</button>
    </div>
    <p class="hint">Enter salva. Clique em qualquer linha da tabela abaixo para abrir a ficha daquele item aqui mesmo. Se a peça vai suspensa ou apoiada é decidido na OS, linha a linha — um moving pode ir no grid num evento e no chão no outro.</p></form>`;
}
function formKit(cod){
  const k=cod?kitById(cod):null;
  const porCat={}; S.cat.forEach(c=>{(porCat[c.cat]=porCat[c.cat]||[]).push(c);});
  const t=somaTecnica(tmpKit);
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${k?"Editar kit · "+esc(k.cod):"Novo kit"}</h4><div style="flex:1"></div>
      <button class="btn sm ghost" type="button" data-act="fecharKitForm">Fechar</button></div>
    <div class="rowf">
      <div class="field s"><label for="ktCod">Código</label><input id="ktCod" value="${k?esc(k.cod):""}" ${k?"disabled":""} placeholder="KIT-VID-03"></div>
      <div class="field"><label for="ktCat">Categoria</label><select id="ktCat">${CATEGORIAS.map(c=>`<option ${k&&k.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="field w"><label for="ktNome">Nome do kit</label><input id="ktNome" value="${k?esc(k.nome):""}" placeholder="Ex.: Kit de Vídeo · corte simples"></div>
      <div class="field w"><label for="ktObs">Para que serve</label><input id="ktObs" value="${k?esc(k.obs||""):""}" placeholder="Quando usar este kit"></div>
      <button class="btn pri go" type="submit" data-act="salvarKit" data-id="${cod||""}">${k?"Salvar kit":"Criar kit"}</button>
    </div>
    <div class="rowf" style="border-top:1px solid var(--line);padding-top:10px">
      <div class="field w"><label for="ktItem">Adicionar à composição</label><select id="ktItem">
        ${CATEGORIAS.filter(c=>porCat[c]).map(c=>`<optgroup label="${esc(c)}">${porCat[c].map(x=>`<option value="${x.cod}">${esc(x.cod)} · ${esc(x.nome)}</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      <div class="field s"><label for="ktQtd">Qtd</label><input id="ktQtd" type="number" value="1" min="1"></div>
      <button class="btn go" type="button" data-act="addKitItem">Incluir no kit</button>
      ${k?`<button class="btn go" type="button" data-act="apagarKit" data-id="${k.cod}" style="color:var(--crit)">Apagar kit</button>`:""}
    </div>
    <div class="picklist" id="kitList"></div>
    <div class="calcout" id="kitTot"></div>
    <p class="hint">Enter no campo de quantidade inclui o item no kit. Enter nos campos de cima salva o kit.</p></form>`;
}
function pintarKit(){
  const el=document.getElementById("kitList"); if(!el) return;
  el.innerHTML = tmpKit.length? tmpKit.map((x,i)=>`<div class="it"><span class="tag">${x.cod}</span>
    <span>${esc(item(x.cod).nome)}</span><span class="q">${x.qtd}×</span>
    <button class="btn sm ghost" type="button" data-act="rmKitItem" data-ix="${i}">remover</button></div>`).join("")
    : `<div class="empty" style="padding:12px">Nenhum item no kit.</div>`;
  const t=somaTecnica(tmpKit), tt=document.getElementById("kitTot");
  if(tt) tt.innerHTML = tmpKit.length
    ? `<span><b>${t.pecas}</b> peças</span><span>·</span><span><b>${t.cases}</b> cases</span><span>·</span><span><b>${kg(t.peso)}</b> kgf</span><span>·</span><span>Consumo <b>${kwFmt(t.w)}</b>${t.w?` ≈ <b>${dec(t.kva,1)} kVA</b>`:""}</span>`
    : `<span>Inclua itens para ver peso, cases e consumo.</span>`;
}

/* ---- eventos ---- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  const L=["estTab","novoItem","editarItem","salvarItem","fecharItemForm","fecharKitForm","novoKit","editarKit","salvarKit","apagarKit","addKitItem","rmKitItem","inserirKit"];
  if(!L.includes(a)) return;
  switch(a){
    case "estTab": S.estTab=t.dataset.t; save(); render(); break;
    case "novoItem": if(can("editar_inventario")){ S.itemForm=""; save(); render(); foco("itCod"); } break;
    case "editarItem": if(can("editar_inventario")){ S.estTab="itens"; S.itemForm=id; save(); render(); foco("itNome"); } break;
    case "fecharItemForm": S.itemForm=null; save(); render(); break;
    case "fecharKitForm": S.kitForm=null; save(); render(); break;
    case "salvarItem": {
      if(!can("editar_inventario")) break;
      const g=x=>document.getElementById(x).value;
      const cod=(id||g("itCod")).trim().toUpperCase();
      if(!cod) return toast("Informe um código para o item.");
      if(!g("itNome").trim()) return toast("Informe a descrição do item.");
      const dados={nome:g("itNome").trim(),cat:g("itCat"),un:g("itUn"),
        peso:Number(g("itPeso"))||0,porCase:Math.max(1,Number(g("itCase"))||1),watts:Number(g("itW"))||0,
        diaria:Number(g("itDiaria"))||0,
        total:Number(g("itTotal"))||0,manut:Number(g("itManut"))||0};
      const ex=S.cat.find(x=>x.cod===cod);
      if(ex) Object.assign(ex,dados);
      else { if(id) return; S.cat.push(Object.assign({cod,rig:"solo"},dados)); }
      S.itemForm=null; save(); render(); toast("Item "+cod+" salvo."); break;}
    case "novoKit": if(can("editar_inventario")){ tmpKit=[]; S.kitForm=""; save(); render(); pintarKit(); foco("ktCod"); } break;
    case "editarKit": if(can("editar_inventario")){ const kk=kitById(id); tmpKit=kk?kk.itens.map(x=>({...x})):[];
      S.estTab="kits"; S.kitForm=id; save(); render(); pintarKit(); foco("ktNome"); } break;
    case "addKitItem": {const c=document.getElementById("ktItem").value, q=Math.max(1,Number(document.getElementById("ktQtd").value)||1);
      const e=tmpKit.find(x=>x.cod===c); if(e) e.qtd+=q; else tmpKit.push({cod:c,qtd:q});
      document.getElementById("ktQtd").value=1; pintarKit(); foco("ktItem"); break;}
    case "rmKitItem": tmpKit.splice(Number(t.dataset.ix),1); pintarKit(); break;
    case "salvarKit": {
      if(!can("editar_inventario")) break;
      const g=x=>document.getElementById(x).value;
      const cod=(id||g("ktCod")).trim().toUpperCase();
      if(!cod) return toast("Informe um código para o kit.");
      if(!g("ktNome").trim()) return toast("Dê um nome ao kit.");
      if(!tmpKit.length) return toast("Um kit precisa de pelo menos um item.");
      const dados={nome:g("ktNome").trim(),cat:g("ktCat"),obs:g("ktObs"),itens:tmpKit.map(x=>({...x}))};
      const ex=kitById(cod);
      if(ex) Object.assign(ex,dados); else S.kits.push(Object.assign({cod},dados));
      S.kitForm=null; save(); render(); toast("Kit "+cod+" salvo."); break;}
    case "apagarKit": S.kits=S.kits.filter(k=>k.cod!==id); S.kitForm=null; save(); render(); toast("Kit removido."); break;
    case "inserirKit": {
      const n=neg(id), k=kitById(document.getElementById("ikKit").value);
      if(!n||!k) break;
      const mult=Math.max(1,Number(document.getElementById("ikMult").value)||1);
      const dias=Math.max(1,Number(document.getElementById("ikDias").value)||1);
      k.itens.forEach(x=>{ const it=item(x.cod);
        const ex=n.orc.linhas.find(l=>l.tipo==="estoque"&&l.cod===x.cod);
        if(ex) ex.qtd+=x.qtd*mult;
        else n.orc.linhas.push({id:novaLinhaId(),tipo:"estoque",cod:x.cod,nome:it.nome,cat:it.cat,
          qtd:x.qtd*mult,dias,unit:it.diaria,modo:"diaria",obs:k.nome}); });
      sincOrc(n); save(); render(); focarAdicao(); toast(k.nome+" aberto em "+k.itens.length+" linhas."); break;}
  }
});
Object.assign(window.VEXTRA||(window.VEXTRA={}),{estoque:vEstoqueNovo});
</script>

</style>
<script>
/* ================= OS DO PRODUTOR ================= */
function ensureProd(){
  S.os.forEach(o=>{
    o.itens.forEach(i=>{ if(i.aereo===undefined) i.aereo = item(i.cod).rig==="aereo" ? i.qtd : 0; });
    if(!o.ancoragens){
      o.ancoragens = (o.aereo.pontos>0)
        ? [{id:"A"+Math.random().toString(36).slice(2,7),nome:"Pontos da estrutura do local",qtd:o.aereo.pontos,wll:o.aereo.wllPonto}]
        : [];
    }
  });
}
const indefinida = i => i.aereo===null || i.aereo===undefined;
const pendentes = o => o.itens.filter(indefinida);
const nPontos = o => (o.ancoragens||[]).reduce((s,a)=>s+(Number(a.qtd)||0),0);

/* memorial aéreo lê a tabela de pontos que o produtor montou */
function calcAereo(o){
  const p=o.aereo, anc=o.ancoragens||[];
  const bruto=pesoPor(o.itens,"aereo");
  const efetivo=o.solo.torres?0:bruto;
  const proj=efetivo*(Number(p.fd)||1.2)*(Number(p.fdes)||1.25);
  const n=nPontos(o);
  const porPonto = n? proj/n : 0;
  const grupos=anc.map(a=>({...a,carga:porPonto,util:porPonto/(Number(a.wll)||1),cap:(Number(a.qtd)||0)*(Number(a.wll)||0)}));
  const util = grupos.length? Math.max(...grupos.map(g=>g.util)) : Infinity;
  const cap = grupos.reduce((s,g)=>s+g.cap,0);
  const cr=(Number(p.wllAcess)||0)*7, fs = porPonto>0 ? cr/porPonto : Infinity;
  const flecha=(Number(p.vao)||0)*1000/200;
  const ok = o.solo.torres ? true : (n>0 && util<=1 && fs>=(Number(p.fsMin)||5));
  return {bruto,efetivo,proj,n,porPonto,util,cr,fs,flecha,ok,apoiadoSolo:o.solo.torres,grupos,cap};
}

/* ---- abas da produção ---- */
function vProdDet(){
  const o=osById(S.sel); if(!o) return vProducao();
  const e=etapasOk(o), aba=S.aba||"escopo", osc=oscDaOS(o.id), c=cli(o.cliente);
  const ed=can("editar_memorial");
  const pend=pendentes(o).length;
  const steps=[["escopo","Escopo","o que vai para o evento",e.escopo&&!pend],
    ["pontos","Pontos e apoios","base dos dois memoriais",nPontos(o)>0||o.solo.torres],
    ["solo","Memorial de solo","kgf/m² sobre o piso",e.solo],
    ["aereo","Memorial aéreo","carga por ponto",e.aereo],
    ["descritivo","Descritivo técnico","texto do projeto",e.descritivo],
    ["logistica","Logística","veículos e equipe",(o.logistica&&o.logistica.viagens.length>0)]];
  const body={escopo:()=>abaEscopo(o,ed),pontos:()=>abaPontos(o,ed),solo:()=>abaSolo(o,!ed),
    aereo:()=>abaAereo(o,!ed),descritivo:()=>abaDesc(o,!ed),logistica:()=>abaLogistica(o,ed)}[aba]();
  return `<div class="between" style="margin-bottom:12px">
    <div><button class="btn sm ghost" data-act="go" data-view="producao">← Fila de produção</button>
      <h2 style="font-size:19px;margin-top:6px">${esc(o.evento)}</h2>
      <div class="flex" style="margin-top:5px"><span class="tag">${o.id}</span><span class="muted">${esc(c.nome)} · ${esc(o.local)}</span>
      <span class="tag">montagem ${dtl(o.montagem)}</span><span class="tag">desmontagem ${dtl(o.desmontagem)}</span>
      <div class="membros" style="margin-left:0">${(o.produtores||[]).map(u=>av(usr(u),22)).join("")}</div></div></div>
    <div class="flex">${osc?`<span class="pill ok"><span class="dot"></span>Carga ${osc.id} emitida</span><button class="btn" data-act="osc" data-id="${osc.id}">Abrir ordem</button>`
      :`<button class="btn pri" data-act="gerarOSC" data-id="${o.id}" ${prontoParaOSC(o)&&can("gerar_osc")?"":"disabled"}>Gerar Ordem de Carga →</button>`}</div></div>
  <div class="steps" style="margin-bottom:14px">${steps.map((s,i)=>`<button class="step ${aba===s[0]?"on":""} ${s[3]?"done":""}" data-act="aba" data-aba="${s[0]}">
    <span class="mk">${s[3]?"✓":i+1}</span><span class="tx">${esc(s[1])}<small>${esc(s[2])}</small></span></button>`).join("")}</div>
  ${body}`;
}

/* ---- 1. Escopo, sem preço nenhum ---- */
function abaEscopo(o,ed){
  const pend=pendentes(o), ps=pesoPor(o.itens,"solo"), pa=pesoPor(o.itens,"aereo"), t=somaTecnica(o.itens);
  const porCat={}; S.cat.forEach(c=>{(porCat[c.cat]=porCat[c.cat]||[]).push(c);});
  return `
  ${ed?`<div style="margin-bottom:14px"><form class="addform" autocomplete="off">
    <div class="top"><h4>Incluir equipamento na OS</h4><div style="flex:1"></div>
      <span class="hint">A produção ajusta o escopo que veio do comercial — quantidades, itens que faltaram, itens que saíram.</span></div>
    <div class="rowf">
      <div class="field w"><label for="peItem">Item</label><select id="peItem">
        ${CATEGORIAS.filter(c=>porCat[c]).map(c=>`<optgroup label="${esc(c)}">${porCat[c].map(x=>`<option value="${x.cod}">${esc(x.cod)} · ${esc(x.nome)}</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      <div class="field s"><label for="peQtd">Qtd</label><input id="peQtd" type="number" value="1" min="1"></div>
      <div class="field s"><label for="peApl">Aplicação</label><select id="peApl">
        <option value="">Definir depois</option><option value="aereo">Aéreo</option><option value="solo">Solo</option></select></div>
      <button class="btn pri go" type="submit" data-act="addItemOS" data-id="${o.id}">Incluir</button>
    </div><p class="hint">Enter inclui e devolve o foco para o campo do item.</p></form></div>`:""}

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="v">${t.pecas}</div><div class="k">peças no escopo</div><div class="d muted">${t.cases} cases</div></div>
    <div class="kpi"><div class="v">${kg(pa)}</div><div class="k">kgf suspensos</div><div class="d muted">entra no memorial aéreo</div></div>
    <div class="kpi"><div class="v">${kg(ps)}</div><div class="k">kgf apoiados</div><div class="d muted">entra no memorial de solo</div></div>
    <div class="kpi"><div class="v" style="color:${pend.length?"var(--crit)":"var(--ok)"}">${pend.length}</div><div class="k">linhas sem aplicação</div>
      <div class="d muted">${pend.length?"os memoriais não fecham assim":"tudo classificado"}</div></div>
  </div>

  ${pend.length?`<div class="verdict crit" style="margin-bottom:14px"><div><b>Falta dizer onde vai</b>
    ${pend.slice(0,4).map(i=>esc(item(i.cod).nome)).join(", ")}${pend.length>4?" e mais "+(pend.length-4):""}. Marque Aéreo ou Solo em cada linha — enquanto estiver em branco, o peso não entra em memorial nenhum.</div></div>`:""}

  ${porCategoria(o.itens).map(([cat,its])=>{const tc=somaTecnica(its);
    return `<div class="card" style="margin-bottom:14px"><header><h3>${esc(cat)}</h3>
      <span class="hint">${its.length} linhas · ${tc.pecas} peças · ${tc.cases} cases · ${kg(tc.peso)} kgf${tc.w?" · "+kwFmt(tc.w):""}</span></header>
    <div class="tblwrap"><table><thead><tr><th>Código</th><th>Item</th><th class="r" style="width:86px">Qtd</th>
      <th style="width:148px">Aplicação</th><th class="r" style="width:88px">No grid</th><th class="r">Peso</th><th class="r">Consumo</th><th></th></tr></thead><tbody>
    ${its.map(i=>{const ix=o.itens.indexOf(i), it=item(i.cod), a=qtdAerea(i), ind=indefinida(i);
      return `<tr style="${ind?"background:var(--critSoft)":""}">
      <td><span class="tag">${i.cod}</span></td><td>${esc(it.nome)}</td>
      <td class="r">${ed?`<input type="number" min="1" value="${i.qtd}" data-osq="${ix}" style="width:70px;text-align:right;padding:4px 7px;font-size:12px">`:`<span class="num">${i.qtd}</span>`}</td>
      <td><span class="apl">
        <button data-act="aplOS" data-id="${o.id}" data-ix="${ix}" data-v="aereo" class="${!ind&&a===i.qtd?"on":""}" ${ed?"":"disabled"}>Aéreo</button>
        <button data-act="aplOS" data-id="${o.id}" data-ix="${ix}" data-v="solo" class="${!ind&&a===0?"on":""}" ${ed?"":"disabled"}>Solo</button>
        <button data-act="aplOS" data-id="${o.id}" data-ix="${ix}" data-v="" class="${ind?"on":""}" ${ed?"":"disabled"}>—</button></span></td>
      <td class="r">${ind?`<span class="muted" style="font-size:11px">—</span>`
        :ed?`<input type="number" min="0" max="${i.qtd}" value="${a}" data-rig="${ix}" style="width:72px;text-align:right;padding:4px 7px;font-size:12px">`
        :`<span class="num">${a}</span>`}</td>
      <td class="r num ${ind?"muted":""}">${kg(it.peso*i.qtd)} kgf</td>
      <td class="r num muted">${it.watts?kwFmt(it.watts*i.qtd):"—"}</td>
      <td class="r">${ed?`<button class="btn sm ghost" data-act="rmItemOS" data-id="${o.id}" data-ix="${ix}">×</button>`:""}</td></tr>`;}).join("")}
    </tbody></table></div></div>`;}).join("")}

  <p class="muted" style="font-size:11.5px;margin:0 2px;line-height:1.6">Uma mesma peça pode ir suspensa num evento e apoiada no outro, por isso a aplicação é definida aqui e não no cadastro. Quando a linha for aérea e só parte das unidades subir ao grid, ajuste o campo <b>No grid</b> — o restante entra como carga de piso.</p>`;
}

/* ---- 2. Pontos e apoios ---- */
function abaPontos(o,ed){
  const anc=o.ancoragens||[], n=nPontos(o), cap=anc.reduce((s,a)=>s+(Number(a.qtd)||0)*(Number(a.wll)||0),0);
  const pa=pesoPor(o.itens,"aereo"), ps=pesoPor(o.itens,"solo"), p=o.solo;
  const f=(k,l,v,st,sf)=>`<div class="field"><label for="solo_${k}">${l}</label><input id="solo_${k}" type="number" data-calc="solo" data-k="${k}" value="${v}" step="${st||1}" ${ed?"":"disabled"}>${sf?`<span class="muted" style="font-size:10.5px">${sf}</span>`:""}</div>`;
  return `<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start">
    <div class="card"><header><h3>Pontos de ancoragem</h3>
      <span class="hint">${n} ponto(s) · capacidade somada ${kg(cap)} kgf</span></header>
      ${ed?`<div class="pad" style="border-bottom:1px solid var(--line2)"><form class="addform" autocomplete="off" style="border:0;background:transparent;padding:0">
        <div class="rowf">
          <div class="field w"><label for="anNome">Grupo de pontos</label><input id="anNome" placeholder="Ex.: Grid frontal · treliça da cobertura"></div>
          <div class="field s"><label for="anQtd">Quantos</label><input id="anQtd" type="number" value="8" min="1"></div>
          <div class="field s"><label for="anWll">WLL cada (kgf)</label><input id="anWll" type="number" value="750" step="50" min="0"></div>
          <button class="btn pri go" type="submit" data-act="addAnc" data-id="${o.id}">Incluir pontos</button>
        </div><p class="hint">Enter inclui o grupo. Use grupos separados quando o local tiver pontos de capacidades diferentes.</p></form></div>`:""}
      ${anc.length?`<div class="tblwrap"><table class="ptab"><thead><tr><th>Grupo</th><th class="r">Pontos</th><th class="r">WLL cada</th><th class="r">Capacidade</th><th></th></tr></thead><tbody>
        ${anc.map((a,ix)=>`<tr>
          <td>${ed?`<input class="ni" value="${esc(a.nome)}" data-anc="${ix}" data-f="nome" style="width:100%;text-align:left">`:esc(a.nome)}</td>
          <td class="r">${ed?`<input type="number" min="1" value="${a.qtd}" data-anc="${ix}" data-f="qtd" style="width:70px">`:`<span class="num">${a.qtd}</span>`}</td>
          <td class="r">${ed?`<input type="number" min="0" step="50" value="${a.wll}" data-anc="${ix}" data-f="wll" style="width:86px">`:`<span class="num">${a.wll}</span>`}</td>
          <td class="r num">${kg((Number(a.qtd)||0)*(Number(a.wll)||0))} kgf</td>
          <td class="r">${ed?`<button class="btn sm ghost" data-act="rmAnc" data-id="${o.id}" data-ix="${ix}">×</button>`:""}</td></tr>`).join("")}
        <tr style="background:var(--surface2)"><td><b>Total</b></td><td class="r num"><b>${n}</b></td><td></td><td class="r num"><b>${kg(cap)} kgf</b></td><td></td></tr>
      </tbody></table></div>`
      :`<div class="empty">Nenhum ponto cadastrado. Se o local não libera ancoragem, marque ao lado que o grid vai em torre de solo.</div>`}
      <div class="pad" style="border-top:1px solid var(--line2)">
        <div class="calcout"><span>Massa suspensa do escopo: <b>${kg(pa)} kgf</b></span>
          ${n?`<span>·</span><span>Média por ponto antes dos fatores: <b>${kg(pa/n)} kgf</b></span>`:""}
          ${cap?`<span>·</span><span>Uso da capacidade: <b>${dec(pa/cap*100,0)}%</b></span>`:""}</div>
      </div>
    </div>

    <div class="card"><header><h3>Apoio no solo</h3><span class="hint">base do memorial de piso</span></header>
      <div class="pad" style="display:grid;gap:11px">
        ${f("area","Área de apoio (m²)",p.area,1)}
        ${f("adm","Carga admissível do piso (kgf/m²)",p.adm,10,"Do memorial do local · NBR 6120")}
        ${f("admPont","Carga pontual admissível (kgf)",p.admPont,10,"Por sapata ou pé de apoio")}
        ${f("publicoKgm2","Sobrecarga de público (kgf/m²)",p.publicoKgm2,10,"300 para aglomeração em pé")}
        ${f("apoios","Apoios por equipamento pesado",p.apoios,1)}
        <label class="flex" style="gap:8px;font-size:12.5px;cursor:pointer;border:1px solid var(--ink3);border-radius:var(--r2);padding:9px 11px;background:var(--surface2)">
          <input type="checkbox" data-calc="solo" data-k="torres" ${p.torres?"checked":""} ${ed?"":"disabled"} style="width:auto">
          <span><b>Grid em torre de solo</b><br><span class="muted" style="font-size:11px">Sem içamento: a massa suspensa passa toda para o piso e o memorial aéreo é dispensado.</span></span></label>
        <div class="calcout"><span>Massa apoiada do escopo: <b>${kg(ps)} kgf</b></span>
          ${p.torres?`<span>·</span><span>+ <b>${kg(pa)} kgf</b> do grid nas torres</span>`:""}
          ${p.area?`<span>·</span><span>Piso suporta <b>${kg(p.area*p.adm)} kgf</b></span>`:""}</div>
      </div></div>
  </div>`;
}
</script>
<script>
/* ---- 3. Memorial de solo, gerado ---- */
function abaSolo(o,ro){
  const p=o.solo, r=calcSolo(o), pend=pendentes(o).length;
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:14px;align-items:start">
    <div class="card"><header><h3>Memorial de cálculo · solo</h3>
      <span class="hint">gerado do escopo e dos apoios · ART pelo eng. responsável (CREA)</span></header>
      <div class="mem" style="border:0;border-radius:0" id="soloRes">${soloRes(r,p)}</div></div>
    <div class="grid" style="gap:12px">
      <div id="soloVer">${soloVer(r)}</div>
      ${pend?`<div class="verdict crit"><div><b>${pend} linha(s) sem aplicação</b>Esse peso não está em memorial nenhum. Resolva no Escopo antes de concluir.</div></div>`:""}
      <div class="card"><header><h3>De onde vêm os números</h3></header><div class="pad" style="display:grid;gap:8px;font-size:12px;color:var(--ink2);line-height:1.5">
        <div>Massa apoiada e massa suspensa saem da coluna <b>Aplicação</b> do escopo.</div>
        <div>Área, carga admissível e sobrecarga de público saem da aba <b>Pontos e apoios</b>.</div>
        <div>Critério: distribuída de projeto ≤ admissível do piso, e nenhum apoio isolado acima da carga pontual. Referência ABNT NBR 6120.</div>
        <button class="btn" data-act="aba" data-aba="pontos" style="justify-content:center;margin-top:3px">Ajustar apoios</button>
      </div></div>
      ${ro?`<div class="verdict warn"><div><b>Somente leitura</b>Este perfil acompanha o memorial, mas quem edita é a produção.</div></div>`
        :`<button class="btn pri" style="justify-content:center" data-act="fecharSolo" data-id="${o.id}">${p.feito?"Revalidar memorial de solo":"Concluir memorial de solo"}</button>`}
    </div></div>`;
}
/* ---- 4. Memorial aéreo, gerado ---- */
function abaAereo(o,ro){
  const p=o.aereo, r=calcAereo(o), pend=pendentes(o).length;
  const f=(k,l,v,st,sf)=>`<div class="field"><label for="ae_${k}">${l}</label><input id="ae_${k}" type="number" data-calc="aereo" data-k="${k}" value="${v}" step="${st||1}" ${ro?"disabled":""}>${sf?`<span class="muted" style="font-size:10.5px">${sf}</span>`:""}</div>`;
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:14px;align-items:start">
    <div class="grid" style="gap:12px">
      <div class="card"><header><h3>Memorial de cálculo · aéreo</h3>
        <span class="hint">${r.apoiadoSolo?"grid em torre de solo":r.n+" pontos cadastrados"}</span></header>
        <div class="mem" style="border:0;border-radius:0" id="aeRes">${aeRes(r,p)}</div></div>
      ${!r.apoiadoSolo&&r.grupos.length?`<div class="card"><header><h3>Verificação ponto a ponto</h3></header>
        <div class="tblwrap"><table><thead><tr><th>Grupo</th><th class="r">Pontos</th><th class="r">WLL</th><th class="r">Carga por ponto</th><th style="width:110px">Utilização</th><th></th></tr></thead><tbody>
        ${r.grupos.map(g=>`<tr><td>${esc(g.nome)}</td><td class="r num">${g.qtd}</td><td class="r num">${kg(g.wll)}</td>
          <td class="r num">${dec(g.carga,0)} kgf</td>
          <td><span class="meter" style="width:100%"><i class="${g.util>1?"crit":g.util>.8?"warn":""}" style="width:${Math.min(100,g.util*100).toFixed(0)}%"></i></span></td>
          <td class="r num ${g.util>1?"":"muted"}" style="${g.util>1?"color:var(--crit);font-weight:600":""}">${dec(g.util*100,0)}%</td></tr>`).join("")}
        </tbody></table></div></div>`:""}
    </div>
    <div class="grid" style="gap:12px">
      <div id="aeVer">${aeVer(r,p)}</div>
      ${pend?`<div class="verdict crit"><div><b>${pend} linha(s) sem aplicação</b>Resolva no Escopo antes de concluir.</div></div>`:""}
      <div class="card"><header><h3>Coeficientes de projeto</h3></header><div class="pad" style="display:grid;gap:11px">
        ${f("fd","Fator dinâmico de içamento",p.fd,0.05,"1,10 a 1,30 para talha manual")}
        ${f("fdes","Fator de desbalanceamento",p.fdes,0.05,"Distribuição desigual entre pontos")}
        ${f("wllAcess","WLL do acessório · sling (kgf)",p.wllAcess,100,"Cinta de poliéster, CR = 7 × WLL")}
        ${f("fsMin","Coeficiente de segurança mínimo",p.fsMin,1,"FS ≥ 5 sobre a carga de ruptura")}
        ${f("vao","Vão livre da treliça (m)",p.vao,0.5,"Flecha admissível L/200")}
        <button class="btn" data-act="aba" data-aba="pontos" style="justify-content:center">Editar pontos de ancoragem</button>
      </div></div>
      ${ro?`<div class="verdict warn"><div><b>Somente leitura</b>Quem edita o memorial é a produção.</div></div>`
        :`<button class="btn pri" style="justify-content:center" data-act="fecharAereo" data-id="${o.id}">${p.feito?"Revalidar memorial aéreo":"Concluir memorial aéreo"}</button>`}
    </div></div>`;
}
function soloRes(r,p){
  return `<div class="l"><div class="k">Equipamentos apoiados no solo</div><div class="v">${kg(r.pEq)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Grid transferido às torres<small>${p.torres?"torre de solo — soma ao piso":"suspenso nos pontos do local"}</small></div><div class="v">${kg(r.transf)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Carga total sobre o piso</b></div><div class="v">${kg(r.total)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Carga distribuída dos equipamentos<small>${kg(r.total)} ÷ ${dec(r.area,0)} m²</small></div><div class="v">${dec(r.dEq,1)} <u>kgf/m²</u></div></div>
  <div class="l"><div class="k">Sobrecarga de público</div><div class="v">${dec(r.dPub,0)} <u>kgf/m²</u></div></div>
  <div class="l h"><div class="k"><b>Carga distribuída de projeto</b><small>limite do local ${dec(p.adm,0)} kgf/m²</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.util>1?"crit":r.util>.8?"warn":""}" style="width:${Math.min(100,r.util*100).toFixed(0)}%"></i></span>${dec(r.dTot,1)} <u>kgf/m² · ${(r.util*100).toFixed(0)}%</u></div></div>
  <div class="l"><div class="k">Item mais pesado<small>${esc(r.maior.nome)}</small></div><div class="v">${kg(r.maior.peso)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Carga pontual por apoio</b><small>limite ${dec(p.admPont,0)} kgf</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.utilP>1?"crit":r.utilP>.8?"warn":""}" style="width:${Math.min(100,r.utilP*100).toFixed(0)}%"></i></span>${dec(r.pont,0)} <u>kgf · ${(r.utilP*100).toFixed(0)}%</u></div></div>`;
}
function aeRes(r,p){
  if(r.apoiadoSolo) return `<div class="l h"><div class="k"><b>Grid apoiado em torre de solo</b><small>não há içamento nos pontos do local</small></div><div class="v">${kg(r.bruto)} <u>kgf no piso</u></div></div>
  <div class="l"><div class="k">Massa do grid<small>verificada no memorial de solo</small></div><div class="v">${kg(r.bruto)} <u>kgf</u></div></div>`;
  if(!r.n) return `<div class="l h"><div class="k"><b>Nenhum ponto cadastrado</b><small>monte a tabela em Pontos e apoios</small></div><div class="v">—</div></div>
  <div class="l"><div class="k">Massa suspensa do escopo</div><div class="v">${kg(r.efetivo)} <u>kgf</u></div></div>`;
  return `<div class="l"><div class="k">Massa suspensa</div><div class="v">${kg(r.efetivo)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Carga de projeto<small>${kg(r.efetivo)} × ${dec(p.fd,2)} × ${dec(p.fdes,2)}</small></div><div class="v">${kg(r.proj)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Carga por ponto</b><small>${r.n} pontos cadastrados</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.util>1?"crit":r.util>.8?"warn":""}" style="width:${Math.min(100,r.util*100).toFixed(0)}%"></i></span>${dec(r.porPonto,0)} <u>kgf · ${(r.util*100).toFixed(0)}%</u></div></div>
  <div class="l"><div class="k">Capacidade somada dos pontos</div><div class="v">${kg(r.cap)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Carga de ruptura do acessório<small>7 × WLL ${dec(p.wllAcess,0)} kgf</small></div><div class="v">${kg(r.cr)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Coeficiente de segurança</b><small>exigido ≥ ${dec(p.fsMin,0)}:1</small></div><div class="v">${isFinite(r.fs)?dec(r.fs,1):"—"} <u>: 1</u></div></div>
  <div class="l"><div class="k">Flecha admissível<small>vão ${dec(p.vao,1)} m · L/200</small></div><div class="v">${dec(r.flecha,0)} <u>mm</u></div></div>`;
}
function aeVer(r,p){
  if(r.apoiadoSolo) return `<div class="verdict warn"><div><b>Sem içamento</b>O grid está em torre de solo. A verificação inteira acontece no memorial de solo; conclua esta etapa para registrar a decisão de projeto.</div></div>`;
  if(!r.n) return `<div class="verdict crit"><div><b>Faltam os pontos</b>Cadastre os pontos de ancoragem em <b>Pontos e apoios</b> — sem eles não há como distribuir a carga suspensa.</div></div>`;
  return r.ok?`<div class="verdict ok"><div><b>Rigging aprovado</b>Utilização de ${(r.util*100).toFixed(0)}% no grupo mais carregado e coeficiente de segurança de ${dec(r.fs,1)}:1 sobre a carga de ruptura dos acessórios.</div></div>`
   :`<div class="verdict crit"><div><b>Rigging reprovado</b>${r.util>1?"A carga por ponto supera o WLL do grupo mais fraco — some pontos ou redistribua o grid. ":""}${r.fs<p.fsMin?"O coeficiente de segurança do acessório está abaixo do mínimo — especifique sling de maior WLL.":""}</div></div>`;
}

/* ---- ações ---- */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  if(!["addItemOS","rmItemOS","aplOS","addAnc","rmAnc"].includes(a)) return;
  if(!can("editar_memorial")) return;
  const o=osById(id); if(!o) return;
  switch(a){
    case "addItemOS": {
      const cod=document.getElementById("peItem").value, q=Math.max(1,Number(document.getElementById("peQtd").value)||1);
      const apl=document.getElementById("peApl").value, it=item(cod);
      const ex=o.itens.find(i=>i.cod===cod);
      if(ex){ ex.qtd+=q; if(apl==="aereo") ex.aereo=ex.qtd; if(apl==="solo") ex.aereo=0; }
      else o.itens.push({cod,qtd:q,aereo: apl==="aereo"?q : apl==="solo"?0 : null});
      o.solo.feito=false; o.aereo.feito=false; save(); render(); foco("peItem"); toast(it.nome+" incluído na OS."); break;}
    case "rmItemOS": o.itens.splice(Number(t.dataset.ix),1); o.solo.feito=false; o.aereo.feito=false; save(); render(); break;
    case "aplOS": {const i=o.itens[Number(t.dataset.ix)], v=t.dataset.v;
      i.aereo = v==="aereo"? i.qtd : v==="solo"? 0 : null;
      o.solo.feito=false; o.aereo.feito=false; save(); render(); break;}
    case "addAnc": {
      const nome=document.getElementById("anNome").value.trim()||"Pontos do local";
      const qtd=Math.max(1,Number(document.getElementById("anQtd").value)||1);
      const wll=Math.max(0,Number(document.getElementById("anWll").value)||0);
      o.ancoragens=o.ancoragens||[];
      o.ancoragens.push({id:"A"+Date.now().toString(36),nome,qtd,wll});
      o.aereo.feito=false; save(); render(); foco("anNome"); toast(qtd+" ponto(s) de "+kg(wll)+" kgf cadastrados."); break;}
    case "rmAnc": o.ancoragens.splice(Number(t.dataset.ix),1); o.aereo.feito=false; save(); render(); break;
  }
});
document.addEventListener("input", ev=>{
  const el=ev.target; if(!can("editar_memorial")) return;
  const o=osById(S.sel); if(!o) return;
  if(el.dataset && el.dataset.osq!==undefined){
    const i=o.itens[Number(el.dataset.osq)]; if(!i) return;
    i.qtd=Math.max(1,Number(el.value)||1);
    if(i.aereo!=null) i.aereo=Math.min(i.aereo,i.qtd);
    o.solo.feito=false; o.aereo.feito=false; save();
  }
  if(el.dataset && el.dataset.anc!==undefined){
    const a=o.ancoragens[Number(el.dataset.anc)]; if(!a) return;
    const f=el.dataset.f;
    a[f] = f==="nome" ? el.value : Math.max(0,Number(el.value)||0);
    o.aereo.feito=false; save();
  }
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.dataset && (el.dataset.osq!==undefined||el.dataset.anc!==undefined)) render();
});
</script>
