tr.marcada>td{background:var(--accentSoft)}
tr.marcada>td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
</style>
<script>
/* ================= OS DO PRODUTOR ================= */
function ensureProd(){
  S.os.forEach(o=>{
    if(!o.itens) o.itens=[];
    if(!o.solo)  o.solo ={area:0,adm:500,admPont:1500,publicoKgm2:250,apoios:4,torres:false,feito:false};
    if(!o.aereo) o.aereo={pontos:0,wllPonto:0,fd:1.2,fdes:1.25,wllAcess:2000,fsMin:5,vao:10,feito:false};
    if(!o.ambientes || !o.ambientes.length) o.ambientes=[{id:PLENARIA,nome:"Plenária",principal:true}];
    o.mem = o.mem || {};
    o.itens.forEach(i=>{
      if(!i.id) i.id=uid();
      if(!i.amb) i.amb=o.ambientes[0].id;
      /* linha avulsa não tem peso nem vai para memorial nenhum */
      if(!i.cod){ i.aereo=null; return; }
      if(i.aereo===undefined) i.aereo = item(i.cod).rig==="aereo" ? i.qtd : 0;
    });
    if(!o.ancoragens){
      o.ancoragens = (o.aereo.pontos>0)
        ? [{id:uid(),nome:"Pontos da estrutura do local",qtd:o.aereo.pontos,wll:o.aereo.wllPonto}]
        : [];
    }
    o.ambientes.forEach(a=>{ const m=memAmb(o,a.id);
      if(m.ancoragens===null || !m.ancoragens) m.ancoragens = (m.aereo.pontos>0)
        ? [{id:uid(),nome:"Pontos da estrutura do local",qtd:m.aereo.pontos,wll:m.aereo.wllPonto}] : [];
      zonasDe(o,a.id); estruturasDe(o,a.id);
    });
  });
}
/* linha de catálogo sem aéreo/solo marcado; a avulsa nunca é pendência */
const indefinida = i => !!i.cod && (i.aereo===null || i.aereo===undefined);
const pendentes = o => o.itens.filter(indefinida);
const nPontos = (o,ambId) => (memAmb(o,ambId).ancoragens||[]).reduce((s,a)=>s+(Number(a.qtd)||0),0);

/* memorial aéreo lê a tabela de pontos que o produtor montou */
function calcAereo(o, ambId){
  const m=memAmb(o,ambId), itens=ambId?itensAmb(o,ambId):o.itens;
  const p=m.aereo, anc=m.ancoragens||[];
  const bruto=pesoPor(itens,"aereo");
  const efetivo=m.solo.torres?0:bruto;
  const proj=efetivo*(Number(p.fd)||1.2)*(Number(p.fdes)||1.25);
  const n=nPontos(o,ambId);
  const porPonto = n? proj/n : 0;
  const grupos=anc.map(a=>({...a,carga:porPonto,util:porPonto/(Number(a.wll)||1),cap:(Number(a.qtd)||0)*(Number(a.wll)||0)}));
  const util = grupos.length? Math.max(...grupos.map(g=>g.util)) : Infinity;
  const cap = grupos.reduce((s,g)=>s+g.cap,0);
  const cr=(Number(p.wllAcess)||0)*7, fs = porPonto>0 ? cr/porPonto : Infinity;
  const flecha=(Number(p.vao)||0)*1000/200;
  const ok = m.solo.torres ? true : (n>0 && util<=1 && fs>=(Number(p.fsMin)||5));
  return {bruto,efetivo,proj,n,porPonto,util,cr,fs,flecha,ok,apoiadoSolo:m.solo.torres,grupos,cap};
}

/* ================= SELEÇÃO MÚLTIPLA =================
   Clicar marca uma linha; clicar com Shift marca o intervalo da última
   marcada até esta, na ordem em que aparecem na tela. Serve para mover
   trinta linhas de sala, ou jogar a iluminação inteira numa vara, sem
   abrir trinta seletores. */
function reabrirAmb(o, ambId){ const mm=memAmb(o,ambId); mm.solo.feito=false; mm.aereo.feito=false; }
let SEL = new Set();
let SEL_ANCORA = null;
const selecionado = id => SEL.has(id);
const nSel = () => SEL.size;
function limparSel(){ SEL=new Set(); SEL_ANCORA=null; }
/* a ordem visível é a que a tela desenha: sala, categoria, linha */
function ordemVisivel(o){
  const out=[];
  ambsOS(o).forEach(amb=>{
    porCategoria(itensAmb(o,amb.id)).forEach(([,its])=>its.forEach(i=>out.push(i.id)));
  });
  return out;
}
function marcar(o, id, comShift){
  const ordem=ordemVisivel(o);
  if(comShift && SEL_ANCORA && ordem.includes(SEL_ANCORA)){
    const a=ordem.indexOf(SEL_ANCORA), b=ordem.indexOf(id);
    if(b>=0){ const [de,ate]=a<b?[a,b]:[b,a];
      for(let k=de;k<=ate;k++) SEL.add(ordem[k]);
      return; }
  }
  if(SEL.has(id)) SEL.delete(id); else SEL.add(id);
  SEL_ANCORA=id;
}
const itensSel = o => o.itens.filter(i=>SEL.has(i.id));

function barraSel(o){
  if(!nSel()) return "";
  const sel=itensSel(o), as=ambsOS(o);
  /* as varas e zonas oferecidas são as da sala das linhas marcadas */
  const salas=[...new Set(sel.map(i=>i.amb||as[0].id))];
  const umaSala = salas.length===1 ? salas[0] : null;
  const ests = umaSala ? estruturasDe(o,umaSala) : [];
  const zons = umaSala ? zonasDe(o,umaSala) : [];
  const comCod = sel.filter(i=>i.cod).length;
  return `<div class="selbar">
    <b>${nSel()} linha(s)</b>
    ${as.length>1?`<label>mover para<select data-lote="amb">
      <option value="">…</option>${as.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></label>`:""}
    ${comCod?`<span class="apl">
      <button data-act="loteApl" data-id="${o.id}" data-v="aereo">Aéreo</button>
      <button data-act="loteApl" data-id="${o.id}" data-v="solo">Solo</button>
      <button data-act="loteApl" data-id="${o.id}" data-v="">—</button></span>`:""}
    ${comCod&&ests.length>1?`<label>vara<select data-lote="estr">
      <option value="">…</option>${ests.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></label>`:""}
    ${comCod&&zons.length>1?`<label>zona<select data-lote="zona">
      <option value="">…</option>${zons.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></label>`:""}
    ${!umaSala&&(ests.length||zons.length)===0&&comCod?`<span class="muted" style="font-size:11px">vara e zona: marque linhas de uma sala só</span>`:""}
    <div style="flex:1"></div>
    <button class="btn sm ghost" data-act="loteRm" data-id="${o.id}">Remover</button>
    <button class="btn sm ghost" data-act="loteNada">Limpar seleção</button>
  </div>`;
}

/* ---- sala ativa da OS ----
   Pontos, memorial de solo e memorial aéreo são de uma sala por vez. */
function ambAtiva(o){
  const as=ambsOS(o);
  return as.find(a=>a.id===S.ambSel) || as[0];
}
function barraAmb(o){
  const as=ambsOS(o); if(as.length<2) return "";
  const at=ambAtiva(o);
  return `<div class="ambbar">${as.map(a=>{ const m=memAmb(o,a.id), feito=m.solo.feito&&m.aereo.feito;
    return `<button class="${a.id===at.id?"on":""} ${feito?"done":""}" data-act="ambSel" data-a="${a.id}">
      <b>${esc(a.nome)}</b><span>${feito?"memoriais fechados":m.solo.feito?"falta o aéreo":m.aereo.feito?"falta o solo":"memoriais abertos"}</span></button>`;}).join("")}</div>`;
}

/* Salas descobertas pela produção entram diretamente na OS. */
function podeAdicionarSalaOS(o){
  return !!o && o.status!=="Encerrada" && (S.role==="gerencia" ||
    (S.role==="producao" && (o.produtores||[]).includes(S.perfilId)));
}
function mNovaSalaOS(o){
  if(!podeAdicionarSalaOS(o)) return toast("Somente a gerência ou um produtor escalado pode adicionar salas a uma OS aberta.");
  modal("Adicionar sala à OS",`
    <form id="formSalaOS" autocomplete="off">
      <p class="hint">A sala terá seus próprios equipamentos, estruturas, pontos e memoriais. Depois do cadastro, selecione os itens que serão usados nela.</p>
      <div class="field"><label for="osSalaNome">Nome da sala</label>
        <input id="osSalaNome" required maxlength="80" placeholder="Ex.: Sala B.U. 2, Foyer, Auditório"></div>
      <div class="field" style="margin-top:12px"><label for="osSalaArea">Área da sala (m²) — opcional</label>
        <input id="osSalaArea" type="number" min="0" max="99999999.99" step="0.01" placeholder="Informe quando confirmada"></div>
      <p id="osSalaErro" role="alert" style="color:var(--crit);margin-top:10px"></p>
      ${oscDaOS(o.id)?`<div class="verdict warn"><div><b>Já existe ordem de carga</b>A sala será adicionada à OS. Os itens da ordem de carga já emitida não serão atualizados automaticamente; revise a separação com o estoque.</div></div>`:""}
    </form>`,
    `<button class="btn" data-act="fecharModal">Cancelar</button><button class="btn pri" type="submit" form="formSalaOS">Adicionar sala</button>`);
  document.getElementById("formSalaOS").addEventListener("submit",ev=>{
    ev.preventDefault();ev.stopPropagation();
    const atual=osById(o.id),campo=document.getElementById("osSalaNome");
    const nome=campo.value.trim().replace(/\s+/g," ");
    const area=Number(document.getElementById("osSalaArea").value||0);
    const aviso=document.getElementById("osSalaErro");
    if(!podeAdicionarSalaOS(atual)){aviso.textContent="Você não pode editar esta OS.";return;}
    if(!nome){aviso.textContent="Informe o nome da sala.";campo.focus();return;}
    if(ambsOS(atual).some(a=>a.nome.trim().replace(/\s+/g," ").toLocaleLowerCase("pt-BR")===nome.toLocaleLowerCase("pt-BR"))){
      aviso.textContent="Já existe uma sala com esse nome nesta OS.";campo.focus();return;
    }
    if(!Number.isFinite(area)||area<0||area>99999999.99){aviso.textContent="Informe uma área válida, maior ou igual a zero.";return;}
    if(!atual.ambientes?.length) atual.ambientes=[...ambsOS(atual)];
    const id=uid();atual.ambientes.push({id,nome,principal:false});
    const m=contAmb(atual,id);m.solo.area=area;m.solo.feito=false;m.aereo.feito=false;
    S.ambSel=id;S.aba="escopo";limparSel();
    fecharModal();save();render();
    toast("Sala "+nome+" adicionada à OS. Inclua os equipamentos e confira os memoriais.");
  });
  document.getElementById("osSalaNome").focus();
}

/* ---- abas da produção ---- */
function vProdDet(){
  const o=osById(S.sel); if(!o){ S.sel=null; return vProducao(); }
  const e=etapasOk(o), aba=S.aba||"escopo", osc=oscDaOS(o.id), c=cli(o.cliente);
  const ed=can("editar_memorial");
  const pend=pendentes(o).length;
  const as=ambsOS(o), pontosOk=as.every(x=>{const m=memAmb(o,x.id); return nPontos(o,x.id)>0||m.solo.torres;});
  const steps=[["escopo","Escopo","o que vai para o evento",e.escopo&&!pend],
    ["pontos","Pontos e apoios","base dos dois memoriais",pontosOk],
    ["solo","Memorial de solo",as.length>1?as.length+" salas · kgf/m²":"kgf/m² sobre o piso",e.solo],
    ["aereo","Memorial aéreo",as.length>1?as.length+" salas · carga por ponto":"carga por ponto",e.aereo],
    ["descritivo","Descritivo técnico","texto do projeto",e.descritivo],
    ["logistica","Logística","escala por dia",!!(o.logistica&&((o.logistica.veicDias||[]).length||(o.logistica.escala||[]).length))]];
  const abas={escopo:()=>abaEscopo(o,ed),pontos:()=>barraAmb(o)+abaPontos(o,ed),solo:()=>barraAmb(o)+abaSolo(o,!ed),
    aereo:()=>barraAmb(o)+abaAereo(o,!ed),descritivo:()=>abaDesc(o,!ed),logistica:()=>abaLogistica(o,ed)};
  /* vindo de outra tela a aba pode não existir aqui; cai no escopo em vez de quebrar */
  const body=(abas[aba]||abas.escopo)();
  return `<div class="between" style="margin-bottom:12px">
    <div><button class="btn sm ghost" data-act="go" data-view="producao">← Fila de produção</button>
      <h2 style="font-size:19px;margin-top:6px">${esc(o.evento)}</h2>
      <div class="flex" style="margin-top:5px"><span class="tag">${o.codigo||""}</span><span class="muted">${esc(c.nome)} · ${esc(o.local)}</span>
      <span class="tag">montagem ${dtl(o.montagem)}</span><span class="tag">desmontagem ${dtl(o.desmontagem)}</span>
      <div class="membros" style="margin-left:0">${(o.produtores||[]).map(u=>av(usr(u),22)).join("")}</div></div></div>
    <div class="flex">${podeAdicionarSalaOS(o)?`<button class="btn" data-act="novaSalaOS" data-id="${o.id}">+ Adicionar sala</button>`:""}${osc?`<span class="pill ok"><span class="dot"></span>Carga ${osc.codigo||""} emitida</span><button class="btn" data-act="osc" data-id="${osc.id}">Abrir ordem</button>`
      :`<button class="btn pri" data-act="gerarOSC" data-id="${o.id}" ${prontoParaOSC(o)&&can("gerar_osc")?"":"disabled"}>Gerar Ordem de Carga →</button>`}</div></div>
  <div class="steps" style="margin-bottom:14px">${steps.map((s,i)=>`<button class="step ${aba===s[0]?"on":""} ${s[3]?"done":""}" data-act="aba" data-aba="${s[0]}">
    <span class="mk">${s[3]?"✓":i+1}</span><span class="tx">${esc(s[1])}<small>${esc(s[2])}</small></span></button>`).join("")}</div>
  ${body}`;
}

/* ---- 1. Escopo, sem preço nenhum ---- */
function abaEscopo(o,ed){
  const pend=pendentes(o), ps=pesoPor(o.itens,"solo"), pa=pesoPor(o.itens,"aereo"), t=somaTecnica(o.itens);
  const porCat={}; S.cat.forEach(c=>{(porCat[c.cat]=porCat[c.cat]||[]).push(c);});
  const kits=(S.kits||[]).slice().sort((a,b)=>a.nome<b.nome?-1:1);
  const as=ambsOS(o), A=ambAtiva(o);
  const selA=(id,sel)=>as.length<2?"":`<div class="field"><label for="${id}">Sala</label><select id="${id}">${
    as.map(a=>`<option value="${a.id}" ${a.id===(sel||A.id)?"selected":""}>${esc(a.nome)}</option>`).join("")}</select></div>`;
  const modo=S.osModo==="avulso"?"avulso":"estoque";
  return `
  ${ed?`<div style="margin-bottom:14px"><form class="addform" autocomplete="off">
    <div class="top"><h4>Incluir na OS</h4>
      <div class="modes" style="margin-left:12px">${[["estoque","Equipamento"],["avulso","Linha avulsa"]].map(x=>
        `<button type="button" class="${modo===x[0]?"on":""}" data-act="osModo" data-m="${x[0]}">${x[1]}</button>`).join("")}</div>
      <div style="flex:1"></div>
      <span class="hint">${modo==="estoque"?"A produção ajusta o escopo que veio do comercial — quantidades, itens que faltaram, itens que saíram."
        :"Serve para o que não sai do galpão: sublocação, serviço de terceiro — ou só um recado para o barracão."}</span></div>
    ${modo==="estoque"?`<div class="rowf">
      <div class="field w"><label for="peItem">Item</label><select id="peItem">
        ${kits.length?`<optgroup label="Kits">${kits.map(k=>`<option value="KIT:${k.cod}">${esc(k.nome)} — ${k.itens.length} itens</option>`).join("")}</optgroup>`:""}
        ${CATEGORIAS.filter(c=>porCat[c]).map(c=>`<optgroup label="${esc(c)}">${porCat[c].map(x=>`<option value="${x.cod}">${esc(x.cod)} · ${esc(x.nome)}</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      ${selA("peAmb")}
      <div class="field s"><label for="peQtd">Qtd</label><input id="peQtd" type="number" value="1" min="1"></div>
      <div class="field s"><label for="peApl">Aplicação</label><select id="peApl">
        <option value="">Definir depois</option><option value="aereo">Aéreo</option><option value="solo">Solo</option></select></div>
      <div class="field w"><label for="peObs">Observação</label><input id="peObs" placeholder="Ex.: 2 de reserva, chega direto do fornecedor"></div>
      <button class="btn pri go" type="submit" data-act="addItemOS" data-id="${o.id}">Incluir</button>
    </div><p class="hint">Enter inclui e devolve o foco para o campo do item. Um kit entra aberto, peça por peça.</p>`
    :`<div class="rowf">
      <div class="field w"><label for="pxNome">O que é</label><input id="pxNome" placeholder="Ex.: Sublocação de 40 módulos P2.6 — ou um recado para o barracão"></div>
      <div class="field"><label for="pxCat">Categoria</label><select id="pxCat">${[...CATEGORIAS,"Serviços","Logística"].map(c=>`<option ${c==="Extras"?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      ${selA("pxAmb")}
      <div class="field s"><label for="pxQtd">Qtd</label><input id="pxQtd" type="number" value="1" min="1"></div>
      <div class="field w"><label for="pxObs">Observação</label><input id="pxObs" placeholder="Prazo, quem entrega, o que conferir…"></div>
      <button class="btn pri go" type="submit" data-act="addAvulso" data-id="${o.id}">Incluir</button>
    </div><p class="hint">Linha avulsa não tem peso nem entra em memorial — ela existe para aparecer na OS e na ordem de carga.</p>`}
    </form></div>`:""}

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="v">${t.pecas}</div><div class="k">peças no escopo</div><div class="d muted">${t.cases} cases</div></div>
    <div class="kpi"><div class="v">${kg(pa)}</div><div class="k">kgf suspensos</div><div class="d muted">entra no memorial aéreo</div></div>
    <div class="kpi"><div class="v">${kg(ps)}</div><div class="k">kgf apoiados</div><div class="d muted">entra no memorial de solo</div></div>
    <div class="kpi"><div class="v" style="color:${pend.length?"var(--crit)":"var(--ok)"}">${pend.length}</div><div class="k">linhas sem aplicação</div>
      <div class="d muted">${pend.length?"os memoriais não fecham assim":"tudo classificado"}</div></div>
  </div>

  ${pend.length?`<div class="verdict crit" style="margin-bottom:14px"><div><b>Falta dizer onde vai</b>
    ${pend.slice(0,4).map(i=>esc(item(i.cod).nome)).join(", ")}${pend.length>4?" e mais "+(pend.length-4):""}. Marque Aéreo ou Solo em cada linha — enquanto estiver em branco, o peso não entra em memorial nenhum.</div></div>`:""}

  ${barraSel(o)}
  ${as.map(amb=>{
    const its0=itensAmb(o,amb.id); if(!its0.length && as.length>1) return "";
    const ta=somaTecnica(its0.filter(i=>i.cod));
    return `${as.length>1?`<div class="ambhead"><b>${esc(amb.nome)}</b>
      <span>${its0.length} linha(s) · ${ta.pecas} peças · ${ta.cases} cases · ${kg(ta.peso)} kgf</span>
      <span class="s">suspenso ${kg(pesoPor(its0,"aereo"))} · apoiado ${kg(pesoPor(its0,"solo"))} kgf</span></div>`:""}
    ${porCategoria(its0).map(([cat,its])=>{const tc=somaTecnica(its.filter(i=>i.cod));
    return `<div class="card" style="margin-bottom:14px"><header><h3>${esc(cat)}</h3>
      <span class="hint">${its.length} linhas · ${tc.pecas} peças · ${tc.cases} cases · ${kg(tc.peso)} kgf${tc.w?" · "+kwFmt(tc.w):""}</span></header>
    <div class="tblwrap"><table><thead><tr>
      <th class="ck">${ed?`<input type="checkbox" data-selcat="${esc(cat)}|${amb.id}" ${its.every(x=>selecionado(x.id))?"checked":""}>`:""}</th>
      <th>Código</th><th>Item</th>${as.length>1?`<th style="width:130px">Sala</th>`:""}<th class="r" style="width:86px">Qtd</th>
      <th style="width:148px">Aplicação</th><th class="r" style="width:88px">No grid</th><th style="width:150px">Vara / zona</th><th class="r">Peso</th><th class="r">Consumo</th><th style="width:180px">Observação</th><th></th></tr></thead><tbody>
    ${its.map(i=>{const ix=o.itens.indexOf(i), avulso=!i.cod, it=avulso?null:item(i.cod), a=qtdAerea(i), ind=indefinida(i);
      const ests=estruturasDe(o,amb.id), zons=zonasDe(o,amb.id);
      const sel=selecionado(i.id);
      /* onde esta linha se apoia: a vara da parte suspensa, a zona da parte no chão */
      const opc=(lista,campo,atual)=>ed&&lista.length>1
        ? `<select data-os${campo}="${ix}" class="ambsel" style="margin:0;max-width:130px">`
          + lista.map(x=>`<option value="${x.id}" ${x.id===atual.id?"selected":""}>${esc(x.nome)}</option>`).join("")
          + `</select>`
        : `<span class="muted" style="font-size:11px">${esc(atual.nome)}</span>`;
      const celApoio = (avulso||ind)
        ? `<span class="muted" style="font-size:11px">—</span>`
        : [ a>0      ? opc(ests,"estr",estrDaLinha(o,amb.id,i)) : "",
            a<i.qtd ? opc(zons,"zona",zonaDaLinha(o,amb.id,i)) : "" ].filter(Boolean).join(" ");
      return `<tr class="${sel?"marcada":""}" style="${ind&&!sel?"background:var(--critSoft)":avulso&&!sel?"background:var(--surface2)":""}">
      <td class="ck">${ed?`<input type="checkbox" data-sel="${i.id}" ${sel?"checked":""}>`:""}</td>
      <td>${avulso?`<span class="pill">avulso</span>`:`<span class="tag">${i.cod}</span>`}</td>
      <td>${esc(avulso?i.nome:it.nome)}</td>
      ${as.length>1?`<td>${ed?`<select data-osamb="${ix}" class="ambsel" style="margin:0">${as.map(x=>`<option value="${x.id}" ${x.id===(i.amb||as[0].id)?"selected":""}>${esc(x.nome)}</option>`).join("")}</select>`:`<span class="muted" style="font-size:11.5px">${esc(nomeAmb(as,i.amb))}</span>`}</td>`:""}
      <td class="r">${ed?`<input type="number" min="1" value="${i.qtd}" data-osq="${ix}" style="width:70px;text-align:right;padding:4px 7px;font-size:12px">`:`<span class="num">${i.qtd}</span>`}</td>
      <td>${avulso?`<span class="muted" style="font-size:11px">fora do estoque</span>`:`<span class="apl">
        <button data-act="aplOS" data-id="${o.id}" data-ix="${ix}" data-v="aereo" class="${!ind&&a===i.qtd?"on":""}" ${ed?"":"disabled"}>Aéreo</button>
        <button data-act="aplOS" data-id="${o.id}" data-ix="${ix}" data-v="solo" class="${!ind&&a===0?"on":""}" ${ed?"":"disabled"}>Solo</button>
        <button data-act="aplOS" data-id="${o.id}" data-ix="${ix}" data-v="" class="${ind?"on":""}" ${ed?"":"disabled"}>—</button></span>`}</td>
      <td class="r">${avulso||ind?`<span class="muted" style="font-size:11px">—</span>`
        :ed?`<input type="number" min="0" max="${i.qtd}" value="${a}" data-rig="${ix}" style="width:72px;text-align:right;padding:4px 7px;font-size:12px">`
        :`<span class="num">${a}</span>`}</td>
      <td>${celApoio}</td>
      <td class="r num ${ind||avulso?"muted":""}">${avulso?"—":kg(it.peso*i.qtd)+" kgf"}</td>
      <td class="r num muted">${!avulso&&it.watts?kwFmt(it.watts*i.qtd):"—"}</td>
      <td>${ed?`<input value="${esc(i.obs||"")}" data-osobs="${ix}" placeholder="—" style="width:100%;padding:4px 7px;font-size:11.5px">`:`<span class="muted" style="font-size:11.5px">${esc(i.obs||"—")}</span>`}</td>
      <td class="r">${ed?`<button class="btn sm ghost" data-act="rmItemOS" data-id="${o.id}" data-ix="${ix}">×</button>`:""}</td></tr>`;}).join("")}
    </tbody></table></div></div>`;}).join("")}`;}).join("")}

  <p class="muted" style="font-size:11.5px;margin:0 2px;line-height:1.6">Uma mesma peça pode ir suspensa num evento e apoiada no outro, por isso a aplicação é definida aqui e não no cadastro. Quando a linha for aérea e só parte das unidades subir ao grid, ajuste o campo <b>No grid</b> — o restante entra como carga de piso.</p>`;
}

/* ---- 2. Pontos e apoios ---- */
function abaPontos(o,ed){
  const A=ambAtiva(o), m=memAmb(o,A.id);
  const ests=estruturasDe(o,A.id), zons=zonasDe(o,A.id);
  const f=(k,l,v,st,sf)=>`<div class="field"><label for="solo_${k}">${l}</label><input id="solo_${k}" type="number" data-calc="solo" data-k="${k}" value="${v}" step="${st||1}" ${ed?"":"disabled"}>${sf?`<span class="muted" style="font-size:10.5px">${sf}</span>`:""}</div>`;
  const fa=(k,l,v,st,sf)=>`<div class="field"><label for="ae_${k}">${l}</label><input id="ae_${k}" type="number" data-calc="aereo" data-k="${k}" value="${v}" step="${st||1}" ${ed?"":"disabled"}>${sf?`<span class="muted" style="font-size:10.5px">${sf}</span>`:""}</div>`;

  const blocoEstr = (e,ix) => {
    const r=calcEstr(o,A.id,e.id);
    return `<div class="estr ${r.linhas&&!r.ok?"ruim":""}">
      <header>
        ${ed?`<input class="nm" value="${esc(e.nome)}" data-estr="${e.id}" data-f="nome" placeholder="Ex.: Vara 1">`
           :`<b>${esc(e.nome)}</b>`}
        <span class="tag">${r.n} ponto(s)</span>
        <span class="tag">${kg(r.bruto)} kgf</span>
        ${r.linhas?`<span class="pill ${r.ok?"ok":"crit"}"><span class="dot"></span>${r.torres?"em torre":r.ok?"aprovada":"reprovada"}</span>`
          :`<span class="pill">sem equipamento</span>`}
        <div style="flex:1"></div>
        ${ed?`<label class="flex" style="gap:6px;font-size:11.5px;cursor:pointer;white-space:nowrap">
          <input type="checkbox" data-estr="${e.id}" data-f="torres" ${e.torres?"checked":""} style="width:auto">torre de solo</label>
          ${zons.length>1&&e.torres?`<select data-estr="${e.id}" data-f="zona" style="width:auto;font-size:11px;padding:2px 6px">${
            zons.map(z=>`<option value="${z.id}" ${(e.zona||zons[0].id)===z.id?"selected":""}>desce em ${esc(z.nome)}</option>`).join("")}</select>`:""}
          ${ests.length>1?`<button class="btn sm ghost" data-act="rmEstr" data-id="${o.id}" data-e="${e.id}">×</button>`:""}`:""}
      </header>
      <div class="corpo">
        ${(e.pontos||[]).length?`<div class="tblwrap"><table class="ptab"><thead><tr><th>Grupo de pontos</th><th class="r">Quantos</th><th class="r">WLL cada</th><th class="r">Capacidade</th><th></th></tr></thead><tbody>
          ${e.pontos.map((x,pi)=>`<tr>
            <td>${ed?`<input class="ni" value="${esc(x.nome)}" data-pto="${e.id}" data-pi="${pi}" data-f="nome" style="width:100%;text-align:left">`:esc(x.nome)}</td>
            <td class="r">${ed?`<input type="number" min="1" value="${x.qtd}" data-pto="${e.id}" data-pi="${pi}" data-f="qtd" style="width:70px">`:`<span class="num">${x.qtd}</span>`}</td>
            <td class="r">${ed?`<input type="number" min="0" step="50" value="${x.wll}" data-pto="${e.id}" data-pi="${pi}" data-f="wll" style="width:86px">`:`<span class="num">${x.wll}</span>`}</td>
            <td class="r num">${kg((Number(x.qtd)||0)*(Number(x.wll)||0))} kgf</td>
            <td class="r">${ed?`<button class="btn sm ghost" data-act="rmPto" data-id="${o.id}" data-e="${e.id}" data-pi="${pi}">×</button>`:""}</td></tr>`).join("")}
        </tbody></table></div>`
        :`<div class="empty" style="padding:12px;font-size:12px">Sem pontos. Cadastre abaixo, ou marque torre de solo.</div>`}
        ${ed?`<form class="addform" autocomplete="off" style="margin:0;border:0;border-top:1px solid var(--line2);border-radius:0;background:transparent">
          <div class="rowf">
            <div class="field w"><label for="pn${ix}">Grupo de pontos</label><input id="pn${ix}" placeholder="Ex.: Treliça da cobertura"></div>
            <div class="field s"><label for="pq${ix}">Quantos</label><input id="pq${ix}" type="number" value="4" min="1"></div>
            <div class="field s"><label for="pw${ix}">WLL cada</label><input id="pw${ix}" type="number" value="750" step="50" min="0"></div>
            <button class="btn go" type="submit" data-act="addPto" data-id="${o.id}" data-e="${e.id}" data-ix="${ix}">Incluir</button>
          </div></form>`:""}
        ${r.linhas?`<div class="calcout" style="border-top:1px solid var(--line2)">
          <span>${r.linhas} linha(s) · <b>${kg(r.bruto)} kgf</b></span>
          ${r.torres?`<span>·</span><span>desce para o piso</span>`
            :`<span>·</span><span>projeto <b>${kg(r.proj)} kgf</b></span>
              ${r.n?`<span>·</span><span><b>${dec(r.porPonto,0)} kgf</b> por ponto</span>
                     <span>·</span><span>uso <b>${dec(r.util*100,0)}%</b> · FS <b>${r.fs===Infinity?"—":dec(r.fs,1)}</b></span>`:""}`}
        </div>`:""}
      </div></div>`;
  };

  const blocoZona = (z,ix) => {
    const r=calcZona(o,A.id,z.id);
    return `<div class="estr ${(r.linhas||r.transf)&&!r.ok?"ruim":""}">
      <header>
        ${ed?`<input class="nm" value="${esc(z.nome)}" data-zona="${z.id}" data-f="nome" placeholder="Ex.: Palco">`
           :`<b>${esc(z.nome)}</b>`}
        <span class="tag">${dec(r.area,0)} m²</span>
        <span class="tag">${kg(r.total)} kgf</span>
        ${(r.linhas||r.transf)?`<span class="pill ${r.ok?"ok":"crit"}"><span class="dot"></span>${r.ok?"aprovada":"reprovada"}</span>`
          :`<span class="pill">sem equipamento</span>`}
        <div style="flex:1"></div>
        ${ed&&zons.length>1?`<button class="btn sm ghost" data-act="rmZona" data-id="${o.id}" data-z="${z.id}">×</button>`:""}
      </header>
      <div class="corpo"><div class="pad" style="display:grid;gap:10px">
        <div class="row2">
          <div class="field"><label for="za${ix}">Área (m²)</label><input id="za${ix}" type="number" step="10" min="0" value="${z.area||0}" data-zona="${z.id}" data-f="area" ${ed?"":"disabled"}></div>
          <div class="field"><label for="zc${ix}">Carga admissível (kgf/m²)</label><input id="zc${ix}" type="number" step="50" min="0" value="${z.adm||0}" data-zona="${z.id}" data-f="adm" ${ed?"":"disabled"}></div>
        </div>
        ${(r.linhas||r.transf)?`<div class="calcout">
          <span>${r.linhas} linha(s) · <b>${kg(r.pEq)} kgf</b></span>
          ${r.transf?`<span>·</span><span>+ <b>${kg(r.transf)} kgf</b> de torre</span>`:""}
          <span>·</span><span><b>${dec(r.dTot,1)} kgf/m²</b> de ${dec(r.adm,0)} · uso <b>${dec(r.util*100,0)}%</b></span>
        </div>`:""}
      </div></div></div>`;
  };

  return `<div class="grid" style="gap:14px">
    <div class="card"><header><h3>Estruturas aéreas${ambsOS(o).length>1?" · "+esc(A.nome):""}</h3>
      <span class="hint">cada vara pendura nos próprios pontos e é verificada sozinha</span></header>
      <div class="pad" style="display:grid;gap:11px">
        <p style="margin:0;font-size:12px;color:var(--ink2);line-height:1.5">Um palco costuma ter mais de uma: vara 1, vara 2, portal frontal.
          Somar tudo esconde a vara que está sobrecarregada, então cada uma tem o próprio memorial. No Escopo você diz em qual vara cada equipamento sobe.</p>
        ${ests.map(blocoEstr).join("")}
        ${ed?`<form class="addform" autocomplete="off" style="margin:0"><div class="rowf">
          <div class="field w"><label for="estrNome">Nova estrutura</label><input id="estrNome" placeholder="Ex.: Vara 2"></div>
          <button class="btn go" type="submit" data-act="addEstr" data-id="${o.id}">Incluir estrutura</button>
        </div><p class="hint">Enter inclui e deixa o cursor pronto para a próxima.</p></form>`:""}
      </div></div>

    <div class="card"><header><h3>Zonas de piso${ambsOS(o).length>1?" · "+esc(A.nome):""}</h3>
      <span class="hint">o palco e a plateia não têm o mesmo limite</span></header>
      <div class="pad" style="display:grid;gap:11px">
        ${zons.map(blocoZona).join("")}
        ${ed?`<form class="addform" autocomplete="off" style="margin:0"><div class="rowf">
          <div class="field w"><label for="zonaNome">Nova zona</label><input id="zonaNome" placeholder="Ex.: Palco"></div>
          <div class="field s"><label for="zonaArea">Área (m²)</label><input id="zonaArea" type="number" value="0" step="10" min="0"></div>
          <div class="field s"><label for="zonaAdm">kgf/m²</label><input id="zonaAdm" type="number" value="${m.solo.adm||500}" step="50" min="0"></div>
          <button class="btn go" type="submit" data-act="addZona" data-id="${o.id}">Incluir zona</button>
        </div></form>`:""}
      </div></div>

    <div class="card"><header><h3>Coeficientes de projeto</h3>
      <span class="hint">valem para a sala inteira</span></header>
      <div class="pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px">
        ${fa("fd","Fator dinâmico de içamento",m.aereo.fd,0.05,"1,10 a 1,30 para talha manual")}
        ${fa("fdes","Fator de desbalanceamento",m.aereo.fdes,0.05,"Distribuição desigual entre pontos")}
        ${fa("wllAcess","WLL do acessório · sling (kgf)",m.aereo.wllAcess,100,"Cinta de poliéster, CR = 7 × WLL")}
        ${fa("fsMin","Coeficiente de segurança mínimo",m.aereo.fsMin,1,"FS ≥ 5 sobre a carga de ruptura")}
        ${fa("vao","Vão livre da treliça (m)",m.aereo.vao,0.5,"Flecha admissível L/200")}
        ${f("admPont","Carga pontual admissível (kgf)",m.solo.admPont,10,"Por sapata ou pé de apoio")}
        ${f("publicoKgm2","Sobrecarga de público (kgf/m²)",m.solo.publicoKgm2,10,"300 para aglomeração em pé")}
        ${f("apoios","Apoios por equipamento pesado",m.solo.apoios,1)}
      </div></div>
  </div>`;
}

/* ---- 3. Memorial de solo, gerado ---- */
function abaSolo(o,ro){
  const A=ambAtiva(o), m=memAmb(o,A.id), zons=zonasDe(o,A.id);
  const pend=itensAmb(o,A.id).filter(indefinida).length;
  const rs=zons.map(z=>calcZona(o,A.id,z.id));
  const usadas=rs.filter(r=>r.linhas||r.transf);
  const reprova=usadas.filter(r=>!r.ok);
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:14px;align-items:start">
    <div class="grid" style="gap:12px">
      ${rs.map(r=>`<div class="card"><header><h3>${esc(r.nome)}</h3>
        <span class="hint">${r.linhas} linha(s) · ${dec(r.area,0)} m² · limite ${dec(r.adm,0)} kgf/m²</span></header>
        ${r.linhas||r.transf
          ? `<div class="mem" style="border:0;border-radius:0">${soloRes(r,{adm:r.adm,torres:r.transf>0,apoios:m.solo.apoios,admPont:m.solo.admPont})}</div>`
          : `<div class="empty" style="padding:14px;font-size:12px">Nenhum equipamento apoiado nesta zona. No Escopo, marque Solo numa linha e escolha esta zona.</div>`}
      </div>`).join("")}
    </div>
    <div class="grid" style="gap:12px">
      <div id="soloVer">${usadas.length
        ? (reprova.length
            ? `<div class="verdict crit"><div><b>${reprova.length===1?"Uma zona reprovada":reprova.length+" zonas reprovadas"}</b>${reprova.map(r=>esc(r.nome)+" a "+dec(r.dTot,1)+" kgf/m² de "+dec(r.adm,0)).join(" · ")}. Aumente a área, redistribua o peso ou confirme o limite do piso.</div></div>`
            : `<div class="verdict ok"><div><b>Piso aprovado em ${usadas.length===1?"uma zona":usadas.length+" zonas"}</b>${usadas.map(r=>esc(r.nome)+" a "+(r.util*100).toFixed(0)+"%").join(" · ")}. Referência ABNT NBR 6120.</div></div>`)
        : `<div class="verdict warn"><div><b>Nada apoiado ainda</b>Classifique as linhas do escopo como Solo para o memorial ter o que calcular.</div></div>`}</div>
      ${pend?`<div class="verdict crit"><div><b>${pend} linha(s) sem aplicação</b>Esse peso não está em memorial nenhum. Resolva no Escopo antes de concluir.</div></div>`:""}
      <div class="card"><header><h3>De onde vêm os números</h3></header><div class="pad" style="display:grid;gap:8px;font-size:12px;color:var(--ink2);line-height:1.5">
        <div>Cada zona soma só o que foi apoiado nela, mais o peso das estruturas que descem em torre de solo ali.</div>
        <div>Área e carga admissível são de cada zona; sobrecarga de público e carga pontual valem para a sala.</div>
        <div>Critério: distribuída de projeto ≤ admissível da zona, e nenhum apoio isolado acima da carga pontual. Referência ABNT NBR 6120.</div>
        <button class="btn" data-act="aba" data-aba="pontos" style="justify-content:center;margin-top:3px">Ajustar zonas</button>
      </div></div>
      ${ro?`<div class="verdict warn"><div><b>Somente leitura</b>Este perfil acompanha o memorial, mas quem edita é a produção.</div></div>`
        :`<button class="btn pri" style="justify-content:center" data-act="fecharSolo" data-id="${o.id}">${m.solo.feito?"Revalidar memorial de solo":"Concluir memorial de solo"}</button>`}
      <button class="btn" style="justify-content:center" data-act="baixarMem" data-tipo="solo" data-id="${o.id}">Baixar planilha de solo (Excel) · todas as salas</button>
    </div></div>`;
}
/* ---- 4. Memorial aéreo, gerado ---- */
function abaAereo(o,ro){
  const A=ambAtiva(o), m=memAmb(o,A.id), ests=estruturasDe(o,A.id);
  const pend=itensAmb(o,A.id).filter(indefinida).length;
  const rs=ests.map(e=>calcEstr(o,A.id,e.id));
  const usadas=rs.filter(r=>r.linhas);
  const reprova=usadas.filter(r=>!r.ok);
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:14px;align-items:start">
    <div class="grid" style="gap:12px">
      ${rs.map(r=>`<div class="card"><header><h3>${esc(r.nome)}</h3>
        <span class="hint">${r.torres?"em torre de solo":r.n+" ponto(s) cadastrados"} · ${r.linhas} linha(s)</span></header>
        ${r.linhas
          ? `<div class="mem" style="border:0;border-radius:0">${aeRes(r,m.aereo)}</div>
             ${!r.torres&&r.grupos.length?`<div class="tblwrap" style="border-top:1px solid var(--line2)"><table><thead><tr><th>Grupo</th><th class="r">Pontos</th><th class="r">WLL</th><th class="r">Carga por ponto</th><th style="width:110px">Utilização</th><th></th></tr></thead><tbody>
              ${r.grupos.map(g=>`<tr><td>${esc(g.nome)}</td><td class="r num">${g.qtd}</td><td class="r num">${kg(g.wll)}</td>
                <td class="r num">${dec(g.carga,0)} kgf</td>
                <td><span class="meter" style="width:100%"><i class="${g.util>1?"crit":g.util>.8?"warn":""}" style="width:${Math.min(100,g.util*100).toFixed(0)}%"></i></span></td>
                <td class="r num ${g.util>1?"":"muted"}" style="${g.util>1?"color:var(--crit);font-weight:600":""}">${dec(g.util*100,0)}%</td></tr>`).join("")}
            </tbody></table></div>`:""}`
          : `<div class="empty" style="padding:14px;font-size:12px">Nada sobe nesta estrutura. No Escopo, marque Aéreo numa linha e escolha esta vara.</div>`}
      </div>`).join("")}
    </div>
    <div class="grid" style="gap:12px">
      <div id="aeVer">${usadas.length
        ? (reprova.length
            ? `<div class="verdict crit"><div><b>${reprova.length===1?"Uma estrutura reprovada":reprova.length+" estruturas reprovadas"}</b>${reprova.map(r=>esc(r.nome)+(r.n?" a "+dec(r.porPonto,0)+" kgf por ponto":" sem pontos cadastrados")).join(" · ")}. Some pontos, redistribua o grid ou use acessório de maior WLL.</div></div>`
            : `<div class="verdict ok"><div><b>Rigging aprovado em ${usadas.length===1?"uma estrutura":usadas.length+" estruturas"}</b>${usadas.map(r=>esc(r.nome)+(r.torres?" em torre":" a "+(r.util*100).toFixed(0)+"%")).join(" · ")}.</div></div>`)
        : `<div class="verdict warn"><div><b>Nada suspenso ainda</b>Classifique as linhas do escopo como Aéreo para o memorial ter o que calcular.</div></div>`}</div>
      ${pend?`<div class="verdict crit"><div><b>${pend} linha(s) sem aplicação</b>Resolva no Escopo antes de concluir.</div></div>`:""}
      <div class="card"><header><h3>De onde vêm os números</h3></header><div class="pad" style="display:grid;gap:8px;font-size:12px;color:var(--ink2);line-height:1.5">
        <div>Cada estrutura distribui só a massa que sobe nela, pelos pontos dela — somar as varas esconderia a que está sobrecarregada.</div>
        <div>Fator dinâmico, desbalanceamento, WLL do acessório e FS mínimo valem para a sala inteira.</div>
        <button class="btn" data-act="aba" data-aba="pontos" style="justify-content:center;margin-top:3px">Editar estruturas e pontos</button>
      </div></div>
      ${ro?`<div class="verdict warn"><div><b>Somente leitura</b>Quem edita o memorial é a produção.</div></div>`
        :`<button class="btn pri" style="justify-content:center" data-act="fecharAereo" data-id="${o.id}">${m.aereo.feito?"Revalidar memorial aéreo":"Concluir memorial aéreo"}</button>`}
      <button class="btn" style="justify-content:center" data-act="baixarMem" data-tipo="aereo" data-id="${o.id}">Baixar planilha do aéreo (Excel) · todas as salas</button>
    </div></div>`;
}
function soloRes(r,p){
  return `<div class="l"><div class="k">Equipamentos apoiados no solo</div><div class="v">${kg(r.pEq)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Grid transferido às torres<small>${p.torres?"torre de solo — soma ao piso":"suspenso nos pontos do local"}</small></div><div class="v">${kg(r.transf)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Carga total sobre o piso</b></div><div class="v">${kg(r.total)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Carga distribuída dos equipamentos<small>${kg(r.total)} ÷ ${dec(r.area,0)} m²</small></div><div class="v">${dec(r.dEq,1)} <u>kgf/m²</u></div></div>
  <div class="l"><div class="k">Sobrecarga de público</div><div class="v">${dec(r.dPub,0)} <u>kgf/m²</u></div></div>
  <div class="l h"><div class="k"><b>Carga distribuída de projeto</b><small>limite do local ${dec(p.adm,0)} kgf/m²</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.util>1?"crit":r.util>.8?"warn":""}" style="width:${Math.min(100,r.util*100).toFixed(0)}%"></i></span>${dec(r.dTot,1)} <u>kgf/m² · ${(r.util*100).toFixed(0)}%</u></div></div>
  <div class="l"><div class="k">Item mais pesado<small>${esc(r.maior.nome)}</small></div><div class="v">${kg(r.maior.peso)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Carga pontual por apoio</b><small>limite ${dec(p.admPont,0)} kgf</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.utilP>1?"crit":r.utilP>.8?"warn":""}" style="width:${Math.min(100,r.utilP*100).toFixed(0)}%"></i></span>${dec(r.pont,0)} <u>kgf · ${(r.utilP*100).toFixed(0)}%</u></div></div>`;
}
function aeRes(r,p){
  if(r.apoiadoSolo) return `<div class="l h"><div class="k"><b>Grid apoiado em torre de solo</b><small>não há içamento nos pontos do local</small></div><div class="v">${kg(r.bruto)} <u>kgf no piso</u></div></div>
  <div class="l"><div class="k">Massa do grid<small>verificada no memorial de solo</small></div><div class="v">${kg(r.bruto)} <u>kgf</u></div></div>`;
  if(!r.n) return `<div class="l h"><div class="k"><b>Nenhum ponto cadastrado</b><small>monte a tabela em Pontos e apoios</small></div><div class="v">—</div></div>
  <div class="l"><div class="k">Massa suspensa do escopo</div><div class="v">${kg(r.efetivo)} <u>kgf</u></div></div>`;
  return `<div class="l"><div class="k">Massa suspensa</div><div class="v">${kg(r.efetivo)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Carga de projeto<small>${kg(r.efetivo)} × ${dec(p.fd,2)} × ${dec(p.fdes,2)}</small></div><div class="v">${kg(r.proj)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Carga por ponto</b><small>${r.n} pontos cadastrados</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.util>1?"crit":r.util>.8?"warn":""}" style="width:${Math.min(100,r.util*100).toFixed(0)}%"></i></span>${dec(r.porPonto,0)} <u>kgf · ${(r.util*100).toFixed(0)}%</u></div></div>
  <div class="l"><div class="k">Capacidade somada dos pontos</div><div class="v">${kg(r.cap)} <u>kgf</u></div></div>
  <div class="l"><div class="k">Carga de ruptura do acessório<small>7 × WLL ${dec(p.wllAcess,0)} kgf</small></div><div class="v">${kg(r.cr)} <u>kgf</u></div></div>
  <div class="l h"><div class="k"><b>Coeficiente de segurança</b><small>exigido ≥ ${dec(p.fsMin,0)}:1</small></div><div class="v">${isFinite(r.fs)?dec(r.fs,1):"—"} <u>: 1</u></div></div>
  <div class="l"><div class="k">Flecha admissível<small>vão ${dec(p.vao,1)} m · L/200</small></div><div class="v">${dec(r.flecha,0)} <u>mm</u></div></div>`;
}
function aeVer(r,p){
  if(r.apoiadoSolo) return `<div class="verdict warn"><div><b>Sem içamento</b>O grid está em torre de solo. A verificação inteira acontece no memorial de solo; conclua esta etapa para registrar a decisão de projeto.</div></div>`;
  if(!r.n) return `<div class="verdict crit"><div><b>Faltam os pontos</b>Cadastre os pontos de ancoragem em <b>Pontos e apoios</b> — sem eles não há como distribuir a carga suspensa.</div></div>`;
  return r.ok?`<div class="verdict ok"><div><b>Rigging aprovado</b>Utilização de ${(r.util*100).toFixed(0)}% no grupo mais carregado e coeficiente de segurança de ${dec(r.fs,1)}:1 sobre a carga de ruptura dos acessórios.</div></div>`
   :`<div class="verdict crit"><div><b>Rigging reprovado</b>${r.util>1?"A carga por ponto supera o WLL do grupo mais fraco — some pontos ou redistribua o grid. ":""}${r.fs<p.fsMin?"O coeficiente de segurança do acessório está abaixo do mínimo — especifique sling de maior WLL.":""}</div></div>`;
}

/* ---- ações ---- */
function acaoProd(a, id, t){
  t = t || {dataset:{}};
  if(a==="novaSalaOS"){const o=osById(id);if(o)mNovaSalaOS(o);return;}
  if(!["addItemOS","rmItemOS","aplOS","addAnc","rmAnc","ambSel","addAvulso","osModo",
       "addEstr","rmEstr","addPto","rmPto","addZona","rmZona",
       "loteApl","loteRm","loteNada"].includes(a)) return;
  if(a==="ambSel"){ S.ambSel=t.dataset.a; save(); render(); return; }
  if(a==="osModo"){ S.osModo=t.dataset.m; save(); render(); foco(t.dataset.m==="avulso"?"pxNome":"peItem"); return; }
  if(!can("editar_memorial")) return;
  const o=osById(id); if(!o) return;
  const A=ambAtiva(o), M=memAmb(o,A.id);
  /* mexeu no escopo, os memoriais daquela sala reabrem */
  const reabrir=ambId=>reabrirAmb(o, ambId||A.id);
  switch(a){
    case "addItemOS": {
      const cod=document.getElementById("peItem").value, q=Math.max(1,Number(document.getElementById("peQtd").value)||1);
      const apl=document.getElementById("peApl").value, it=item(cod);
      const amb=(document.getElementById("peAmb")||{}).value||A.id;
      const obs=(document.getElementById("peObs")||{}).value||"";
      if(cod.startsWith("KIT:")){
        const k=kitById(cod.slice(4)); if(!k) break;
        k.itens.forEach(x=>{ const ex=o.itens.find(i=>i.cod===x.cod && (i.amb||A.id)===amb);
          if(ex) ex.qtd+=x.qtd*q;
          else o.itens.push({id:uid(),cod:x.cod,qtd:x.qtd*q,amb,obs:obs||k.nome,
            aereo: apl==="aereo"?x.qtd*q : apl==="solo"?0 : null}); });
        reabrir(amb); save(); render(); foco("peItem");
        toast(k.nome+" aberto em "+k.itens.length+" linhas."); break;
      }
      const ex=o.itens.find(i=>i.cod===cod && (i.amb||A.id)===amb);
      if(ex){ ex.qtd+=q; if(apl==="aereo") ex.aereo=ex.qtd; if(apl==="solo") ex.aereo=0; if(obs) ex.obs=obs; }
      else o.itens.push({id:uid(),cod,qtd:q,amb,obs,aereo: apl==="aereo"?q : apl==="solo"?0 : null});
      reabrir(amb); save(); render(); foco("peItem"); toast(it.nome+" incluído na OS."); break;}
    case "addAvulso": {
      const nome=(document.getElementById("pxNome")||{}).value.trim();
      if(!nome) return toast("Escreva o que é a linha avulsa.");
      const amb=(document.getElementById("pxAmb")||{}).value||A.id;
      o.itens.push({id:uid(),cod:null,nome,cat:(document.getElementById("pxCat")||{}).value||"Extras",
        qtd:Math.max(1,Number((document.getElementById("pxQtd")||{}).value)||1),amb,aereo:null,
        obs:(document.getElementById("pxObs")||{}).value||""});
      save(); render(); foco("pxNome"); toast("Linha avulsa incluída."); break;}
    case "rmItemOS": {const i=o.itens[Number(t.dataset.ix)];
      o.itens.splice(Number(t.dataset.ix),1); if(i) reabrir(i.amb); save(); render(); break;}
    case "aplOS": {const i=o.itens[Number(t.dataset.ix)], v=t.dataset.v;
      if(!i||!i.cod) break;
      i.aereo = v==="aereo"? i.qtd : v==="solo"? 0 : null;
      reabrir(i.amb); save(); render(); break;}
    case "loteNada": limparSel(); render(); break;
    case "loteApl": {
      const v=t.dataset.v, alvo=itensSel(o).filter(i=>i.cod);
      if(!alvo.length) return toast("Nenhuma linha de catálogo marcada.");
      alvo.forEach(i=>{ i.aereo = v==="aereo"? i.qtd : v==="solo"? 0 : null; reabrir(i.amb); });
      save(); render();
      toast(alvo.length+" linha(s) "+(v==="aereo"?"no grid.":v==="solo"?"no solo.":"sem aplicação.")); break;}
    case "loteRm": {
      const alvo=itensSel(o); if(!alvo.length) break;
      const salas=[...new Set(alvo.map(i=>i.amb))];
      o.itens=o.itens.filter(i=>!SEL.has(i.id));
      salas.forEach(reabrir); limparSel(); save(); render();
      toast(alvo.length+" linha(s) removida(s) da OS."); break;}
    case "addEstr": {
      const el=document.getElementById("estrNome"); const nome=(el?el.value:"").trim();
      if(!nome) return toast("Dê um nome à estrutura — vara 1, portal, o que for.");
      const es=estruturasDe(o,A.id);
      if(es.some(x=>x.nome.trim().toLowerCase()===nome.toLowerCase()))
        return toast("Já existe uma estrutura com esse nome nesta sala.");
      es.push({id:uid(),nome,torres:false,pontos:[]});
      M.aereo.feito=false; save(); render(); foco("estrNome"); toast(nome+" criada."); break;}
    case "rmEstr": {
      const es=estruturasDe(o,A.id); if(es.length<2) return toast("A sala precisa de ao menos uma estrutura.");
      const eid=t.dataset.e, alvo=es.find(x=>x.id===eid); if(!alvo) break;
      const orfas=itensDaEstr(o,A.id,eid).length;
      /* o equipamento que estava nela volta para a primeira, em vez de sumir */
      const destino=es.find(x=>x.id!==eid);
      o.itens.forEach(i=>{ if(i.estr===eid) i.estr=destino.id; });
      M.estruturas=es.filter(x=>x.id!==eid);
      M.aereo.feito=false; save(); render();
      toast(orfas?alvo.nome+" removida — "+orfas+" linha(s) foram para "+destino.nome+".":alvo.nome+" removida."); break;}
    case "addPto": {
      const ix=t.dataset.ix, e=estruturasDe(o,A.id).find(x=>x.id===t.dataset.e); if(!e) break;
      const g=k=>(document.getElementById(k+ix)||{value:""}).value;
      const nome=g("pn").trim()||"Pontos do local";
      const qtd=Math.max(1,Number(g("pq"))||1), wll=Math.max(0,Number(g("pw"))||0);
      e.pontos=e.pontos||[]; e.pontos.push({id:uid(),nome,qtd,wll});
      M.aereo.feito=false; save(); render(); foco("pn"+ix);
      toast(qtd+" ponto(s) de "+kg(wll)+" kgf em "+e.nome+"."); break;}
    case "rmPto": {
      const e=estruturasDe(o,A.id).find(x=>x.id===t.dataset.e); if(!e) break;
      e.pontos.splice(Number(t.dataset.pi),1); M.aereo.feito=false; save(); render(); break;}
    case "addZona": {
      const el=document.getElementById("zonaNome"); const nome=(el?el.value:"").trim();
      if(!nome) return toast("Dê um nome à zona — palco, plateia, área técnica.");
      const zs=zonasDe(o,A.id);
      if(zs.some(x=>x.nome.trim().toLowerCase()===nome.toLowerCase()))
        return toast("Já existe uma zona com esse nome nesta sala.");
      zs.push({id:uid(),nome,
        area:Math.max(0,Number((document.getElementById("zonaArea")||{}).value)||0),
        adm:Math.max(0,Number((document.getElementById("zonaAdm")||{}).value)||500)});
      M.solo.feito=false; save(); render(); foco("zonaNome"); toast(nome+" criada."); break;}
    case "rmZona": {
      const zs=zonasDe(o,A.id); if(zs.length<2) return toast("A sala precisa de ao menos uma zona de piso.");
      const zid=t.dataset.z, alvo=zs.find(x=>x.id===zid); if(!alvo) break;
      const orfas=itensDaZona(o,A.id,zid).length;
      const destino=zs.find(x=>x.id!==zid);
      o.itens.forEach(i=>{ if(i.zona===zid) i.zona=destino.id; });
      estruturasDe(o,A.id).forEach(e=>{ if(e.zona===zid) e.zona=destino.id; });
      M.zonas=zs.filter(x=>x.id!==zid);
      M.solo.feito=false; save(); render();
      toast(orfas?alvo.nome+" removida — "+orfas+" linha(s) foram para "+destino.nome+".":alvo.nome+" removida."); break;}
    case "addAnc": {
      const nome=document.getElementById("anNome").value.trim()||"Pontos do local";
      const qtd=Math.max(1,Number(document.getElementById("anQtd").value)||1);
      const wll=Math.max(0,Number(document.getElementById("anWll").value)||0);
      M.ancoragens=M.ancoragens||[];
      M.ancoragens.push({id:uid(),nome,qtd,wll});
      M.aereo.feito=false; save(); render(); foco("anNome"); toast(qtd+" ponto(s) de "+kg(wll)+" kgf cadastrados."); break;}
    case "rmAnc": M.ancoragens.splice(Number(t.dataset.ix),1); M.aereo.feito=false; save(); render(); break;
  }
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  acaoProd(t.dataset.act, t.dataset.id, t);
});
document.addEventListener("input", ev=>{
  const el=ev.target; if(!can("editar_memorial")) return;
  const o=osById(S.sel); if(!o) return;
  if(el.dataset && el.dataset.osq!==undefined){
    const i=o.itens[Number(el.dataset.osq)]; if(!i) return;
    i.qtd=Math.max(1,Number(el.value)||1);
    if(i.aereo!=null) i.aereo=Math.min(i.aereo,i.qtd);
    const m=memAmb(o,i.amb); m.solo.feito=false; m.aereo.feito=false; save();
  }
  if(el.dataset && el.dataset.osobs!==undefined){
    const i=o.itens[Number(el.dataset.osobs)]; if(!i) return;
    i.obs=el.value; save();
  }
  if(el.dataset && el.dataset.estr!==undefined){
    const A=ambAtiva(o), M=memAmb(o,A.id);
    const e=estruturasDe(o,A.id).find(x=>x.id===el.dataset.estr); if(!e) return;
    const f=el.dataset.f;
    e[f] = f==="torres" ? el.checked : el.value;
    M.aereo.feito=false; M.solo.feito=false; save();
    if(f==="torres") render();
    return;
  }
  if(el.dataset && el.dataset.pto!==undefined){
    const A=ambAtiva(o), M=memAmb(o,A.id);
    const e=estruturasDe(o,A.id).find(x=>x.id===el.dataset.pto); if(!e) return;
    const x=e.pontos[Number(el.dataset.pi)]; if(!x) return;
    const f=el.dataset.f;
    x[f] = f==="nome" ? el.value : Math.max(0,Number(el.value)||0);
    M.aereo.feito=false; save(); return;
  }
  if(el.dataset && el.dataset.zona!==undefined){
    const A=ambAtiva(o), M=memAmb(o,A.id);
    const z=zonasDe(o,A.id).find(x=>x.id===el.dataset.zona); if(!z) return;
    const f=el.dataset.f;
    z[f] = f==="nome" ? el.value : Math.max(0,Number(el.value)||0);
    M.solo.feito=false; save(); return;
  }
  if(el.dataset && el.dataset.anc!==undefined){
    const M=memAmb(o,ambAtiva(o).id);
    const a=M.ancoragens[Number(el.dataset.anc)]; if(!a) return;
    const f=el.dataset.f;
    a[f] = f==="nome" ? el.value : Math.max(0,Number(el.value)||0);
    M.aereo.feito=false; save();
  }
});
/* clique nas caixas: shift marca o intervalo */
document.addEventListener("click", ev=>{
  const el=ev.target;
  if(!el.dataset || el.dataset.sel===undefined) return;
  if(!can("editar_memorial")) return;
  const o=osById(S.sel); if(!o) return;
  marcar(o, el.dataset.sel, ev.shiftKey);
  render();
});
document.addEventListener("change", ev=>{
  const el=ev.target; if(!can("editar_memorial")) return;
  /* marcar/desmarcar uma categoria inteira */
  if(el.dataset && el.dataset.selcat!==undefined){
    const o=osById(S.sel); if(!o) return;
    const [cat,ambId]=el.dataset.selcat.split("|");
    const alvo=porCategoria(itensAmb(o,ambId)).find(([c])=>c===cat);
    if(alvo){ const todos=alvo[1].every(i=>SEL.has(i.id));
      alvo[1].forEach(i=>{ if(todos) SEL.delete(i.id); else SEL.add(i.id); });
      if(!todos && alvo[1].length) SEL_ANCORA=alvo[1][alvo[1].length-1].id;
      render(); }
    return;
  }
  /* ações em lote pelos seletores da barra */
  if(el.dataset && el.dataset.lote!==undefined && el.value){
    const o=osById(S.sel); if(!o) return;
    const campo=el.dataset.lote, alvo=itensSel(o);
    const salas=new Set();
    alvo.forEach(i=>{ salas.add(i.amb);
      if(campo==="amb"){ i.amb=el.value; salas.add(el.value); }
      else if(i.cod) i[campo]=el.value; });
    salas.forEach(reabrirAmb.bind(null,o));
    save(); render();
    toast(alvo.length+" linha(s) atualizada(s).");
    return;
  }
  if(el.dataset && el.dataset.estr!==undefined && el.dataset.f==="zona"){
    const o=osById(S.sel); if(!o) return;
    const A=ambAtiva(o);
    const e=estruturasDe(o,A.id).find(x=>x.id===el.dataset.estr); if(!e) return;
    e.zona=el.value; memAmb(o,A.id).solo.feito=false; save(); render(); return;
  }
  if(el.dataset && (el.dataset.osestr!==undefined||el.dataset.oszona!==undefined)){
    const o=osById(S.sel); if(!o) return;
    const qual = el.dataset.osestr!==undefined ? "estr" : "zona";
    const ix = Number(el.dataset.osestr!==undefined ? el.dataset.osestr : el.dataset.oszona);
    const i=o.itens[ix]; if(!i) return;
    i[qual]=el.value; reabrirAmb(o,i.amb); save(); render(); return;
  }
  if(!el.dataset || el.dataset.osamb===undefined) return;
  const o=osById(S.sel); if(!o) return;
  const i=o.itens[Number(el.dataset.osamb)]; if(!i) return;
  const antes=i.amb; i.amb=el.value;
  /* mudou de sala: a vara e a zona da sala antiga não valem mais */
  i.estr=null; i.zona=null;
  [antes,i.amb].forEach(x=>reabrirAmb(o,x));
  save(); render();
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.dataset && (el.dataset.osq!==undefined||el.dataset.anc!==undefined)) render();
});
</script>

<script>
/* ================= FREELANCERS =================
   O comercial cadastra uma vez; a logística escala depois. Cachê,
   documento e conta bancária são do mesmo tipo da diária do item: existem
   no banco, mas quem não é gerência não recebe a coluna. */
const ESPECIALIDADES = ["Rigger","Montagem","Operação de som","Operação de luz","Operação de vídeo",
  "Cenografia","Motorista","Coordenação","Técnico de LED","Projecionista","Eletricista","Apoio"];
const TIPOS_CONTA = ["Corrente","Poupança","Pagamentos"];

function ensureFreelas(){ if(!S.freelas) S.freelas=[]; if(!S.reembolsos) S.reembolsos=[]; }
const freela = id => (S.freelas||[]).find(f=>f.id===id) || null;
const freelaNome = id => (freela(id)||{}).nome || "";
const iniciais = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase();
const avNome = (nome,cor,tam) => `<span class="av" style="background:${cor||"var(--ink3)"};color:#FFF;width:${tam||26}px;height:${tam||26}px;font-size:${(tam||26)<26?10:11}px">${esc(iniciais(nome))}</span>`;

/* uma pessoa pode ser freelancer, gente da casa, ou um nome solto de equipe
   terceirizada — a escala guarda os três do mesmo jeito */
function pessoasDisponiveis(){
  const out=[];
  (S.perfis||[]).forEach(u=>out.push({chave:"p:"+u.id, nome:u.nome, sub:u.cargo||PERFIS[u.role]&&PERFIS[u.role].label||"", casa:true}));
  (S.freelas||[]).filter(f=>f.ativo!==false).forEach(f=>out.push({chave:"f:"+f.id, nome:f.nome,
    sub:(f.especialidades||[]).join(" · ")||"Freelancer", freela:true, veic:f.veicProprio}));
  return out.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
}

function formFreela(id){
  const f = id ? freela(id) : null;
  const ver = can("ver_valores");

/* quantos dias de escala essa pessoa já tem, contando só evento não encerrado */
function diasEscalados(freelaId){
  let n=0;
  (S.os||[]).forEach(o=>{ if(o.status==="Encerrada") return;
    ((o.logistica||{}).escala||[]).forEach(e=>{ if(e.freela===freelaId) n++; }); });
  return n;
}

<script>
/* ---- ações do cadastro de freelancers ---- */
function acaoFreela(a,id,t){
  if(!["novoFreela","editarFreela","fecharFreela","salvarFreela","rmFreela"].includes(a)) return;
  switch(a){
    case "novoFreela": if(can("editar_freelancer")){ S.freelaForm=""; save(); render(); foco("frNome"); } break;
    case "editarFreela": if(can("editar_freelancer")){ S.freelaForm=id; save(); render(); foco("frNome"); } break;
    case "fecharFreela": S.freelaForm=null; save(); render(); break;
    case "rmFreela": {
      if(!can("editar_freelancer")) break;
      const f=freela(id); if(!f) break;
      if(diasEscalados(id)) return toast("Essa pessoa está escalada em evento aberto. Marque como inativa em vez de excluir.");
      S.freelas=S.freelas.filter(x=>x.id!==id); S.freelaForm=null; save(); render();
      toast(f.nome+" removido do cadastro."); break;}
    case "salvarFreela": {
      if(!can("editar_freelancer")) break;
      const g=x=>{const el=document.getElementById(x); return el?el.value:"";};
      const ck=x=>{const el=document.getElementById(x); return el?el.checked:false;};
      const nome=g("frNome").trim();
      if(!nome) return toast("Informe o nome do freelancer.");
      const dados={nome, apelido:g("frApelido").trim(), tel:g("frTel").trim(), email:g("frEmail").trim(),
        cidade:g("frCidade").trim(),
        especialidades:[...document.querySelectorAll(".frEsp")].filter(c=>c.checked).map(c=>c.value),
        veicProprio:ck("frVeic"), veicDesc:g("frVeicDesc").trim(),
        obs:g("frObs").trim(), ativo:ck("frAtivo")};
      /* quem não vê valores não manda essas colunas: o banco também não deixaria */
      if(can("ver_valores")) Object.assign(dados,{
        cache:Number(g("frCache"))||0, cpf:g("frCpf").trim(), rg:g("frRg").trim(), nasc:g("frNasc")||null,
        banco:g("frBanco").trim(), agencia:g("frAg").trim(), conta:g("frConta").trim(),
        tipoConta:g("frTipoConta"), titular:g("frTitular").trim(), pix:g("frPix").trim()});
      const ex=freela(id);
      if(ex) Object.assign(ex,dados); else S.freelas.push(Object.assign({id:uid()},dados));
      S.freelaForm=null; save(); render(); toast(nome+" salvo no cadastro."); break;}
  }
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  acaoFreela(t.dataset.act, t.dataset.id, t);
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset && el.dataset.busca==="freela"){ S.freelaBusca=el.value; const p=el.selectionStart;
    render(); const n=document.getElementById("frBusca"); if(n){ n.focus(); n.setSelectionRange(p,p); } }
});
Object.assign(window.VEXTRA||(window.VEXTRA={}),{freelas:vFreelas});
</script>
