        if(r.error && r.error.code!=="23505") throw r.error; }
      if(!curti && curtiaAntes){ const r=await sb.from("post_curtidas").delete()
        .eq("post_id",p.id).eq("perfil_id",eu); if(r.error) throw r.error; }
    }
    const antesCom=porId((a&&a.coments)||[]);
    const novos=p.coments.filter(c=>!antesCom[c.id]);
    if(novos.length){ const r=await sb.from("post_comentarios").upsert(
      novos.map(c=>({id:c.id,post_id:p.id,autor_id:pid(c.autor),texto:c.txt})),
      {onConflict:"id",ignoreDuplicates:true}); if(r.error) throw r.error; }
  }
}
async function syncNotifs(estado){
  const antes=porId(ultimo.notifs);
  const novas=estado.notifs.filter(n=>!antes[n.id]);
  if(novas.length){
    /* a linha pode já estar lá de uma tentativa anterior: reenviar não pode explodir */
    const r=await sb.from("notificacoes").upsert(novas.map(n=>({id:n.id,texto:n.txt,tipo:n.tipo,
      destino:n.para,tela:nz(n.view),referencia:nz(n.sel)})), {onConflict:"id",ignoreDuplicates:true});
    if(r.error) throw r.error;
  }
  const lidas=estado.notifs.filter(n=>n.lida[estado.role] && (!antes[n.id] || !antes[n.id].lida[estado.role]));
  if(lidas.length){
    const r=await sb.from("notificacao_leituras").upsert(
      lidas.map(n=>({notificacao_id:n.id,perfil_id:estado.perfilId})));
    if(r.error && r.error.code!=="23505") throw r.error;
  }
}
</script>
<script>
/* =============================================================
   4 · IDENTIFICADORES
   O banco usa uuid na chave e guarda o código legível à parte.
   ============================================================= */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
      const r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }));
const ano = () => new Date().getFullYear();
function proximoCodigo(prefixo, lista){
  const re=new RegExp("^"+prefixo+"-\\d{4}-(\\d+)$");
  const max=lista.map(x=>{ const m=re.exec(x.codigo||""); return m?+m[1]:0; }).reduce((a,b)=>Math.max(a,b),0);
  return prefixo+"-"+ano()+"-"+String(max+1).padStart(4,"0");
}
/* busca por uuid ou por código, porque as telas mostram o código */
osById  = id => S.os.find(o=>o.id===id || o.codigo===id);
oscById = id => S.cargas.find(c=>c.id===id || c.codigo===id);

/* =============================================================
   5 · FOTOS DA VISITA TÉCNICA → Supabase Storage
   ============================================================= */
async function assinarFotos(){
  const paths=[];
  S.negocios.forEach(n=>n.vt.fotos.forEach(f=>{ if(f.path) paths.push(f.path); }));
  if(paths.length){
    const { data } = await sb.storage.from("vt-fotos").createSignedUrls(paths, 60*60*8);
    const mapa=Object.fromEntries((data||[]).map(d=>[d.path,d.signedUrl]));
    S.negocios.forEach(n=>n.vt.fotos.forEach(f=>{ if(mapa[f.path]) f.src=mapa[f.path]; }));
  }
  const notas=(S.reembolsos||[]).filter(r=>r.path).map(r=>r.path);
  if(notas.length){
    const { data } = await sb.storage.from("reembolsos").createSignedUrls(notas, 60*60*8);
    const mapa=Object.fromEntries((data||[]).map(d=>[d.path,d.signedUrl]));
    (S.reembolsos||[]).forEach(r=>{ if(mapa[r.path]) r.src=mapa[r.path]; });
  }
}
lerFotos = async function(negId, files){
  if(!await sincronizar()) return;
  const arr=[...files].filter(f=>f.type.startsWith("image/")).slice(0,12);
  if(!arr.length) return;
  const n=neg(negId); if(!n) return;
  toast("Enviando "+arr.length+" foto(s)…");
  arr.forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=async ()=>{
        const max=1400, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(async blob=>{
          const path=S.empresaId+"/"+negId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";
          const up=await sb.storage.from("vt-fotos").upload(path, blob, {contentType:"image/jpeg"});
          if(up.error) return erro(up.error,"Falha ao enviar a foto");
          const ins=await sb.from("vt_fotos").insert({negocio_id:negId,storage_path:path,
                       enviado_por:S.perfilId}).select().single();
          if(ins.error){ await sb.storage.from("vt-fotos").remove([path]); return erro(ins.error,"Falha ao registrar a foto"); }
          const { data } = await sb.storage.from("vt-fotos").createSignedUrl(path, 60*60*8);
          n.vt.fotos.push({id:ins.data.id,nome:f.name.slice(0,40),legenda:"",path,src:data?.signedUrl||""});
          save(); render(); toast("Foto anexada à visita técnica.");
        },"image/jpeg",0.78);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  });
};

/* Comprovante de reembolso: a foto do papel amassado do bolso. Vai para um
   bucket próprio, redimensionada, e o caminho fica na nota. A nota já tem de
   existir — o botão só aparece depois que ela foi salva. */
lerNota = async function(reembId, files){
  if(!await sincronizar()) return;
  const r0=reembById(reembId); if(!r0) return;
  const f=[...files].find(x=>x.type.startsWith("image/"));
  if(!f) return toast("Anexe uma imagem do comprovante.");
  toast("Enviando o comprovante…");
  const fr=new FileReader();
  fr.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(async blob=>{
        const path=S.empresaId+"/"+reembId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";
        const up=await sb.storage.from("reembolsos").upload(path, blob, {contentType:"image/jpeg"});
        if(up.error) return erro(up.error,"Falha ao enviar o comprovante");
        const antigo=r0.path;
        const gr=await sb.from("reembolsos").update({comprovante_path:path}).eq("id",reembId).select("id").single();
        if(gr.error){ await sb.storage.from("reembolsos").remove([path]); return erro(gr.error,"Falha ao registrar o comprovante"); }
        r0.path=path;
        if(antigo) await sb.storage.from("reembolsos").remove([antigo]);
        const { data } = await sb.storage.from("reembolsos").createSignedUrl(path, 60*60*8);
        r0.src=data?.signedUrl||"";
        save(); render(); toast("Comprovante anexado à nota.");
      },"image/jpeg",0.8);
    };
    img.src=ev.target.result;
  };
  fr.readAsDataURL(f);
};

/* =============================================================
   6 · OPERAÇÕES DE ESTOQUE → funções do banco
   São transações: mudam o status, escrevem o livro razão e
   mexem na manutenção de uma vez só.
   ============================================================= */
gerarOSC = async function(osId){
  const o=osById(osId); if(!o) return;
  if(!can("gerar_osc")) return toast("Seu perfil não emite ordem de carga.");
  if(!await sincronizar()) return;
  const { data, error } = await sb.rpc("gerar_ordem_carga", { p_os: o.id });
  if(error) return toast(error.message.replace(/^.*?:\s*/,""));
  await recarregar();
  toast("Ordem de carga "+data.codigo+" emitida para o estoque.");
  go("cargas", data.id);
};
confirmarCarga = async function(id){
  const c=oscById(id); if(!c) return;
  /* o "Em separação" pode ter acabado de ser clicado e ainda estar na fila */
  if(!await sincronizar()) return;
  const { data, error } = await sb.rpc("confirmar_carga", { p_ordem: c.id });
  if(error) return toast(error.message.replace(/^.*?:\s*/,""));
  await recarregar();
  toast("Baixa lançada em "+dtl(data.data)+" · "+c.itens.reduce((s,i)=>s+i.qtd,0)+" peças saíram do galpão.");
};
confirmarRetorno = async function(id){
  const c=oscById(id); if(!c) return;
  const av={};
  document.querySelectorAll("[data-av]").forEach(el=>{
    const q=Math.max(0,Number(el.value)||0); if(q>0) av[el.dataset.av]=q; });
  if(!await sincronizar()) return;
  const { data, error } = await sb.rpc("registrar_descarga", { p_ordem: c.id, p_avarias: av });
  if(error){ fecharModal(); return toast(error.message.replace(/^.*?:\s*/,"")); }
  fecharModal(); await recarregar();
  const total=Object.values(av).reduce((s,v)=>s+v,0);
  toast("Entrada registrada em "+dtl(data.data)+(total?" · "+total+" peça(s) em manutenção.":"."));
};

/* =============================================================
   7 · NOVOS REGISTROS COM uuid E CÓDIGO
   ============================================================= */
const _gerarOSVBase = gerarOSVdeNegocio;
gerarOSVdeNegocio = function(negId){
  const n=neg(negId); if(!n) return;
  S._novoOsId = uid();
  S._novoOsCodigo = proximoCodigo("OSV", S.os);
  _gerarOSVBase(negId);
};

/* =============================================================
   8 · BOOT
   ============================================================= */
async function recarregar(){
  if(carregandoDados) return false;
  if(!await sincronizar()) return false;
  carregandoDados=true;
  const inicioRevisao=revisaoLocal;
  const app=document.getElementById("app"); if(app) app.inert=true;
  const b=document.getElementById("btnSync"); if(b) b.textContent="Atualizando…";
  try{
    if(await carregarTudo()===false) return false;
    await assinarFotos();
    ensureComms(); ensureCRM(); ensureOrc(); ensureKits(); ensureProd(); ensureFrota(); ensureFreelas();
    if(inicioRevisao!==revisaoLocal){statusSync("Novas alterações pendentes");return false;}
    marcarSincronizado();
    render();
    statusSync("Dados atualizados");
    return true;
  }catch(e){ erro(e,"Não consegui carregar"); statusSync("Falha ao atualizar. Seus dados foram mantidos.",true); return false; }
  finally { carregandoDados=false; if(app) app.inert=false; if(b) b.disabled=false; }
}

function telaCarregando(txt){
  document.getElementById("authHost").innerHTML =
    `<div class="carregando"><div>${esc(txt||"Carregando a operação…")}</div></div>`;
}

async function iniciar(){
  telaCarregando();
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ telaLogin(); return; }

  const owner = await sb.rpc("plataforma_owner");
  if(owner.error){telaLogin("Atualização pendente. Aplique a migração 0011 para acessar esta versão.");return;}
  if(owner.data===true){window.location.replace("owner.html");return;}
  const contexto = await sb.rpc("contexto_empresa");
  if(contexto.error || !contexto.data?.id){await sb.auth.signOut();telaLogin("Acesso indisponível. Sua empresa ou seu perfil está inativo ou ainda não foi cadastrado.");return;}
  S.empresaId=contexto.data.id;
  S.empresaNome=contexto.data.nome;
  const empresaLabel=document.getElementById("empresaAtual");if(empresaLabel){empresaLabel.textContent=S.empresaNome;empresaLabel.title=S.empresaNome;}
  const { data: perfil, error } = await sb.from("perfis").select("*").eq("id", user.id).single();
  if(error || !perfil || !perfil.ativo){
    await sb.auth.signOut();
    telaLogin("Seu usuário existe, mas ainda não tem perfil na operação. Peça ao owner para liberar.");
    return;
  }
  S.perfilId = perfil.id;
  S.role     = perfil.papel;

  try{
    await carregarTudo();
    await assinarFotos();
  }catch(e){ erro(e,"Não consegui carregar"); telaLogin("Falha ao carregar: "+mensagemErro(e)); return; }

  ensureComms(); ensureCRM(); ensureOrc(); ensureKits(); ensureProd(); ensureFrota(); ensureFreelas();
  marcarSincronizado();

  document.getElementById("authHost").innerHTML="";
  document.getElementById("app").hidden=false;
  if(!podeVer(S.view)) S.view="painel";
  render(); pintarTema();
  ouvirMudancas();
  iniciarConta();
}

/* novidades dos outros chegam sozinhas */
function ouvirMudancas(){
  sb.channel("operacao")
    .on("postgres_changes",{event:"*",schema:"public",table:"mensagens"}, () => recarregarSuave())
    .on("postgres_changes",{event:"*",schema:"public",table:"ordens_carga"}, () => recarregarSuave())
    .on("postgres_changes",{event:"*",schema:"public",table:"itens"}, () => recarregarSuave())
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"notificacoes"}, () => recarregarSuave())
    .subscribe();
}
let suave=null;
function recarregarSuave(){ clearTimeout(suave); suave=setTimeout(()=>{ if(S.view!=="perfil" && S.view!=="chat" && S.view!=="organograma" && !gravando && !temAlteracoes() && !document.querySelector("input:focus,textarea:focus,select:focus,#modalHost .modal")) recarregar(); }, 1200); }

/* ações do cabeçalho e da tela de login */
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  if(t.dataset.act==="sair"){ sair(); }
  if(t.dataset.act==="recarregar"){ recarregar(); }
  if(t.dataset.act==="recuperar"){ recuperarSenha(); }
});

sb.auth.onAuthStateChange((evento,sessao)=>{ if(evento==="SIGNED_OUT" || (evento==="SIGNED_IN" && S.perfilId && sessao?.user?.id!==S.perfilId)) location.reload(); });
iniciar();
</script>
