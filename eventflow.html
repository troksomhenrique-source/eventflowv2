<script>
/* ================= COMUNICAÇÃO — dados e utilitários ================= */
/* as pessoas vêm da tabela perfis */
const USERS_FALLBACK=[];
Object.defineProperty(window,"USERS",{get:()=> (S.perfis&&S.perfis.length)?S.perfis:USERS_FALLBACK});
const usr = id => USERS.find(u=>u.id===id)||{id,nome:"Sistema",ini:"SY",cargo:"",cor:"#7C929C",role:"sistema"};
const me = () => usr(S.perfilId) ;
const av = (u,sz=26) => `<span class="av" style="background:${u.cor};color:#FFF;width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px" title="${esc(u.nome)}">${u.ini}</span>`;

const nowTs = () => HOJE+"T"+new Date().toTimeString().slice(0,5);
const tsData = t => (t||"").slice(0,10);
const tsHora = t => (t||"").slice(11,16);
function tsRel(t){
  const d=tsData(t); if(d===HOJE) return "hoje "+tsHora(t);
  if(d===addDays(HOJE,-1)) return "ontem "+tsHora(t);
  const n=diffDays(d,HOJE);
  if(n>0&&n<7) return n+" dias atrás";
  return dt(d)+" "+tsHora(t);
}
function linkify(txt){
  return esc(txt)
    .replace(/(OSV-\d{4}-\d{4})/g,'<a href="#" class="ref" data-act="osv" data-id="$1">$1</a>')
    .replace(/(OSC-\d{4}-\d{4})/g,'<a href="#" class="ref" data-act="osc" data-id="$1">$1</a>')
    .replace(/@([A-ZÀ-Ý][a-zà-ÿ]+(?:\s[A-ZÀ-Ý][a-zà-ÿ]+)?)/g,'<b class="men">@$1</b>')
    .replace(/\n/g,"<br>");
}

function seedComms(){
  return {chats:[],msgs:[],posts:[],notas:[],compromissos:[],notifs:[],
          lidos:{}, chatSel:null, notaSel:null, agendaDia:HOJE, agendaMes:HOJE.slice(0,7),
          notaFiltro:"", muralTxt:""};
}
function ensureComms(){
  if(!S.chats)  S.chats=[];  if(!S.msgs) S.msgs=[];
  if(!S.posts)  S.posts=[];  if(!S.notas) S.notas=[];
  if(!S.compromissos) S.compromissos=[]; if(!S.notifs) S.notifs=[];
  if(!S.lidos)  S.lidos={};
  if(!S.lidos[S.role]) S.lidos[S.role]={};
  if(!S.agendaDia) S.agendaDia=HOJE;
  if(!S.agendaMes) S.agendaMes=HOJE.slice(0,7);
}

/* ---- consultas ---- */
const chatById = id => S.chats.find(c=>c.id===id);
const msgsDo = id => S.msgs.filter(m=>m.chat===id).sort((a,b)=>a.ts<b.ts?-1:1);
function chatNome(c){ if(c.tipo!=="dm") return c.nome; const o=c.membros.find(m=>m!==me().id); return usr(o||c.membros[0]).nome; }
function chatSub(c){ if(c.tipo==="dm") return usr(c.membros.find(m=>m!==me().id)||c.membros[0]).cargo;
  if(c.tipo==="os"){const o=osById(c.osId); return o?o.id+" · "+o.status:"OS";} return c.desc||""; }
const visivelPraMim = c => c.membros.includes(me().id);
function naoLidas(c){ const last=(S.lidos[S.role]||{})[c.id]||"2000-01-01T00:00";
  return msgsDo(c.id).filter(m=>m.ts>last && m.autor!==me().id && !m.sys).length; }
const totalNaoLidas = () => S.chats.filter(visivelPraMim).reduce((s,c)=>s+naoLidas(c),0);
const ultimaMsg = c => { const l=msgsDo(c.id); return l[l.length-1]||null; };
const notifsMinhas = () => S.notifs.filter(n=>n.para.includes(S.role)).sort((a,b)=>a.ts<b.ts?1:-1);
const notifsNaoLidas = () => notifsMinhas().filter(n=>!n.lida[S.role]).length;
const notasVisiveis = () => S.notas.filter(n=>n.escopo==="equipe"||n.autor===me().id);
/* quem aparece na agenda sai de quem realmente está no time, não de uma
   lista fixa: os produtores da OS, e o pessoal de estoque na carga */
const doEstoque = () => USERS.filter(u=>u.role==="estoque").map(u=>u.id);
function compromissosDo(iso){
  const out=[];
  for(const c of S.compromissos) if(c.data===iso) out.push({...c,fonte:"manual"});
  for(const o of S.os){
    const eq=(o.produtores||[]).slice(0,3);
    if(o.montagem===iso) out.push({id:o.id+"-m",titulo:"Montagem · "+o.evento,data:iso,hora:"07:00",tipo:"montagem",osId:o.id,resp:eq,local:o.local,fonte:"os"});
    if(o.evIni===iso) out.push({id:o.id+"-e",titulo:"Evento · "+o.evento,data:iso,hora:"19:00",tipo:"evento",osId:o.id,resp:eq,local:o.local,fonte:"os"});
    if(o.desmontagem===iso) out.push({id:o.id+"-d",titulo:"Desmontagem · "+o.evento,data:iso,hora:"22:00",tipo:"desmontagem",osId:o.id,resp:eq,local:o.local,fonte:"os"});
  }
  for(const c of S.cargas){
    const o=c.osId?osById(c.osId):null; const nm=o?o.evento:c.evento||c.codigo||"";
    const eq=doEstoque().slice(0,3);
    if(c.carga===iso) out.push({id:c.id+"-c",titulo:"Carga · "+nm,data:iso,hora:c.horaCarga||"06:00",tipo:"carga",oscId:c.id,resp:eq,local:c.veiculo,fonte:"osc"});
    if(c.descarga===iso) out.push({id:c.id+"-r",titulo:"Descarga · "+nm,data:iso,hora:"18:00",tipo:"descarga",oscId:c.id,resp:eq,local:c.veiculo,fonte:"osc"});
  }
  return out.sort((a,b)=>(a.hora||"")<(b.hora||"")?-1:1);
}
const TIPOCOR={reuniao:"acc",visita:"acc",prazo:"crit",montagem:"warn",evento:"",desmontagem:"warn",carga:"ok",descarga:"ok"};
const TIPONOME={reuniao:"Reunião",visita:"Visita técnica",prazo:"Prazo",montagem:"Montagem",evento:"Evento",desmontagem:"Desmontagem",carga:"Carga",descarga:"Descarga"};

/* ---- escrita ---- */
function postarMsg(chatId,txt,sys){
  if(!txt||!txt.trim()) return;
  S.msgs.push({id:uid(),chat:chatId,autor:sys?"sistema":me().id,ts:nowTs(),txt:txt.trim(),sys:!!sys});
  marcarLido(chatId);
}
function marcarLido(chatId){
  if(!S.lidos[S.role]) S.lidos[S.role]={};
  S.lidos[S.role][chatId]=nowTs();
  if(typeof db!=="undefined" && db.marcarLido) db.marcarLido(chatId);
}
function avisar(txt,para,view,sel,tipo){
  S.notifs.push({id:uid(),ts:nowTs(),txt,para:para||["gerencia","producao","estoque"],view:view||"painel",sel:sel||null,tipo:tipo||"info",lida:{[S.role]:true}});
}
function postarMural(txt,sys){
  S.posts.unshift({id:uid(),autor:sys?"sistema":me().id,ts:nowTs(),txt,likes:[],coments:[],sys:!!sys});
}
function canalDaOS(osId){
  let c=S.chats.find(x=>x.osId===osId);
  if(!c){ const o=osById(osId); if(!o) return null;
    c={id:uid(),tipo:"os",osId,nome:o.evento,membros:[S.perfilId].filter(Boolean)}; S.chats.push(c); }
  return c;
}
/* evento de fluxo: notifica, posta no canal da OS e registra no mural quando relevante */
function fluxo(osId,txt,para,view,sel,mural){
  const c=osId?canalDaOS(osId):null;
  if(c) S.msgs.push({id:uid(),chat:c.id,autor:"sistema",ts:nowTs(),txt,sys:true});
  avisar(txt,para,view,sel,"fluxo");
  if(mural) postarMural(txt,true);
}
</script>

<script>

      </div></div>
      ${S.posts.map(p=>{const a=usr(p.autor);const curti=p.likes.includes(me().id);

    <div class="grid" style="gap:12px">
      <div class="card"><header><h3>Quem está na operação</h3></header><div class="res" style="border:0">
        ${USERS.map(u=>`<div class="row"><div class="n" style="display:flex;gap:9px;align-items:center">${av(u,26)}<span><b style="font-size:12.5px">${esc(u.nome)}</b><small style="font-family:var(--sans);color:var(--ink3)">${esc(u.cargo)}</small></span></div>
          <div class="v"><span class="pill ${u.role===S.role?"acc":""}">${esc(PERFIS[u.role]?PERFIS[u.role].label:u.role)}</span></div></div>`).join("")}
      </div></div>
      <div class="card"><header><h3>Agenda de hoje</h3><span class="hint">${dtl(HOJE)}</span></header>
        ${(()=>{const l=compromissosDo(HOJE);return l.length?`<div class="res" style="border:0">${l.map(c=>`<div class="row"><div class="n"><b style="font-size:12.5px">${esc(c.titulo)}</b><small style="font-family:var(--sans);color:var(--ink3)">${esc(c.local||"—")}</small></div><div class="v">${esc(c.hora||"")}<br><span class="pill ${TIPOCOR[c.tipo]||""}" style="margin-top:3px">${TIPONOME[c.tipo]}</span></div></div>`).join("")}</div>`:`<div class="empty">Nenhum compromisso hoje.</div>`;})()}
      </div>
      <div class="card"><header><h3>Notas fixadas</h3></header>
        ${notasVisiveis().filter(n=>n.fixada).map(n=>`<div class="res" style="border:0;border-radius:0"><div class="row" style="cursor:pointer" data-act="abrirNota" data-id="${n.id}">
          <div class="n"><b style="font-size:12.5px">${esc(n.titulo)}</b><small style="font-family:var(--sans);color:var(--ink3)">${n.checklist.length?n.checklist.filter(c=>c.ok).length+"/"+n.checklist.length+" concluídos":esc(n.tags.join(" · "))}</small></div>
          <div class="v">${av(usr(n.autor),22)}</div></div></div>`).join("")||`<div class="empty">Nenhuma nota fixada.</div>`}
      </div>
    </div></div>`;
}

/* ================= CHAT ================= */
function vChat(){
  const meus=S.chats.filter(visivelPraMim);
  const sel=chatById(S.chatSel)&&visivelPraMim(chatById(S.chatSel))?chatById(S.chatSel):meus[0];
  if(!sel) return `<div class="empty">Nenhuma conversa disponível para este perfil.</div>`;
  const grupos=[["Canais",meus.filter(c=>c.tipo==="canal")],["Eventos em produção",meus.filter(c=>c.tipo==="os")],["Mensagens diretas",meus.filter(c=>c.tipo==="dm")]];
  const ms=msgsDo(sel.id);
  let ultimoDia="";
  const corpo=ms.map(m=>{
    let sep="";
    if(tsData(m.ts)!==ultimoDia){ultimoDia=tsData(m.ts);sep=`<div class="daysep">${ultimoDia===HOJE?"hoje":dtl(ultimoDia)}</div>`;}
    if(m.sys) return sep+`<div class="msg sys"><div class="bub">${linkify(m.txt)} · ${tsHora(m.ts)}</div></div>`;
    const a=usr(m.autor), mine=m.autor===me().id;
    return sep+`<div class="msg ${mine?"mine":""}">${av(a,28)}<div class="bub">
      <div class="who">${mine?"Você":esc(a.nome)}<time>${tsHora(m.ts)}</time></div>
      <div class="tx">${linkify(m.txt)}</div></div></div>`;
  }).join("");
  const o=sel.tipo==="os"?osById(sel.osId):null;
  return `<div class="chatwrap">
    <div class="chatlist">
      <div class="srch"><input id="chatSrch" placeholder="Buscar conversa…" value="${esc(S.chatQ||"")}" data-chatq="1"></div>
      <div class="scroll">${grupos.map(([g,l])=>{
        const f=l.filter(c=>!S.chatQ||chatNome(c).toLowerCase().includes(S.chatQ.toLowerCase()));
        if(!f.length) return "";
        return `<div class="grp">${g}</div>`+f.map(c=>{const u=naoLidas(c),lm=ultimaMsg(c);
          return `<div class="crow ${c.id===sel.id?"on":""}" data-act="abrirChat" data-id="${c.id}">
            ${c.tipo==="dm"?av(usr(c.membros.find(m=>m!==me().id)||c.membros[0]),30):`<span class="av" style="background:${c.tipo==="os"?"var(--warn)":"var(--accent)"};color:var(--onSolid);width:30px;height:30px;font-size:11px;border-radius:8px">${c.tipo==="os"?"OS":"#"}</span>`}
            <span class="tx"><b>${esc(chatNome(c))}</b><span>${lm?(lm.sys?"":esc(usr(lm.autor).nome.split(" ")[0])+": ")+esc(lm.txt.slice(0,42)):esc(chatSub(c))}</span></span>
            <span class="meta"><time>${lm?tsHora(lm.ts):""}</time>${u?`<span class="ub">${u}</span>`:""}</span></div>`;}).join("");
      }).join("")}</div>
    </div>
    <div class="chatmain">
      <div class="chathead">
        <div><h3>${esc(chatNome(sel))}</h3><span class="muted" style="font-size:11.5px">${esc(chatSub(sel))}</span></div>
        ${o?`<button class="btn sm" data-act="osv" data-id="${o.id}">Abrir OS</button>`:""}
        <div class="membros">${sel.membros.slice(0,6).map(u=>av(usr(u),24)).join("")}</div>
      </div>
      <div class="chatbody" id="chatBody">${corpo||`<div class="empty">Comece a conversa.</div>`}</div>
      <div class="composer">
        <textarea id="msgTxt" rows="1" placeholder="Escreva para ${esc(chatNome(sel))}…   (Enter envia · Shift+Enter quebra linha)"></textarea>
        <button class="btn pri" data-act="enviarMsg" data-id="${sel.id}">Enviar</button>
      </div>
    </div></div>
  <p class="muted" style="font-size:11px;margin:10px 2px 0">Escreva <span class="mono">OSV-2026-0148</span> ou <span class="mono">OSC-2026-0312</span> em qualquer mensagem para criar um link direto para a ordem. Use <span class="mono">@Nome</span> para mencionar alguém.</p>`;
}

/* ================= NOTAS ================= */
function vNotas(){
  const tags=[...new Set(notasVisiveis().flatMap(n=>n.tags))];
  const f=S.notaFiltro||"";
  const lista=notasVisiveis().filter(n=>!f||n.tags.includes(f)).sort((a,b)=>(b.fixada?1:0)-(a.fixada?1:0)||(a.ts<b.ts?1:-1));
  return `<div class="sechead"><h2>Notas da operação</h2><p>Combinados com cliente, checklists de processo e lembretes — podem ficar ligadas a uma OS.</p>
    <div style="flex:1"></div>
    <div class="flex" style="gap:6px"><button class="btn sm ${!f?"pri":""}" data-act="tagFiltro" data-tag="">Todas</button>
    ${tags.map(t=>`<button class="btn sm ${f===t?"pri":""}" data-act="tagFiltro" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}
    <button class="btn pri" data-act="novaNota">+ Nova nota</button></div></div>
  <div class="notegrid">${lista.map(n=>{const a=usr(n.autor),o=n.osId?osById(n.osId):null;
    const feitos=n.checklist.filter(c=>c.ok).length;
    return `<article class="note ${n.cor||""}" data-act="abrirNota" data-id="${n.id}"><div class="bar"></div><div class="in">
      <div class="flex" style="gap:7px">${n.fixada?`<span class="pill acc">fixada</span>`:""}${n.escopo==="privada"?`<span class="pill">privada</span>`:""}
        ${o?`<span class="tag">${o.codigo||""}</span>`:""}</div>
      <h4>${esc(n.titulo)}</h4>
      ${n.txt?`<p>${esc(n.txt)}</p>`:""}
      ${n.checklist.length?`<div class="chk">${n.checklist.slice(0,5).map((c,i)=>`<div class="${c.ok?"on":""}"><i class="${c.ok?"on":""}">${c.ok?"✓":""}</i>${esc(c.t)}</div>`).join("")}
        ${n.checklist.length>5?`<div class="muted" style="font-size:11px">+${n.checklist.length-5} itens</div>`:""}</div>`:""}
    </div><footer>${av(a,22)}<span class="muted" style="font-size:11px">${esc(a.nome.split(" ")[0])} · ${tsRel(n.ts)}</span>
      ${n.checklist.length?`<span class="pill ${feitos===n.checklist.length?"ok":"warn"}" style="margin-left:auto">${feitos}/${n.checklist.length}</span>`:`<span style="margin-left:auto"></span>`}
      ${n.tags.map(t=>`<span class="tag" style="font-size:10px">${esc(t)}</span>`).join("")}</footer></article>`;}).join("")||`<div class="empty">Nenhuma nota com esse filtro.</div>`}</div>`;
}
</script>
<style>
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line2);gap:1px}
.cal .dow{background:var(--surface2);padding:7px 8px;font-family:var(--disp);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;text-align:center}
.cal .cell{background:var(--surface);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative}
.cal .cell:hover{background:var(--surface2)}
.cal .cell.out{background:var(--surface2);opacity:.55}
.cal .cell.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.cal .cell .n{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
.cal .cell.today .n{background:var(--ink);color:var(--bg);border-radius:20px;padding:0 5px;align-self:flex-start;font-weight:600}
.cal .ev{font-size:10.5px;line-height:1.3;padding:2px 5px;border-radius:4px;background:var(--surface2);border-left:2.5px solid var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.ok{border-left-color:var(--ok);background:var(--okSoft);color:var(--ok)}
.cal .ev.warn{border-left-color:var(--warn);background:var(--warnSoft);color:var(--warn)}
.cal .ev.crit{border-left-color:var(--crit);background:var(--critSoft);color:var(--crit)}
.cal .ev.acc{border-left-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.cal .more{font-size:10px;color:var(--ink3);font-family:var(--mono)}
.cal .dots{display:none}
.tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:2px}
.tabs button{background:none;border:0;padding:5px 12px;border-radius:4px;cursor:pointer;font-family:var(--disp);font-size:12px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadowUp)}
.agenda-layout>div>.between{flex-wrap:wrap;gap:8px}
@media (max-width:700px){.agenda-layout{grid-template-columns:1fr!important}.cal .cell{min-height:64px;padding:5px}.cal .ev,.cal .more{display:none}.cal .dots{display:flex;gap:3px;flex-wrap:wrap}}
</style>
<script>
/* ================= AGENDA ================= */
const DOW=["seg","ter","qua","qui","sex","sáb","dom"];
const MESN=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function mesShift(ym,n){let[a,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;a--;}while(m>12){m-=12;a++;}return a+"-"+String(m).padStart(2,"0");}
function vAgendaCal(){
  if(S.agendaTab==="ocupacao") return `${agendaHead()}${vAgenda()}`;
  const ym=S.agendaMes||HOJE.slice(0,7);
  const first=ym+"-01", fd=new Date(first+"T12:00:00");
  const offset=(fd.getDay()+6)%7;
  const ini=addDays(first,-offset);
  const dias=[...Array(42)].map((_,i)=>addDays(ini,i));
  const sel=S.agendaDia||HOJE;
  const lista=compromissosDo(sel);
  return `${agendaHead()}
  <div class="grid agenda-layout" style="grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:14px;align-items:start">
    <div>
      <div class="between" style="margin-bottom:10px">
        <div class="flex" style="gap:6px"><button class="btn sm" data-act="mes" data-n="-1">←</button>
          <h2 style="font-size:15px;min-width:150px;text-align:center">${MESN[+ym.slice(5,7)-1]} de ${ym.slice(0,4)}</h2>
          <button class="btn sm" data-act="mes" data-n="1">→</button>
          <button class="btn sm ghost" data-act="hoje">Hoje</button></div>
        <div class="flex" style="gap:5px">${["carga","descarga","montagem","evento","prazo","reuniao"].map(t=>`<span class="pill ${TIPOCOR[t]||""}"><span class="dot"></span>${TIPONOME[t]}</span>`).join("")}</div>
      </div>
      <div class="cal">
        ${DOW.map(d=>`<div class="dow">${d}</div>`).join("")}
        ${dias.map(d=>{const evs=compromissosDo(d), fora=d.slice(0,7)!==ym;
          return `<div class="cell ${fora?"out":""} ${d===HOJE?"today":""} ${d===sel?"sel":""}" data-act="dia" data-d="${d}">
            <span class="n">${+d.slice(8,10)}</span>
            ${evs.slice(0,3).map(e=>`<span class="ev ${TIPOCOR[e.tipo]||""}">${e.hora?e.hora+" ":""}${esc(e.titulo.replace(/^(Carga|Descarga|Montagem|Evento|Desmontagem) · /,""))}</span>`).join("")}
            ${evs.length>3?`<span class="more">+${evs.length-3}</span>`:""}
            ${evs.length?`<span class="dots">${evs.slice(0,6).map(e=>`<i style="width:5px;height:5px;border-radius:50%;display:inline-block;background:var(--${TIPOCOR[e.tipo]==="ok"?"ok":TIPOCOR[e.tipo]==="warn"?"warn":TIPOCOR[e.tipo]==="crit"?"crit":TIPOCOR[e.tipo]==="acc"?"accent":"ink3"})"></i>`).join("")}</span>`:""}
          </div>`;}).join("")}
      </div>
      <p class="muted" style="font-size:11px;margin:10px 2px 0">Montagem, evento e desmontagem vêm das Ordem de Serviço; carga e descarga vêm das Ordens de Carga. Reuniões, visitas técnicas e prazos são lançados aqui.</p>
    </div>
    <div class="card"><header><h3>${sel===HOJE?"Hoje":dtl(sel)}</h3><span class="hint">${lista.length} compromisso(s)</span></header>
      ${lista.length?`<div class="res" style="border:0;border-radius:0">${lista.map(c=>{
        const o=c.osId?osById(c.osId):null;
        return `<div class="row" style="align-items:flex-start;cursor:${c.fonte==="manual"?"pointer":"default"}" ${c.fonte==="manual"?`data-act="verComp" data-id="${c.id}"`:c.oscId?`data-act="osc" data-id="${c.oscId}"`:o?`data-act="osv" data-id="${o.id}"`:""}>
          <div class="n" style="flex:1"><div class="flex" style="gap:6px;margin-bottom:2px"><span class="pill ${TIPOCOR[c.tipo]||""}"><span class="dot"></span>${TIPONOME[c.tipo]}</span>
            ${c.hora?`<span class="tag">${c.hora}${c.dur?" · "+c.dur+" min":""}</span>`:""}</div>
            <b style="font-size:12.5px;display:block">${esc(c.titulo)}</b>
            ${c.local?`<small style="font-family:var(--sans);color:var(--ink3)">${esc(c.local)}</small>`:""}
            ${c.obs?`<small style="font-family:var(--sans);color:var(--ink2);display:block;margin-top:3px">${esc(c.obs)}</small>`:""}
            ${c.resp&&c.resp.length?`<div class="membros" style="margin:5px 0 0;justify-content:flex-start">${c.resp.map(u=>av(usr(u),20)).join("")}</div>`:""}
          </div></div>`;}).join("")}</div>`:`<div class="empty">Dia livre. Bom para adiantar separação.</div>`}
      <div class="pad" style="border-top:1px solid var(--line2)"><button class="btn pri" style="width:100%;justify-content:center" data-act="novoComp" data-d="${sel}">+ Novo compromisso em ${dt(sel)}</button></div>
    </div>
  </div>`;
}
function agendaHead(){
  return `<div class="between" style="margin-bottom:12px"><div class="tabs">
    <button class="${S.agendaTab!=="ocupacao"?"on":""}" data-act="agTab" data-t="cal">Calendário</button>
    <button class="${S.agendaTab==="ocupacao"?"on":""}" data-act="agTab" data-t="ocupacao">Ocupação do galpão</button></div></div>`;
}

/* ================= modais de comunicação ================= */
let tmpChk=[];
function mNota(id){
  const n=id?S.notas.find(x=>x.id===id):null;
  tmpChk = n? n.checklist.map(c=>({...c})) : [];
  const osOpts=`<option value="">Sem vínculo</option>`+S.os.map(o=>`<option value="${o.id}" ${n&&n.osId===o.id?"selected":""}>${esc(o.codigo||"")} · ${esc(o.evento)}</option>`).join("");
  modal(n?"Editar nota":"Nova nota",`
    <div class="field"><label for="ntTit">Título</label><input id="ntTit" value="${n?esc(n.titulo):""}" placeholder="Ex.: Combinados com o cliente"></div>
    <div class="field"><label for="ntTxt">Conteúdo</label><textarea id="ntTxt" rows="5" style="font-family:var(--sans)">${n?esc(n.txt):""}</textarea></div>
    <div class="row3">
      <div class="field"><label for="ntTags">Etiquetas (vírgula)</label><input id="ntTags" value="${n?esc(n.tags.join(", ")):""}" placeholder="processo, estoque"></div>
      <div class="field"><label for="ntOS">Vincular à OS</label><select id="ntOS">${osOpts}</select></div>
      <div class="field"><label for="ntCor">Destaque</label><select id="ntCor">
        ${[["","Neutro"],["acc","Informação"],["ok","Concluído"],["warn","Atenção"],["crit","Crítico"]].map(c=>`<option value="${c[0]}" ${n&&n.cor===c[0]?"selected":""}>${c[1]}</option>`).join("")}</select></div></div>
    <div class="row2">
      <label class="flex" style="gap:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ntFix" ${n&&n.fixada?"checked":""} style="width:auto"> Fixar no mural</label>
      <label class="flex" style="gap:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="ntPriv" ${n&&n.escopo==="privada"?"checked":""} style="width:auto"> Nota privada (só eu vejo)</label></div>
    <div><span class="lbl">Checklist</span>
      <div class="flex" style="gap:7px;margin:6px 0 8px"><input id="ntChk" placeholder="Nova tarefa…" style="flex:1"><button class="btn" data-act="addChk">Adicionar</button></div>
      <div class="picklist" id="chkList"></div></div>`,
    `${n?`<button class="btn" data-act="apagarNota" data-id="${n.id}" style="margin-right:auto;color:var(--crit)">Apagar</button>`:""}
     <button class="btn" data-act="fecharModal">Cancelar</button><button class="btn pri" data-act="salvarNota" data-id="${n?n.id:""}">Salvar nota</button>`);
  pintarChk();
}
function pintarChk(){
  const el=document.getElementById("chkList"); if(!el) return;
  el.innerHTML = tmpChk.length? tmpChk.map((c,i)=>`<div class="it"><input type="checkbox" ${c.ok?"checked":""} data-chk="${i}" style="width:auto">
    <span style="${c.ok?"text-decoration:line-through;color:var(--ink3)":""}">${esc(c.t)}</span>
    <button class="btn sm ghost" style="margin-left:auto" data-act="rmChk" data-ix="${i}">remover</button></div>`).join("")
    : `<div class="empty" style="padding:12px">Sem tarefas nesta nota.</div>`;
}
function mComp(id,dia){
  const c=id?S.compromissos.find(x=>x.id===id):null;
  const osOpts=`<option value="">Sem vínculo</option>`+S.os.map(o=>`<option value="${o.id}" ${c&&c.osId===o.id?"selected":""}>${esc(o.codigo||"")} · ${esc(o.evento)}</option>`).join("");
  modal(c?"Compromisso":"Novo compromisso",`
    <div class="field"><label for="cpTit">Título</label><input id="cpTit" value="${c?esc(c.titulo):""}" placeholder="Ex.: Visita técnica ao pavilhão"></div>
    <div class="row3">
      <div class="field"><label for="cpData">Data</label><input id="cpData" type="date" value="${c?c.data:(dia||HOJE)}"></div>
      <div class="field"><label for="cpHora">Hora</label><input id="cpHora" type="time" value="${c?c.hora:"09:00"}"></div>
      <div class="field"><label for="cpDur">Duração (min)</label><input id="cpDur" type="number" step="15" value="${c?c.dur:60}"></div></div>
    <div class="row2">
      <div class="field"><label for="cpTipo">Tipo</label><select id="cpTipo">${["reuniao","visita","prazo"].map(t=>`<option value="${t}" ${c&&c.tipo===t?"selected":""}>${TIPONOME[t]}</option>`).join("")}</select></div>
      <div class="field"><label for="cpOS">Vincular à OS</label><select id="cpOS">${osOpts}</select></div></div>
    <div class="field"><label for="cpLocal">Local</label><input id="cpLocal" value="${c?esc(c.local||""):""}"></div>
    <div class="field"><label for="cpObs">Observações</label><textarea id="cpObs" rows="3" style="font-family:var(--sans)">${c?esc(c.obs||""):""}</textarea></div>
    <div><span class="lbl">Participantes</span><div class="flex" style="gap:6px;margin-top:7px">
      ${USERS.map(u=>`<label class="flex" style="gap:6px;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 4px;cursor:pointer">
        <input type="checkbox" data-resp="${u.id}" ${c&&c.resp.includes(u.id)?"checked":""} style="width:auto">${av(u,20)}${esc(u.nome.split(" ")[0])}</label>`).join("")}</div></div>`,
    `${c?`<button class="btn" data-act="apagarComp" data-id="${c.id}" style="margin-right:auto;color:var(--crit)">Apagar</button>`:""}
     <button class="btn" data-act="fecharModal">Cancelar</button><button class="btn pri" data-act="salvarComp" data-id="${c?c.id:""}">Salvar</button>`);
}

/* ================= sino de notificações ================= */
function injectBell(){
  const top=document.querySelector(".top"); if(!top) return;
  let b=document.getElementById("bellBtn");
  if(!b){ b=document.createElement("button"); b.className="bell"; b.id="bellBtn"; b.setAttribute("aria-label","Avisos");
    top.insertBefore(b, document.querySelector(".roles")); }
  const n=notifsNaoLidas();
  b.dataset.act="sino";

document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]");
  if(!t){ if(!ev.target.closest(".drop")) fecharSino(); return; }
  const a=t.dataset.act, id=t.dataset.id;
  const COM=["sino","lerTudo","verNotif","abrirChat","enviarMsg","publicar","curtir","comentarFoco","abrirNota","novaNota","salvarNota","apagarNota","addChk","rmChk","tagFiltro","dia","mes","hoje","agTab","novoComp","verComp","salvarComp","apagarComp"];
  if(!COM.includes(a)){ if(a!=="sino") fecharSino(); return; }
  switch(a){
    case "sino": abrirSino(); break;
    case "lerTudo": S.notifs.forEach(n=>{if(n.para.includes(S.role)) n.lida[S.role]=true;}); save(); render(); abrirSino(); break;
    case "verNotif": {const n=S.notifs.find(x=>x.id===id); if(!n) break; n.lida[S.role]=true;

    case "enviarMsg": {const el=document.getElementById("msgTxt"); if(!el||!el.value.trim()) break;

    case "publicar": {const el=document.getElementById("muralTxt"); if(!el||!el.value.trim()) return toast("Escreva algo antes de publicar.");

    case "curtir": {const p=S.posts.find(x=>x.id===id); const i=p.likes.indexOf(me().id);
      if(i<0) p.likes.push(me().id); else p.likes.splice(i,1); save(); render(); break;}
    case "comentarFoco": {const el=document.getElementById("cmt_"+id); if(el){el.focus();el.scrollIntoView({block:"center"});} break;}

    case "addChk": {const el=document.getElementById("ntChk"); if(el&&el.value.trim()){tmpChk.push({t:el.value.trim(),ok:false});el.value="";pintarChk();} break;}
    case "rmChk": tmpChk.splice(Number(t.dataset.ix),1); pintarChk(); break;
    case "tagFiltro": S.notaFiltro=t.dataset.tag; save(); render(); break;
    case "dia": S.agendaDia=t.dataset.d; if(t.dataset.d.slice(0,7)!==S.agendaMes) S.agendaMes=t.dataset.d.slice(0,7); save(); render(); break;
    case "mes": S.agendaMes=mesShift(S.agendaMes||HOJE.slice(0,7),Number(t.dataset.n)); save(); render(); break;
    case "hoje": S.agendaMes=HOJE.slice(0,7); S.agendaDia=HOJE; save(); render(); break;
    case "agTab": S.agendaTab=t.dataset.t; save(); render(); break;
    case "novoComp": mComp(null,t.dataset.d); break;
    case "verComp": mComp(id); break;
    case "salvarComp": salvarComp(id); break;
    case "apagarComp": {S.compromissos=S.compromissos.filter(c=>c.id!==id); fecharModal(); save(); render(); toast("Compromisso removido."); break;}
  }
});
function salvarNota(id){
  const tit=document.getElementById("ntTit").value.trim(); if(!tit) return toast("Dê um título à nota.");
  const dados={titulo:tit,txt:document.getElementById("ntTxt").value,
    tags:document.getElementById("ntTags").value.split(",").map(s=>s.trim()).filter(Boolean),
    osId:document.getElementById("ntOS").value||null, cor:document.getElementById("ntCor").value,
    fixada:document.getElementById("ntFix").checked, escopo:document.getElementById("ntPriv").checked?"privada":"equipe",
    checklist:tmpChk.map(c=>({...c}))};
  if(id){ Object.assign(S.notas.find(n=>n.id===id), dados); }
  else { S.notas.unshift(Object.assign({id:uid(),autor:me().id,ts:nowTs()},dados)); }
  fecharModal(); save(); render(); toast("Nota salva.");
}
function salvarComp(id){
  const tit=document.getElementById("cpTit").value.trim(); if(!tit) return toast("Dê um título ao compromisso.");
  const resp=[...document.querySelectorAll("[data-resp]")].filter(e=>e.checked).map(e=>e.dataset.resp);
  const dados={titulo:tit,data:document.getElementById("cpData").value,hora:document.getElementById("cpHora").value,
    dur:Number(document.getElementById("cpDur").value)||0,tipo:document.getElementById("cpTipo").value,
    osId:document.getElementById("cpOS").value||null,local:document.getElementById("cpLocal").value,
    obs:document.getElementById("cpObs").value,resp};
  if(id) Object.assign(S.compromissos.find(c=>c.id===id),dados);
  else { S.compromissos.push(Object.assign({id:uid()},dados));
    avisar(me().nome.split(" ")[0]+" marcou “"+tit+"” para "+dtl(dados.data)+" às "+dados.hora+".",["gerencia","producao","estoque"],"agenda",null,"info"); }
  S.agendaDia=dados.data; S.agendaMes=dados.data.slice(0,7);
  fecharModal(); save(); render(); toast("Compromisso salvo na agenda.");
}
function rolarChat(){ const b=document.getElementById("chatBody"); if(b) b.scrollTop=b.scrollHeight; }
document.addEventListener("keydown", ev=>{
  if(ev.target.id==="msgTxt" && ev.key==="Enter" && !ev.shiftKey){ ev.preventDefault();
    const btn=document.querySelector('[data-act="enviarMsg"]'); if(btn) btn.click(); }
  if(ev.target.dataset && ev.target.dataset.cmt && ev.key==="Enter"){
    const p=S.posts.find(x=>x.id===ev.target.dataset.cmt);
    if(p && ev.target.value.trim()){ p.coments.push({id:uid(),autor:me().id,ts:nowTs(),txt:ev.target.value.trim()}); save(); render(); }
  }
  if(ev.target.id==="ntChk" && ev.key==="Enter"){ ev.preventDefault(); const b=document.querySelector('[data-act="addChk"]'); if(b) b.click(); }
});
document.addEventListener("input", ev=>{

});

<script>
/* ================= FUNIL DE PRÉ-PRODUÇÃO ================= */
const ETAPAS=[
  ["qualificacao","Qualificação","Datas, local, sala e temperatura do lead"],
  ["briefing","Briefing","Levantamento técnico feito na ligação"],
  ["vt","Visita técnica","Medição no local e fotos"],
  ["tresd","Projeto 3D","Render para aprovação do cliente"],
  ["orcamento","Orçamento","Proposta, condições e margem"],
  ["fechamento","Fechamento","Reunião dos gerentes sobre o evento inteiro"],
  ["finalizacao","Finalização","Contrato fechado · gerar a Ordem de Serviço"]
];
const etapaIx = k => ETAPAS.findIndex(e=>e[0]===k);
const CATEGORIAS=["Estrutura","Som","Luz","Vídeo","Cenografia","Internet","Extras"];
/* quem pode tocar uma OS: a produção e também a gerência, que muitas vezes
   assume a produção de um evento em vez de repassar */
const PRODUTORES = () => USERS.filter(u=>u.role==="producao" || u.role==="gerencia")
  .sort((a,b)=> (a.role==="producao"?0:1) - (b.role==="producao"?0:1));
function porCategoria(itens){
  const m={}; CATEGORIAS.forEach(c=>m[c]=[]);
  /* a linha avulsa traz a própria categoria, já que não tem item de catálogo */
  itens.forEach(i=>{ const c = i.cod ? item(i.cod).cat : (i.cat||"Extras"); (m[c]=m[c]||[]).push(i); });
  return [...CATEGORIAS, ...Object.keys(m).filter(c=>!CATEGORIAS.includes(c))]
    .map(c=>[c,m[c]||[]]).filter(x=>x[1].length);
}

function aplicarPorte(b,bloco,porte){
  b[bloco].porte=porte;
  const p=(PORTES[bloco]||{})[porte];
  if(p) Object.assign(b[bloco],p);
}
function inferirPortes(n){
  const b=n.brief;
  const perto=(bloco,dist)=>{ let best=null,bd=Infinity;
    for(const k of Object.keys(PORTES[bloco])){ const d=dist(PORTES[bloco][k]); if(d<bd){bd=d;best=k;} } return best; };
  if(!b.led.porte) b.led.porte = b.led.larg? perto("led",p=>Math.abs(p.larg*p.alt-b.led.larg*b.led.alt)) : "Backdrop padrão";
  if(!b.palco.porte) b.palco.porte = b.palco.larg? perto("palco",p=>Math.abs(p.larg*p.prof-b.palco.larg*b.palco.prof)) : "Médio · palco de palestra";
  if(!b.estrutura.porte) b.estrutura.porte = b.estrutura.vao? perto("estrutura",p=>Math.abs(p.vao-b.estrutura.vao)+(p.config===b.estrutura.config?0:6)) : "Grid suspenso";
  if(!b.luz.porte) b.luz.porte = perto("luz",p=>Math.abs(p.movings-b.luz.movings)*2+Math.abs(p.wash-b.luz.wash)+Math.abs(p.pares-b.luz.pares)/4);
  if(!b.sala.ancoragem) b.sala.ancoragem = b.sala.pontos>0?"sim":"nao";
  if(!b.transmissao) b.transmissao={tem:false,porte:"Transmissão simples",obs:""};
  if(b.transmissao.ptz===undefined) aplicarPorte(b,"transmissao",b.transmissao.porte||"Transmissão simples");
  if(!b.cenografia) b.cenografia={tem:false,porte:"Identidade simples",obs:""};
  if(b.cenografia.paineis===undefined) aplicarPorte(b,"cenografia",b.cenografia.porte||"Identidade simples");
  if(!b.internet) b.internet={tem:false,porte:"Wi-Fi para a equipe",obs:""};
  if(b.internet.aps===undefined) aplicarPorte(b,"internet",b.internet.porte||"Wi-Fi para a equipe");
}
/* ================= AMBIENTES =================
   Um evento corporativo raramente cabe numa sala só: tem a plenária e as
   salas de B.U., cada uma com a própria área, o próprio piso e o próprio
   grid. A plenária continua sendo a sala do briefing — é dela que o
   vendedor fala na ligação — e as demais entram nesta lista.
   O id fixo da plenária deixa as linhas antigas apontando para o lugar certo. */
const PLENARIA = "plenaria";
const vazioAmbiente = nome => ({id:uid(), nome:nome||"", area:0, peDireito:0,
  cargaPiso:500, pontos:0, energia:0, obs:""});

function ambientes(n){
  const b=n.brief||vazioBrief(), s=b.sala||{};
  return [{id:PLENARIA, nome:s.nome||"Plenária", area:s.area||0, peDireito:s.peDireito||0,
           cargaPiso:s.cargaPiso||500, pontos:s.pontos||0, energia:s.energia||0, obs:s.obs||"", principal:true},
          ...(b.ambientes||[])];
}
const ambiente  = (n,id) => ambientes(n).find(a=>a.id===id) || ambientes(n)[0];
const nomeAmb   = (lista,id) => (lista.find(a=>a.id===id)||lista[0]||{nome:"—"}).nome;
/* linha sem ambiente é da plenária: é o caso de quem só tem uma sala */
const ambDaLinha = l => l.amb || PLENARIA;

const vazioVT = () => ({feita:false,data:"",hora:"",quem:[],resumo:"",fotos:[],
  checklist:[{t:"Medida do pé-direito conferida",ok:false},{t:"Pontos de ancoragem localizados",ok:false},
    {t:"Quadro de energia e carga disponível",ok:false},{t:"Acesso, doca e elevador de carga",ok:false},
    {t:"Restrições de ruído e horário de montagem",ok:false}]});
/* sem responsável até alguém ser escolhido — id de demonstração aqui virava
   uuid inválido na hora de gravar */
const vazio3D = () => ({necessario:false,status:"Não solicitado",resp:null,prazo:"",revisoes:0,link:"",obs:""});
const ST3D=["Não solicitado","Em produção","Enviado ao cliente","Aprovado","Reprovado"];
const PAUTA=["Escopo fecha com o que foi vendido ao cliente",
  "Cronograma de montagem cabe na janela liberada pelo local",
  "Equipe e frota disponíveis nas datas",
  "Equipamento disponível em estoque na janela",
  "Margem aprovada pela diretoria",
  "Riscos do local tratados: acesso, energia e ancoragem",
  "Responsabilidade técnica encaminhada (ART)"];
const vazioFech = () => ({reuniao:"",hora:"",participantes:[],
  pauta:PAUTA.map(t=>({t,ok:false})),decisoes:"",aprovado:false,aprovadoPor:"",aprovadoEm:""});

function seedCRM(){ return []; }
function ensureCRM(){
  CAT.forEach(c=>{ const e=S.cat.find(x=>x.cod===c.cod); if(!e) S.cat.push({...c}); else e.cat=c.cat; });
  S.os.forEach(o=>{ if(!o.produtores) o.produtores=[]; });
  if(!S.negocios) S.negocios=[];
  S.negocios.forEach(n=>{
    if(n.etapa==="negociacao") n.etapa="orcamento";
    if(n.etapa==="ganho"||n.etapa==="proposta") n.etapa="orcamento";
    if(n.osId) n.etapa="finalizacao";
    if(!n.fech) n.fech=vazioFech();
    if(!n.produtores) n.produtores = [];
    if(!n.brief) n.brief=vazioBrief(); if(!n.vt) n.vt=vazioVT(); if(!n.tresd) n.tresd=vazio3D(); if(!n.briefNotas) n.briefNotas=[];
    if(!n.brief.ambientes) n.brief.ambientes=[];
    if(!n.brief.sala.ancoragem||!n.brief.led.porte) inferirPortes(n); });
}

/* ---- completude por etapa ---- */
function checkEtapas(n){
  const b=n.brief;
  const temBrief = b.sala.area>0 && [b.led,b.palco,b.estrutura,b.som,b.luz,b.transmissao,b.cenografia,b.internet].some(x=>x&&x.tem);
  const f=n.fech||{pauta:[],aprovado:false};
  return {
    qualificacao: !!(n.local && n.montagem && n.desmontagem && n.publico>0),
    briefing: temBrief,
    vt: !!n.vt.feita && n.vt.resumo.trim().length>30,
    tresd: !n.tresd.necessario || n.tresd.status==="Aprovado",
    orcamento: !!(n.orc && n.orc.linhas.length) && !!(n.orc && n.orc.previsao),
    fechamento: !!f.aprovado,
    finalizacao: !!n.osId
  };
}
const progresso = n => { const c=checkEtapas(n); return ETAPAS.filter(e=>c[e[0]]).length; };
/* pontos que os gerentes precisam olhar na reunião de fechamento */
function alertasFech(n){
  const out=[], b=n.brief;
  const dias=n.montagem?diffDays(HOJE,n.montagem):null;
  if(!n.vt.feita) out.push(["crit","Visita técnica não realizada — o memorial vai ser feito sobre estimativa."]);
  if(n.tresd.necessario && n.tresd.status!=="Aprovado") out.push(["warn","Projeto 3D ainda não aprovado pelo cliente ("+n.tresd.status.toLowerCase()+")."]);
  if(b.sala.ancoragem!=="sim") out.push(["warn","Sem ancoragem confirmada no salão — todo o grid vai em torre de solo e pesa no piso."]);
  if(dias!==null && dias<10) out.push(["warn","Faltam "+dias+" dias para a montagem — prazo curto para separação e credenciamento."]);
  const tt=(typeof orcTotais==="function"&&n.orc)?orcTotais(n):null;
  if(!tt || !n.orc.linhas.length) out.push(["warn","Orçamento ainda não montado — a etapa anterior precisa ser fechada."]);
  else {
    const sug=valorSugerido(n);
    if(sug>0 && tt.total < sug*0.9) out.push(["crit","Margem apertada: proposta de "+brl(tt.total)+" contra "+brl(sug)+" de locação sugerida pelo escopo."]);
    if(tt.subtotal>0 && tt.subExterno/tt.subtotal>0.4) out.push(["warn",dec(tt.subExterno/tt.subtotal*100,0)+"% do orçamento é item fora do estoque — confirmar fornecedores."]);
  }
  if(n.montagem&&n.desmontagem){
    const base=(typeof escopoDaOS==="function"&&n.orc&&n.orc.linhas.length)?escopoDaOS(n):escopoDoBriefing(n);
    const falta=base.filter(i=>disponivel(i.cod,n.montagem,n.desmontagem)<i.qtd);
    if(falta.length) out.push(["crit",falta.length+" item(ns) sem saldo na janela: "+falta.slice(0,3).map(i=>item(i.cod).nome).join(", ")+(falta.length>3?"…":"")+"."]);
  }
  if(!out.length) out.push(["ok","Nenhum ponto crítico. Evento pronto para virar Ordem de Serviço."]);
  return out;
}

/* ---- escopo calculado a partir do briefing ---- */
function escopoDoBriefing(n){
  const b=n.brief, out=[], add=(cod,q)=>{ if(q>0){ const e=out.find(x=>x.cod===cod); if(e) e.qtd+=Math.round(q); else out.push({cod,qtd:Math.round(q)}); } };
  if(b.led.tem && b.led.larg>0 && b.led.alt>0){
    const mods=Math.ceil(b.led.larg/0.5)*Math.ceil(b.led.alt/0.5);
    add("LED-P39",mods); add("PRC-600",Math.max(1,Math.ceil(mods/120)));
  }
  if(b.palco.tem && b.palco.larg>0 && b.palco.prof>0){
    const area=b.palco.larg*b.palco.prof;
    add("PRT-2X1",Math.ceil(area/2)); add("PSO-NAV",Math.ceil(area/2));
  }
  if(b.estrutura.tem && b.estrutura.vao>0){
    const mult={Grid:4,Portal:2,Torre:3}[b.estrutura.config]||2;
    const pc=Math.ceil(b.estrutura.vao/3)*mult;
    add(b.estrutura.tipo==="Q40"?"TRS-Q40":"TRS-Q30",pc);
    if(b.estrutura.config==="Grid" && b.sala.pontos>0){
      add("TAL-1T",b.sala.pontos); add("SLG-2T",b.sala.pontos*3); add("MAN-3T",b.sala.pontos*3.5);
    } else { add("TRS-SLV",4); add("BAS-P50",b.estrutura.config==="Torre"?6:4); }
  }
  if(b.som.tem){
    const p={"Fala":[0,0,1],"Música ambiente":[4,2,1],"Show":[12,8,2]}[b.som.porte]||[4,2,1];
    add("LNA-VT",p[0]); add("SUB-218",p[1]); add("CON-M32",p[2]);
  }
  if(b.transmissao&&b.transmissao.tem){ const v=b.transmissao;
    add("CAM-PTZ",v.ptz); add("CAM-4K",v.cams); add("TRI-PRO",v.cams+Math.ceil(v.ptz/2));
    add("SWT-4K",v.switcher); add("ENC-STR",v.encoder); add("MON-REF",v.monitores);
    add("INT-WL",v.intercom); add("LNK-FIB",v.fibra); }
  if(b.luz.tem){ add("MOV-B230",b.luz.movings); add("MOV-W575",b.luz.wash); add("PAR-18",b.luz.pares);
    if(b.luz.movings+b.luz.wash>0) add("MES-AVO",1); }
  if(b.cenografia&&b.cenografia.tem){ const g=b.cenografia;
    add("CEN-PNL",g.paineis); add("CEN-TST",g.testeiras); add("CEN-BKD",g.backdrops); add("CEN-TAP",g.forracao); }
  if(b.internet&&b.internet.tem){ const w=b.internet;
    add("NET-LNK",w.link); add("NET-RTR",w.roteador); add("NET-APX",w.aps); add("NET-SWT",w.switches); add("NET-CAB",w.cabo); }
  if(b.som.tem){ add("MIC-SF",{"Fala":2,"Música ambiente":4,"Show":8}[b.som.porte]||2);
    add("MON-P12",{"Fala":0,"Música ambiente":2,"Show":6}[b.som.porte]||0); }
  if(b.luz.tem && b.luz.pares>0) add("RCK-DIM",Math.max(1,Math.ceil(b.luz.pares/48)));
  const e=b.extras;
  if(e.climatizacao) add("CLM-30",Math.max(2,Math.ceil((b.sala.area||100)/60)));
  if(e.gerador) add("GER-180",Math.max(1,Math.ceil((b.sala.energia||120)/180)));
  if(e.mobiliario){
    /* evento social é todo sentado; nos demais o mobiliário atende só a área de lounge */
    const cad = n.tipoEvento==="Social" ? (n.publico||0) : Math.ceil((n.publico||0)*0.15);
    add("CAD-TIF",cad); add("MES-BIS",Math.ceil(cad/8)); add("LNG-SOF",Math.ceil((n.publico||0)/120));
  }
  if(e.tenda) add("TND-10",Math.max(1,Math.ceil((n.publico||0)/900)));
  add("EXT-RAD",Math.max(2,Math.ceil((n.publico||0)/400)));
  add("EXT-EXT",Math.max(2,Math.ceil((b.sala.area||100)/150)));
  return out;
}
const valorSugerido = (n) => { const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
  return escopoDoBriefing(n).reduce((s,i)=>s+item(i.cod).diaria*i.qtd*dias,0); };

/* ================= KANBAN ================= */
function vCRM(){
  const q=(S.crmQ||"").toLowerCase();
  const lista=S.negocios.filter(n=>!q||n.titulo.toLowerCase().includes(q)||cli(n.cliente).nome.toLowerCase().includes(q));
  const tot=lista.filter(n=>n.etapa!=="ganho").reduce((s,n)=>s+n.valor,0);
  return `<div class="between" style="margin-bottom:12px">
    <div><h2 style="font-size:15px">Pipeline de pré-produção</h2>
      <p style="margin:2px 0 0;font-size:11.5px;color:var(--ink3)">Da primeira ligação à Ordem de Serviço. Clique num negócio para abrir a ficha completa.</p></div>
    <div class="flex" style="gap:8px">
      <input id="crmQ" placeholder="Buscar negócio ou cliente…" value="${esc(S.crmQ||"")}" data-crmq="1" style="width:210px">
      ${can("ver_valores")?`<span class="pill">em aberto · ${brl(tot)}</span>`:""}
      ${can("criar_negocio")?`<button class="btn pri" data-act="novoNegocio">+ Novo negócio</button>`:""}</div></div>
  <div class="kb">${ETAPAS.map(([k,t,desc],ix)=>{
    const ns=lista.filter(n=>n.etapa===k);
    const soma=ns.reduce((s,n)=>s+n.valor,0);
    const tinta=["var(--line)","var(--line)","var(--ink3)","var(--ink3)","var(--ink2)","var(--ink2)","var(--accent)"][ix];
    return `<div class="kbcol"><div class="stripe" style="background:${tinta}"></div>
      <h4>${esc(t)}<span class="n">${ns.length}${can("ver_valores")&&soma?" · "+brl(soma):""}</span></h4>
      <div class="kbbody">${ns.map(n=>{const c=cli(n.cliente),pr=progresso(n);
        return `<div class="deal" data-act="negocio" data-id="${n.id}">
          <div class="top"><span class="temp ${n.temp}" title="Lead ${TEMPS[n.temp]}"></span>
            <span class="muted" style="font-size:10.5px;font-family:var(--mono)">${n.id}</span>
            ${n.recorrente?`<span class="rec" style="margin-left:auto" title="${n.eventosAnteriores} eventos anteriores">recorrente</span>`:""}</div>
          <div class="t">${esc(n.titulo)}</div>
          <div class="c">${esc(c.nome)}</div>
          <div class="meta">${n.montagem?`<span class="tag">${dt(n.montagem)} → ${dt(n.desmontagem)}</span>`:`<span class="tag">datas a definir</span>`}
            ${n.sala?`<span class="tag">${esc(n.sala)}</span>`:""}</div>
          <div class="f">${can("ver_valores")?`<span class="val">${brl(n.valor)}</span>`:`<span class="muted" style="font-size:11px">${esc(n.tipoEvento)}</span>`}
            ${n.osId?`<span class="pill acc" style="margin-left:auto">${((osById(n.osId)||{}).codigo||"").slice(-4)}</span>`:""}</div>
          <div class="prog" title="${pr} de 6 etapas concluídas">${ETAPAS.map((e,i)=>`<i class="${checkEtapas(n)[e[0]]?"on":""}"></i>`).join("")}</div>
        </div>`;}).join("")||`<div class="empty" style="padding:16px 10px;font-size:11.5px">${esc(desc)}</div>`}</div></div>`;
  }).join("")}</div>`;
}

<script>
/* ================= FICHA DO NEGÓCIO ================= */
const podeEditarCRM = aba => S.role==="gerencia" || (S.role==="producao" && (aba==="vt"||aba==="tresd"));
function vNegocio(){
  const n=neg(S.sel); if(!n){ S.sel=null; return vCRM(); }
  const c=cli(n.cliente), aba=S.crmAba||"qualificacao", ck=checkEtapas(n), ix=etapaIx(n.etapa);
  const abas={qualificacao:abaQual,briefing:abaBrief,vt:abaVT,tresd:aba3D,orcamento:abaNeg,fechamento:abaFech,finalizacao:abaGanho};
  /* aba desconhecida (etapa antiga, link velho) volta para a qualificação em vez de quebrar a tela */
  const body=(abas[aba]||abaQual)(n);
  const prox=ix<ETAPAS.length-1?ETAPAS[ix+1]:null;
  return `<div class="between" style="margin-bottom:12px">
    <div><button class="btn sm ghost" data-act="go" data-view="crm">← Pipeline</button>
      <h2 style="font-size:19px;margin-top:6px">${esc(n.titulo)}</h2>
      <div class="flex" style="margin-top:5px"><span class="tag">${n.codigo||""}</span><span class="muted">${esc(c.nome)}</span>
        <span class="pill"><span class="temp ${n.temp}" style="width:7px;height:7px"></span>Lead ${TEMPS[n.temp]}</span>
        ${n.recorrente?`<span class="rec">recorrente · ${n.eventosAnteriores} eventos</span>`:`<span class="pill">primeiro evento</span>`}
        <span class="pill acc">${esc(ETAPAS[ix][1])}</span>${can("ver_valores")?`<span class="tag">${brl(n.valor)}</span>`:""}</div></div>
    <div class="flex">
      ${n.osId?`<button class="btn" data-act="osv" data-id="${n.osId}">Abrir ${(osById(n.osId)||{}).codigo||""}</button>`
        :prox&&S.role==="gerencia"?`<button class="btn" data-act="avancar" data-id="${n.id}">Avançar para ${esc(prox[1])} →</button>`:""}
      ${n.etapa==="finalizacao"&&!n.osId&&can("criar_osv")?`<button class="btn pri" data-act="gerarOSVdeNegocio" data-id="${n.id}">Gerar Ordem de Serviço</button>`:""}</div></div>
  <div class="tl2">${ETAPAS.map((e,i)=>`<button class="${aba===e[0]?"on":""} ${ck[e[0]]?"done":""}" data-act="crmAba" data-a="${e[0]}" title="${esc(e[2])}">
    <span class="mk">${ck[e[0]]?"✓":i+1}</span><span class="tx">${esc(e[1])}</span></button>`).join("")}</div>
  ${body}`;
}
const fld=(l,path,v,tipo,attrs)=>`<div class="field"><label for="f_${path.replace(".","_")}">${l}</label>
  <input id="f_${path.replace(".","_")}" type="${tipo||"text"}" value="${v==null?"":esc(String(v))}" data-${path.includes(".")?"negb":"neg"}="${path}" ${attrs||""}></div>`;
const sel=(l,path,v,ops)=>`<div class="field"><label for="f_${path.replace(".","_")}">${l}</label>
  <select id="f_${path.replace(".","_")}" data-${path.includes(".")?"negb":"neg"}="${path}">${ops.map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
const sel2=(l,path,v,pares)=>`<div class="field"><label for="f_${path.replace(".","_")}">${l}</label>
  <select id="f_${path.replace(".","_")}" data-${path.includes(".")?"negb":"neg"}="${path}">${pares.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
const chk=(l,path,v)=>`<label class="flex" style="gap:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" ${v?"checked":""} data-${path.includes(".")?"negb":"neg"}="${path}" style="width:auto"> ${l}</label>`;
const ro = aba => podeEditarCRM(aba)?"":`<div class="verdict warn" style="margin-bottom:12px"><div><b>Somente leitura</b>Este perfil acompanha esta etapa, mas quem edita é a gerência.</div></div>`;

/* ---- salas além da plenária ---- */
function ambientesHTML(n,ed){
  const extras=(n.brief.ambientes||[]);
  const linha=(a,ix)=>`<div class="amb">
    <input value="${esc(a.nome)}" data-amb="${a.id}" data-f="nome" placeholder="Ex.: B.U. Vendas" ${ed?"":"disabled"} style="flex:1;min-width:120px">
    <label>área m²<input type="number" step="10" value="${a.area||0}" data-amb="${a.id}" data-f="area" ${ed?"":"disabled"}></label>
    <label>pé-direito<input type="number" step="0.5" value="${a.peDireito||0}" data-amb="${a.id}" data-f="peDireito" ${ed?"":"disabled"}></label>
    <label>piso kgf/m²<input type="number" step="50" value="${a.cargaPiso||500}" data-amb="${a.id}" data-f="cargaPiso" ${ed?"":"disabled"}></label>
    <label>pontos<input type="number" step="1" value="${a.pontos||0}" data-amb="${a.id}" data-f="pontos" ${ed?"":"disabled"}></label>
    ${ed?`<button class="btn sm ghost" data-act="rmAmbiente" data-id="${n.id}" data-a="${a.id}" title="Remover">×</button>`:""}
  </div>`;
  return `<div class="bsec"><header><h4>Outras salas do evento</h4>
      <span class="muted" style="margin-left:auto;font-size:11px">plenária, B.U., credenciamento…</span></header><div class="in">
    <p style="margin:0 0 9px;font-size:12px;color:var(--ink2);line-height:1.5">A plenária é a sala de cima. Aqui entram as salas de B.U. e o resto do evento —
      cada uma com a própria área, o próprio piso e os próprios pontos. O orçamento e a OS ficam separados por sala, e cada uma ganha o seu memorial.</p>
    ${extras.length?`<div style="display:grid;gap:7px;margin-bottom:10px">${extras.map(linha).join("")}</div>`
      :`<div class="empty" style="padding:11px;font-size:12px;margin-bottom:10px">Só a plenária por enquanto. Se o evento tiver salas de B.U., cadastre aqui.</div>`}
    ${ed?`<form class="addform" autocomplete="off" style="margin:0"><div class="rowf">
      <div class="field w"><label for="ambNome">Nova sala</label><input id="ambNome" placeholder="Ex.: B.U. Marketing"></div>
      <button class="btn go" type="submit" data-act="addAmbiente" data-id="${n.id}">Incluir sala</button>
    </div><p class="hint">Enter inclui e deixa o cursor pronto para a próxima.</p></form>`:""}
  </div></div>`;
}

/* ---- 1. Qualificação ---- */

        <span class="hint" style="margin-top:5px">Falta alguém? <a href="#" data-act="go" data-view="clientes" style="color:var(--ink2)">cadastre na carteira</a>.</span></div>
      <div class="row2">${sel("Tipo","tipoEvento",n.tipoEvento,["Corporativo","Social","Público","Híbrido"])}
        ${fld("Público estimado","publico",n.publico,"number",'step="50"')}</div>
      <div class="row2">${sel("Origem do lead","origem",n.origem,["Indicação","Cliente recorrente","Inbound","Cerimonialista","Licitação","Prospecção ativa","Agência"])}
        ${sel2("Temperatura do lead","temp",n.temp,[["quente","Quente — decide logo"],["morno","Morno — em avaliação"],["frio","Frio — sondagem"]])}</div>
      <div class="row2">${chk("Cliente recorrente","recorrente",n.recorrente)}
        ${fld("Eventos anteriores","eventosAnteriores",n.eventosAnteriores,"number")}</div>
      ${can("ver_valores")?fld("Valor estimado (R$)","valor",n.valor,"number",'step="1000"'):""}
      ${fld("Prazo de decisão do cliente","prazoDecisao",n.prazoDecisao,"date")}
    </div></div>

    <div class="card"><header><h3>Local</h3></header><div class="pad" style="display:grid;gap:11px">
      ${fld("Casa / espaço","local",n.local)}
      ${fld("Sala, pavilhão ou área","sala",n.sala,"text",'placeholder="Ex.: Pavilhão Branco"')}
      ${fld("Endereço","endereco",n.endereco)}
      ${fld("Cidade / UF","cidade",n.cidade)}
      <div class="calcout"><span>Sala e dimensões entram no <b>Briefing</b>, que alimenta o memorial de cálculo.</span></div>
    </div></div>

    <div class="card"><header><h3>Datas e horários</h3><span class="hint">definem a janela de locação</span></header>
      <div class="pad" style="display:grid;gap:11px">
      <div class="row2">${fld("Montagem","montagem",n.montagem,"date")}${fld("Início da montagem","montagemHora",n.montagemHora,"time")}</div>
      <div class="row2">${fld("Início do evento","evIni",n.evIni,"date")}${fld("Horário","evIniHora",n.evIniHora,"time")}</div>
      <div class="row2">${fld("Fim do evento","evFim",n.evFim,"date")}${fld("Horário","evFimHora",n.evFimHora,"time")}</div>
      <div class="row2">${fld("Desmontagem","desmontagem",n.desmontagem,"date")}${fld("Término previsto","desmontagemHora",n.desmontagemHora,"time")}</div>
      <div class="calcout" id="qualCalc">${qualCalc(n)}</div>
    </div></div>
  </div>`;
}
function qualCalc(n){
  if(!n.montagem||!n.desmontagem) return `<span>Preencha montagem e desmontagem para calcular a janela.</span>`;
  const d=diffDays(n.montagem,n.desmontagem);
  const ev=n.evIni&&n.evFim?diffDays(n.evIni,n.evFim)+1:0;
  const falta=diffDays(HOJE,n.montagem);
  return `<span>Janela de locação <b>${d} diária${d>1?"s":""}</b></span><span>·</span><span>Evento em <b>${ev||1} dia${ev>1?"s":""}</b></span><span>·</span>
    <span>Carga ${falta>0?`em <b>${falta} dias</b>`:falta===0?"<b>hoje</b>":`há <b>${-falta} dias</b>`}</span>`;
}

/* ---- 2. Briefing ---- */

    <header><h4>${esc(tit)}</h4><label class="sw">${ed?`<input type="checkbox" ${tem?"checked":""} data-negb="${id}.tem" data-sw="${id}" style="width:auto">`:""}${tem?"incluso":"não incluso"}</label></header>
    <div class="in">
      ${sel(pergunta,id+".porte",b[id].porte,opcoes(id))}

        <textarea id="f_${id}_obs" rows="2" style="font-family:var(--sans)" data-negb="${id}.obs" placeholder="Anote em palavras, sem se preocupar com número">${esc(b[id].obs)}</textarea></div>

        <div class="row2">${fld("Sala, salão ou área","sala.nome",b.sala.nome)}${fld("Área aproximada (m²)","sala.area",b.sala.area,"number",'step="10"')}</div>
        ${fld("Pé-direito aproximado (m)","sala.peDireito",b.sala.peDireito,"number",'step="0.5"')}
        <div class="anc">
          <div class="q"><span class="lbl">Pontos de ancoragem do salão</span>
            <b>O teto recebe carga?</b></div>
          <div class="ops">
            ${[["sim","Sim","o salão tem pontos liberados"],["nao","Não","nada pode ser suspenso"],["confirmar","A confirmar","ninguém sabe ainda"]]
              .map(o=>`<button class="ancop ${b.sala.ancoragem===o[0]?"on":""}" data-act="setAnc" data-id="${n.id}" data-v="${o[0]}" ${ed?"":"disabled"}>
                <b>${o[1]}</b><span>${o[2]}</span></button>`).join("")}
          </div>
          <p>${({sim:"O grid vai <b>suspenso</b>. A produção conta os pontos na visita técnica e faz o memorial de cálculo aéreo.",
                 nao:"Todo o grid vai em <b>torre de solo</b>. A OS já nasce com a carga do grid somada ao memorial de solo, sem içamento.",
                 confirmar:"Enquanto não se confirma, o cálculo assume <b>torre de solo</b> — o cenário mais pesado. A visita técnica resolve."})[b.sala.ancoragem]}</p>
        </div>
        <div class="field"><label for="f_sala_obs">Observações do local</label>
          <textarea id="f_sala_obs" rows="2" style="font-family:var(--sans)" data-negb="sala.obs" placeholder="Acesso difícil, restrição de horário, piso de madeira…">${esc(b.sala.obs)}</textarea></div>
      </div></div>

      ${ambientesHTML(n,ed)}

      ${bloco("led","Painel de LED","Que painel o evento pede",b.led.tem)}
      ${bloco("palco","Palco","Que palco o evento pede",b.palco.tem)}
      ${bloco("estrutura","Estrutura","Como a estrutura vai ficar",b.estrutura.tem)}
      ${bloco("som","Som","Que som o evento pede",b.som.tem)}
      ${bloco("luz","Iluminação","Que iluminação o evento pede",b.luz.tem)}
      ${bloco("transmissao","Transmissão e câmeras","Como o evento vai ser registrado",b.transmissao.tem)}
      ${bloco("cenografia","Cenografia","Que ambientação o evento pede",b.cenografia.tem)}
      ${bloco("internet","Internet","Que conectividade o evento precisa",b.internet.tem)}

      <div class="bsec"><header><h4>Complementos</h4></header><div class="in">
        <div class="row2">${chk("Climatização","extras.climatizacao",b.extras.climatizacao)}${chk("Gerador de energia","extras.gerador",b.extras.gerador)}</div>
        <div class="row2">${chk("Mobiliário e lounge","extras.mobiliario",b.extras.mobiliario)}${chk("Tenda ou cobertura","extras.tenda",b.extras.tenda)}</div>
        <div class="field"><label for="f_extras_obs">Observações</label><textarea id="f_extras_obs" rows="2" style="font-family:var(--sans)" data-negb="extras.obs">${esc(b.extras.obs)}</textarea></div>
      </div></div>
    </div>

    <div class="grid" style="gap:12px">
      <div class="card"><header><h3>Anotações da ligação</h3><span class="hint">registro com hora</span></header>
        <div class="pad" style="display:grid;gap:9px">
          ${ed?`<div class="flex" style="gap:7px"><input id="briefNota" placeholder="Anotar o que o cliente está dizendo…" style="flex:1">
            <button class="btn" data-act="addNota" data-id="${n.id}">Anotar</button></div>`:""}
          <div id="notasLista" style="display:grid;gap:8px;max-height:260px;overflow-y:auto">${notasHTML(n)}</div>
        </div></div>
      <div class="card"><header><h3>Fica para a visita técnica</h3></header><div class="pad">
        <p style="margin:0;font-size:12px;color:var(--ink2);line-height:1.55">O briefing registra a ideia central de cada bloco. Perfil de treliça, medida exata do painel, quantidade de aparelhos, carga do piso, energia e pontos de ancoragem são definidos pela produção depois da visita técnica.</p>
      </div></div>
    </div>
  </div>`;
}
function notasHTML(n){
  return n.briefNotas.length? n.briefNotas.slice().reverse().map(x=>`<div style="border-left:2px solid var(--line);padding-left:9px">
    <div class="muted mono" style="font-size:10px">${tsRel(x.ts)} · ${esc(usr(x.autor).nome.split(" ")[0])}</div>
    <div style="font-size:12.5px;line-height:1.45">${esc(x.txt)}</div></div>`).join("")
    : `<div class="empty" style="padding:12px;font-size:11.5px">Nada anotado ainda. Use este campo durante a ligação.</div>`;
}
function escopoHTML(n){
  const e=escopoDoBriefing(n);
  if(!e.length) return `<div class="empty" style="font-size:11.5px">Marque os blocos do briefing para calcular o escopo.</div>`;
  const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
  const peso=e.reduce((s,i)=>s+item(i.cod).peso*i.qtd,0);
  return `<div class="tblwrap"><table style="min-width:0"><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Disp.</th></tr></thead><tbody>
    ${e.map(i=>{const d=n.montagem&&n.desmontagem?disponivel(i.cod,n.montagem,n.desmontagem):item(i.cod).total-item(i.cod).manut;
      return `<tr><td style="font-size:12px">${esc(item(i.cod).nome)}<br><span class="tag">${i.cod}</span></td>
      <td class="r num" style="font-weight:600">${i.qtd}</td>
      <td class="r num" style="color:${d<i.qtd?"var(--crit)":"var(--ink3)"}">${d}</td></tr>`;}).join("")}
    </tbody></table></div>
    <div class="pad" style="border-top:1px solid var(--line2);display:grid;gap:5px">
      <div class="flex"><span class="muted" style="font-size:11.5px">Peso total</span><span class="num" style="margin-left:auto;font-weight:600">${kg(peso)} kgf</span></div>
      ${can("ver_valores")?`<div class="flex"><span class="muted" style="font-size:11.5px">Locação sugerida · ${dias} diárias</span>
        <span class="num" style="margin-left:auto;font-weight:600">${brl(valorSugerido(n))}</span></div>
        <button class="btn sm" data-act="usarSugerido" data-id="${n.id}">Usar como valor do negócio</button>`:""}
    </div>`;
}

/* ---- 3. Visita técnica ---- */
function abaVT(n){

            <textarea id="f_vt_resumo" rows="7" style="font-family:var(--sans)" data-negb="vt.resumo" ${ed?"":"disabled"}

      <div class="card"><header><h3>Medições do local</h3><span class="hint">substituem as estimativas do briefing</span></header>

          <div class="row2">${fld("Pé-direito medido (m)","sala.peDireito",n.brief.sala.peDireito,"number",'step="0.1"')}
            ${fld("Pontos de ancoragem","sala.pontos",n.brief.sala.pontos,"number")}</div>
          <div class="row2">${fld("Carga do piso (kgf/m²)","sala.cargaPiso",n.brief.sala.cargaPiso,"number",'step="50"')}
            ${fld("Energia disponível (kVA)","sala.energia",n.brief.sala.energia,"number",'step="10"')}</div>
          ${fld("Acesso e doca","sala.acesso",n.brief.sala.acesso,"text",'placeholder="Doca 4, nivelada"')}
          ${chk("Elevador de carga disponível","sala.elevador",n.brief.sala.elevador)}
          <div class="calcout"><span>No briefing o vendedor anotou <b>${n.brief.sala.area?dec(n.brief.sala.area,0)+" m²":"área não informada"}</b>
            e o teto ${({sim:"<b>recebendo carga</b>",nao:"<b>sem ancoragem</b>",confirmar:"<b>a confirmar</b>"})[n.brief.sala.ancoragem]}.</span></div>
        </div></div>
      <div class="card"><header><h3>Checklist de conferência</h3>

/* ---- 4. Projeto 3D ---- */
function aba3D(n){
  const t=n.tresd, ed=podeEditarCRM("tresd");
  const cor={"Aprovado":"ok","Reprovado":"crit","Enviado ao cliente":"warn","Em produção":"acc","Não solicitado":""}[t.status];
  return `${ro("tresd")}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
    <div class="card"><header><h3>Necessidade do 3D</h3></header><div class="pad" style="display:grid;gap:11px">
      ${chk("Este evento precisa de projeto 3D","tresd.necessario",t.necessario)}
      ${sel("Situação","tresd.status",t.status,ST3D)}
      <div class="row2">
        <div class="field"><label for="f_tresd_resp">Responsável</label>
          <select id="f_tresd_resp" data-negb="tresd.resp" ${ed?"":"disabled"}>
            <option value="" ${t.resp?"":"selected"}>A definir</option>
            ${USERS.map(u=>`<option value="${u.id}" ${t.resp===u.id?"selected":""}>${esc(u.nome)}</option>`).join("")}</select></div>
        ${fld("Prazo de entrega","tresd.prazo",t.prazo,"date")}</div>
      <div class="row2">${fld("Revisões solicitadas","tresd.revisoes",t.revisoes,"number")}
        ${fld("Arquivo / link do render","tresd.link",t.link,"text",'placeholder="render-evento-v1.png"')}</div>
      <div class="field"><label for="f_tresd_obs">Retorno do cliente</label>
        <textarea id="f_tresd_obs" rows="4" style="font-family:var(--sans)" data-negb="tresd.obs" ${ed?"":"disabled"}>${esc(t.obs)}</textarea></div>
    </div></div>
    <div class="card"><header><h3>Situação</h3></header><div class="pad" style="display:grid;gap:12px">
      ${!t.necessario?`<div class="verdict ok"><div><b>3D dispensado</b>O cliente aprova pelo briefing e pela visita técnica. A etapa não bloqueia o avanço para a negociação.</div></div>`
        :`<div class="verdict ${t.status==="Aprovado"?"ok":t.status==="Reprovado"?"crit":"warn"}"><div>
          <b>${esc(t.status)}</b>${t.status==="Aprovado"?"Render aprovado pelo cliente — a proposta pode ser fechada com o escopo travado."
            :t.status==="Reprovado"?"É preciso refazer o render antes de seguir para a negociação."
            :t.status==="Em produção"?"Render em elaboração com "+esc(usr(t.resp).nome)+(t.prazo?", entrega em "+dtl(t.prazo):"")+"."
            :t.status==="Enviado ao cliente"?"Aguardando retorno do cliente."+(t.revisoes?" Já houve "+t.revisoes+" revisão(ões).":"")
            :"Marque a necessidade e solicite o render ao time de produção."}</div></div>`}
      <div class="res" style="border:0">
        <div class="row"><div class="n">Responsável</div><div class="v" style="font-family:var(--sans);font-size:12.5px">${esc(usr(t.resp).nome)}</div></div>
        <div class="row"><div class="n">Prazo</div><div class="v">${t.prazo?dtl(t.prazo):"—"}</div></div>
        <div class="row"><div class="n">Revisões</div><div class="v">${t.revisoes}</div></div>
        <div class="row"><div class="n">Arquivo</div><div class="v" style="font-family:var(--mono);font-size:11.5px">${esc(t.link||"—")}</div></div>
        <div class="row hl"><div class="n"><b>Base do render</b><small>dados travados no briefing</small></div>
          <div class="v" style="font-family:var(--sans);font-size:12px;text-align:right">${n.brief.led.tem?`LED ${dec(n.brief.led.larg,1)}×${dec(n.brief.led.alt,1)} m<br>`:""}${n.brief.palco.tem?`Palco ${dec(n.brief.palco.larg,1)}×${dec(n.brief.palco.prof,1)} m<br>`:""}${n.brief.sala.area?`Sala ${dec(n.brief.sala.area,0)} m²`:""}</div></div>
      </div>
      ${ed&&t.necessario&&t.status!=="Aprovado"?`<div class="flex" style="gap:7px">
        <button class="btn sm" data-act="st3d" data-id="${n.id}" data-s="Em produção">Iniciar render</button>
        <button class="btn sm" data-act="st3d" data-id="${n.id}" data-s="Enviado ao cliente">Enviar ao cliente</button>
        <button class="btn sm pri" data-act="st3d" data-id="${n.id}" data-s="Aprovado">Marcar aprovado</button></div>`:""}
    </div></div>
  </div>`;
}
</script>
<script>
/* ---- 5. Negociação ---- */
function abaNeg(n){
  const g=n.neg, liq=g.proposta*(1-(g.desconto||0)/100), sug=valorSugerido(n);
  if(!can("ver_valores")) return `<div class="verdict warn"><div><b>Sem acesso</b>Valores e condições comerciais são visíveis apenas para a gerência.</div></div>`;
  return `${ro("negociacao")}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">
    <div class="card"><header><h3>Proposta</h3></header><div class="pad" style="display:grid;gap:11px">
      <div class="row2">${fld("Valor da proposta (R$)","neg.proposta",g.proposta,"number",'step="1000"')}
        ${fld("Desconto concedido (%)","neg.desconto",g.desconto,"number",'step="0.5"')}</div>
      <div class="field"><label for="f_neg_condicoes">Condições de pagamento</label>

      <div class="row2">${fld("Probabilidade (%)","neg.probabilidade",g.probabilidade,"number",'step="5"')}

      ${fld("Concorrentes no páreo","neg.concorrentes",g.concorrentes,"text",'placeholder="Separe por vírgula"')}
    </div></div>
    <div class="card"><header><h3>Composição</h3><span class="hint">proposta × escopo do briefing</span></header>
      <div class="res" style="border:0">
        <div class="row"><div class="n">Locação sugerida pelo briefing<small>${escopoDoBriefing(n).length} linhas de equipamento</small></div><div class="v">${brl(sug)}</div></div>
        <div class="row"><div class="n">Valor proposto</div><div class="v">${brl(g.proposta)}</div></div>
        <div class="row"><div class="n">Desconto</div><div class="v">${dec(g.desconto,1)}% <u>−${brl(g.proposta-liq)}</u></div></div>
        <div class="row hl"><div class="n"><b>Valor líquido</b></div><div class="v" style="font-size:15px">${brl(liq)}</div></div>
        <div class="row"><div class="n">Diferença sobre o sugerido</div>
          <div class="v" style="color:${liq>=sug?"var(--ok)":"var(--crit)"}">${liq>=sug?"+":""}${sug?dec((liq/sug-1)*100,1):"0,0"}%</div></div>
        <div class="row"><div class="n">Valor ponderado pela probabilidade</div><div class="v">${brl(liq*(g.probabilidade||0)/100)}</div></div>

          :`<div class="verdict ok"><div><b>Proposta coerente</b>O valor líquido cobre o escopo levantado no briefing.</div></div>`}
      </div></div>
  </div>`;
}

/* ---- 6. Fechamento · reunião dos gerentes ---- */
function abaFech(n){

  const blocos=[["Painel de LED",n.brief.led],["Palco",n.brief.palco],["Estrutura",n.brief.estrutura],
    ["Som",n.brief.som],["Iluminação",n.brief.luz],["Transmissão",n.brief.transmissao]].filter(x=>x[1]&&x[1].tem);
  return `${ed?"":`<div class="verdict warn" style="margin-bottom:12px"><div><b>Somente leitura</b>A reunião de fechamento é conduzida pela gerência.</div></div>`}
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:14px;align-items:start">
    <div class="grid" style="gap:12px">

          <div>
            <span class="lbl">Cronograma</span>
            <div class="res" style="margin-top:7px">${cron.map(c=>`<div class="row"><div class="n">${esc(c[0])}</div>

          </div>
          <div>
            <span class="lbl">Escopo vendido</span>
            <div class="flex" style="gap:6px;margin-top:7px">${blocos.length?blocos.map(x=>`<span class="pill">${esc(x[0])} · ${esc(x[1].porte)}</span>`).join(""):`<span class="muted" style="font-size:12px">Nenhum bloco marcado no briefing.</span>`}</div>

              ${n.vt.fotos.length>4?`<span class="muted" style="font-size:11px">+${n.vt.fotos.length-4}</span>`:""}</div>`:""}
          </div>

      <div class="card"><header><h3>Pauta da reunião</h3><span class="hint">${feitos}/${f.pauta.length} revisados</span></header>
        <div class="pad" style="display:grid;gap:9px">
