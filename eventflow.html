<script>
/* ================= FROTA E ESCALA =================
   A escala é por DIA, não pela janela da OS. Essa é a diferença que faz o
   resto funcionar: um truck que descarrega na quinta e sai para outro
   evento na sexta só pode estar reservado na quinta. */
const TIPOS_VEIC=["Carreta","Truck baú","VUC 3/4","Van de equipe","Munck","Utilitário de apoio"];
const FUNCOES=["Coordenação","Rigger","Montagem","Operação de som","Operação de luz","Operação de vídeo",
  "Cenografia","Motorista","Técnico de LED","Projecionista","Eletricista","Apoio"];
function seedFrota(){ return []; }
function ensureFrota(){
  if(!S.frota) S.frota=[];
  S.os.forEach(o=>{
    if(!o.logistica) o.logistica={obs:""};
    const lg=o.logistica;
    if(!lg.veicDias) lg.veicDias=[];
    if(!lg.escala)   lg.escala=[];
    /* modelo antigo: um veículo valia a janela inteira. Vira um lançamento
       por dia, que é como a frota passa a ser baixada. */
    if(lg.viagens && lg.viagens.length){
      lg.viagens.forEach(v=>{
        diasDaOS(o).forEach(d=>{
          if(lg.veicDias.some(x=>x.cod===v.cod && x.data===d.data)) return;
          lg.veicDias.push({id:uid(),cod:v.cod,data:d.data,hora:v.hora||"",motorista:v.motorista||"",obs:v.obs||""});
        });
        (v.equipe||[]).forEach(p=>{
          lg.escala.push({id:uid(),data:o.montagem,freela:null,perfil:null,
            nome:p.nome,funcao:p.funcao||"Apoio",cod:v.cod,hora:"",obs:""});
        });
      });
      delete lg.viagens;
    }
  });
}
const veic = cod => (S.frota||[]).find(v=>v.cod===cod) || {cod,nome:cod,tipo:"—",placa:"—",capKg:0,capCases:0,lugares:0};
const icVeic = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4h8v7h-8zM9.5 6.5h2.7L14.5 9v2h-5z"/><circle cx="4.4" cy="12.4" r="1.4"/><circle cx="11.4" cy="12.4" r="1.4"/></svg>`;

/* ---- os dias de um evento ---- */
function diasDaOS(o){
  const out=[]; if(!o||!o.montagem) return out;
  const fim=o.desmontagem||o.montagem;
  let d=o.montagem, guarda=0;
  while(d<=fim && guarda++<120){
    let tipo="Apoio";
    if(d===o.montagem) tipo="Montagem";
    else if(d===o.desmontagem) tipo="Desmontagem";
    else if(o.evIni && o.evFim && d>=o.evIni && d<=o.evFim) tipo="Evento";
    else if(o.evIni && d===o.evIni) tipo="Evento";
    else tipo="Trânsito";
    out.push({data:d, tipo});
    d=maisDias(d,1);
  }
  return out;
}
const veicDoDia   = (o,data) => ((o.logistica||{}).veicDias||[]).filter(v=>v.data===data);
const escalaDoDia = (o,data) => ((o.logistica||{}).escala||[]).filter(e=>e.data===data);

/* ---- disponibilidade da frota, dia a dia ---- */
/* devolve, para cada OS que usa o veículo na janela, os dias em que usa */
function frotaOcupada(cod,de,ate,excluiOs){
  const out=[];
  S.os.forEach(o=>{
    if(excluiOs && o.id===excluiOs) return;
    if(o.status==="Encerrada") return;
    const dias=((o.logistica||{}).veicDias||[]).filter(v=>v.cod===cod && v.data>=de && v.data<=ate)
      .map(v=>v.data).sort();
    if(dias.length) out.push({os:o, evento:o.evento, dias});
  });
  return out;
}
const veicLivreDia = (cod,data,excluiOs) => !veic(cod).manut && frotaOcupada(cod,data,data,excluiOs).length===0;
const veicLivre    = (cod,de,ate,excluiOs) => !veic(cod).manut && frotaOcupada(cod,de,ate,excluiOs).length===0;

/* ---- a mesma pessoa em dois eventos no mesmo dia ---- */
const chaveP = e => e.freela ? "f:"+e.freela : e.perfil ? "p:"+e.perfil : "n:"+String(e.nome||"").trim().toLowerCase();
function pessoaEmOutroEvento(chave,data,excluiOs){
  const out=[];
  S.os.forEach(o=>{
    if(excluiOs && o.id===excluiOs) return;
    if(o.status==="Encerrada") return;
    if(escalaDoDia(o,data).some(e=>chaveP(e)===chave)) out.push(o);
  });
  return out;
}

/* ---- resumo que vai na ordem de carga ----
   O veículo entra com os dias em que fica no evento, porque é por dia que a
   frota é baixada: o barracão precisa saber até quando conta com o carro. */
function resumoFrota(o){
  const por={};
  ((o.logistica||{}).veicDias||[]).forEach(v=>{ (por[v.cod]=por[v.cod]||[]).push(v.data); });
  const cods=Object.keys(por).sort((a,b)=>por[a][0]<por[b][0]?-1:1);
  if(!cods.length) return "A definir na roteirização";
  return cods.map(c=>{const d=por[c].slice().sort(), v=veic(c);
    return v.nome+" · "+v.placa+" ("+dt(d[0])+(d[d.length-1]!==d[0]?"–"+dt(d[d.length-1]):"")+")";}).join(" + ");
}
function resumoEquipe(o){
  const lista=((o.logistica||{}).escala||[]);
  if(!lista.length) return "A escalar";
  const gente=new Set(lista.map(chaveP)).size;
  const carros=new Set(((o.logistica||{}).veicDias||[]).map(v=>v.cod)).size;
  return gente+" pessoa"+(gente===1?"":"s")+" em "+carros+" veículo(s)";
}

/* ---- inventário · aba Frota ---- */
function vFrota(){
  const {de,ate}=S.per;
  const fs=S.frota||[];
  return `<p class="muted" style="font-size:12px;margin:0 2px 12px">A frota usa a mesma janela de datas do inventário: <b class="mono">${dtl(de)} → ${dtl(ate)}</b>. A baixa é por <b>dia de escala</b>, não pelo bloco inteiro da OS — por isso um veículo pode sair de um evento e entrar em outro no meio da semana.</p>
  <div class="card"><div class="tblwrap"><table><thead><tr>
    <th>Veículo</th><th>Placa</th><th>Tipo</th><th class="r">Carga (kg)</th><th class="r">Cases</th><th class="r">Lugares</th><th>Situação na janela</th><th></th></tr></thead><tbody>
  ${fs.map(v=>{const oc=frotaOcupada(v.cod,de,ate);
    const tot=oc.reduce((s,x)=>s+x.dias.length,0);
    return `<tr class="clickable" data-act="editarVeic" data-id="${v.cod}">
      <td><b style="font-weight:600">${esc(v.nome)}</b>${v.obs?`<br><span class="muted" style="font-size:11px">${esc(v.obs)}</span>`:""}</td>
      <td><span class="plate">${esc(v.placa)}</span></td>
      <td class="muted" style="font-size:12px">${esc(v.tipo)}</td>
      <td class="r num">${kg(v.capKg)}</td><td class="r num">${v.capCases}</td><td class="r num">${v.lugares}</td>
      <td>${v.manut?`<span class="pill warn"><span class="dot"></span>em manutenção</span>`
        :oc.length?`<span class="pill crit"><span class="dot"></span>${esc(oc[0].evento)}</span>
            <span class="muted" style="font-size:11px"> ${tot} dia(s)${oc.length>1?" · +"+(oc.length-1)+" evento(s)":""}</span>`
        :`<span class="pill ok"><span class="dot"></span>livre</span>`}</td>
      <td class="r">${can("editar_inventario")?`<span class="muted" style="font-size:11px">editar</span>`:""}</td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}
function formVeic(cod){
  const v=cod?veic(cod):null;
  const f=(id,l,val,tipo,attrs,cls)=>`<div class="field ${cls||""}"><label for="${id}">${l}</label><input id="${id}" type="${tipo||"text"}" value="${esc(String(val==null?"":val))}" ${attrs||""}></div>`;
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${v?"Veículo · "+esc(v.placa):"Novo veículo da frota"}</h4><div style="flex:1"></div>
      <button class="btn sm ghost" type="button" data-act="fecharVeicForm">Fechar</button></div>
    <div class="rowf">
      ${f("vfCod","Código",v?v.cod:"","text",v?"disabled":'placeholder="VEI-08"',"s")}
      ${f("vfNome","Descrição",v?v.nome:"","text",'placeholder="Ex.: Truck baú 8 t"',"w")}
      <div class="field"><label for="vfTipo">Tipo</label><select id="vfTipo">${TIPOS_VEIC.map(t=>`<option ${v&&v.tipo===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
      ${f("vfPlaca","Placa",v?v.placa:"","text",'placeholder="ABC-1D23"',"s")}
    </div>
    <div class="rowf">
      ${f("vfKg","Carga útil (kg)",v?v.capKg:0,"number",'step="100" min="0"',"s")}
      ${f("vfCases","Cases que cabem",v?v.capCases:0,"number",'step="1" min="0"',"s")}
      ${f("vfLug","Lugares",v?v.lugares:2,"number",'step="1" min="1"',"s")}
      ${f("vfObs","Observações",v?v.obs:"","text",'placeholder="Restrição de acesso, altura, manobra…"',"w")}
      <label class="flex" style="gap:7px;font-size:12px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="vfManut" ${v&&v.manut?"checked":""} style="width:auto"> Em manutenção</label>
      <button class="btn pri go" type="submit" data-act="salvarVeic" data-id="${cod||""}">${v?"Salvar veículo":"Cadastrar veículo"}</button>
    </div>
    <p class="hint">Enter salva. Veículo em manutenção não aparece como disponível para nenhuma OS.</p></form>`;
}

/* ---- produção · aba Logística ---- */
function diaAtivo(o){
  const dias=diasDaOS(o);
  if(!dias.length) return null;
  const alvo=(S.diaLog||{})[o.id];
  return dias.some(d=>d.data===alvo) ? alvo : dias[0].data;
}
function faixaDias(o){
  const at=diaAtivo(o);
  return `<div class="dias">${diasDaOS(o).map(d=>{
    const p=escalaDoDia(o,d.data).length, v=veicDoDia(o,d.data).length;
    return `<button class="dia ${d.data===at?"on":""} ${p||v?"":"vazio"}" data-act="diaLog" data-id="${o.id}" data-dia="${d.data}">
      <span class="et">${esc(d.tipo)}</span><span class="dd">${dt(d.data)}</span>
      <span class="qt">${p||v?`${p} pessoa${p===1?"":"s"} · ${v} veíc.`:"nada ainda"}</span></button>`;}).join("")}</div>`;
}
function abaLogistica(o,ed){
  ensureFreelas();
  const lg=o.logistica||{veicDias:[],escala:[],obs:""}, t=somaTecnica(o.itens);
  const dia=diaAtivo(o);
  const vd=veicDoDia(o,dia), noDia=escalaDoDia(o,dia);
  const lugares=vd.reduce((s,v)=>s+veic(v.cod).lugares,0);
  const capKg=vd.reduce((s,v)=>s+veic(v.cod).capKg,0);
  const capCs=vd.reduce((s,v)=>s+veic(v.cod).capCases,0);
  const pessoas=noDia.length;
  const usados=new Set(vd.map(v=>v.cod));
  const livres=(S.frota||[]).filter(v=>!usados.has(v.cod));
  const gente=pessoasDisponiveis();
  const outros=diasDaOS(o).filter(d=>d.data!==dia);
  const semVeic=noDia.filter(e=>!e.cod);

  const linhaPessoa=(e)=>{
    const outro=pessoaEmOutroEvento(chaveP(e),e.data,o.id);
    const f=e.freela?freela(e.freela):null;
    return `<div class="pessoa">${avNome(e.nome, f?"var(--accent2)":e.perfil?"var(--ink)":"var(--ink3)",24)}
      <span>${esc(e.nome)}${e.hora?` <span class="muted num" style="font-size:11px">${esc(e.hora)}</span>`:""}
      ${e.obs?`<br><span class="muted" style="font-size:11px">${esc(e.obs)}</span>`:""}</span>
      ${outro.length?`<span class="alerta" title="${esc(outro.map(x=>x.evento).join(" · "))}">também em ${esc(outro[0].evento)}${outro.length>1?" +"+(outro.length-1):""}</span>`:""}
      <span class="fn">${esc(e.funcao||"")}</span>
      ${ed?`<button class="btn sm ghost" data-act="rmEscala" data-id="${o.id}" data-eid="${e.id}">×</button>`:""}</div>`;
  };

  return `
  ${faixaDias(o)}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="v">${vd.length}</div><div class="k">veículos em ${dt(dia)}</div><div class="d muted">${lugares} lugares</div></div>
    <div class="kpi"><div class="v">${pessoas}</div><div class="k">pessoas no dia</div>
      <div class="d" style="color:${pessoas>lugares?"var(--crit)":"var(--ink3)"}">${pessoas>lugares?"faltam "+(pessoas-lugares)+" lugares":"cabe todo mundo"}</div></div>
    <div class="kpi"><div class="v">${t.cases}</div><div class="k">cases a transportar</div>
      <div class="d" style="color:${t.cases>capCs?"var(--crit)":"var(--ok)"}">${capCs} de capacidade no dia</div></div>
    <div class="kpi"><div class="v">${kg(t.peso)}</div><div class="k">kgf de carga</div>
      <div class="d" style="color:${t.peso>capKg?"var(--crit)":"var(--ok)"}">${kg(capKg)} kg de carga útil</div></div>
  </div>

  ${ed?`<div style="margin-bottom:14px"><form class="addform" autocomplete="off">
    <div class="top"><h4>Veículo em ${dtl(dia)}</h4><div style="flex:1"></div>
      <span class="hint">Só aparecem os livres neste dia — a reserva é diária.</span></div>
    <div class="rowf">
      <div class="field w"><label for="lgVeic">Veículo</label><select id="lgVeic">
        ${livres.map(v=>{const livre=veicLivreDia(v.cod,dia,o.id);
          return `<option value="${v.cod}" ${livre?"":"disabled"}>${esc(v.nome)} · ${esc(v.placa)} — ${v.capCases} cases, ${v.lugares} lugares${livre?"":v.manut?" (em manutenção)":" (em outro evento neste dia)"}</option>`;}).join("")||`<option value="">Todos os veículos já estão neste dia</option>`}
      </select></div>
      <div class="field"><label for="lgMot">Motorista</label><input id="lgMot" list="dlPessoas" placeholder="Quem dirige"></div>
      <div class="field s"><label for="lgHora">Saída</label><input id="lgHora" type="time" value="06:00"></div>
      <button class="btn pri go" type="submit" data-act="addVeicDia" data-id="${o.id}">Alocar no dia</button>
    </div><p class="hint">Enter aloca. Para o veículo ficar mais dias, aloque em cada dia — ou use “repetir nos outros dias”.</p></form></div>`:""}
  <datalist id="dlPessoas">${gente.map(p=>`<option value="${esc(p.nome)}">`).join("")}<option value="Equipe A · 6 montadores"><option value="Equipe B · 12 montadores"></datalist>

  ${vd.map(v=>{const vv=veic(v.cod), aBordo=noDia.filter(e=>e.cod===v.cod), excede=aBordo.length>vv.lugares;
    return `<div class="viagem"><header>
      <span class="veic" style="border:0;padding:0"><span class="ic">${icVeic}</span></span>
      <span><h4>${esc(vv.nome)}</h4><span class="muted" style="font-size:11px">${esc(vv.tipo)} · ${vv.capCases} cases · ${kg(vv.capKg)} kg · ${vv.lugares} lugares</span></span>
      <span class="plate">${esc(vv.placa)}</span>
      <div style="flex:1"></div>
      <span class="pill ${excede?"crit":""}">${aBordo.length}/${vv.lugares} a bordo</span>
      ${ed?`<button class="btn sm ghost" data-act="repetirVeic" data-id="${o.id}" data-vid="${v.id}">repetir nos outros dias</button>
           <button class="btn sm ghost" data-act="rmVeicDia" data-id="${o.id}" data-vid="${v.id}">tirar do dia</button>`:""}</header>
      <div class="pad" style="display:grid;gap:10px">
        <div class="rowf" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="flex:1;min-width:150px"><label>Motorista</label>
            <input value="${esc(v.motorista||"")}" list="dlPessoas" data-vd="${v.id}" data-f="motorista" ${ed?"":"disabled"}></div>
          <div class="field" style="flex:0 0 110px"><label>Saída</label><input type="time" value="${v.hora||""}" data-vd="${v.id}" data-f="hora" ${ed?"":"disabled"}></div>
          <div class="field" style="flex:2;min-width:180px"><label>Observação do dia</label>
            <input value="${esc(v.obs||"")}" data-vd="${v.id}" data-f="obs" placeholder="Doca, credenciamento, restrição de horário…" ${ed?"":"disabled"}></div>
        </div>
      </div>
      ${aBordo.length?`<div>${aBordo.map(linhaPessoa).join("")}</div>`
        :`<div class="empty" style="padding:14px;font-size:12px">Ninguém neste carro ainda.</div>`}
    </div>`;}).join("")||`<div class="empty" style="margin-bottom:12px">Nenhum veículo em ${dtl(dia)}.</div>`}

  ${ed?`<div style="margin-bottom:14px"><form class="addform" autocomplete="off">
    <div class="top"><h4>Escalar pessoa em ${dtl(dia)}</h4><div style="flex:1"></div>
      <span class="hint">Nome e cargo. Se já estiver em outro evento no dia, aparece o aviso na linha.</span></div>
    <div class="rowf">
      <div class="field w"><label for="lgP">Quem</label><select id="lgP">
        <option value="">— digitar um nome —</option>
        ${gente.map(p=>`<option value="${esc(p.chave)}">${esc(p.nome)}${p.sub?" · "+esc(p.sub):""}${p.veic?" · tem veículo":""}</option>`).join("")}
      </select></div>
      <div class="field"><label for="lgPn">Nome (se não for do cadastro)</label><input id="lgPn" placeholder="Equipe terceirizada, diarista…"></div>
      <div class="field"><label for="lgPf">Cargo no dia</label><select id="lgPf">${FUNCOES.map(f=>`<option>${esc(f)}</option>`).join("")}</select></div>
      <div class="field"><label for="lgPv">Vai em qual veículo</label><select id="lgPv">
        <option value="">Sem veículo / por conta própria</option>
        ${vd.map(v=>`<option value="${esc(v.cod)}">${esc(veic(v.cod).nome)} · ${esc(veic(v.cod).placa)}</option>`).join("")}
      </select></div>
      <div class="field s"><label for="lgPh">Hora</label><input id="lgPh" type="time"></div>
      <button class="btn pri go" type="submit" data-act="addEscala" data-id="${o.id}">Escalar</button>
    </div><p class="hint">Enter escala. Escolha alguém do cadastro ou digite um nome solto.</p></form></div>`:""}

  ${semVeic.length?`<div class="viagem"><header>
      <span><h4>Sem veículo</h4><span class="muted" style="font-size:11px">vai por conta própria, de carona ou já está no local</span></span>
      <div style="flex:1"></div><span class="pill">${semVeic.length} pessoa${semVeic.length===1?"":"s"}</span></header>
      <div>${semVeic.map(linhaPessoa).join("")}</div></div>`:""}

  ${ed&&noDia.length?`<div class="card" style="margin-bottom:14px"><div class="pad" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="muted" style="font-size:12px">Repetir a escala de <b>${dtl(dia)}</b> em:</span>
    ${outros.map(d=>`<button class="btn sm" data-act="copiarDia" data-id="${o.id}" data-de="${dia}" data-para="${d.data}">${dt(d.data)}</button>`).join("")}
    <button class="btn sm pri" data-act="copiarDia" data-id="${o.id}" data-de="${dia}" data-para="todos">todos os dias</button>
  </div></div>`:""}

  <div class="card"><header><h3>Observações da logística</h3></header><div class="pad">
    <textarea rows="3" style="font-family:var(--sans)" data-lgobs="1" ${ed?"":"disabled"}
      placeholder="Ordem de carregamento, o que sobe primeiro, retorno parcial, estacionamento da equipe…">${esc(lg.obs||"")}</textarea>
    <p class="muted" style="font-size:11.5px;margin:9px 0 0;line-height:1.55">A Ordem de Carga leva os veículos com os dias em que ficam no evento, e o veículo só aparece como ocupado nesses dias — nos outros ele volta para a lista de livres dos demais produtores.</p>
  </div></div>`;
}

/* ---- Logística · painel de escala entre eventos ---- */
function vEscalas(){
  ensureFrota(); ensureFreelas();
  const base=S.escalaDia||HOJE;
  const dias=[-1,0,1,2,3,4,5].map(n=>maisDias(base,n));
  const ativos=S.os.filter(o=>o.status!=="Encerrada");
  const linhas=[];
  ativos.forEach(o=>{
    const dd=diasDaOS(o).map(d=>d.data);
    if(dias.some(d=>dd.includes(d))) linhas.push(o);
  });
  const cel=(o,d)=>{
    if(!diasDaOS(o).some(x=>x.data===d)) return `<td class="muted" style="text-align:center;font-size:11px">·</td>`;
    const p=escalaDoDia(o,d), v=veicDoDia(o,d);
    if(!p.length&&!v.length) return `<td style="text-align:center"><span class="muted" style="font-size:11px">a escalar</span></td>`;
    return `<td style="font-size:11.5px;line-height:1.5">
      <b style="font-weight:600">${p.length}</b> pessoa${p.length===1?"":"s"}<br>
      ${v.map(x=>`<span class="plate" style="font-size:10px">${esc(veic(x.cod).placa)}</span>`).join(" ")||`<span class="muted">sem veículo</span>`}</td>`;
  };
  /* conflitos do período: a mesma pessoa em dois eventos no mesmo dia */
  const conflitos=[];
  dias.forEach(d=>{
    const mapa={};
    ativos.forEach(o=>escalaDoDia(o,d).forEach(e=>{
      const k=chaveP(e); (mapa[k]=mapa[k]||{nome:e.nome,os:new Set()}).os.add(o.evento); }));
    Object.values(mapa).forEach(x=>{ if(x.os.size>1) conflitos.push({data:d,nome:x.nome,onde:[...x.os]}); });
  });

  return `<div class="sechead"><h2>Escala e frota</h2>
    <p>Quem está onde e com qual veículo, dia a dia. A frota é baixada por dia: o que não está escalado aqui volta a ficar livre.</p>
    <div style="flex:1"></div>
    <div class="field s" style="margin:0"><label for="escDia">A partir de</label>
      <input id="escDia" type="date" value="${base}" data-escdia="1"></div></div>

  ${conflitos.length?`<div class="verdict crit" style="margin-bottom:14px"><div><b>${conflitos.length} choque${conflitos.length===1?"":"s"} de escala</b>
    ${conflitos.slice(0,6).map(c=>esc(c.nome)+" em "+dt(c.data)+" ("+esc(c.onde.join(" · "))+")").join("; ")}${conflitos.length>6?"…":"."}</div></div>`:""}

  ${!linhas.length?`<div class="empty">Nenhum evento nesta semana. Mude a data acima para ver outra.</div>`:`
  <div class="card"><div class="tblwrap"><table><thead><tr><th style="min-width:190px">Evento</th>
    ${dias.map(d=>`<th class="r" style="text-align:center">${dt(d)}<br><span class="muted" style="font-weight:400;font-size:10px">${["dom","seg","ter","qua","qui","sex","sáb"][new Date(d+"T12:00:00").getDay()]}</span></th>`).join("")}
  </tr></thead><tbody>
  ${linhas.map(o=>`<tr class="${podeVer("producao")?"clickable":""}" ${podeVer("producao")?`data-act="abrirLog" data-id="${o.id}"`:""}>
    <td><b style="font-weight:600">${esc(o.evento)}</b><br><span class="muted" style="font-size:11px">${esc(cli(o.cliente).nome)} · ${esc(o.local||"")}</span></td>
    ${dias.map(d=>cel(o,d)).join("")}</tr>`).join("")}
  </tbody></table></div></div>

  <div class="card" style="margin-top:14px"><header><h3>Frota na semana</h3></header><div class="tblwrap"><table><thead><tr>
    <th>Veículo</th>${dias.map(d=>`<th style="text-align:center">${dt(d)}</th>`).join("")}</tr></thead><tbody>
  ${(S.frota||[]).map(v=>`<tr><td><b style="font-weight:600">${esc(v.nome)}</b> <span class="plate">${esc(v.placa)}</span></td>
    ${dias.map(d=>{const oc=frotaOcupada(v.cod,d,d);
      return `<td style="text-align:center;font-size:11px">${v.manut?`<span class="muted">manut.</span>`
        :oc.length?`<span class="pill crit" style="font-size:10px"><span class="dot"></span>${esc(oc[0].evento.slice(0,18))}</span>`
        :`<span class="muted">livre</span>`}</td>`;}).join("")}</tr>`).join("")
    ||`<tr><td colspan="${dias.length+1}" class="muted" style="font-size:12px">Nenhum veículo cadastrado no inventário.</td></tr>`}
  </tbody></table></div></div>`}`;
}
</script>
<script>
/* ---- ações de frota e escala ---- */
function acaoFrota(a, id, t){
  t = t || {dataset:{}};
  if(!["novoVeic","editarVeic","salvarVeic","fecharVeicForm","addVeicDia","rmVeicDia","repetirVeic",
       "addEscala","rmEscala","diaLog","copiarDia","abrirLog"].includes(a)) return;
  const eu=()=>document.getElementById;
  switch(a){
    case "novoVeic": if(can("editar_inventario")){ S.veicForm=""; save(); render(); foco("vfCod"); } break;
    case "editarVeic": if(can("editar_inventario")){ S.estTab="frota"; S.veicForm=id; save(); render(); foco("vfNome"); } break;
    case "fecharVeicForm": S.veicForm=null; save(); render(); break;
    case "salvarVeic": {
      if(!can("editar_inventario")) break;
      const g=x=>document.getElementById(x).value;
      const cod=(id||g("vfCod")).trim().toUpperCase();
      if(!cod) return toast("Informe um código para o veículo.");
      if(!g("vfNome").trim()) return toast("Informe a descrição do veículo.");
      const dados={nome:g("vfNome").trim(),tipo:g("vfTipo"),placa:g("vfPlaca").trim().toUpperCase(),
        capKg:Number(g("vfKg"))||0,capCases:Number(g("vfCases"))||0,lugares:Math.max(1,Number(g("vfLug"))||1),
        obs:g("vfObs"),manut:document.getElementById("vfManut").checked};
      const ex=(S.frota||[]).find(v=>v.cod===cod);
      if(ex) Object.assign(ex,dados); else S.frota.push(Object.assign({cod},dados));
      S.veicForm=null; save(); render(); toast("Veículo "+cod+" salvo."); break;}

    case "diaLog": { S.diaLog=S.diaLog||{}; S.diaLog[id]=t.dataset.dia; save(); render(); break;}
    case "abrirLog": { S.aba="logistica"; go("producao",id); break;}

    case "addVeicDia": {
      if(!can("editar_memorial")) break;
      const o=osById(id); if(!o) break;
      const dia=diaAtivo(o);
      const cod=document.getElementById("lgVeic").value; if(!cod) return toast("Não há veículo livre neste dia.");
      if(!veicLivreDia(cod,dia,o.id)) return toast("Esse veículo já está em outro evento em "+dtl(dia)+".");
      o.logistica.veicDias.push({id:uid(),cod,data:dia,
        motorista:document.getElementById("lgMot").value.trim(),
        hora:document.getElementById("lgHora").value, obs:""});
      save(); render(); foco("lgVeic"); toast(veic(cod).nome+" alocado em "+dtl(dia)+"."); break;}

    case "rmVeicDia": {
      if(!can("editar_memorial")) break;
      const o=osById(id), vid=t.dataset.vid;
      const v=o.logistica.veicDias.find(x=>x.id===vid); if(!v) break;
      /* quem estava naquele carro naquele dia fica sem veículo, não some */
      o.logistica.escala.forEach(e=>{ if(e.data===v.data && e.cod===v.cod) e.cod=null; });
      o.logistica.veicDias=o.logistica.veicDias.filter(x=>x.id!==vid);
      save(); render(); break;}

    case "repetirVeic": {
      if(!can("editar_memorial")) break;
      const o=osById(id), v=o.logistica.veicDias.find(x=>x.id===t.dataset.vid); if(!v) break;
      let n=0, bloq=[];
      diasDaOS(o).forEach(d=>{
        if(d.data===v.data) return;
        if(o.logistica.veicDias.some(x=>x.cod===v.cod && x.data===d.data)) return;
        if(!veicLivreDia(v.cod,d.data,o.id)){ bloq.push(dt(d.data)); return; }
        o.logistica.veicDias.push({id:uid(),cod:v.cod,data:d.data,hora:v.hora,motorista:v.motorista,obs:v.obs}); n++;
      });
      save(); render();
      toast(n?veic(v.cod).nome+" em +"+n+" dia(s)"+(bloq.length?" · ocupado em "+bloq.join(", "):"."):"Nenhum dia livre para repetir."); break;}

    case "addEscala": {
      if(!can("editar_memorial")) break;
      const o=osById(id); if(!o) break;
      const dia=diaAtivo(o);
      const chave=document.getElementById("lgP").value;
      const digitado=document.getElementById("lgPn").value.trim();
      let nome=digitado, fl=null, pf=null;
      if(chave){
        const p=pessoasDisponiveis().find(x=>x.chave===chave);
        if(p){ nome=p.nome; if(chave.startsWith("f:")) fl=chave.slice(2); else pf=chave.slice(2); }
      }
      if(!nome) return toast("Escolha alguém do cadastro ou digite um nome.");
      const cod=document.getElementById("lgPv").value||null;
      const e={id:uid(),data:dia,freela:fl,perfil:pf,nome,
        funcao:document.getElementById("lgPf").value,cod,
        hora:document.getElementById("lgPh").value||"",obs:""};
      if(o.logistica.escala.some(x=>x.data===dia && chaveP(x)===chaveP(e)))
        return toast(nome+" já está escalado em "+dtl(dia)+".");
      o.logistica.escala.push(e);
      const outro=pessoaEmOutroEvento(chaveP(e),dia,o.id);
      save(); render(); foco("lgP");
      toast(outro.length ? nome+" escalado — atenção: também está em "+outro[0].evento+" neste dia."
                         : nome+" escalado em "+dtl(dia)+"."); break;}

    case "rmEscala": {
      if(!can("editar_memorial")) break;
      const o=osById(id);
      o.logistica.escala=o.logistica.escala.filter(x=>x.id!==t.dataset.eid);
      save(); render(); break;}

    case "copiarDia": {
      if(!can("editar_memorial")) break;
      const o=osById(id), de=t.dataset.de, para=t.dataset.para;
      const alvos = para==="todos" ? diasDaOS(o).map(d=>d.data).filter(d=>d!==de) : [para];
      let n=0;
      alvos.forEach(d=>{
        escalaDoDia(o,de).forEach(e=>{
          if(o.logistica.escala.some(x=>x.data===d && chaveP(x)===chaveP(e))) return;
          /* o veículo só vai junto se ele também estiver naquele dia */
          const temVeic=e.cod && o.logistica.veicDias.some(v=>v.cod===e.cod && v.data===d);
          o.logistica.escala.push({id:uid(),data:d,freela:e.freela,perfil:e.perfil,nome:e.nome,
            funcao:e.funcao,cod:temVeic?e.cod:null,hora:e.hora,obs:e.obs});
          n++;
        });
      });
      save(); render(); toast(n?n+" escalação copiada(s).":"Nada a copiar — os dias já têm essa gente."); break;}
  }
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  acaoFrota(t.dataset.act, t.dataset.id, t);
});
document.addEventListener("input", ev=>{
  const el=ev.target;
  if(el.dataset && el.dataset.escdia!==undefined){ S.escalaDia=el.value; save(); render(); return; }
  if(!can("editar_memorial")) return;
  const o=osById(S.sel); if(!o||!o.logistica) return;
  if(el.dataset && el.dataset.vd!==undefined){
    const v=(o.logistica.veicDias||[]).find(x=>x.id===el.dataset.vd); if(v){ v[el.dataset.f]=el.value; save(); } }
  if(el.dataset && el.dataset.lgobs!==undefined){ o.logistica.obs=el.value; save(); }
});
Object.assign(window.VEXTRA||(window.VEXTRA={}),{escalas:vEscalas});
</script>

<script>
/* ================= REEMBOLSOS =================
   Quem tirou do próprio bolso manda a nota com foto. Quatro coisas que o
   financeiro sempre pergunta ficam em campo separado: quem pagou, quanto,
   como pagou e para quem volta o dinheiro — nem sempre é a mesma pessoa. */
const CAT_GASTO = ["Alimentação","Combustível","Pedágio","Estacionamento","Hospedagem",
  "Transporte / app","Material de montagem","Frete","Diária de equipe","Outros"];
const FORMAS_PG = ["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Vale","Boleto"];
const ST_REEMB  = ["Enviado","Aprovado","Pago","Recusado"];
const ST_COR    = {Enviado:"warn", Aprovado:"acc", Pago:"ok", Recusado:"crit"};
let lerNota = () => toast("Anexo indisponível sem conexão com o banco.");

const reembById = id => (S.reembolsos||[]).find(r=>r.id===id);
/* a pessoa de um lado ou do outro da nota: cadastro, gente da casa ou nome solto */
function nomeDe(ref){
  if(!ref) return "";
  if(ref.freela) return freelaNome(ref.freela) || ref.nome || "";
  if(ref.perfil) return (usr(ref.perfil)||{}).nome || ref.nome || "";
  return ref.nome || "";
}
function dadosPagamento(ref){
  if(ref && ref.freela){ const f=freela(ref.freela); if(f && can("ver_valores")){
    if(f.pix) return "Pix "+f.pix;
    if(f.banco) return f.banco+" "+(f.agencia||"")+" / "+(f.conta||"");
  } }
  return "";
}

function formReemb(id){
  ensureFreelas();
  const r=id?reembById(id):null;
  const gente=pessoasDisponiveis();
  const abertas=S.os.filter(o=>o.status!=="Encerrada");
  const c=(cid,l,val,tipo,attrs,cls)=>`<div class="field ${cls||""}"><label for="${cid}">${l}</label><input id="${cid}" type="${tipo||"text"}" value="${esc(String(val==null?"":val))}" ${attrs||""}></div>`;
  const selPessoa=(cid,l,ref)=>{
    const atual = ref&&ref.freela ? "f:"+ref.freela : ref&&ref.perfil ? "p:"+ref.perfil : "";
    return `<div class="field"><label for="${cid}">${l}</label><select id="${cid}">
      <option value="">— digitar um nome —</option>
      ${gente.map(p=>`<option value="${esc(p.chave)}" ${p.chave===atual?"selected":""}>${esc(p.nome)}${p.sub?" · "+esc(p.sub):""}</option>`).join("")}
    </select></div>`;
  };
  return `<form class="addform" autocomplete="off">
    <div class="top"><h4>${r?"Nota · "+esc(r.descricao):"Nova nota de reembolso"}</h4><div style="flex:1"></div>
      <button class="btn sm ghost" type="button" data-act="fecharReemb">Fechar</button></div>
    <div class="rowf">
      <div class="field w"><label for="rbOs">Evento</label><select id="rbOs">
        ${abertas.map(o=>`<option value="${o.id}" ${r&&r.osId===o.id?"selected":""}>${esc(o.evento)} · ${esc(cli(o.cliente).nome)}</option>`).join("")
          ||`<option value="">Nenhum evento aberto</option>`}</select></div>
      ${c("rbData","Data do gasto",r?r.data:HOJE,"date","","s")}
      ${c("rbDesc","O que foi",r?r.descricao:"","text",'placeholder="Almoço da equipe, diesel do truck…"',"w")}
      <div class="field"><label for="rbCat">Categoria</label><select id="rbCat">${CAT_GASTO.map(x=>`<option ${r&&r.categoria===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
      ${c("rbValor","Valor (R$)",r?r.valor:"","number",'step="0.01" min="0" placeholder="0,00"',"s")}
    </div>
    <div class="rowf" style="border-top:1px solid var(--line);padding-top:10px">
      ${selPessoa("rbQuem","Quem pagou",r?r.pagoPor:{perfil:S.perfilId})}
      ${c("rbQuemN","Nome (se não for do cadastro)",r&&r.pagoPor&&!r.pagoPor.freela&&!r.pagoPor.perfil?r.pagoPor.nome:"","text","","")}
      <div class="field"><label for="rbForma">Como pagou</label><select id="rbForma">${FORMAS_PG.map(x=>`<option ${r&&r.forma===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
      ${selPessoa("rbPara","Reembolsar para",r?r.para:{perfil:S.perfilId})}
      ${c("rbParaN","Nome (se não for do cadastro)",r&&r.para&&!r.para.freela&&!r.para.perfil?r.para.nome:"","text","","")}
    </div>
    <div class="rowf">
      ${c("rbObs","Observação",r?r.obs:"","text",'placeholder="Nota fiscal nº, quem autorizou, rateio…"',"w")}
      <button class="btn pri go" type="submit" data-act="salvarReemb" data-id="${id||""}">${r?"Salvar nota":"Enviar nota"}</button>
    </div>
    <p class="hint">Enter envia. Depois de salva, anexe a foto do comprovante pelo botão da própria nota.</p></form>`;
}

function vReembolsos(){
  ensureFreelas();
  const pode=can("lancar_reembolso"), chefe=can("aprovar_reembolso");
  const fOs=S.rbOs||"", fSt=S.rbSt||"";
  const todas=(S.reembolsos||[]).slice().sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const lista=todas.filter(r=>(!fOs||r.osId===fOs)&&(!fSt||r.status===fSt));
  const soma=st=>lista.filter(r=>!st||r.status===st).reduce((s,r)=>s+(Number(r.valor)||0),0);
  const usadas=[...new Set(todas.map(r=>r.osId))].map(osById).filter(Boolean);

  return `<div class="sechead"><h2>Reembolsos</h2>
    <p>Nota de gasto por evento, com o comprovante anexado. ${chefe?"A gerência aprova e marca como paga.":"A gerência aprova; você acompanha o andamento aqui."}</p>
    <div style="flex:1"></div>
    ${pode?`<button class="btn ${S.reembForm===undefined||S.reembForm===null?"pri":""}" data-act="${S.reembForm===undefined||S.reembForm===null?"novoReemb":"fecharReemb"}">${S.reembForm===undefined||S.reembForm===null?"+ Nova nota":"Fechar formulário"}</button>`:""}</div>

  ${pode&&S.reembForm!==undefined&&S.reembForm!==null?`<div style="margin-bottom:14px">${formReemb(S.reembForm||null)}</div>`:""}

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px">
    <div class="kpi"><div class="v">${brl(soma("Enviado"))}</div><div class="k">aguardando aprovação</div></div>
    <div class="kpi"><div class="v">${brl(soma("Aprovado"))}</div><div class="k">aprovado, a pagar</div></div>
    <div class="kpi"><div class="v">${brl(soma("Pago"))}</div><div class="k">já reembolsado</div></div>
    <div class="kpi"><div class="v">${lista.length}</div><div class="k">notas no filtro</div><div class="d muted">${brl(soma(""))} no total</div></div>
  </div>

  <div class="card" style="margin-bottom:14px"><div class="pad" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
    <div class="field" style="margin:0"><label for="rbfOs">Evento</label><select id="rbfOs" data-rbf="os">
      <option value="">Todos</option>
      ${usadas.map(o=>`<option value="${o.id}" ${fOs===o.id?"selected":""}>${esc(o.evento)}</option>`).join("")}</select></div>
    <div class="field s" style="margin:0"><label for="rbfSt">Status</label><select id="rbfSt" data-rbf="st">
      <option value="">Todos</option>
      ${ST_REEMB.map(s=>`<option ${fSt===s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
  </div></div>

  ${!lista.length?`<div class="empty">${todas.length?"Nenhuma nota neste filtro.":"Nenhuma nota lançada ainda."+(pode?" Mande a primeira pelo botão acima.":"")}</div>`
  :lista.map(r=>{
    const o=osById(r.osId), meu=r.criadoPor===S.perfilId;
    const editavel = chefe || (meu && r.status==="Enviado");
    const pg=dadosPagamento(r.para);
    return `<div class="nota">
      <div class="thumb" ${r.src?`data-act="verNota" data-id="${r.id}"`:""}>
        ${r.src?`<img src="${esc(r.src)}" alt="comprovante">`
        :`<svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.5 3.5h11v9h-11z"/><path d="M2.5 10l3-3 2.5 2.5L11 6l2.5 2.5"/><circle cx="6" cy="6" r="1"/></svg>`}
      </div>
      <div class="corpo">
        <div class="tit"><b>${esc(r.descricao)}</b>
          <span class="tag">${esc(r.categoria)}</span>
          <span class="pill ${ST_COR[r.status]||""}"><span class="dot"></span>${esc(r.status)}</span>
          <div style="flex:1"></div>
          <b class="num" style="font-size:14px">${brl(r.valor)}</b></div>
        <div class="meta">
          <span><u>Evento</u>${o?esc(o.evento):"—"}</span>
          <span><u>Data</u><span class="num">${dtl(r.data)}</span></span>
          <span><u>Quem pagou</u>${esc(nomeDe(r.pagoPor))||"—"}</span>
          <span><u>Como</u>${esc(r.forma||"—")}</span>
          <span><u>Reembolsar para</u>${esc(nomeDe(r.para))||"—"}${pg?`<br><span class="muted num" style="font-size:10.5px">${esc(pg)}</span>`:""}</span>
        </div>
        ${r.obs?`<span class="muted" style="font-size:11.5px">${esc(r.obs)}</span>`:""}
        <div class="acoes">
          ${editavel?`<label class="btn sm">${r.src?"Trocar comprovante":"Anexar comprovante"}
            <input type="file" accept="image/*" data-nota="${r.id}" style="display:none"></label>`:""}
          ${editavel?`<button class="btn sm ghost" data-act="editarReemb" data-id="${r.id}">editar</button>`:""}
          ${chefe&&r.status==="Enviado"?`<button class="btn sm" data-act="stReemb" data-id="${r.id}" data-st="Aprovado">aprovar</button>
            <button class="btn sm ghost" data-act="stReemb" data-id="${r.id}" data-st="Recusado">recusar</button>`:""}
          ${chefe&&r.status==="Aprovado"?`<button class="btn sm pri" data-act="stReemb" data-id="${r.id}" data-st="Pago">marcar como paga</button>`:""}
          ${chefe&&r.status==="Recusado"?`<button class="btn sm ghost" data-act="stReemb" data-id="${r.id}" data-st="Enviado">reabrir</button>`:""}
          ${editavel?`<button class="btn sm ghost" data-act="rmReemb" data-id="${r.id}">excluir</button>`:""}
        </div>
      </div></div>`;}).join("")}
  ${S.notaZoom?`<div class="lupa" data-act="fecharNota"><img src="${esc((reembById(S.notaZoom)||{}).src||"")}" alt="comprovante"></div>`:""}`;
}
</script>
<script>
/* ---- ações de reembolso ---- */
function refPessoa(selId,txtId){
  const sel=document.getElementById(selId), txt=document.getElementById(txtId);
  const chave=sel?sel.value:"";
  if(chave){
    const p=pessoasDisponiveis().find(x=>x.chave===chave);
    if(p) return chave.startsWith("f:") ? {freela:chave.slice(2),perfil:null,nome:p.nome}
                                        : {freela:null,perfil:chave.slice(2),nome:p.nome};
  }
  return {freela:null,perfil:null,nome:(txt?txt.value:"").trim()};
}
function acaoReemb(a,id,t){
  if(!["novoReemb","editarReemb","fecharReemb","salvarReemb","rmReemb","stReemb","verNota","fecharNota"].includes(a)) return;
  switch(a){
    case "novoReemb": if(can("lancar_reembolso")){ S.reembForm=""; save(); render(); foco("rbDesc"); } break;
    case "editarReemb": S.reembForm=id; save(); render(); foco("rbDesc"); break;
    case "fecharReemb": S.reembForm=null; save(); render(); break;
    case "verNota": S.notaZoom=id; render(); break;
    case "fecharNota": S.notaZoom=null; render(); break;
    case "salvarReemb": {
      if(!can("lancar_reembolso")) break;
      const g=x=>{const el=document.getElementById(x); return el?el.value:"";};
      const desc=g("rbDesc").trim();
      if(!desc) return toast("Diga o que foi o gasto.");
      const osId=g("rbOs"); if(!osId) return toast("Escolha o evento da nota.");
      const valor=Number(g("rbValor"))||0;
      if(valor<=0) return toast("Informe o valor da nota.");
      const dados={osId, data:g("rbData")||HOJE, descricao:desc, categoria:g("rbCat"),
        valor, forma:g("rbForma"), obs:g("rbObs").trim(),
        pagoPor:refPessoa("rbQuem","rbQuemN"), para:refPessoa("rbPara","rbParaN")};
      const ex=reembById(id);
      if(ex){ if(!(can("aprovar_reembolso")||(ex.criadoPor===S.perfilId&&ex.status==="Enviado")))
                return toast("Esta nota já foi analisada; só a gerência altera.");
              Object.assign(ex,dados); }
      else S.reembolsos.push(Object.assign({id:uid(),status:"Enviado",criadoPor:S.perfilId,
             path:null,src:null},dados));
      S.reembForm=null; save(); render();
      toast(ex?"Nota atualizada.":"Nota enviada para aprovação."); break;}
    case "rmReemb": {
      const r=reembById(id); if(!r) break;
      if(!(can("aprovar_reembolso")||(r.criadoPor===S.perfilId&&r.status==="Enviado")))
        return toast("Só a gerência exclui uma nota já analisada.");
      S.reembolsos=S.reembolsos.filter(x=>x.id!==id); S.reembForm=null; save(); render();
      toast("Nota excluída."); break;}
    case "stReemb": {
      if(!can("aprovar_reembolso")) return toast("Só a gerência muda o status de uma nota.");
      const r=reembById(id); if(!r) break;
      r.status=t.dataset.st; save(); render();
      toast("Nota "+r.status.toLowerCase()+"."); break;}
  }
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  acaoReemb(t.dataset.act, t.dataset.id, t);
});
document.addEventListener("change", ev=>{
  const el=ev.target;
  if(el.dataset && el.dataset.nota && el.files && el.files.length) lerNota(el.dataset.nota, el.files);
  if(el.dataset && el.dataset.rbf==="os"){ S.rbOs=el.value; save(); render(); }
  if(el.dataset && el.dataset.rbf==="st"){ S.rbSt=el.value; save(); render(); }
});
Object.assign(window.VEXTRA||(window.VEXTRA={}),{reembolsos:vReembolsos});
</script>

<script>
/* ================= IMPRESSÃO =================
   O orçamento e a ordem de carga saem em papel A4 branco. A tela é escura
   e cheia de controle; o papel é o contrário — só o que a pessoa do outro
   lado precisa ler, com espaço para assinar. */

/* Editável: é o que aparece no cabeçalho do documento impresso. */
const EMPRESA = {
  nome:   "EventFlow",
  linha1: "Locação de equipamentos para eventos",
  linha2: ""     /* CNPJ · endereço · telefone · e-mail */
};

const pEsc = s => esc(s==null?"":String(s));
const pCampo = (l,v,larga,sufixo) => `<div class="c ${larga?"larga":""}"><span class="lbl">${pEsc(l)}</span>
  <b>${pEsc(v||"—")}${sufixo?`<span class="hr">${pEsc(sufixo)}</span>`:""}</b></div>`;
const pTopo = (titulo,codigo,extra) => `<div class="topo">
  <div class="marca"><b>${pEsc(EMPRESA.nome)}</b>
    <span>${pEsc(EMPRESA.linha1)}${EMPRESA.linha2?"<br>"+pEsc(EMPRESA.linha2):""}</span></div>
  <div class="doc"><b>${pEsc(titulo)}</b><span>${pEsc(codigo)}</span>
    <small>emitido em ${dtl(HOJE)}${extra?" · "+pEsc(extra):""}</small></div>
</div>`;
const pPeriodo = (a,b) => a===b ? dtl(a) : dtl(a)+" a "+dtl(b);

/* ---------- orçamento ---------- */
function folhaOrcamento(n){
  const c=cli(n.cliente), t=orcTotais(n), ambs=ambientes(n);
  const dias=Math.max(1,diffDays(n.montagem||HOJE,n.desmontagem||HOJE));
  const porAmb=ambs.map(a=>[a,n.orc.linhas.filter(l=>ambDaLinha(l)===a.id)]).filter(x=>x[1].length);
  const soltas=n.orc.linhas.filter(l=>!ambs.some(a=>a.id===ambDaLinha(l)));
  if(soltas.length) porAmb.push([{id:PLENARIA,nome:ambs[0].nome},soltas]);
  const valorDe=l=>(Number(l.qtd)||0)*(l.modo==="diaria"?(Number(l.dias)||1):1)*(Number(l.unit)||0);

  const corpo = porAmb.map(([amb,ls])=>{
    const totAmb=ls.reduce((s,l)=>s+valorDe(l),0);
    /* a categoria que não está na lista padrão entra no fim, em vez de sumir do papel */
    const ordem=[...new Set([...CATORC, ...ls.map(l=>l.cat)])];
    const cats=ordem.map(cc=>[cc,ls.filter(l=>l.cat===cc)]).filter(x=>x[1].length);
    return (ambs.length>1?`<tr class="grupo"><td colspan="5">${pEsc(amb.nome)}</td><td class="r n">${brl(totAmb)}</td></tr>`:"")
      + cats.map(([cc,lls])=>`<tr class="sub"><td colspan="6">${pEsc(cc)}</td></tr>`
        + lls.map(l=>`<tr>
            <td>${pEsc(l.nome)}${l.cod?`<span class="cod">${pEsc(l.cod)}</span>`:""}
              ${l.obs?`<span class="obs">${pEsc(l.obs)}</span>`:""}</td>
            <td class="r n">${dec(l.qtd,0)}</td>
            <td class="r n">${l.modo==="diaria"?dec(l.dias||1,0):"—"}</td>
            <td class="r n">${brl(l.unit)}</td>
            <td class="r n">${l.modo==="diaria"?"diária":"fechado"}</td>
            <td class="r n">${brl(valorDe(l))}</td></tr>`).join("")).join("");
  }).join("");

  return `<div class="folha">
    ${pTopo("Proposta comercial", n.codigo||"", "válida "+(n.orc.validade?"até "+dtl(n.orc.validade):"por 15 dias"))}
    <h2>${pEsc(n.titulo)}</h2>
    <p class="sub">${pEsc(c.nome)}${c.contato?" · a/c "+pEsc(c.contato):""}</p>

    <div class="campos">
      ${pCampo("Local", (n.local||"—")+(n.sala?" · "+n.sala:""), true)}
      ${pCampo("Cidade", n.cidade)}
      ${pCampo("Público", n.publico?n.publico.toLocaleString("pt-BR")+" pessoas":"—")}
      ${pCampo("Montagem", n.montagem?dtl(n.montagem):"—", false, n.montagemHora?"a partir das "+n.montagemHora:"")}
      ${pCampo("Realização", n.evIni?pPeriodo(n.evIni,n.evFim||n.evIni):"—", true, n.evIniHora?"a partir das "+n.evIniHora:"")}
      ${pCampo("Desmontagem", n.desmontagem?dtl(n.desmontagem):"—", false, n.desmontagemHora?"a partir das "+n.desmontagemHora:"")}
      ${pCampo("Período de locação", dias+" diária"+(dias>1?"s":""))}
      ${ambs.length>1?pCampo("Ambientes", ambs.map(a=>a.nome).join(" · "), true):""}
      ${pCampo("Contato", [c.tel,c.email].filter(Boolean).join(" · "), true)}
    </div>

    <table><thead><tr>
      <th>Item</th><th class="r">Qtd</th><th class="r">Diárias</th>
      <th class="r">Valor unit.</th><th class="r">Cobrança</th><th class="r">Subtotal</th>
    </tr></thead><tbody>${corpo||`<tr><td colspan="6">Sem itens lançados.</td></tr>`}</tbody></table>

    <div class="totais">
      <div class="l"><span>Equipamento de locação</span><b>${brl(t.subEstoque)}</b></div>
      ${t.subExterno?`<div class="l"><span>Serviços e sublocação</span><b>${brl(t.subExterno)}</b></div>`:""}
      <div class="l"><span>Subtotal</span><b>${brl(t.subtotal)}</b></div>
      ${t.descV?`<div class="l"><span>Desconto de ${dec(n.orc.desconto,1)}%</span><b>− ${brl(t.descV)}</b></div>`:""}
      <div class="l big"><span>Valor total</span><b>${brl(t.total)}</b></div>
    </div>

    ${n.orc.condicoes?`<div class="nota"><span class="lbl">Condições de pagamento</span>${pEsc(n.orc.condicoes)}</div>`:""}
    ${n.orc.obsGeral?`<div class="nota"><span class="lbl">Observações</span>${pEsc(n.orc.obsGeral)}</div>`:""}

    <div class="assina">
      <div class="a"><b>${pEsc(EMPRESA.nome)}</b>Responsável comercial</div>
      <div class="a"><b>${pEsc(c.nome)}</b>De acordo · data ___/___/______</div>
    </div>

    <div class="rodape">Os valores acima cobrem locação, montagem, operação e desmontagem no período indicado.
      Alterações de escopo, prorrogação de diárias ou mudança de local podem alterar o valor.
      Esta proposta não reserva o equipamento — a reserva se dá com o aceite formal.</div>
  </div>`;
}

/* ---------- ordem de carga ---------- */
function folhaCarga(c){
  const o=c.osId?osById(c.osId):null;
  const cl=o?cli(o.cliente):{nome:"—"};
  const t=somaTecnica(c.itens);
  const comCod=c.itens.filter(i=>i.cod), avulsos=c.itens.filter(i=>!i.cod);
  const porCat={}; comCod.forEach(i=>{ const k=item(i.cod).cat||"Outros"; (porCat[k]=porCat[k]||[]).push(i); });
  const cats=[...CATEGORIAS,...Object.keys(porCat).filter(k=>!CATEGORIAS.includes(k))]
    .map(k=>[k,porCat[k]||[]]).filter(x=>x[1].length);

  const linha=i=>{ const it=item(i.cod);
    return `<tr><td class="box"><i></i></td>
      <td>${pEsc(it.nome)}<span class="cod">${pEsc(i.cod)}</span>
        ${i.obs?`<span class="obs">${pEsc(i.obs)}</span>`:""}</td>
      <td class="r n" style="font-weight:600">${i.qtd}</td>
      <td class="r n">${cases(i.cod,i.qtd)}</td>
      <td class="r n">${kg(it.peso*i.qtd)}</td>
      <td class="box"><i></i></td></tr>`; };

  return `<div class="folha">
    ${pTopo("Ordem de carga", c.codigo||"", c.status)}
    <h2>${pEsc(o?o.evento:(c.evento||"Carga avulsa"))}</h2>
    <p class="sub">${pEsc(cl.nome)}${o&&o.local?" · "+pEsc(o.local):""}</p>

    <div class="campos">
      ${pCampo("Carga", dtl(c.carga), false, c.horaCarga?"a partir das "+c.horaCarga:"")}
      ${pCampo("Descarga prevista", dtl(c.descarga))}
      ${pCampo("OS de venda", o?(o.codigo||"—"):"—")}
      ${pCampo("Conferente", c.conferente||"—")}
      ${pCampo("Veículo", c.veiculo, true)}
      ${pCampo("Equipe", c.equipe, true)}
      ${o&&o.local?pCampo("Endereço de entrega", (o.local||"")+(o.cidade?" · "+o.cidade:""), true):""}
      ${(c.ambientes||[]).length>1?pCampo("Ambientes", c.ambientes.map(a=>a.nome).join(" · "), true):""}
    </div>

    <div class="resumo">
      <div class="k"><span class="lbl">Peças</span><b>${t.pecas}</b></div>
      <div class="k"><span class="lbl">Cases</span><b>${t.cases}</b></div>
      <div class="k"><span class="lbl">Peso</span><b>${kg(t.peso)}<span style="font-size:8pt;color:#666"> kgf</span></b></div>
      <div class="k"><span class="lbl">Demanda</span><b>${dec(t.kva,1)}<span style="font-size:8pt;color:#666"> kVA</span></b></div>
    </div>

    <table><thead><tr>
      <th class="box">Sep.</th><th>Item</th><th class="r">Qtd</th>
      <th class="r">Cases</th><th class="r">Peso (kgf)</th><th class="box">Ret.</th>
    </tr></thead><tbody>
      ${cats.map(([k,its])=>`<tr class="grupo"><td colspan="6">${pEsc(k)} · ${its.reduce((s,i)=>s+i.qtd,0)} peças</td></tr>`
        + its.map(linha).join("")).join("")
        || `<tr><td colspan="6">Romaneio vazio.</td></tr>`}
    </tbody></table>

    <p class="legenda">Marque <b>Sep.</b> ao separar e <b>Ret.</b> ao conferir o retorno. Peça avariada não volta ao saldo — registre na descarga.</p>

    ${avulsos.length?`<div class="nota"><span class="lbl">Fora do estoque · recados da produção</span>
      ${avulsos.map(i=>`<div style="margin-top:3px">• <b>${pEsc(i.nome||"Linha avulsa")}</b>${i.qtd>1?" ("+i.qtd+")":""}${i.obs?" — "+pEsc(i.obs):""}</div>`).join("")}</div>`:""}
    ${c.obs?`<div class="nota"><span class="lbl">Observações</span>${pEsc(c.obs)}</div>`:""}

    <div class="assina q4">
      <div class="a"><b>Separação</b>Nome · ___/___/____</div>
      <div class="a"><b>Recebido no evento</b>Nome · ___/___/____</div>
      <div class="a"><b>Retorno conferido</b>Nome · ___/___/____</div>
      <div class="a"><b>Avarias</b>__________________</div>
    </div>

  </div>`;
}

/* ---------- disparo ---------- */
function montarFolha(tipo,id){
  if(tipo==="orcamento"){ const n=neg(id); return n?folhaOrcamento(n):""; }
  if(tipo==="carga"){ const c=oscById(id); return c?folhaCarga(c):""; }
  return "";
}
function imprimir(tipo,id){
  const html=montarFolha(tipo,id);
  if(!html) return toast("Não encontrei o documento para imprimir.");
  const host=document.getElementById("printHost");
  host.innerHTML=html;
  document.body.classList.add("imprimindo");
  /* o navegador precisa de um quadro para aplicar o estilo antes de medir as páginas */
  requestAnimationFrame(()=>{ window.print(); });
}
function preverImpressao(tipo,id){
  const html=montarFolha(tipo,id);
  if(!html) return;
  const host=document.getElementById("printHost");
  host.innerHTML=`<div class="prevbar">
      <button class="btn pri" data-act="imprimirAgora">Imprimir ou salvar em PDF</button>
      <button class="btn" data-act="fecharPrev">Voltar</button>
      <span class="muted" style="font-size:12px">No diálogo, escolha <b>Salvar como PDF</b> — o texto continua selecionável.</span>
    </div>`+html;
  document.body.classList.add("preview");
  window.scrollTo({top:0});
}
function fecharPreview(){
  document.body.classList.remove("preview");
  document.getElementById("printHost").innerHTML="";
}
window.addEventListener("afterprint", ()=>{
  document.body.classList.remove("imprimindo");
  if(!document.body.classList.contains("preview")) document.getElementById("printHost").innerHTML="";
});
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="imprimir"){ preverImpressao(t.dataset.tipo, t.dataset.id); return; }
  if(a==="imprimirAgora"){
    document.body.classList.add("imprimindo");
    requestAnimationFrame(()=>window.print());
    return;
  }
  if(a==="fecharPrev"){ fecharPreview(); render(); return; }
});
</script>

<script>
/* ================= PLANILHA DE MEMORIAL =================
   Os memoriais de solo e aéreo saem no mesmo modelo de Excel que a
   engenharia já assina. O arquivo é montado aqui dentro — um .xlsx é
   um zip de XML, e escrever esses XML custa menos que carregar uma
   biblioteca de 800 KB só para isso. Sem dependência externa: funciona
   offline e não quebra se um CDN sair do ar. */

/* ---------- zip, sem compressão (válido e suficiente) ---------- */
const CRC_TAB = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(buf){ let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TAB[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0; }

function zipar(arquivos){
  const enc=new TextEncoder(), partes=[], central=[];
  let deslocamento=0;
  const u16=v=>[v&255,(v>>8)&255];
  const u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const {nome,texto} of arquivos){
    const dados=enc.encode(texto), nb=enc.encode(nome), crc=crc32(dados);
    const cab=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(dados.length),...u32(dados.length),...u16(nb.length),...u16(0)];
    partes.push(new Uint8Array(cab), nb, dados);
    central.push({nb,crc,tam:dados.length,desl:deslocamento});
    deslocamento += cab.length + nb.length + dados.length;
  }
  const dir=[];
  for(const c of central){
    dir.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),
      ...u16(0),...u16(0),...u32(c.crc),...u32(c.tam),...u32(c.tam),
      ...u16(c.nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.desl)]), c.nb);
  }
  const tamDir=dir.reduce((s,d)=>s+d.length,0);
  dir.push(new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),
    ...u16(central.length),...u16(central.length),...u32(tamDir),...u32(deslocamento),...u16(0)]));
  return new Blob([...partes,...dir],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ---------- estilos, copiados do modelo ---------- */

};
const ESTILO_TOPO = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

/* cada xf é uma linha da tabela de estilos; ficam num array porque as

const XF = [

<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

/* ---------- bordas das faixas mescladas ----------
   Numa faixa mesclada o Excel usa a borda das pontas: a esquerda vem da
   primeira célula e a direita, da última. Só que nem todo leitor respeita a
   mesclagem na hora de pintar — alguns escrevem o texto esticado na faixa
   inteira e mesmo assim desenham a borda de cada célula de dentro, e aí o
   traço corta a palavra no meio ("TOTAL DE EQUIPAMENTO" virava "TOTAL D|E
   EQUIPAMENTO"). Por isso as células de dentro da faixa perdem as bordas
   laterais: a primeira fica sem a direita, as do meio sem as duas e a última
   sem a esquerda. O contorno da faixa continua igual em quem mescla certo, e
   some o risco no meio da palavra em quem não mescla. */
const BORDA_FAIXA = {0:{ini:0,meio:0,fim:0}, 1:{ini:3,meio:4,fim:5}, 2:{ini:6,meio:7,fim:8}};
const VARIANTES = {};
function bordaVariante(base,pos){
  const xml=XF[base]; if(!xml) return base;
  const atual=+((xml.match(/borderId="(\d+)"/)||[])[1]||0);
  const alvo=(BORDA_FAIXA[atual]||{})[pos];
  if(alvo==null || alvo===atual) return base;
  const k=base+"|"+pos;
  if(VARIANTES[k]==null){ VARIANTES[k]=XF.length;
    XF.push(xml.replace(/borderId="\d+"/,'borderId="'+alvo+'"')); }
  return VARIANTES[k];
}
const estilosXml = () => ESTILO_TOPO+`<cellXfs count="${XF.length}">`+XF.join("")+`</cellXfs>`+ESTILO_FIM;


/* ---------- construtor de planilha ---------- */
const xEsc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const colNum = L => [...L].reduce((n,ch)=>n*26+(ch.charCodeAt(0)-64),0);
const numCol = n => { let s=""; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=(n-r-1)/26; } return s; };

function novaPlanilha(nomeAba){
  const cels={}, larguras=[], alturas={}, merges=[];
  const api={
    nome:nomeAba,
    col(letra,largura){ larguras.push([colNum(letra),largura]); return api; },
    /* a maior altura pedida para a linha é a que vale: duas colunas de blocos
       dividem a mesma linha, e quem tem o texto mais comprido manda */
    alt(linha,altura){ alturas[linha]=Math.max(alturas[linha]||0, altura); return api; },
    txt(ref,v,s){ cels[ref]={t:"s",v,s:s||0}; return api; },
    /* sem o arredondamento, 141 × 0,2 grava 28.200000000000003 no arquivo */
    num(ref,v,s){ cels[ref]={t:"n",v:Math.round((Number(v)||0)*10000)/10000,s:s||0}; return api; },
    vazio(ref,s){ cels[ref]={t:"e",s:s||0}; return api; },
    /* o estilo vai em toda a faixa, senão a borda da célula mesclada some —
       mas sem as laterais de dentro, que é o que cortava as palavras */
    merge(faixa,s){
      merges.push(faixa);
      const [a,b]=faixa.split(":");
      const c1=colNum(a.match(/[A-Z]+/)[0]), r1=+a.match(/\d+/)[0];
      const c2=colNum(b.match(/[A-Z]+/)[0]), r2=+b.match(/\d+/)[0];
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
        const ref=numCol(c)+r;
        const base = s!=null ? s : (cels[ref] ? cels[ref].s : 0);
        const est = c1===c2 ? base
          : bordaVariante(base, c===c1?"ini":(c===c2?"fim":"meio"));
        if(!cels[ref]) cels[ref]={t:"e",s:est};
        else cels[ref].s=est;
      }
      return api;
    },
    xml(){
      const porLinha={};
      Object.keys(cels).forEach(ref=>{
        const r=+ref.match(/\d+/)[0]; (porLinha[r]=porLinha[r]||[]).push(ref);
      });
      const linhas=Object.keys(porLinha).map(Number).sort((a,b)=>a-b).map(r=>{
        const refs=porLinha[r].sort((a,b)=>colNum(a.match(/[A-Z]+/)[0])-colNum(b.match(/[A-Z]+/)[0]));
        const cs=refs.map(ref=>{ const c=cels[ref];
          if(c.t==="s") return `<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${xEsc(c.v)}</t></is></c>`;
          if(c.t==="n") return `<c r="${ref}" s="${c.s}"><v>${c.v}</v></c>`;
          return `<c r="${ref}" s="${c.s}"/>`;
        }).join("");
        const h=alturas[r]?` ht="${alturas[r]}" customHeight="1"`:"";
        return `<row r="${r}"${h}>${cs}</row>`;
      }).join("");
      const cols=larguras.map(([n,w])=>`<col min="${n}" max="${n}" width="${w}" customWidth="1"/>`).join("");
      /* faixa total e mesclagens em ordem de linha/coluna: leitores exigentes
         (Excel e Google Planilhas) descartam a lista inteira se estranharem
         alguma coisa, e aí as bordas voltam a cortar o texto */
      const refs=Object.keys(cels);
      const cMax=Math.max(1,...refs.map(r=>colNum(r.match(/[A-Z]+/)[0])));
      const rMax=Math.max(1,...refs.map(r=>+r.match(/\d+/)[0]));
      const chave=f=>{ const a=f.split(":")[0]; return (+a.match(/\d+/)[0])*1000 + colNum(a.match(/[A-Z]+/)[0]); };
      const ms=merges.slice().sort((a,b)=>chave(a)-chave(b));
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>
<dimension ref="A1:${numCol(cMax)}${rMax}"/>
<sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
${cols?`<cols>${cols}</cols>`:""}
<sheetData>${linhas}</sheetData>
${ms.length?`<mergeCells count="${ms.length}">${ms.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`:""}
<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>
<pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>
</worksheet>`;
    }
  };
  return api;
}

/* ---------- geometria da folha ----------
   Cada bloco ocupa quatro colunas — nome, quantidade, peso unitário, peso
   total. São duas colunas de blocos: a da esquerda em B..E e a da direita em
   G..J, com F de corredor. É isso que faz a planilha crescer para o lado em
   vez de virar uma tira comprida de blocos empilhados. */
const LARG = {A:2.5,B:34,C:8,D:14,E:18,F:3,G:34,H:8,I:14,J:18};
const LADOS = [{n:"B",q:"C",u:"D",t:"E"},{n:"G",q:"H",u:"I",t:"J"}];
const largFaixa = (de,ate) => { let s=0;
  for(let c=colNum(de);c<=colNum(ate);c++) s+=LARG[numCol(c)]||8; return s; };
/* célula mesclada não se auto-ajusta em altura — em nenhum leitor. Sem uma
   altura calculada, a segunda linha do texto vaza e a borda passa por cima
   dele. Daí estimar quantas linhas o texto ocupa e pedir a altura na mão. */
function altoTexto(texto,largura,base){
  const cab=Math.max(4,Math.floor(largura)-2);
  const n=Math.max(1,Math.ceil(String(texto==null?"":texto).length/cab));
  return Math.max(base||16, n*14+4);
}

/* ---------- cabeçalho comum aos dois memoriais ---------- */
const NOME_ITEM = i => "["+String((i.cod?item(i.cod).cat:(i.cat||"Extras"))).toUpperCase()+"] "+(i.cod?item(i.cod).nome:i.nome);
const dd = s => s? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
function cabecalhoMem(sh,o,titulo){
  Object.keys(LARG).forEach(l=>sh.col(l,LARG[l]));
  sh.alt(2,24);
  sh.txt("B2",titulo,X.titulo); sh.merge("B2:J2",X.titulo);
  sh.txt("B3","EVENTO:",X.rotulo);        sh.merge("B3:C3",X.rotulo);
  sh.txt("D3","LOCAL:",X.rotulo);         sh.merge("D3:E3",X.rotulo);
  sh.txt("G3","DATA DO EVENTO:",X.rotulo);sh.merge("G3:H3",X.rotulo);
  sh.txt("I3","DATA DA MONTAGEM:",X.rotulo); sh.merge("I3:J3",X.rotulo);
  const per = o.evIni ? (o.evFim&&o.evFim!==o.evIni ? dd(o.evIni)+" — "+dd(o.evFim) : dd(o.evIni)) : "";
  const vals=[[o.evento||"","B","C"],[o.local||"","D","E"],[per,"G","H"],[dd(o.montagem),"I","J"]];
  /* altura medida pela coluna de ancoragem, não pela faixa inteira: se o
     leitor ignorar a mesclagem o texto se espreme nela, e é aí que a linha
     de baixo corta a última palavra */
  vals.forEach(([v,a])=>sh.alt(4,altoTexto(v,LARG[a],22)));
  vals.forEach(([v,a,b])=>{ sh.txt(a+"4",v,X.valorTopo); sh.merge(a+"4:"+b+"4",X.valorTopo); });
  return 6;   /* primeira linha livre */
}
const dois = String(0).padStart ? (n=>String(n).padStart(2,"0")) : (n=>(n<10?"0":"")+n);

/* ---------- bloco de equipamento, igual nos dois ---------- */
function blocoEquip(sh,lin,itens,pesoDe,rotuloTotal,L){
  L = L || LADOS[0];
  const largNome=LARG[L.n], largRot=largFaixa(L.n,L.u);
  sh.txt(L.n+lin,"EQUIPAMENTO / MARCA E MODELO",X.colHdr);
  sh.txt(L.q+lin,"QUANT.",X.colHdr);
  sh.txt(L.u+lin,"PESO UNITÁRIO",X.colHdr);
  sh.txt(L.t+lin,"PESO TOTAL",X.colHdr);
  sh.alt(lin,24); lin++;
  let soma=0;
  itens.forEach(i=>{
    const un=i.cod?item(i.cod).peso:0, q=pesoDe(i), tot=un*q;
    soma+=tot;
    const nome=NOME_ITEM(i);
    sh.txt(L.n+lin,nome,X.celTextoQ);          /* quebra a linha em vez de sumir */
    sh.num(L.q+lin,q,X.itemCentro);
    sh.num(L.u+lin,un,X.itemCentro);
    sh.num(L.t+lin,tot,X.itemNum);
    sh.alt(lin,altoTexto(nome,largNome,16));
    lin++;
  });
  if(!itens.length){
    sh.txt(L.n+lin,"— sem equipamento lançado —",X.itemNome);
    sh.vazio(L.q+lin,X.itemCentro); sh.vazio(L.u+lin,X.itemCentro); sh.num(L.t+lin,0,X.itemNum);
    sh.alt(lin,16); lin++;
  }
  const seg=soma*0.2, tot=soma+seg;
  [[rotuloTotal,soma],["20% DE SEGURANÇA",seg],["TOTAL",tot]].forEach(([rot,val])=>{
    sh.txt(L.n+lin,rot,X.rotCinza); sh.merge(L.n+lin+":"+L.u+lin,X.rotCinza);
    sh.num(L.t+lin,val,X.totalNum); sh.alt(lin,altoTexto(rot,largRot,16)); lin++;
  });
  return {lin, soma, total:tot};
}

/* ---------- memorial aéreo ---------- */
const LEGAIS_AEREO = [
  "Limite de carga por vara cênica de referência é definido pela capacidade cadastrada do item de talha/box utilizado, já com 20% de margem de segurança aplicada (inexatidão de carga, cabeamentos, acessórios, sobrecarga de içamento, etc).",
  "O projeto aéreo e o memorial de cálculo devem ser compatíveis.",
  "A ART/RRT deve estar de acordo com o projeto aprovado pelo engenheiro responsável do local e, preferencialmente, deve ser validada antes da emissão definitiva. Nela deve conter a carga total de projeto e a quantidade de pontos aéreos utilizados. Importante: a ART/RRT só tem validade mediante ao pagamento do boleto.",
  "A montagem será liberada após o recebimento da ART ou RRT e comprovante de pagamento do boleto. Quaisquer divergências entre a montagem e o projeto aprovado ocasionará a interrupção do serviço.",
  "As equipes de montagem devem ser capacitadas conforme as Normas Regulamentadoras vigentes. Todos os certificados deverão ser apresentados aos responsáveis no local (NR 11 ou 18 e NR 35).",
  "É expressamente obrigatório o uso de EPI (Equipamento de Proteção Individual) durante o trabalho."
];

function planilhaAereo(o){
  const sh=novaPlanilha("Memorial Aéreo");
  let lin=cabecalhoMem(sh,o,"MEMORIAL DE CÁLCULO DE ESTRUTURA AÉREA");
  const varias=ambsOS(o).length>1;
  let nEstr=0, pontosTot=0, cargaProjeto=0;

  /* junta primeiro, desenha depois: só assim dá para pôr dois blocos lado a
     lado e continuar embaixo do mais alto dos dois */
  const blocos=[];
  ambsOS(o).forEach(amb=>{
    estruturasDe(o,amb.id).forEach(e=>{
      const itens=itensDaEstr(o,amb.id,e.id);
      if(!itens.length) return;                       /* vara vazia não entra no documento */
      nEstr++;
      const pts=(e.pontos||[]).reduce((s,p)=>s+(Number(p.qtd)||0),0);
      /* kg por ponto: a capacidade do ponto mais fraco é a que manda */
      const kgPonto=(e.pontos||[]).length ? Math.min(...e.pontos.map(p=>Number(p.wll)||0)) : 0;
      pontosTot+=pts; cargaProjeto+=pts*kgPonto;
      blocos.push({nome:" ESTRUTURA "+dois(nEstr)+" — "+(varias?amb.nome+" · ":"")+e.nome
        +(e.torres?" (torre de solo)":""), itens, pts, kgPonto});
    });
  });

  for(let k=0;k<blocos.length;k+=2){
    let fim=lin;
    blocos.slice(k,k+2).forEach((b,j)=>{
      const L=LADOS[j]; let l=lin;
      sh.txt(L.n+l,b.nome,X.estrNome); sh.merge(L.n+l+":"+L.u+l,X.estrNome);
      sh.txt(L.t+l,"Kg por ponto",X.estrHdr);
      sh.alt(l,altoTexto(b.nome,largFaixa(L.n,L.u),22)); l++;
      const rot="PONTOS DE FIXAÇÃO ("+b.pts+")";
      sh.txt(L.n+l,rot,X.rotCinza); sh.merge(L.n+l+":"+L.u+l,X.rotCinza);
      sh.num(L.t+l,b.kgPonto,X.destaque); sh.alt(l,altoTexto(rot,largFaixa(L.n,L.u),18)); l++;
      const r=blocoEquip(sh,l,b.itens,i=>qtdAerea(i),"TOTAL DE EQUIPAMENTO",L);
      fim=Math.max(fim,r.lin);
    });
    lin=fim+2;                                        /* duas linhas de respiro, como no modelo */
  }
  if(!nEstr){
    sh.txt("B"+lin,"Nenhuma estrutura com equipamento suspenso nesta OS.",X.legal);
    sh.merge("B"+lin+":J"+lin,X.legal); lin+=2;
  }

  sh.txt("B"+lin,"CARGA TOTAL DE PROJETO (Kg):",X.rotCinza); sh.merge("B"+lin+":D"+lin,X.rotCinza);
  sh.num("E"+lin,cargaProjeto,X.destaque); sh.alt(lin,18); lin++;
  sh.txt("B"+lin,"PONTOS AÉREOS TOTAIS UTILIZADOS:",X.rotCinza); sh.merge("B"+lin+":D"+lin,X.rotCinza);
  sh.num("E"+lin,pontosTot,X.destaque); sh.alt(lin,18); lin+=2;

  const largLegal=largFaixa("B","J");
  LEGAIS_AEREO.forEach(t=>{
    sh.txt("B"+lin,t,X.legal); sh.merge("B"+lin+":J"+lin,X.legal);
    sh.alt(lin,altoTexto(t,largLegal,20)); lin+=2;
  });
  ["ENGENHEIRO/ARQUITETO RESPONSÁVEL:","CREA/CAU:","ART/RRT:","ASSINATURA:"].forEach(t=>{
    sh.txt("B"+lin,t,X.assina); lin+=2;
  });
  return sh;
}

/* ---------- memorial de solo ---------- */
function planilhaSolo(o){
  const sh=novaPlanilha("Memorial Solo");
  let lin=cabecalhoMem(sh,o,"MEMORIAL DE CÁLCULO DE ESTRUTURAS EM SOLO");
  const varias=ambsOS(o).length>1;
  let nEstr=0, cargaProjeto=0;
  const resumo=[];

  /* junta primeiro, desenha depois — duas zonas por faixa horizontal */
  const blocos=[];
  ambsOS(o).forEach(amb=>{
    zonasDe(o,amb.id).forEach(z=>{
      const itens=itensDaZona(o,amb.id,z.id);
      const emTorre=estruturasDe(o,amb.id).filter(e=>e.torres && (e.zona||zonasDe(o,amb.id)[0].id)===z.id);
      if(!itens.length && !emTorre.length) return;
      nEstr++;
      /* as linhas apoiadas, mais o que desce das estruturas em torre de solo */
      const linhas=[...itens];
      emTorre.forEach(e=>itensDaEstr(o,amb.id,e.id).forEach(i=>linhas.push({...i,_torre:true})));
      blocos.push({nome:" ESTRUTURA "+dois(nEstr)+" — "+(varias?amb.nome+" · ":"")+z.nome,
        linhas, area:Number(z.area)||0, adm:Number(z.adm)||0});
    });
  });
  const pesoDe=i=>i._torre?qtdAerea(i):(i.qtd-qtdAerea(i));

  for(let k=0;k<blocos.length;k+=2){
    let fim=lin;
    blocos.slice(k,k+2).forEach((b,j)=>{
      const L=LADOS[j]; let l=lin;
      sh.txt(L.n+l,b.nome,X.estrNome); sh.merge(L.n+l+":"+L.u+l,X.estrNome);
      sh.txt(L.t+l,"DISTRIBUIÇÃO DE CARGA KG/M²",X.estrHdr);
      sh.alt(l,Math.max(altoTexto(b.nome,largFaixa(L.n,L.u),24),
                        altoTexto("DISTRIBUIÇÃO DE CARGA KG/M²",LARG[L.t],24))); l++;
      const linArea=l; l++;
      const r=blocoEquip(sh,l,b.linhas,pesoDe,"TOTAL DE EQUIPAMENTOS",L);
      fim=Math.max(fim,r.lin);
      /* a fórmula do modelo: (peso × 1,20) ÷ área de apoio */
      const dist = b.area>0 ? r.total/b.area : 0;
      cargaProjeto += r.total;
      const rot="ÁREA DE CONTATO EM M² ("+dec(b.area,2)+")";
      sh.txt(L.n+linArea,rot,X.rotCinza); sh.merge(L.n+linArea+":"+L.u+linArea,X.rotCinza);
      sh.num(L.t+linArea,dist,X.destaque);
      sh.alt(linArea,altoTexto(rot,largFaixa(L.n,L.u),18));
      resumo.push({nome:b.nome, dist, ok: !(b.adm>0) || dist<=b.adm, adm:b.adm});
    });
    lin=fim+1;
  }
  if(!nEstr){
    sh.txt("B"+lin,"Nenhuma estrutura apoiada no piso nesta OS.",X.legal);
    sh.merge("B"+lin+":J"+lin,X.legal); lin+=2;
  }

  /* fecho à esquerda e quadro-resumo à direita, na mesma altura — é o que
     impede o resumo de cair sozinho na página seguinte */
  const linTopo=lin;
  sh.txt("B"+lin,"CARGA TOTAL DE PROJETO (KG):",X.rotCinza); sh.merge("B"+lin+":D"+lin,X.rotCinza);
  sh.num("E"+lin,cargaProjeto,X.destaque); sh.alt(lin,18); lin++;
  const formula="Fórmula: (peso total dos equipamentos × 1,20) ÷ área de apoio (m²) = carga distribuída em kg/m²";
  sh.txt("B"+lin,formula,X.legal);
  sh.merge("B"+lin+":E"+lin,X.legal); sh.alt(lin,altoTexto(formula,largFaixa("B","E"),20)); lin++;

  let lr=linTopo;
  sh.txt("G"+lr,"ESTRUTURAS",X.colHdr);
  /* rótulo curto de propósito: cabe na coluna de ancoragem mesmo sem mesclar */
  sh.txt("H"+lr,"CARGA KG/M²",X.colHdr); sh.merge("H"+lr+":I"+lr,X.colHdr);
  sh.txt("J"+lr,"STATUS",X.colHdr);
  sh.alt(lr,26); lr++;
  resumo.forEach(x=>{
    const nome=x.nome.trim();
    sh.txt("G"+lr,nome,X.celTextoQ);
    sh.num("H"+lr,x.dist,X.celNum); sh.merge("H"+lr+":I"+lr,X.celNum);
    sh.txt("J"+lr,x.ok?"OK":"NÃO OK",x.ok?X.statusOk:X.statusNao);
    sh.alt(lr,altoTexto(nome,LARG.G,18));
    lr++;
  });

  /* as assinaturas descem pela esquerda, ao lado do resumo, como no modelo:
     juntas embaixo dele a folha estourava para uma segunda página só com elas */
  lin++;
  ["ENGENHEIRO/ARQUITETO RESPONSÁVEL:","CREA/CAU:","ART/RRT:","ASSINATURA:"].forEach(t=>{
    sh.txt("B"+lin,t,X.assina); sh.alt(lin,18); lin+=2;
  });
  return sh;
}

  if(ev.key!=="Tab") return;
  const els=[...dlg.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(e=>e.getClientRects().length);
  if(!els.length){ev.preventDefault();dlg.focus();return;}
  const first=els[0],last=els[els.length-1];
  if(!dlg.contains(document.activeElement)||(!ev.shiftKey&&document.activeElement===last)) {ev.preventDefault();first.focus();}
  else if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
});

/* ---------------- ações ---------------- */
/* O galpão separa por item, não por sala: o mesmo moving pedido na plenária e
   numa B.U. sai como uma pilha só, com a divisão anotada na linha. A linha
   avulsa viaja junto — não mexe em saldo, mas carrega o recado do produtor.
   A mesma regra está em gerar_ordem_carga, no banco. */
function romaneioDaOS(o){
  const as=ambsOS(o), por={}, avulsos=[];
  o.itens.forEach(i=>{
    if(!i.cod) return avulsos.push({...i, obs:[nomeAmb(as,i.amb), i.obs].filter(Boolean).join(" · ")});
    const e=por[i.cod] || (por[i.cod]={cod:i.cod,qtd:0,partes:[]});
    e.qtd+=i.qtd; e.partes.push(nomeAmb(as,i.amb)+" "+i.qtd);
  });
  return [...Object.values(por).map(e=>({cod:e.cod,qtd:e.qtd,
    obs:e.partes.length>1?e.partes.join(" · "):""})), ...avulsos];
}
function gerarOSC(osId){
  const o=osById(osId); if(!o) return;
  if(!prontoParaOSC(o)) return toast("Conclua os dois memoriais e o descritivo antes de gerar a carga.");
  if(oscDaOS(osId)) return toast("Esta OS já possui ordem de carga.");
  S.seq.osc++;
  const id="OSC-2026-0"+S.seq.osc;
  S.cargas.push({id,osId,status:"Liberada",carga:o.montagem,horaCarga:"07:00",descarga:o.desmontagem,
    veiculo:resumoFrota(o), equipe:resumoEquipe(o),
    conferente:PERFIS.estoque.nome,
    ambientes:(o.ambientes||[]).map(a=>({...a})),
    itens:romaneioDaOS(o),
    obs:"Gerada automaticamente a partir de "+(o.codigo||o.id)+" pela produção."});
  o.status="Liberada"; o.etapaAtual="pronto";
  fluxo(osId, "Ordem de carga "+id+" emitida a partir de "+o.id+". Carga em "+dtl(o.montagem)+", descarga em "+dtl(o.desmontagem)+".",
    ["gerencia","estoque","producao"], "cargas", id, false);
  save(); toast("Ordem de carga "+id+" emitida para o estoque."); go("cargas",id);
}
function confirmarCarga(id){
  const c=oscById(id); if(!c) return;

    return it.total-it.manut-reservado(i.cod,c.carga,c.descarga,c.id)<i.qtd;});
  if(falta.length) return toast("Sem saldo para "+item(falta[0].cod).nome+" nesta janela.");
  c.status="Carregada";
  S.seq.mov++;
  const o=c.osId?osById(c.osId):null;
  S.movs.push({id:"M-"+S.seq.mov,data:c.carga,tipo:"SAÍDA",oscId:c.id,ref:o?o.evento:c.evento||c.id,
    linhas:c.itens.filter(i=>i.cod).map(i=>[i.cod,i.qtd]),user:PERFIS[S.role].nome});
  fluxo(c.osId, "Carga confirmada em "+dtl(c.carga)+": "+c.itens.filter(i=>i.cod).reduce((s,i)=>s+i.qtd,0)+" peças baixadas do estoque pela ordem "+(c.codigo||c.id)+".",
    ["gerencia","producao","estoque"], "cargas", c.id, false);
  save(); render(); toast("Baixa lançada em "+dtl(c.carga)+" · "+c.itens.filter(i=>i.cod).reduce((s,i)=>s+i.qtd,0)+" peças saíram do galpão.");
}
function confirmarRetorno(id){

  const av=[];
  document.querySelectorAll("[data-av]").forEach(el=>{const q=Math.max(0,Math.min(Number(el.value)||0, (c.itens.find(i=>i.cod===el.dataset.av)||{qtd:0}).qtd)); if(q>0) av.push([el.dataset.av,q]);});
  av.forEach(a=>{const it=S.cat.find(x=>x.cod===a[0]); if(it) it.manut+=a[1];});
  c.status="Retornada";
  S.seq.mov++;
  const o=c.osId?osById(c.osId):null;
  S.movs.push({id:"M-"+S.seq.mov,data:c.descarga,tipo:"ENTRADA",oscId:c.id,ref:o?o.evento:c.evento||c.id,
    linhas:c.itens.filter(i=>i.cod).map(i=>[i.cod,i.qtd-((av.find(a=>a[0]===i.cod)||[0,0])[1])]),user:PERFIS[S.role].nome, avarias:av.length?av:undefined});
  if(o) o.status="Encerrada";
  fluxo(c.osId, "Descarga registrada em "+dtl(c.descarga)+" pela ordem "+c.id+"."+(av.length?" "+av.reduce((s,a)=>s+a[1],0)+" peça(s) seguiram para manutenção.":" Retorno sem avarias."),

  toast("Entrada registrada em "+dtl(c.descarga)+(av.length?" · "+av.reduce((s,a)=>s+a[1],0)+" peça(s) em manutenção.":"."));
