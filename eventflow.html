<title>EventFlow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* EventFlow — escala monocromática: tinta sobre papel */
  --ink:#0D0D0F; --ink2:#55565A; --ink3:#737479;
  --bg:#EFEFF0; --surface:#FFFFFF; --surface2:#F6F6F7; --line:#DCDCDF; --line2:#EAEAEC;
  --accent:#16171A; --accent2:#3A3B40; --accentSoft:#E7E7EA; --onAccent:#FFFFFF;
  --ok:#2E6047; --okSoft:#E6EBE8; --warn:#6B5216; --warnSoft:#EFEBE1; --crit:#8A2D20; --critSoft:#F2E6E4;
  --onSolid:#FFFFFF;
  --shadow:0 1px 2px rgba(13,13,15,.08), 0 10px 28px -16px rgba(13,13,15,.34);
  --shadowUp:0 1px 1px rgba(13,13,15,.06);
  --r:8px; --r2:5px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#ECECEE; --ink2:#A8A9AD; --ink3:#8A8B90;
  --bg:#09090A; --surface:#141416; --surface2:#1C1C1F; --line:#2D2D31; --line2:#232326;
  --accent:#F1F1F3; --accent2:#FFFFFF; --accentSoft:#262629; --onAccent:#0E0E10;
  --ok:#8FC6A8; --okSoft:#182420; --warn:#CFB284; --warnSoft:#26211A; --crit:#DE9A8E; --critSoft:#2A1B19;
  --onSolid:#0E0E10;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 12px 30px -18px rgba(0,0,0,.95);
  --shadowUp:0 1px 1px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --ink:#ECECEE; --ink2:#A8A9AD; --ink3:#8A8B90;
  --bg:#09090A; --surface:#141416; --surface2:#1C1C1F; --line:#2D2D31; --line2:#232326;
  --accent:#F1F1F3; --accent2:#FFFFFF; --accentSoft:#262629; --onAccent:#0E0E10;
  --ok:#8FC6A8; --okSoft:#182420; --warn:#CFB284; --warnSoft:#26211A; --crit:#DE9A8E; --critSoft:#2A1B19;
  --onSolid:#0E0E10;
  --shadow:0 1px 2px rgba(0,0,0,.55), 0 12px 30px -18px rgba(0,0,0,.95);
  --shadowUp:0 1px 1px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;z-index:40}
.brand{display:flex;align-items:center;gap:9px;padding:16px 14px 14px;border-bottom:1px solid var(--line2)}
.brand .mk{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mk svg{display:block}
.brand b{font-family:var(--disp);font-size:14.5px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.brand span{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.navwrap{overflow-y:auto;flex:1;padding:10px 8px 16px}
.navgrp{font-family:var(--disp);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);padding:12px 8px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:var(--r2);color:var(--ink2);cursor:pointer;font-weight:500;font-size:13px;position:relative}
.navitem:hover{background:var(--surface2);color:var(--ink)}
.navitem.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
.navitem svg{flex:none;opacity:.9}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--surface2);color:var(--ink2);border-radius:20px;padding:1px 6px;font-weight:600}
.navitem.on .cnt{background:var(--accent);color:var(--onAccent)}
.navitem .cnt.alert{background:var(--critSoft);color:var(--crit)}
.sidefoot{border-top:1px solid var(--line2);padding:10px;display:flex;gap:6px;flex-wrap:wrap}
.main{min-width:0;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:9px 18px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:var(--r2);padding:6px 8px;cursor:pointer}
.crumb{display:flex;align-items:baseline;gap:9px;min-width:0}
.crumb h1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sub{color:var(--ink3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.roles{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:2px;gap:2px}
.roles button{background:none;border:0;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink2);font-family:var(--disp);white-space:nowrap}
.roles button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadowUp)}
.who{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--line)}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent2);color:var(--onAccent);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:11.5px;flex:none}
.who .nm{font-weight:600;font-size:12.5px;line-height:1.2}
.who .rl{font-size:10.5px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.view{padding:18px;flex:1;min-width:0}
.wrap{max-width:1280px;margin:0 auto}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadowUp)}
.card>header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.card>header h3{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.card>header .hint{font-size:11px;color:var(--ink3);margin-left:auto}
.pad{padding:14px}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:var(--r2);cursor:pointer;font-weight:600;font-size:12.5px;font-family:var(--disp)}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accentSoft);border-color:transparent}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn svg{flex:none}
:where(button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2.5px 8px;border-radius:20px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--okSoft);color:var(--ok)} .pill.warn{background:var(--warnSoft);color:var(--warn)}
.pill.crit{background:var(--critSoft);color:var(--crit)} .pill.acc{background:var(--accent);color:var(--onAccent)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line2);padding:1px 5px;border-radius:4px}
.muted{color:var(--ink3)}
.lbl{font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-family:var(--disp);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface2)}
td.r,th.r{text-align:right}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--disp);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:6px 9px;width:100%;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{font-family:var(--mono);font-size:12px;line-height:1.65;resize:vertical}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadowUp)}
.kpi .v{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px;color:var(--ink3);margin-top:2px}
.kpi .d{font-size:10.5px;margin-top:6px;font-weight:600}
.empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:20px;font-weight:600;font-size:12.5px;z-index:120;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* ---------- kanban ---------- */
.kb{display:grid;grid-template-columns:repeat(4,minmax(232px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.kbcol{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:232px}
.kbcol>h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:10px 12px 8px;display:flex;align-items:center;gap:7px;color:var(--ink2)}
.kbcol>h4 .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.kbcol .stripe{height:3px;border-radius:3px 3px 0 0}
.kbbody{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px;cursor:pointer;box-shadow:var(--shadowUp)}
.deal:hover{border-color:var(--accent)}
.deal .t{font-weight:600;font-size:12.5px;line-height:1.3}
.deal .c{font-size:11.5px;color:var(--ink3);margin-top:2px}
.deal .f{display:flex;align-items:center;gap:8px;margin-top:8px}
.deal .val{font-family:var(--mono);font-weight:600;font-size:12px}

/* ---------- steps ---------- */
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:9px 14px 9px 12px;border:1px solid var(--line);border-right:0;background:var(--surface);flex:1;min-width:150px;cursor:pointer;text-align:left}
.step:first-child{border-radius:var(--r) 0 0 var(--r)}
.step:last-child{border-right:1px solid var(--line);border-radius:0 var(--r) var(--r) 0}
.step.on{background:var(--accentSoft);border-color:var(--accent);z-index:2}
.step .mk{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3);flex:none}
.step.done .mk{background:var(--ok);border-color:var(--ok);color:var(--onSolid)}
.step.on .mk{border-color:var(--accent);color:var(--accent)}
.step.on.done .mk{background:var(--ok);border-color:var(--ok);color:var(--onSolid)}
.step .tx{font-family:var(--disp);font-size:12px;font-weight:600;line-height:1.2}
.step .tx small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--ink3)}

/* ---------- calc ---------- */
.calcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.res{display:grid;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res .row{display:flex;align-items:center;gap:10px;background:var(--surface);padding:8px 12px}
.res .row.hl{background:var(--surface2)}
.res .row .n{font-size:12px;color:var(--ink2)}
.res .row .n small{display:block;color:var(--ink3);font-size:10.5px;font-family:var(--mono)}
.res .row .v{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap}
.res .row .v u{text-decoration:none;color:var(--ink3);font-weight:400;font-size:11px;margin-left:2px}
.meter{height:6px;border-radius:4px;background:var(--line2);overflow:hidden;flex:none;width:86px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:4px}
.meter i.warn{background:var(--warn)} .meter i.crit{background:var(--crit)}
.verdict{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--r);border:1px solid;font-size:12.5px;line-height:1.45}
.verdict.ok{background:var(--okSoft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.verdict.crit{background:var(--critSoft);border-color:color-mix(in srgb,var(--crit) 30%,transparent);color:var(--crit)}
.verdict.warn{background:var(--warnSoft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.verdict b{font-family:var(--disp);display:block;font-size:12px;letter-spacing:.03em;text-transform:uppercase}

/* ---------- timeline ---------- */
.tl{overflow-x:auto}
.tlin{min-width:760px;position:relative}
.tlhead{display:flex;border-bottom:1px solid var(--line);position:relative}
.tlhead .lead{width:200px;flex:none;border-right:1px solid var(--line)}
.tlhead .days{flex:1;display:flex}
.tlhead .d{flex:1;text-align:center;font-family:var(--mono);font-size:9.5px;color:var(--ink3);padding:5px 0 4px;border-left:1px solid var(--line2)}
.tlhead .d.mstart{border-left:1px solid var(--line);color:var(--ink2);font-weight:600}
.tlhead .d.we{background:var(--surface2)}
.tlrow{display:flex;border-bottom:1px solid var(--line2);min-height:40px;align-items:stretch}
.tlrow:last-child{border-bottom:0}
.tlrow .lead{width:200px;flex:none;border-right:1px solid var(--line);padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.tlrow .lead b{font-size:12px;font-weight:600;line-height:1.2}
.tlrow .lead span{font-size:10.5px;color:var(--ink3)}
.tlrow .track{flex:1;position:relative;padding:8px 0}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:22px;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;color:var(--onAccent);background:var(--accent)}
.bar.sep{background:var(--warn)} .bar.carr{background:var(--ok)} .bar.ret{background:var(--ink3)} .bar.prev{background:transparent;border:1.5px dashed var(--accent);color:var(--accent)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:3}
.nowline::after{content:"hoje";position:absolute;top:-1px;left:4px;font-family:var(--mono);font-size:9px;color:var(--ink);font-weight:600}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:100%;max-width:640px;margin:auto}
.modal>header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.modal>header h3{font-size:14.5px;font-weight:600}
.modal>header .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink3);font-size:18px;line-height:1;padding:2px 6px}
.modal .body{padding:16px;display:grid;gap:13px}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line2);background:var(--surface2);border-radius:0 0 10px 10px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.picklist{border:1px solid var(--line);border-radius:var(--r2);max-height:190px;overflow-y:auto}
.picklist .it{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line2);font-size:12.5px}
.picklist .it:last-child{border-bottom:0}
.picklist .it .q{font-family:var(--mono);font-weight:600;margin-left:auto}

.sidefoot{flex-direction:column;align-items:stretch}
.themesel{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r2);padding:2px;gap:2px;width:100%}
.themesel button{flex:1;background:none;border:0;padding:5px 4px;border-radius:4px;cursor:pointer;font-family:var(--disp);font-size:11px;font-weight:600;color:var(--ink2)}
.themesel button:hover{color:var(--ink)}
.themesel button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadowUp)}
.addform{border:1px solid var(--ink3);border-radius:var(--r);background:var(--surface2);padding:12px;display:grid;gap:10px}
.addform .rowf{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.addform .field{min-width:128px;flex:1}
.addform .field.w{flex:2.2}
.addform .field.s{flex:0 0 92px;min-width:92px}
.addform .go{flex:none}
.addform h4{font-size:12px;font-weight:600;letter-spacing:.02em}
.addform .hint{font-size:11px;color:var(--ink3);margin:0}
.addform .top{display:flex;align-items:center;gap:9px}
.modes{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:2px;gap:2px}
.modes button{background:none;border:0;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:var(--disp);font-size:11.5px;font-weight:600;color:var(--ink2)}
.modes button.on{background:var(--accent);color:var(--onAccent)}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sechead h2{font-size:14px;font-weight:600}
.sechead p{margin:0;font-size:11.5px;color:var(--ink3)}
.scrim{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-101%);transition:transform .2s;height:100dvh}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim.on{display:block;position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 48%,transparent);z-index:35}
  .burger{display:inline-flex}
  .view{padding:14px}
  .roles button{padding:5px 7px;font-size:11px}
  .who .nm,.who .rl{display:none}
  .who{padding-left:0;border-left:0}
  .crumb .sub{display:none}
}
@media (max-width:640px){
  .kb{grid-template-columns:1fr;overflow:visible}
  .kbcol{min-width:0}
  .row2,.row3{grid-template-columns:1fr}
  .view{padding:12px 16px}
  .top{padding:8px 16px;gap:8px}
  .steps{flex-direction:column}
  .step{border-right:1px solid var(--line);border-bottom:0;min-width:0}
  .step:first-child{border-radius:var(--r) var(--r) 0 0}
  .step:last-child{border-radius:0 0 var(--r) var(--r)}
  .step:not(:last-child){border-bottom:0}
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => "R$ "+Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0});
const kg = n => Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0});
const dec = (n,d=2) => Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const dt = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "—";
const dtl = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "—";
const item = c => S.cat.find(i=>i.cod===c) || {cod:c,nome:c,peso:0,total:0,manut:0,un:"pç",cat:"—",rig:"solo",diaria:0};

const osById = id => S.os.find(o=>o.id===id);
const oscById = id => S.cargas.find(c=>c.id===id);
const overlap = (a1,a2,b1,b2) => a1<=b2 && b1<=a2;
const addDays = (iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const diffDays = (a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
const RESERVA = ["Liberada","Em separação","Carregada"];

function reservado(cod, de, ate, exclude){
  let q=0;
  for(const c of S.cargas){
    if(exclude && c.id===exclude) continue;
    if(!RESERVA.includes(c.status)) continue;
    if(!overlap(c.carga,c.descarga,de,ate)) continue;
    for(const i of c.itens) if(i.cod===cod) q+=i.qtd;
  }
  return q;
}
const emCampo = cod => S.cargas.filter(c=>c.status==="Carregada").reduce((s,c)=>s+c.itens.filter(i=>i.cod===cod).reduce((a,i)=>a+i.qtd,0),0);
function disponivel(cod,de,ate){ const it=item(cod); return it.total - it.manut - reservado(cod,de,ate); }

function conflitos(){
  const out=[];
  for(const c of S.cargas){
    if(!RESERVA.includes(c.status)) continue;
    for(const i of c.itens){
      const it=item(i.cod);
      const res=reservado(i.cod,c.carga,c.descarga);
      const cap=it.total-it.manut;
      if(res<=cap) continue;
      const ja=out.find(o=>o.cod===i.cod);
      if(!ja) out.push({cod:i.cod,de:c.carga,ate:c.descarga,res,cap,falta:res-cap});
      else if(res-cap>ja.falta){ ja.de=c.carga; ja.ate=c.descarga; ja.res=res; ja.falta=res-cap; }
    }
  }
  return out;
}
/* quantas unidades daquela linha sobem para o grid — decidido na OS, não no cadastro */
function qtdAerea(i){
  /* null = o produtor ainda não classificou: não entra em memorial nenhum */
  if(i.aereo==null) return 0;
  return Math.max(0,Math.min(i.qtd,Number(i.aereo)||0)); }
function pesoPor(itens,rig){ return itens.reduce((s,i)=>{
  if(i.aereo==null) return s;            /* linha não classificada fica fora dos dois memoriais */
  const it=item(i.cod), a=qtdAerea(i);
  return s + it.peso*(rig==="aereo" ? a : i.qtd-a);},0); }
function valorItens(itens,dias){ return itens.reduce((s,i)=>s+item(i.cod).diaria*i.qtd*(dias||1),0); }

/* ---------------- memoriais ---------------- */
function calcSolo(os){
  const p=os.solo, pEq=pesoPor(os.itens,"solo"), pAe=pesoPor(os.itens,"aereo");
  const transf = p.torres ? pAe : 0;
  const total = pEq + transf;
  const area = Math.max(1,Number(p.area)||1);
  const dEq = total/area;
  const dPub = Number(p.publicoKgm2)||0;
  const dTot = dEq + dPub;
  const util = dTot/(Number(p.adm)||1);
  let maior={peso:0,nome:"—"};
  for(const i of os.itens){const it=item(i.cod); if(it.rig==="solo"&&it.peso>maior.peso) maior={peso:it.peso,nome:it.nome};}
  const pont = maior.peso/(Math.max(1,Number(p.apoios)||1));
  const utilP = pont/(Number(p.admPont)||1);
  const ok = util<=1 && utilP<=1;
  return {pEq,pAe,transf,total,area,dEq,dPub,dTot,util,maior,pont,utilP,ok};
}
function calcAereo(os){
  const p=os.aereo, susp = p && os.solo.torres ? 0 : pesoPor(os.itens,"aereo");
  const bruto = pesoPor(os.itens,"aereo");
  const efetivo = os.solo.torres ? 0 : bruto;
  const proj = efetivo*(Number(p.fd)||1)*(Number(p.fdes)||1);
  const n = Math.max(1,Number(p.pontos)||1);
  const porPonto = proj/n;
  const util = porPonto/(Number(p.wllPonto)||1);
  const cr = (Number(p.wllAcess)||0)*7;
  const fs = porPonto>0 ? cr/porPonto : Infinity;
  const flecha = (Number(p.vao)||0)*1000/200;
  const ok = util<=1 && fs>=(Number(p.fsMin)||5);
  return {bruto,efetivo,proj,n,porPonto,util,cr,fs,flecha,ok,apoiadoSolo:os.solo.torres};
}
function etapasOk(os){
  return {escopo:os.itens.length>0, solo:!!os.solo.feito, aereo:!!os.aereo.feito, descritivo:(os.descritivo||"").trim().length>40};
}

        ${CATEGORIAS.filter(c=>porCat[c]).map(c=>`<optgroup label="${esc(c)}">${porCat[c].map(x=>`<option value="${x.cod}">${esc(x.cod)} · ${esc(x.nome)}</option>`).join("")}</optgroup>`).join("")}
      </select></div>
      <div class="field s"><label for="fQtd">Qtd</label><input id="fQtd" type="number" value="10" min="1"></div>
      <button class="btn go" type="button" data-act="addItem">Incluir no escopo</button>
      <button class="btn pri go" type="submit" data-act="salvarOSV">Emitir OS de Venda</button>
    </div>
    <div class="picklist" id="pick"></div>
    <p class="hint">Enter no campo de quantidade inclui o item. Enter nos campos de cima emite a OS.</p></form>`;
}
const STCOR={"Aguardando produção":"warn","Em produção":"acc","Liberada":"ok","Encerrada":""};
function vVendas(){
  return `<div class="sechead"><h2>Ordens de Serviço de Venda</h2><p>Geradas pela gerência a partir de um negócio ganho e encaminhadas ao produtor responsável.</p>
    <div style="flex:1"></div>${can("criar_osv")?`<button class="btn ${S.osvForm?"":"pri"}" data-act="${S.osvForm?"fecharOSVForm":"novaOSV"}">${S.osvForm?"Fechar formulário":"+ Nova OS de Venda"}</button>`:""}</div>
  ${can("criar_osv")&&S.osvForm?`<div style="margin-bottom:14px">${formOSV()}</div>`:""}
  <div class="card"><div class="tblwrap"><table><thead><tr><th>OS</th><th>Evento / cliente</th><th>Local</th><th>Montagem → desmontagem</th><th class="r">Itens</th>${can("ver_valores")?`<th class="r">Valor</th>`:""}<th>Produção</th><th>Equipe</th><th>Status</th></tr></thead><tbody>
  ${S.os.slice().sort((a,b)=>a.montagem<b.montagem?-1:1).map(o=>{const c=cli(o.cliente);const e=etapasOk(o);const done=[e.solo,e.aereo,e.descritivo].filter(Boolean).length;
    return `<tr class="clickable" data-act="osv" data-id="${o.id}">
    <td><span class="tag">${o.id}</span></td>
    <td><b>${esc(o.evento)}</b><br><span class="muted" style="font-size:11.5px">${esc(c.nome)}</span></td>
    <td style="font-size:12px">${esc(o.local)}</td>
    <td class="num" style="font-size:12px">${dt(o.montagem)} → ${dt(o.desmontagem)}<br><span class="muted" style="font-size:11px">evento ${dt(o.evIni)}</span></td>
    <td class="r num">${o.itens.reduce((s,i)=>s+i.qtd,0)}</td>
    ${can("ver_valores")?`<td class="r num">${brl(o.valor)}</td>`:""}
    <td><span class="pill ${done===3?"ok":done?"warn":""}">${done}/3 etapas</span></td>
    <td><div class="membros" style="justify-content:flex-start">${(o.produtores||[]).map(u=>av(usr(u),22)).join("")}</div></td>
    <td><span class="pill ${STCOR[o.status]||""}"><span class="dot"></span>${esc(o.status)}</span></td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}

function vOSV(){
  const o=osById(S.sel); if(!o) return vVendas();
  const c=cli(o.cliente), e=etapasOk(o), osc=oscDaOS(o.id);
  const dias=Math.max(1,diffDays(o.montagem,o.desmontagem));
  return `<div class="between" style="margin-bottom:14px">
    <div><button class="btn sm ghost" data-act="go" data-view="vendas">← OS de Venda</button>
      <h2 style="font-size:19px;margin-top:6px">${esc(o.evento)}</h2>
      <div class="flex" style="margin-top:5px"><span class="tag">${o.id}</span><span class="muted">${esc(c.nome)} · ${esc(o.local)}</span><span class="pill ${STCOR[o.status]||""}"><span class="dot"></span>${esc(o.status)}</span></div></div>
    <div class="flex">${can("editar_memorial")?`<button class="btn pri" data-act="go" data-view="producao" data-id="${o.id}">Abrir na produção</button>`:""}
      ${osc?`<button class="btn" data-act="osc" data-id="${osc.id}">Ver ordem de carga ${osc.id}</button>`:""}</div></div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
    <div class="card"><header><h3>Dados do evento</h3></header><div class="res" style="border:0;border-radius:0">
      ${[["Contratante",c.nome],["Contato",c.contato+" · "+c.tel],["Local",o.local],["Cidade",o.cidade],["Público estimado",o.publico.toLocaleString("pt-BR")+" pessoas"],["Área contratada",dec(o.area,0)+" m²"],["Montagem",dtl(o.montagem)],["Realização",dtl(o.evIni)+(o.evFim!==o.evIni?" a "+dtl(o.evFim):"")],["Desmontagem",dtl(o.desmontagem)],["Produtor responsável",o.produtor]]
        .map(r=>`<div class="row"><div class="n">${esc(r[0])}</div><div class="v" style="font-family:var(--sans);font-weight:500;font-size:12.5px;text-align:right">${esc(r[1])}</div></div>`).join("")}
      ${can("ver_valores")?`<div class="row hl"><div class="n"><b>Valor do contrato</b><small>${dias} diárias de locação</small></div><div class="v" style="font-size:15px">${brl(o.valor)}</div></div>`:""}
    </div>
    <div class="pad" style="border-top:1px solid var(--line2)"><span class="lbl">Equipe de produção</span>
      <div style="display:grid;gap:6px;margin-top:8px">${(o.produtores||[]).map((u,i)=>`<div class="prod ${i===0?"on":""}">${av(usr(u),26)}
        <span class="tx"><b>${esc(usr(u).nome)}</b><span>${esc(usr(u).cargo)}</span></span>
        ${i===0?`<span class="pill acc">responsável</span>`:""}</div>`).join("")||`<span class="muted" style="font-size:12px">Sem produtor atribuído.</span>`}</div>
    </div></div>
    <div class="card"><header><h3>Andamento da produção</h3><span class="hint">obrigatório para liberar a carga</span></header><div class="pad" style="display:grid;gap:9px">
      ${[["Escopo de equipamentos",e.escopo],["Memorial de cálculo · solo",e.solo],["Memorial de cálculo · aéreo",e.aereo],["Descritivo técnico",e.descritivo]].map(x=>
        `<div class="flex" style="gap:9px"><span class="pill ${x[1]?"ok":"warn"}"><span class="dot"></span>${x[1]?"concluído":"pendente"}</span><span style="font-size:12.5px">${esc(x[0])}</span></div>`).join("")}
      <div class="verdict ${prontoParaOSC(o)?"ok":"warn"}" style="margin-top:4px"><div>${prontoParaOSC(o)?"<b>Pronta para logística</b>A ordem de carga pode ser gerada e enviada ao estoque.":"<b>Em elaboração</b>A ordem de carga só é liberada quando os dois memoriais e o descritivo estiverem concluídos."}</div></div>
    </div></div>
  </div>

  <div class="card" style="margin-top:14px"><header><h3>Carga elétrica e volumetria</h3><span class="hint">soma do escopo</span></header>
    <div class="tblwrap"><table><thead><tr><th>Categoria</th><th class="r">Peças</th><th class="r">Cases</th><th class="r">Peso</th><th class="r">Consumo</th></tr></thead><tbody>
    ${porCategoria(o.itens).map(([c,its])=>{const t=somaTecnica(its);
      return `<tr><td><b style="font-weight:600">${esc(c)}</b></td><td class="r num">${t.pecas}</td><td class="r num">${t.cases}</td>
      <td class="r num">${kg(t.peso)} kgf</td><td class="r num">${t.w?kwFmt(t.w):"—"}</td></tr>`;}).join("")}
    ${(()=>{const t=somaTecnica(o.itens);const ger=o.itens.filter(i=>i.cod==="GER-180").reduce((s,i)=>s+i.qtd,0);
      return `<tr style="background:var(--surface2)"><td><b>Total</b></td><td class="r num"><b>${t.pecas}</b></td><td class="r num"><b>${t.cases}</b></td>
      <td class="r num"><b>${kg(t.peso)} kgf</b></td><td class="r num"><b>${kwFmt(t.w)}</b></td></tr>`;})()}
    </tbody></table></div>
    <div class="pad" style="border-top:1px solid var(--line2)">${(()=>{const t=somaTecnica(o.itens);
      const ger=o.itens.filter(i=>i.cod==="GER-180").reduce((s,i)=>s+i.qtd,0), kvaGer=ger*180;
      const dem=t.kva*1.25;
      return kvaGer>0
        ? `<div class="verdict ${kvaGer>=dem?"ok":"crit"}"><div><b>${kvaGer>=dem?"Energia coberta":"Energia insuficiente"}</b>Consumo de ${kwFmt(t.w)} ≈ ${dec(t.kva,1)} kVA; com 25% de folga, ${dec(dem,1)} kVA. ${ger} gerador(es) de 180 kVA somam ${kvaGer} kVA.</div></div>`
        : `<div class="verdict warn"><div><b>Sem gerador no escopo</b>Consumo de ${kwFmt(t.w)} ≈ ${dec(dem,1)} kVA com folga — confirmar se a energia do local atende.</div></div>`;})()}</div>
  </div>

  ${porCategoria(o.itens).map(([c,its])=>`
  <div class="card" style="margin-top:14px"><header><h3>${esc(c)}</h3>
    <span class="hint">${(()=>{const t=somaTecnica(its);return its.length+" linhas · "+t.pecas+" peças · "+t.cases+" cases · "+kg(t.peso)+" kgf";})()}</span></header>
  <div class="tblwrap"><table><thead><tr><th>Código</th><th>Item</th><th>Aplicação</th><th class="r">Qtd</th><th>Aplicação</th><th class="r">Cases</th><th class="r">Peso total</th><th class="r">Consumo</th><th class="r">Disponível na janela</th></tr></thead><tbody>
  ${its.map(i=>{const it=item(i.cod);const disp=disponivel(i.cod,o.montagem,o.desmontagem)+ (oscDaOS(o.id)? (oscDaOS(o.id).itens.find(x=>x.cod===i.cod)||{qtd:0}).qtd :0);
    const falta=disp<i.qtd;
    return `<tr><td><span class="tag">${i.cod}</span></td><td>${esc(it.nome)}</td>
    <td class="r num">${i.qtd}</td>
    <td>${(()=>{const a=qtdAerea(i); return a===i.qtd?`<span class="pill acc">todo no grid</span>`
      : a===0?`<span class="pill">todo no solo</span>`
      : `<span class="pill acc">${a} no grid</span> <span class="pill">${i.qtd-a} no solo</span>`;})()}</td>
    <td class="r num muted">${cases(i.cod,i.qtd)}</td><td class="r num">${kg(it.peso*i.qtd)} kgf</td>
    <td class="r num muted">${it.watts?kwFmt(it.watts*i.qtd):"—"}</td>
    <td class="r num" style="color:${falta?"var(--crit)":"var(--ink2)"};font-weight:${falta?600:400}">${disp}</td></tr>`;}).join("")}
  </tbody></table></div></div>`).join("")}`;
}
</script>
<script>
/* ---------------- Produção ---------------- */
function vProducao(){
  if(S.sel) return vProdDet();
  const meuId=me().id;
  const todas=S.os.slice().sort((a,b)=>a.montagem<b.montagem?-1:1);
  const minhas=todas.filter(o=>(o.produtores||[]).includes(meuId));
  const outras=todas.filter(o=>!(o.produtores||[]).includes(meuId));
  const fila=S.role==="producao"?[...minhas,...outras]:todas;
  return `<div class="sechead"><h2>Fila de produção técnica</h2><p>Cada OS de Venda precisa de memorial de solo, memorial aéreo e descritivo antes de virar Ordem de Carga.</p>
    ${S.role==="producao"?`<div style="flex:1"></div><span class="pill acc">${minhas.length} atribuída(s) a você</span>`:""}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
  ${fila.map(o=>{const e=etapasOk(o),c=cli(o.cliente),osc=oscDaOS(o.id),pr=prontoParaOSC(o);
    const minha=(o.produtores||[]).includes(me().id);
    return `<div class="card" style="${minha&&S.role==="producao"?"border-color:var(--ink2)":""}"><header><h3>${esc(o.evento)}</h3>
      ${minha&&S.role==="producao"?`<span class="pill acc">sua</span>`:""}<span class="hint">${o.id}</span></header>
      <div class="pad" style="display:grid;gap:10px">
        <div class="flex" style="gap:7px"><span class="pill ${STCOR[o.status]||""}"><span class="dot"></span>${esc(o.status)}</span>
          <span class="tag">${dt(o.montagem)} → ${dt(o.desmontagem)}</span><span class="muted" style="font-size:11.5px">${esc(c.nome)}</span>
          <div class="membros">${(o.produtores||[]).map(u=>av(usr(u),20)).join("")}</div></div>
        <div style="display:grid;gap:5px">
          ${[["Solo",e.solo],["Aéreo",e.aereo],["Descritivo",e.descritivo]].map(x=>`<div class="flex" style="gap:8px"><span class="meter"><i class="${x[1]?"":"warn"}" style="width:${x[1]?100:12}%"></i></span><span style="font-size:12px;color:var(--ink2)">${x[0]}</span><span class="pill ${x[1]?"ok":"warn"}" style="margin-left:auto">${x[1]?"ok":"pendente"}</span></div>`).join("")}
        </div>
        <div class="flex" style="justify-content:flex-end;gap:7px">
          ${osc?`<span class="pill ok">Carga ${osc.id}</span>`:pr&&can("gerar_osc")?`<button class="btn sm pri" data-act="gerarOSC" data-id="${o.id}">Gerar ordem de carga</button>`:""}
          <button class="btn sm" data-act="prod" data-id="${o.id}">Abrir</button></div>
      </div></div>`;}).join("")}</div>`;
}

function vProdDet(){
  const o=osById(S.sel); if(!o) return vProducao();
  const e=etapasOk(o), aba=S.aba||"escopo", osc=oscDaOS(o.id), c=cli(o.cliente);
  const ro=!can("editar_memorial");
  const steps=[["escopo","Escopo","itens e pesos",e.escopo],["solo","Memorial solo","NBR 6120",e.solo],["aereo","Memorial aéreo","rigging e FS",e.aereo],["descritivo","Descritivo técnico","texto do projeto",e.descritivo]];
  let body="";
  if(aba==="escopo") body=abaEscopo(o);
  if(aba==="solo") body=abaSolo(o,ro);
  if(aba==="aereo") body=abaAereo(o,ro);
  if(aba==="descritivo") body=abaDesc(o,ro);
  return `<div class="between" style="margin-bottom:12px">
    <div><button class="btn sm ghost" data-act="go" data-view="producao">← Fila de produção</button>
      <h2 style="font-size:19px;margin-top:6px">${esc(o.evento)}</h2>
      <div class="flex" style="margin-top:5px"><span class="tag">${o.id}</span><span class="muted">${esc(c.nome)} · ${esc(o.local)}</span>
      <span class="tag">montagem ${dtl(o.montagem)}</span><span class="tag">desmontagem ${dtl(o.desmontagem)}</span></div></div>
    <div class="flex">${osc?`<span class="pill ok"><span class="dot"></span>Carga ${osc.id} emitida</span><button class="btn" data-act="osc" data-id="${osc.id}">Abrir ordem</button>`
      :`<button class="btn pri" data-act="gerarOSC" data-id="${o.id}" ${prontoParaOSC(o)&&can("gerar_osc")?"":"disabled"}>Gerar Ordem de Carga →</button>`}</div></div>
  <div class="steps" style="margin-bottom:14px">${steps.map((s,i)=>`<button class="step ${aba===s[0]?"on":""} ${s[3]?"done":""}" data-act="aba" data-aba="${s[0]}">
    <span class="mk">${s[3]?"✓":i+1}</span><span class="tx">${esc(s[1])}<small>${esc(s[2])}</small></span></button>`).join("")}</div>
  ${body}`;
}

function abaEscopo(o){
  const ps=pesoPor(o.itens,"solo"), pa=pesoPor(o.itens,"aereo");
  const cats={}; o.itens.forEach(i=>{const it=item(i.cod); cats[it.cat]=(cats[it.cat]||0)+i.qtd;});
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    <div class="card"><header><h3>Massas do projeto</h3></header><div class="res" style="border:0">
      <div class="row"><div class="n">Carga suspensa (aérea)<small>truss, movings, line array, LED</small></div><div class="v">${kg(pa)} <u>kgf</u></div></div>
      <div class="row"><div class="n">Carga apoiada no solo<small>praticáveis, subs, geradores, mobiliário</small></div><div class="v">${kg(ps)} <u>kgf</u></div></div>
      <div class="row hl"><div class="n"><b>Massa total mobilizada</b></div><div class="v">${kg(ps+pa)} <u>kgf</u></div></div>
      <div class="row"><div class="n">Volume de peças</div><div class="v">${o.itens.reduce((s,i)=>s+i.qtd,0)} <u>un</u></div></div>
    </div></div>
    <div class="card"><header><h3>Composição por categoria</h3></header><div class="pad" style="display:grid;gap:7px">
      ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const mx=Math.max(...Object.values(cats));
        return `<div class="flex" style="gap:9px"><span style="font-size:12px;width:96px;color:var(--ink2)">${esc(k)}</span>
        <span class="meter" style="flex:1;width:auto"><i style="width:${Math.round(v/mx*100)}%;background:var(--accent)"></i></span>
        <span class="num" style="font-size:12px;width:44px;text-align:right">${v}</span></div>`;}).join("")}
    </div></div></div>
  <div class="card" style="margin-top:14px"><header><h3>Itens da OS</h3>
    <span class="hint">defina quantas unidades de cada linha sobem para o grid</span></header>
  <div class="tblwrap"><table><thead><tr><th>Código</th><th>Item</th><th class="r">Qtd</th>
    <th class="r" style="width:96px">No grid</th><th class="r">No solo</th><th class="r">Peso suspenso</th><th class="r">Peso no solo</th></tr></thead><tbody>
  ${o.itens.map((i,ix)=>{const it=item(i.cod), a=qtdAerea(i);
    return `<tr><td><span class="tag">${i.cod}</span></td><td>${esc(it.nome)}</td>
    <td class="r num">${i.qtd}</td>
    <td class="r"><input type="number" min="0" max="${i.qtd}" value="${a}" data-rig="${ix}" ${can("editar_memorial")?"":"disabled"} style="width:76px;text-align:right;padding:4px 7px;font-size:12px"></td>
    <td class="r num ${i.qtd-a?"":"muted"}">${i.qtd-a}</td>
    <td class="r num ${a?"":"muted"}">${a?kg(it.peso*a):"—"}</td>
    <td class="r num ${i.qtd-a?"":"muted"}">${i.qtd-a?kg(it.peso*(i.qtd-a)):"—"}</td></tr>`;}).join("")}
  </tbody></table></div>
  <div class="pad" style="border-top:1px solid var(--line2)"><p class="muted" style="margin:0;font-size:11.5px;line-height:1.55">
    Um mesmo equipamento pode ir suspenso num evento e apoiado no outro — por isso a aplicação é definida aqui, na OS, e não no cadastro do item.
    O que estiver <b>no grid</b> entra no memorial aéreo; o resto entra no memorial de solo.</p></div></div>`;
}

function abaSolo(o,ro){
  const p=o.solo, r=calcSolo(o);
  const f=(k,l,v,st,sf)=>`<div class="field"><label for="solo_${k}">${l}</label><input id="solo_${k}" type="number" data-calc="solo" data-k="${k}" value="${v}" step="${st||1}" ${ro?"disabled":""}>${sf?`<span class="muted" style="font-size:10.5px">${sf}</span>`:""}</div>`;
  return `<div class="grid" style="grid-template-columns:minmax(260px,340px) 1fr">
    <div class="card"><header><h3>Parâmetros do local</h3></header><div class="pad" style="display:grid;gap:11px">
      ${f("area","Área de apoio (m²)",p.area,1)}
      ${f("adm","Carga admissível distribuída (kgf/m²)",p.adm,10,"Informada pelo memorial do pavilhão · NBR 6120")}
      ${f("admPont","Carga admissível pontual (kgf)",p.admPont,10,"Por sapata / pé de apoio")}
      ${f("publicoKgm2","Sobrecarga de público (kgf/m²)",p.publicoKgm2,10,"300 kgf/m² para aglomeração em pé")}
      ${f("apoios","Apoios por equipamento pesado",p.apoios,1)}
      <label class="flex" style="gap:8px;font-size:12.5px;cursor:pointer"><input type="checkbox" data-calc="solo" data-k="torres" ${p.torres?"checked":""} ${ro?"disabled":""} style="width:auto"> Grid aéreo apoiado em torres de solo</label>
      ${ro?`<div class="pill warn">somente leitura neste perfil</div>`:`<button class="btn pri" data-act="fecharSolo" data-id="${o.id}">${p.feito?"Revalidar memorial":"Concluir memorial de solo"}</button>`}
    </div></div>
    <div><div class="card"><header><h3>Memorial de cálculo · solo</h3><span class="hint">ART a ser emitida pelo eng. responsável (CREA)</span></header>
      <div class="res" style="border:0" id="soloRes">${soloRes(r,p)}</div></div>
      <div style="margin-top:12px" id="soloVer">${soloVer(r)}</div>
      <p class="muted" style="font-size:11px;margin:10px 2px 0;line-height:1.6">Critério: a soma da carga distribuída dos equipamentos com a sobrecarga de público não pode superar a carga admissível do piso, e nenhum apoio isolado pode superar a carga pontual admissível. Referência ABNT NBR 6120 (cargas para o cálculo de estruturas de edificações).</p>
    </div></div>`;
}
function soloRes(r,p){
  return `<div class="row"><div class="n">Equipamentos apoiados no solo</div><div class="v">${kg(r.pEq)} <u>kgf</u></div></div>
  <div class="row"><div class="n">Grid aéreo transferido às torres<small>${p.torres?"torres de solo — carga somada":"suspenso na estrutura do local"}</small></div><div class="v">${kg(r.transf)} <u>kgf</u></div></div>
  <div class="row hl"><div class="n"><b>Carga total sobre o piso</b></div><div class="v">${kg(r.total)} <u>kgf</u></div></div>
  <div class="row"><div class="n">Carga distribuída dos equipamentos<small>${kg(r.total)} kgf ÷ ${dec(r.area,0)} m²</small></div><div class="v">${dec(r.dEq,1)} <u>kgf/m²</u></div></div>
  <div class="row"><div class="n">Sobrecarga de público</div><div class="v">${dec(r.dPub,0)} <u>kgf/m²</u></div></div>
  <div class="row hl"><div class="n"><b>Carga distribuída de projeto</b><small>limite do local: ${dec(p.adm,0)} kgf/m²</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.util>1?"crit":r.util>.8?"warn":""}" style="width:${Math.min(100,r.util*100).toFixed(0)}%"></i></span>${dec(r.dTot,1)} <u>kgf/m² · ${(r.util*100).toFixed(0)}%</u></div></div>
  <div class="row"><div class="n">Item mais pesado<small>${esc(r.maior.nome)}</small></div><div class="v">${kg(r.maior.peso)} <u>kgf</u></div></div>
  <div class="row hl"><div class="n"><b>Carga pontual por apoio</b><small>limite: ${dec(p.admPont,0)} kgf</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.utilP>1?"crit":r.utilP>.8?"warn":""}" style="width:${Math.min(100,r.utilP*100).toFixed(0)}%"></i></span>${dec(r.pont,0)} <u>kgf · ${(r.utilP*100).toFixed(0)}%</u></div></div>`;
}
function soloVer(r){
  return r.ok?`<div class="verdict ok"><div><b>Verificação atendida</b>A carga de projeto está dentro do limite do piso e nenhum apoio isolado excede a carga pontual admissível.</div></div>`
   :`<div class="verdict crit"><div><b>Verificação não atendida</b>${r.util>1?"A carga distribuída de projeto supera a admissível do piso. ":""}${r.utilP>1?"A carga pontual por apoio supera o limite — usar placa de distribuição sob os pés. ":""}Reveja área de apoio, distribuição ou parâmetros do local.</div></div>`;
}

function abaAereo(o,ro){
  const p=o.aereo, r=calcAereo(o);
  const f=(k,l,v,st,sf)=>`<div class="field"><label for="ae_${k}">${l}</label><input id="ae_${k}" type="number" data-calc="aereo" data-k="${k}" value="${v}" step="${st||1}" ${ro?"disabled":""}>${sf?`<span class="muted" style="font-size:10.5px">${sf}</span>`:""}</div>`;
  return `<div class="grid" style="grid-template-columns:minmax(260px,340px) 1fr">
    <div class="card"><header><h3>Parâmetros de rigging</h3></header><div class="pad" style="display:grid;gap:11px">
      ${f("pontos","Pontos de ancoragem",p.pontos,1)}
      ${f("wllPonto","WLL por ponto do local (kgf)",p.wllPonto,50,"Conforme memorial do pavilhão")}
      ${f("fd","Fator dinâmico de içamento",p.fd,0.05,"1,10 a 1,30 para talha manual")}
      ${f("fdes","Fator de desbalanceamento",p.fdes,0.05,"Distribuição desigual entre pontos")}
      ${f("wllAcess","WLL do acessório · sling (kgf)",p.wllAcess,100,"Sling de poliéster, CR = 7 × WLL")}
      ${f("fsMin","Coeficiente de segurança mínimo",p.fsMin,1,"FS ≥ 5 sobre carga de ruptura")}
      ${f("vao","Vão livre da treliça (m)",p.vao,0.5,"Flecha admissível L/200")}
      ${ro?`<div class="pill warn">somente leitura neste perfil</div>`:`<button class="btn pri" data-act="fecharAereo" data-id="${o.id}">${p.feito?"Revalidar memorial":"Concluir memorial aéreo"}</button>`}
    </div></div>
    <div><div class="card"><header><h3>Memorial de cálculo · aéreo</h3><span class="hint">içamento e ancoragem</span></header>
      <div class="res" style="border:0" id="aeRes">${aeRes(r,p)}</div></div>
      <div style="margin-top:12px" id="aeVer">${aeVer(r,p)}</div>
      <p class="muted" style="font-size:11px;margin:10px 2px 0;line-height:1.6">Carga de projeto = massa suspensa × fator dinâmico × fator de desbalanceamento. A carga por ponto é comparada ao WLL do ponto de ancoragem do local; o coeficiente de segurança do acessório usa a carga de ruptura (7 × WLL para cinta de poliéster). Inspeção de slings, manilhas e talhas registrada antes de cada içamento.</p>
    </div></div>`;
}
function aeRes(r,p){
  if(r.apoiadoSolo) return `<div class="row hl"><div class="n"><b>Grid apoiado em torres de solo</b><small>não há içamento em pontos da estrutura do local</small></div><div class="v">${kg(r.bruto)} <u>kgf no solo</u></div></div>
  <div class="row"><div class="n">Massa do grid<small>verificada no memorial de solo</small></div><div class="v">${kg(r.bruto)} <u>kgf</u></div></div>`;
  return `<div class="row"><div class="n">Massa suspensa</div><div class="v">${kg(r.efetivo)} <u>kgf</u></div></div>
  <div class="row"><div class="n">Carga de projeto<small>${kg(r.efetivo)} × ${dec(p.fd,2)} × ${dec(p.fdes,2)}</small></div><div class="v">${kg(r.proj)} <u>kgf</u></div></div>
  <div class="row hl"><div class="n"><b>Carga por ponto de ancoragem</b><small>${r.n} pontos · WLL ${dec(p.wllPonto,0)} kgf</small></div>
    <div class="v"><span class="meter" style="display:inline-block;vertical-align:middle;margin-right:8px"><i class="${r.util>1?"crit":r.util>.8?"warn":""}" style="width:${Math.min(100,r.util*100).toFixed(0)}%"></i></span>${dec(r.porPonto,0)} <u>kgf · ${(r.util*100).toFixed(0)}%</u></div></div>
  <div class="row"><div class="n">Carga de ruptura do acessório<small>7 × WLL ${dec(p.wllAcess,0)} kgf</small></div><div class="v">${kg(r.cr)} <u>kgf</u></div></div>
  <div class="row hl"><div class="n"><b>Coeficiente de segurança resultante</b><small>exigido ≥ ${dec(p.fsMin,0)}:1</small></div><div class="v">${isFinite(r.fs)?dec(r.fs,1):"—"} <u>: 1</u></div></div>
  <div class="row"><div class="n">Flecha admissível da treliça<small>vão ${dec(p.vao,1)} m · L/200</small></div><div class="v">${dec(r.flecha,0)} <u>mm</u></div></div>`;
}
function aeVer(r,p){
  if(r.apoiadoSolo) return `<div class="verdict warn"><div><b>Sem içamento</b>O grid está apoiado em torres de solo. A verificação estrutural é feita integralmente no memorial de solo; conclua esta etapa para registrar a decisão de projeto.</div></div>`;
  return r.ok?`<div class="verdict ok"><div><b>Rigging aprovado</b>Utilização de ${(r.util*100).toFixed(0)}% dos pontos de ancoragem e coeficiente de segurança de ${dec(r.fs,1)}:1 sobre a carga de ruptura dos acessórios.</div></div>`
   :`<div class="verdict crit"><div><b>Rigging reprovado</b>${r.util>1?"A carga por ponto supera o WLL do local — aumente o número de pontos ou redistribua o grid. ":""}${r.fs<p.fsMin?"O coeficiente de segurança do acessório está abaixo do mínimo exigido — especifique sling de maior WLL.":""}</div></div>`;
}

const MODELO = o => `1. OBJETO\nFornecimento, montagem, operação e desmontagem de estrutura, sonorização, iluminação e painel de LED para ${o.evento}, em ${o.local}, ${o.cidade}.\n\n2. ESTRUTURA\nGrid em treliça Box Truss com vão livre de ${dec(o.aereo.vao,2)} m. Carga suspensa de ${kg(pesoPor(o.itens,"aereo"))} kgf distribuída em ${o.aereo.pontos} pontos de ancoragem.\n\n3. RIGGING\nTalhas manuais, slings de poliéster WLL ${dec(o.aereo.wllAcess,0)} kgf e manilhas âncora. Inspeção visual dos acessórios registrada antes do içamento. Coeficiente de segurança mínimo ${dec(o.aereo.fsMin,0)}:1.\n\n4. PISO E APOIOS\nCarga distribuída de projeto de ${dec(calcSolo(o).dTot,1)} kgf/m² sobre área de ${dec(o.solo.area,0)} m², limite do local ${dec(o.solo.adm,0)} kgf/m².\n\n5. ENERGIA\nGerador silenciado com quadro de transferência automática e aterramento com resistência ≤ 10 Ω.\n\n6. CRONOGRAMA\nCarga ${dtl(o.montagem)} · evento ${dtl(o.evIni)} · desmontagem ${dtl(o.desmontagem)}.\n\n7. RESPONSABILIDADE TÉCNICA\nART de execução a ser emitida pelo engenheiro responsável junto ao CREA antes do início da montagem.`;

function abaDesc(o,ro){
  return `<div class="card"><header><h3>Descritivo técnico</h3><span class="hint">acompanha a ART e a ordem de carga</span>
    ${ro?"":`<button class="btn sm" data-act="modelo" data-id="${o.id}">Inserir modelo</button>`}</header>
    <div class="pad"><textarea id="descTxt" rows="18" ${ro?"disabled":""} placeholder="Descreva objeto, estrutura, rigging, energia, cronograma e responsabilidade técnica…">${esc(o.descritivo||"")}</textarea>
    <div class="between" style="margin-top:11px"><span class="muted" style="font-size:11.5px">Mínimo de 40 caracteres para concluir a etapa.</span>
    ${ro?`<span class="pill warn">somente leitura neste perfil</span>`:`<button class="btn pri" data-act="salvarDesc" data-id="${o.id}">Salvar descritivo</button>`}</div></div></div>`;
}
</script>
<script>
/* ---------------- Inventário ---------------- */
function vEstoque(){
  const {de,ate}=S.per, dias=Math.max(1,diffDays(de,ate)+1);
  const cats=[...new Set(S.cat.map(c=>c.cat))];
  const filtro=S.filtroCat||"";
  const lista=S.cat.filter(c=>!filtro||c.cat===filtro);
  const crit=lista.filter(c=>disponivel(c.cod,de,ate)<0).length;
  return `<div class="card" style="margin-bottom:14px"><header><h3>Disponibilidade por janela de locação</h3>
    <span class="hint">a baixa ocorre na data da carga e a entrada na data da descarga</span></header>
    <div class="pad"><div class="flex" style="gap:12px;align-items:flex-end">
      <div class="field" style="width:150px"><label for="perDe">Data da carga</label><input id="perDe" type="date" value="${de}" data-per="de"></div>
      <div class="field" style="width:150px"><label for="perAte">Data da descarga</label><input id="perAte" type="date" value="${ate}" data-per="ate"></div>
      <div class="field" style="width:190px"><label for="fCat">Categoria</label><select id="fCat" data-filtro="cat"><option value="">Todas</option>${cats.map(c=>`<option ${filtro===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
      <div style="flex:1"></div>
      <div class="flex" style="gap:8px"><span class="pill acc"><span class="dot"></span>${dias} diária${dias>1?"s":""}</span>
      <span class="pill ${crit?"crit":"ok"}"><span class="dot"></span>${crit?crit+" item(ns) sem saldo":"todos os itens com saldo"}</span></div>
    </div></div></div>

  <div class="card"><div class="tblwrap"><table><thead><tr>
    <th>Código</th><th>Item</th><th>Categoria</th><th class="r">Un/case</th><th class="r">Consumo</th><th class="r">Peso un.</th><th class="r">Total</th><th class="r">Manut.</th><th class="r">Em campo</th><th class="r">Reservado</th><th class="r">Disponível</th><th style="width:96px">Ocupação</th></tr></thead><tbody>
  ${lista.map(c=>{const res=reservado(c.cod,de,ate), campo=emCampo(c.cod), cap=c.total-c.manut, disp=cap-res, oc=cap?res/cap:0;
    return `<tr class="clickable" data-act="editarItem" data-id="${c.cod}"><td><span class="tag">${c.cod}</span></td><td><b style="font-weight:500">${esc(c.nome)}</b></td>
    <td class="muted" style="font-size:12px">${esc(c.cat)}</td>
    <td class="r num muted">${c.porCase||1}</td>
    <td class="r num ${c.watts?"":"muted"}">${c.watts?kwFmt(c.watts):"—"}</td>
    <td class="r num muted">${dec(c.peso,1)}</td>
    <td class="r num">${c.total}</td><td class="r num ${c.manut?"":"muted"}" style="${c.manut?"color:var(--warn)":""}">${c.manut||"—"}</td>
    <td class="r num ${campo?"":"muted"}">${campo||"—"}</td><td class="r num">${res||"—"}</td>
    <td class="r num" style="font-weight:600;color:${disp<0?"var(--crit)":disp<cap*0.15?"var(--warn)":"var(--ink)"}">${disp}</td>
    <td><span class="meter" style="width:100%"><i class="${oc>1?"crit":oc>.85?"warn":""}" style="width:${Math.min(100,oc*100).toFixed(0)}%"></i></span></td></tr>`;}).join("")}
  </tbody></table></div></div>
  <p class="muted" style="font-size:11px;margin:10px 2px 0;line-height:1.6">Clique em qualquer linha para abrir a ficha do item — peso, unidades por case, consumo em watts, aplicação e diária. Reservado no período = soma das quantidades de todas as Ordens de Carga com status Liberada, Em separação ou Carregada cuja janela <span class="mono">carga → descarga</span> se sobrepõe ao intervalo consultado. Em campo = peças já baixadas fisicamente e ainda não retornadas.</p>`;
}

/* ---------------- Ordens de carga ---------------- */
const OSCCOR={"Liberada":"acc","Em separação":"warn","Carregada":"ok","Retornada":""};
function vCargas(){
  if(S.sel) return vOSC();
  const cs=S.cargas.slice().sort((a,b)=>a.carga<b.carga?-1:1);
  return `<div class="sechead"><h2>Ordens de Serviço de Carga</h2><p>Emitidas pela produção. O estoque separa, confirma a carga (baixa) e registra o retorno na descarga.</p></div>
  <div class="card"><div class="tblwrap"><table><thead><tr><th>Ordem</th><th>Evento</th><th>Carga</th><th>Descarga</th><th class="r">Peças</th><th>Veículo / equipe</th><th>Status</th><th></th></tr></thead><tbody>
  ${cs.map(c=>{const o=c.osId?osById(c.osId):null;const prox=c.status!=="Retornada"&&c.carga>=HOJE;
    return `<tr class="clickable" data-act="osc" data-id="${c.id}"><td><span class="tag">${c.id}</span></td>
    <td><b>${esc(o?o.evento:c.evento||"—")}</b><br><span class="muted" style="font-size:11px">${esc(o?cli(o.cliente).nome:"—")}</span></td>
    <td class="num">${dtl(c.carga)}<br><span class="muted" style="font-size:11px">${c.horaCarga||""}</span></td>
    <td class="num">${dtl(c.descarga)}<br><span class="muted" style="font-size:11px">${diffDays(c.carga,c.descarga)} diárias</span></td>
    <td class="r num">${c.itens.reduce((s,i)=>s+i.qtd,0)}</td>
    <td style="font-size:11.5px">${esc(c.veiculo)}<br><span class="muted">${esc(c.equipe)}</span></td>
    <td><span class="pill ${OSCCOR[c.status]||""}"><span class="dot"></span>${esc(c.status)}</span></td>
    <td class="r">${prox?`<span class="pill">${diffDays(HOJE,c.carga)===0?"hoje":"em "+diffDays(HOJE,c.carga)+"d"}</span>`:""}</td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}

function vOSC(){
  const c=oscById(S.sel); if(!c) return vCargas();
  const o=c.osId?osById(c.osId):null;
  const pode=can("movimentar");
  let acao="";
  if(c.status==="Liberada") acao=`<button class="btn pri" data-act="separar" data-id="${c.id}" ${pode?"":"disabled"}>Iniciar separação</button>`;
  if(c.status==="Em separação") acao=`<button class="btn pri" data-act="confirmarCarga" data-id="${c.id}" ${pode?"":"disabled"}>Confirmar carga · baixa em ${dt(c.carga)}</button>`;
  if(c.status==="Carregada") acao=`<button class="btn pri" data-act="registrarRetorno" data-id="${c.id}" ${pode?"":"disabled"}>Registrar descarga · entrada em ${dt(c.descarga)}</button>`;
  if(c.status==="Retornada") acao=`<span class="pill ok"><span class="dot"></span>Ciclo encerrado</span>`;
  const semSaldo=c.itens.filter(i=>{const it=item(i.cod);return it.total-it.manut-reservado(i.cod,c.carga,c.descarga,c.id)<i.qtd;});
  return `<div class="between" style="margin-bottom:14px">
    <div><button class="btn sm ghost" data-act="go" data-view="cargas">← Ordens de carga</button>
      <h2 style="font-size:19px;margin-top:6px">${esc(o?o.evento:c.evento||c.id)}</h2>
      <div class="flex" style="margin-top:5px"><span class="tag">${c.id}</span>${o?`<span class="tag">${o.id}</span>`:""}
      <span class="pill ${OSCCOR[c.status]||""}"><span class="dot"></span>${esc(c.status)}</span></div></div>
    <div class="flex">${acao}${!pode?`<span class="pill warn">somente leitura neste perfil</span>`:""}</div></div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(275px,1fr))">
    <div class="card"><header><h3>Janela de locação</h3></header><div class="res" style="border:0">
      <div class="row hl"><div class="n"><b>Data da carga</b><small>baixa do estoque físico</small></div><div class="v">${dtl(c.carga)} <u>${c.horaCarga||""}</u></div></div>
      <div class="row hl"><div class="n"><b>Data da descarga</b><small>retorno ao estoque</small></div><div class="v">${dtl(c.descarga)}</div></div>
      <div class="row"><div class="n">Diárias faturadas</div><div class="v">${diffDays(c.carga,c.descarga)}</div></div>
      <div class="row"><div class="n">Veículo</div><div class="v" style="font-family:var(--sans);font-size:12.5px">${esc(c.veiculo)}</div></div>
      <div class="row"><div class="n">Equipe</div><div class="v" style="font-family:var(--sans);font-size:12.5px">${esc(c.equipe)}</div></div>
      <div class="row"><div class="n">Conferente</div><div class="v" style="font-family:var(--sans);font-size:12.5px">${esc(c.conferente)}</div></div>
    </div></div>
    <div class="card"><header><h3>Local e observações</h3></header><div class="pad" style="display:grid;gap:9px;font-size:12.5px">
      ${o?`<div><span class="lbl">Local</span><div>${esc(o.local)}</div><div class="muted">${esc(o.cidade)}</div></div>
      <div><span class="lbl">Montagem → desmontagem</span><div class="num">${dtl(o.montagem)} → ${dtl(o.desmontagem)}</div></div>`:""}
      <div><span class="lbl">Observações</span><div style="color:var(--ink2)">${esc(c.obs||"—")}</div></div>
      ${semSaldo.length?`<div class="verdict crit"><div><b>Saldo insuficiente</b>${semSaldo.map(i=>esc(item(i.cod).nome)).join(", ")} — reservas concorrentes na mesma janela.</div></div>`:
        `<div class="verdict ok"><div><b>Saldo confirmado</b>Todos os itens têm disponibilidade na janela ${dt(c.carga)} → ${dt(c.descarga)}.</div></div>`}
    </div></div>
  </div>

  <div class="card" style="margin-top:14px"><header><h3>Romaneio de carga</h3><span class="hint">${(()=>{const t=somaTecnica(c.itens);return t.pecas+" peças · "+t.cases+" cases · "+kg(t.peso)+" kgf · "+kwFmt(t.w);})()}</span></header>
  <div class="tblwrap"><table><thead><tr><th>Código</th><th>Item</th><th class="r">Qtd</th><th class="r">Cases</th><th class="r">Peso (kgf)</th><th class="r">Consumo</th><th class="r">Disponível na janela</th><th>Situação</th></tr></thead><tbody>
  ${c.itens.map(i=>{const it=item(i.cod);const disp=it.total-it.manut-reservado(i.cod,c.carga,c.descarga,c.id);const ok=disp>=i.qtd;
    return `<tr><td><span class="tag">${i.cod}</span></td><td>${esc(it.nome)}</td><td class="r num" style="font-weight:600">${i.qtd}</td>
    <td class="r num">${cases(i.cod,i.qtd)}</td>
    <td class="r num muted">${kg(it.peso*i.qtd)}</td><td class="r num muted">${it.watts?kwFmt(it.watts*i.qtd):"—"}</td>
    <td class="r num" style="color:${ok?"var(--ink2)":"var(--crit)"}">${disp}</td>
    <td><span class="pill ${c.status==="Carregada"?"ok":ok?"":"crit"}">${c.status==="Carregada"?"em campo":ok?"reservado":"sem saldo"}</span></td></tr>`;}).join("")}
  </tbody></table></div></div>`;
}

/* ---------------- movimentos ---------------- */
function vMovs(){
  const ms=S.movs.slice().sort((a,b)=>a.data<b.data?1:-1);
  return `<div class="sechead"><h2>Livro de movimentações</h2><p>Cada confirmação de carga gera uma baixa datada; cada descarga gera a entrada correspondente.</p></div>
  <div class="card"><div class="tblwrap"><table><thead><tr><th>Lançamento</th><th>Data</th><th>Tipo</th><th>Referência</th><th class="r">Linhas</th><th class="r">Peças</th><th>Responsável</th></tr></thead><tbody>
  ${ms.map(m=>`<tr class="clickable" data-act="verMov" data-id="${m.id}"><td><span class="tag">${m.id}</span></td><td class="num">${dtl(m.data)}</td>
    <td><span class="pill ${m.tipo==="SAÍDA"?"warn":"ok"}"><span class="dot"></span>${m.tipo}</span></td>
    <td>${esc(m.ref)}<br><span class="muted" style="font-size:11px">${esc(m.oscId||"")}</span></td>
    <td class="r num">${m.linhas.length}</td><td class="r num">${m.linhas.reduce((s,l)=>s+l[1],0)}</td>
    <td style="font-size:12px">${esc(m.user)}${m.avarias?`<br><span class="pill crit" style="margin-top:3px">${m.avarias.reduce((s,a)=>s+a[1],0)} avaria(s)</span>`:""}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

/* ---------------- agenda ---------------- */
function vAgenda(){
  const ini="2026-09-15", fim="2026-10-31", n=diffDays(ini,fim)+1;
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const dias=[...Array(n)].map((_,i)=>addDays(ini,i));
  const pos=d=>((diffDays(ini,d))/n*100);
  const linhas=S.cargas.slice().sort((a,b)=>a.carga<b.carga?-1:1).map(c=>{

  });
  const prev=S.os.filter(o=>!oscDaOS(o.id)).map(o=>({tit:o.evento,sub:o.id+" · carga prevista",de:o.montagem,ate:o.desmontagem,cls:"prev",id:o.id,tipo:"osv"}));
  const all=[...linhas,...prev].filter(r=>overlap(r.de,r.ate,ini,fim));

    </div></div>
    ${all.map(r=>{const l=pos(r.de<ini?ini:r.de), w=Math.max(2,(diffDays(r.de<ini?ini:r.de,(r.ate>fim?fim:r.ate))+1)/n*100);
      return `<div class="tlrow"><div class="lead"><b>${esc(r.tit)}</b><span>${esc(r.sub)}</span></div>
      <div class="track"><div class="bar ${r.cls}" style="left:${l}%;width:${w}%;cursor:pointer" data-act="${r.tipo==="osc"?"osc":"osv"}" data-id="${r.id}">${dt(r.de)} → ${dt(r.ate)}</div>
      ${r===all[0]?`<div class="nowline" style="left:${pos(HOJE)+(100/n/2)}%"></div>`:""}</div></div>`;}).join("")}

}

    if(c.descarga===iso) out.push({id:c.id+"-r",titulo:"Descarga · "+nm,data:iso,hora:"18:00",tipo:"descarga",oscId:c.id,resp:["u3","u5"],local:c.veiculo,fonte:"osc"});
  }
  return out.sort((a,b)=>(a.hora||"")<(b.hora||"")?-1:1);
}
const TIPOCOR={reuniao:"acc",visita:"acc",prazo:"crit",montagem:"warn",evento:"",desmontagem:"warn",carga:"ok",descarga:"ok"};
const TIPONOME={reuniao:"Reunião",visita:"Visita técnica",prazo:"Prazo",montagem:"Montagem",evento:"Evento",desmontagem:"Desmontagem",carga:"Carga",descarga:"Descarga"};

/* ---- escrita ---- */
function postarMsg(chatId,txt,sys){
  if(!txt||!txt.trim()) return;
  S.msgs.push({id:"msg"+Date.now()+Math.floor(Math.random()*99),chat:chatId,autor:sys?"sistema":me().id,ts:nowTs(),txt:txt.trim(),sys:!!sys});
  marcarLido(chatId);
}
function marcarLido(chatId){ if(!S.lidos[S.role]) S.lidos[S.role]={}; S.lidos[S.role][chatId]=nowTs(); }
function avisar(txt,para,view,sel,tipo){
  S.notifs.push({id:"nt"+Date.now()+Math.floor(Math.random()*99),ts:nowTs(),txt,para:para||["gerencia","producao","estoque"],view:view||"painel",sel:sel||null,tipo:tipo||"info",lida:{[S.role]:true}});
}
function postarMural(txt,sys){
  S.posts.unshift({id:"p"+Date.now(),autor:sys?"sistema":me().id,ts:nowTs(),txt,likes:[],coments:[],sys:!!sys});
}
function canalDaOS(osId){
  let c=S.chats.find(x=>x.osId===osId);
  if(!c){ const o=osById(osId); if(!o) return null;
    c={id:"ch-"+osId.slice(-4),tipo:"os",osId,nome:o.evento,membros:["u1","u2","u3"]}; S.chats.push(c); }
  return c;
}
/* evento de fluxo: notifica, posta no canal da OS e registra no mural quando relevante */
function fluxo(osId,txt,para,view,sel,mural){
  const c=osId?canalDaOS(osId):null;
  if(c) S.msgs.push({id:"msg"+Date.now()+Math.floor(Math.random()*99),chat:c.id,autor:"sistema",ts:nowTs(),txt,sys:true});
  avisar(txt,para,view,sel,"fluxo");
  if(mural) postarMural(txt,true);
}

<script>
/* ================= MURAL ================= */
function vMural(){
  return `<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:14px;align-items:start">

        <div style="flex:1;min-width:0"><textarea id="muralTxt" rows="2" placeholder="Compartilhe um aviso com o time…"></textarea>
        <div class="between" style="margin-top:8px"><span class="muted" style="font-size:11px">Publicado como ${esc(me().nome)} · visível para toda a operação</span>
        <button class="btn pri sm" data-act="publicar">Publicar</button></div></div>
      </div></div>
      ${S.posts.map(p=>{const a=usr(p.autor);const curti=p.likes.includes(me().id);
        return `<article class="post"><div class="in">${a.id==="sistema"?`<span class="av" style="background:var(--ink3);color:#FFF;width:30px;height:30px;font-size:12px">SY</span>`:av(a,30)}
          <div class="bd"><div class="hd"><b>${esc(a.nome)}</b><span>${esc(a.cargo||"Registro automático do sistema")}</span><span>·</span><span>${tsRel(p.ts)}</span></div>
          <p class="tx">${linkify(p.txt)}</p></div></div>
          <div class="acts"><button class="btn sm likebtn ${curti?"on":""}" data-act="curtir" data-id="${p.id}">${curti?"✓ Curtido":"Curtir"}${p.likes.length?" · "+p.likes.length:""}</button>
            <button class="btn sm ghost" data-act="comentarFoco" data-id="${p.id}">Comentar${p.coments.length?" · "+p.coments.length:""}</button>
            <div style="flex:1"></div>${p.likes.length?`<div class="membros">${p.likes.slice(0,5).map(u=>av(usr(u),20)).join("")}</div>`:""}</div>
          ${p.coments.length||true?`<div class="cmts">
            ${p.coments.map(c=>`<div class="cmt">${av(usr(c.autor),24)}<div class="b"><b>${esc(usr(c.autor).nome)}</b>${linkify(c.txt)}<time class="muted mono" style="font-size:10px;display:block;margin-top:3px">${tsRel(c.ts)}</time></div></div>`).join("")}
            <div class="cmt">${av(me(),24)}<input id="cmt_${p.id}" placeholder="Escrever um comentário…" data-cmt="${p.id}"></div></div>`:""}
        </article>`;}).join("")}
    </div>
    <div class="grid" style="gap:12px">
      <div class="card"><header><h3>Quem está na operação</h3></header><div class="res" style="border:0">
        ${USERS.map(u=>`<div class="row"><div class="n" style="display:flex;gap:9px;align-items:center">${av(u,26)}<span><b style="font-size:12.5px">${esc(u.nome)}</b><small style="font-family:var(--sans);color:var(--ink3)">${esc(u.cargo)}</small></span></div>
          <div class="v"><span class="pill ${u.role===S.role?"acc":""}">${esc(PERFIS[u.role]?PERFIS[u.role].label:u.role)}</span></div></div>`).join("")}
      </div></div>
      <div class="card"><header><h3>Agenda de hoje</h3><span class="hint">${dtl(HOJE)}</span></header>
        ${(()=>{const l=compromissosDo(HOJE);return l.length?`<div class="res" style="border:0">${l.map(c=>`<div class="row"><div class="n"><b style="font-size:12.5px">${esc(c.titulo)}</b><small style="font-family:var(--sans);color:var(--ink3)">${esc(c.local||"—")}</small></div><div class="v">${esc(c.hora||"")}<br><span class="pill ${TIPOCOR[c.tipo]||""}" style="margin-top:3px">${TIPONOME[c.tipo]}</span></div></div>`).join("")}</div>`:`<div class="empty">Nenhum compromisso hoje.</div>`;})()}

/* ================= CHAT ================= */
function vChat(){
  const meus=S.chats.filter(visivelPraMim);
  const sel=chatById(S.chatSel)&&visivelPraMim(chatById(S.chatSel))?chatById(S.chatSel):meus[0];
  if(!sel) return `<div class="empty">Nenhuma conversa disponível para este perfil.</div>`;
  const grupos=[["Canais",meus.filter(c=>c.tipo==="canal")],["Eventos em produção",meus.filter(c=>c.tipo==="os")],["Mensagens diretas",meus.filter(c=>c.tipo==="dm")]];
  const ms=msgsDo(sel.id);
  let ultimoDia="";
  const corpo=ms.map(m=>{
    let sep="";
    if(tsData(m.ts)!==ultimoDia){ultimoDia=tsData(m.ts);sep=`<div class="daysep">${ultimoDia===HOJE?"hoje":dtl(ultimoDia)}</div>`;}
    if(m.sys) return sep+`<div class="msg sys"><div class="bub">${linkify(m.txt)} · ${tsHora(m.ts)}</div></div>`;
    const a=usr(m.autor), mine=m.autor===me().id;
    return sep+`<div class="msg ${mine?"mine":""}">${av(a,28)}<div class="bub">
      <div class="who">${mine?"Você":esc(a.nome)}<time>${tsHora(m.ts)}</time></div>
      <div class="tx">${linkify(m.txt)}</div></div></div>`;
  }).join("");
  const o=sel.tipo==="os"?osById(sel.osId):null;
  return `<div class="chatwrap">
    <div class="chatlist">
      <div class="srch"><input id="chatSrch" placeholder="Buscar conversa…" value="${esc(S.chatQ||"")}" data-chatq="1"></div>
      <div class="scroll">${grupos.map(([g,l])=>{
        const f=l.filter(c=>!S.chatQ||chatNome(c).toLowerCase().includes(S.chatQ.toLowerCase()));
        if(!f.length) return "";
        return `<div class="grp">${g}</div>`+f.map(c=>{const u=naoLidas(c),lm=ultimaMsg(c);
          return `<div class="crow ${c.id===sel.id?"on":""}" data-act="abrirChat" data-id="${c.id}">
            ${c.tipo==="dm"?av(usr(c.membros.find(m=>m!==me().id)||c.membros[0]),30):`<span class="av" style="background:${c.tipo==="os"?"var(--warn)":"var(--accent)"};color:var(--onSolid);width:30px;height:30px;font-size:11px;border-radius:8px">${c.tipo==="os"?"OS":"#"}</span>`}
            <span class="tx"><b>${esc(chatNome(c))}</b><span>${lm?(lm.sys?"":esc(usr(lm.autor).nome.split(" ")[0])+": ")+esc(lm.txt.slice(0,42)):esc(chatSub(c))}</span></span>
            <span class="meta"><time>${lm?tsHora(lm.ts):""}</time>${u?`<span class="ub">${u}</span>`:""}</span></div>`;}).join("");
      }).join("")}</div>
    </div>
    <div class="chatmain">
      <div class="chathead">
        <div><h3>${esc(chatNome(sel))}</h3><span class="muted" style="font-size:11.5px">${esc(chatSub(sel))}</span></div>
        ${o?`<button class="btn sm" data-act="osv" data-id="${o.id}">Abrir OS</button>`:""}
        <div class="membros">${sel.membros.slice(0,6).map(u=>av(usr(u),24)).join("")}</div>
      </div>
      <div class="chatbody" id="chatBody">${corpo||`<div class="empty">Comece a conversa.</div>`}</div>
      <div class="composer">
        <textarea id="msgTxt" rows="1" placeholder="Escreva para ${esc(chatNome(sel))}…   (Enter envia · Shift+Enter quebra linha)"></textarea>
        <button class="btn pri" data-act="enviarMsg" data-id="${sel.id}">Enviar</button>
      </div>
    </div></div>
  <p class="muted" style="font-size:11px;margin:10px 2px 0">Escreva <span class="mono">OSV-2026-0148</span> ou <span class="mono">OSC-2026-0312</span> em qualquer mensagem para criar um link direto para a ordem. Use <span class="mono">@Nome</span> para mencionar alguém.</p>`;
}

/* ================= NOTAS ================= */
function vNotas(){
  const tags=[...new Set(notasVisiveis().flatMap(n=>n.tags))];
  const f=S.notaFiltro||"";
  const lista=notasVisiveis().filter(n=>!f||n.tags.includes(f)).sort((a,b)=>(b.fixada?1:0)-(a.fixada?1:0)||(a.ts<b.ts?1:-1));
  return `<div class="sechead"><h2>Notas da operação</h2><p>Combinados com cliente, checklists de processo e lembretes — podem ficar ligadas a uma OS.</p>
    <div style="flex:1"></div>
    <div class="flex" style="gap:6px"><button class="btn sm ${!f?"pri":""}" data-act="tagFiltro" data-tag="">Todas</button>
    ${tags.map(t=>`<button class="btn sm ${f===t?"pri":""}" data-act="tagFiltro" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}
    <button class="btn pri" data-act="novaNota">+ Nova nota</button></div></div>
  <div class="notegrid">${lista.map(n=>{const a=usr(n.autor),o=n.osId?osById(n.osId):null;
    const feitos=n.checklist.filter(c=>c.ok).length;
    return `<article class="note ${n.cor||""}" data-act="abrirNota" data-id="${n.id}"><div class="bar"></div><div class="in">
      <div class="flex" style="gap:7px">${n.fixada?`<span class="pill acc">fixada</span>`:""}${n.escopo==="privada"?`<span class="pill">privada</span>`:""}
        ${o?`<span class="tag">${o.id}</span>`:""}</div>
      <h4>${esc(n.titulo)}</h4>
      ${n.txt?`<p>${esc(n.txt)}</p>`:""}
      ${n.checklist.length?`<div class="chk">${n.checklist.slice(0,5).map((c,i)=>`<div class="${c.ok?"on":""}"><i class="${c.ok?"on":""}">${c.ok?"✓":""}</i>${esc(c.t)}</div>`).join("")}
        ${n.checklist.length>5?`<div class="muted" style="font-size:11px">+${n.checklist.length-5} itens</div>`:""}</div>`:""}
    </div><footer>${av(a,22)}<span class="muted" style="font-size:11px">${esc(a.nome.split(" ")[0])} · ${tsRel(n.ts)}</span>
      ${n.checklist.length?`<span class="pill ${feitos===n.checklist.length?"ok":"warn"}" style="margin-left:auto">${feitos}/${n.checklist.length}</span>`:`<span style="margin-left:auto"></span>`}
      ${n.tags.map(t=>`<span class="tag" style="font-size:10px">${esc(t)}</span>`).join("")}</footer></article>`;}).join("")||`<div class="empty">Nenhuma nota com esse filtro.</div>`}</div>`;
}
