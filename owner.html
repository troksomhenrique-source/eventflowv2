ze:13px}th{text-align:left;color:var(--ink3);font-size:11px;letter-spacing:.4px;text-transform:uppercase}td,th{padding:13px 8px;border-bottom:1px solid var(--line2)}td small{display:block;color:var(--ink3);margin-top:4px}.empty{padding:32px;text-align:center;background:var(--surface2);border:1px dashed var(--line);border-radius:8px}.login{max-width:420px;margin:8vh auto}.login .brand{margin-bottom:28px}.field{display:grid;gap:6px;margin-bottom:16px}label{font-size:12px;font-weight:600}input,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:11px;background:var(--surface);color:var(--ink)}input:focus,select:focus{outline:2px solid var(--accent)}.help{font-size:12px;margin:5px 0;color:var(--ink3)}.error{padding:12px;background:var(--critSoft);color:var(--crit);border-radius:7px;margin:12px 0;line-height:1.5}.notice{padding:13px;background:var(--surface2);border-radius:8px;margin-bottom:20px}dialog{width:min(520px,calc(100vw - 28px));border:0;border-radius:14px;padding:0;box-shadow:0 20px 80px #16392640}dialog::backdrop{background:#0c231c80}.dialoghead{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2)}.dialoghead h2{margin:0}.dialogbody{padding:22px 24px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.close{border:0;font-size:22px;padding:2px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{color:var(--accent)}.muted{color:var(--ink3)}.history{margin-top:24px}details summary{cursor:pointer;font-weight:600}.history ul{padding-left:20px}.history li{padding:8px 0;font-size:12px;color:var(--ink3)}.history b{color:var(--ink)}#status:empty{display:none}[hidden]{display:none!important}@media(max-width:780px){main{margin:24px auto;padding:0 16px}header{padding:16px}.layout{grid-template-columns:1fr}.bar{align-items:flex-start;flex-wrap:wrap}.cards{gap:10px}.card{padding:16px}.grid{grid-template-columns:1fr}.login{margin:36px auto}.company{margin-top:6px}h1{font-size:24px}.bar button{flex-shrink:0}}

button{border-radius:5px;font-size:12px;padding:9px 12px}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}

.login{max-width:360px;padding:20px;margin:10vh auto;box-shadow:var(--shadow)}.login h1{font-size:17px}.login .brand{margin-bottom:24px}.login .help{border-top:1px solid var(--line2);padding-top:16px}

</style></head><body><header><div class="brand">EventFlow<span>Administração da plataforma</span></div><div><small style="display:block;color:var(--ink2);margin-bottom:6px">Versão 24.09.3</small><button id="logout" hidden>Sair</button></div></header><main id="app"><p role="status">Verificando acesso…</p></main>
<dialog id="modal" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle"></h2><button type="button" class="close" aria-label="Fechar">×</button></div><div class="dialogbody" id="dialogBody"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient("https://shhwlemlxtphbmfhpicu.supabase.co","sb_publishable_Wstk4liRyPPELnMBJx-_qA_8mktUhk9");let state={empresas:[],pessoas:[],historico:[]},selected=null,busy=false,identityId=null;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles={gerencia:'Gerência',producao:'Produção',estoque:'Estoque'};
function message(error){if(error?.code==='42501')return 'Acesso exclusivo do owner.';return error?.message||'Não foi possível concluir. Tente novamente.';}
function login(msg=''){$('logout').hidden=true;$('app').innerHTML=`<section class="card login"><div class="brand">EventFlow</div><h1>Entrar como owner</h1><p>Cadastre empresas e organize os acessos de cada equipe.</p>${msg?`<div class="error" role="alert">${esc(msg)}</div>`:''}<form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" value="eventflow@eventflow.com" required></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Entrar</button></form><p class="help" style="margin-top:20px"><a href="eventflow.html">Voltar para a operação</a></p></section>`;$('loginForm').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button');b.disabled=true;try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('senha').value});if(r.error)throw r.error;await init();}catch(e){login(e.message==='Invalid login credentials'?'E-mail ou senha não conferem.':message(e));}};}
async function init(){try{const r=await sb.auth.getUser();if(!r.data.user){login();return;}identityId=r.data.user.id;const o=await sb.rpc('plataforma_owner');if(o.error)throw new Error('A área owner ainda não foi instalada no banco. Confira o guia de instalação.');$('logout').hidden=false;if(o.data!==true){$('app').innerHTML='<section class="card"><h1>Acesso restrito</h1><p>Esta conta não é owner da plataforma.</p><a href="eventflow.html">Voltar para a operação</a></section>';return;}await load();}catch(e){login(message(e));}}
async function load(){const r=await ownerRequest(sb.rpc('owner_listar'));if(r.error)throw r.error;state=r.data;if(!state.empresas.some(x=>x.id===selected))selected=state.empresas[0]?.id||null;render();}
function render(note=''){const c=state.empresas.find(x=>x.id===selected),people=state.pessoas.filter(x=>x.empresa_id===selected);$('app').innerHTML=`<div class="bar"><div><h1>Empresas e pessoas</h1><p>Cada empresa tem sua própria operação e equipe.</p></div><button class="primary" id="newCompany">+ Nova empresa</button></div><div id="status" class="notice" role="status">${esc(note)}</div><div class="cards"><div class="card"><span class="stat">${state.empresas.length}</span>Empresas cadastradas</div><div class="card"><span class="stat">${state.pessoas.filter(x=>x.ativo).length}</span>Pessoas com perfil ativo</div></div><div class="layout"><aside class="card"><h2>Suas empresas</h2>${state.empresas.length?state.empresas.map(x=>`<button class="company" data-company="${esc(x.id)}" aria-pressed="${x.id===selected}">${esc(x.nome)}<small>${x.ativa?'Ativa':'Suspensa'} · ${state.pessoas.filter(p=>p.empresa_id===x.id).length} pessoas</small></button>`).join(''):'<p>Nenhuma empresa ainda. Comece pelo cadastro.</p>'}</aside><section class="card">${c?`<div class="bar"><div><h2>${esc(c.nome)}</h2><span class="tag ${c.ativa?'':'off'}">${c.ativa?'Ativa':'Suspensa'}</span></div><button id="companyStatus">${c.ativa?'Suspender acesso':'Reativar empresa'}</button></div><div class="bar"><p>${c.documento?esc(c.documento):'Equipe da empresa'}</p><button class="primary" id="newPerson" ${c.ativa?'':'disabled'}>+ Cadastrar pessoa</button></div>${people.length?`<div class="tablewrap"><table><thead><tr><th>Pessoa</th><th>Acesso</th><th>Situação</th><th><span class="muted">Ação</span></th></tr></thead><tbody>${people.map(p=>`<tr><td>${esc(p.nome)}<small>${esc(p.email)}</small><small>${esc(p.cargo||'Cargo não informado')}</small></td><td>${roles[p.papel]||esc(p.papel)}</td><td><span class="tag ${p.ativo?'':'off'}">${p.ativo?'Ativo':'Inativo'}</span></td><td><button data-person="${esc(p.id)}">Editar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h2>Monte a primeira equipe</h2><p>Cadastre alguém da gerência para começar a operação.</p></div>'}`:'<div class="empty"><h2>Comece pela primeira empresa</h2><p>Depois, cadastre as pessoas e defina seus acessos.</p></div>'}</section></div><details class="card history"><summary>Histórico da plataforma · últimas 100 ações</summary><ul>${state.historico.map(h=>`<li><b>${esc(({empresa_criada:'Empresa criada',empresa_status:'Situação da empresa alterada',usuario_criado:'Pessoa cadastrada',usuario_alterado:'Acesso de pessoa alterado'})[h.acao]||h.acao)}</b> · ${esc(state.empresas.find(e=>e.id===h.empresa_id)?.nome||'Empresa')} · ${esc(new Date(h.ocorrido_em).toLocaleString('pt-BR'))}<br>${esc(h.autor_id?'Responsável: '+h.autor_id:'Operação administrativa')}</li>`).join('')||'<li>Nenhuma alteração registrada.</li>'}</ul></details>`;
$('newCompany').onclick=newCompany;document.querySelectorAll('[data-company]').forEach(b=>b.onclick=()=>{selected=b.dataset.company;render();});document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>person(state.pessoas.find(p=>p.id===b.dataset.person)));if(c){$('newPerson').onclick=()=>person();$('companyStatus').onclick=()=>statusCompany(c);}}
function open(title,body,submit){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=`<form id="editForm" novalidate>${body}<div id="formError" role="alert"></div><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form>`;$('cancel').onclick=()=>close();$('editForm').onsubmit=async ev=>{ev.preventDefault();if(busy)return;const invalid=[...ev.target.elements].find(x=>x.willValidate&&!x.validity.valid);if(invalid){const label=ev.target.querySelector('label[for="'+invalid.id+'"]')?.textContent||'Campo';$('formError').className='error';$('formError').textContent=label+': '+invalid.validationMessage;invalid.focus();return;}busy=true;$('formError').className='notice';$('formError').textContent='Salvando… Aguarde a confirmação.';ev.target.querySelector('button[type=submit]').textContent='Salvando…';$('modal').querySelectorAll('button').forEach(b=>b.disabled=true);try{await submit(new FormData(ev.target));await load();close(true);$('status').textContent='Alteração salva.';}catch(e){$('formError').className='error';$('formError').textContent=message(e);}finally{busy=false;$('modal').querySelectorAll('button').forEach(b=>b.disabled=false);const save=$('modal').querySelector('button[type=submit]');if(save)save.textContent='Salvar';}};$('modal').showModal();}
function close(force=false){if(busy&&!force)return;$('modal').close();$('dialogBody').innerHTML='';}
$('modal').querySelector('.close').onclick=()=>close();$('modal').addEventListener('cancel',e=>{e.preventDefault();close();});$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
async function ownerRequest(promise){let timer;try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('O servidor não confirmou o cadastro em 25 segundos. A solicitação pode continuar no servidor. Feche a janela e atualize a lista antes de tentar novamente.')),25000);})]);}finally{clearTimeout(timer);}}
async function rpc(n,p){const r=await ownerRequest(sb.rpc(n,p));if(r.error)throw r.error;return r.data;}
function newCompany(){open('Cadastrar empresa',`<div class="field"><label for="nome">Nome da empresa</label><input id="nome" name="nome" minlength="2" maxlength="120" required></div><div class="field"><label for="documento">CNPJ / documento (opcional)</label><input id="documento" name="documento" maxlength="40"></div>`,async f=>{selected=await rpc('owner_criar_empresa',{p_nome:f.get('nome'),p_documento:f.get('documento')});});}
function person(p){const c=state.empresas.find(e=>e.id===selected);open(p?'Editar pessoa':'Cadastrar pessoa',`<p class="help">Empresa: <b>${esc(c.nome)}</b></p><div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" value="${esc(p?.nome)}" minlength="2" maxlength="120" required></div>${p?'':`<div class="field"><label for="emailPessoa">E-mail de acesso</label><input id="emailPessoa" name="email" type="email" autocomplete="off" required></div>`}<div class="grid"><div class="field"><label for="cargo">Cargo</label><input id="cargo" name="cargo" maxlength="100" value="${esc(p?.cargo)}"></div><div class="field"><label for="papel">Permissão</label><select id="papel" name="papel">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${k===(p?.papel||'producao')?'selected':''}>${v}</option>`).join('')}</select></div></div>${p?`<div class="field"><label for="ativo">Situação</label><select id="ativo" name="ativo"><option value="true" ${p.ativo?'selected':''}>Ativo</option><option value="false" ${!p.ativo?'selected':''}>Inativo</option></select></div>`:`<div class="field"><label for="novaSenha">Senha inicial</label><input id="novaSenha" name="senha" type="password" autocomplete="new-password" required aria-describedby="senhaHelp"><p id="senhaHelp" class="help">Defina a senha de acesso e informe-a à pessoa. Nenhum e-mail será enviado automaticamente.</p></div>`}`,async f=>{if(p)await rpc('owner_alterar_usuario',{p_id:p.id,p_nome:f.get('nome'),p_cargo:f.get('cargo'),p_papel:f.get('papel'),p_ativo:f.get('ativo')==='true'});else{const r=await ownerRequest(sb.functions.invoke('owner-admin',{body:{action:'criar_usuario',empresa_id:selected,...Object.fromEntries(f)}}));if(r.error){let detail;try{detail=await r.error.context?.json();}catch{}throw new Error(detail?.error||detail?.message||r.error.message||'Não foi possível cadastrar. Confira se a função owner-admin foi publicada.');}if(r.data?.error)throw new Error(r.data.error);if(!r.data?.id)throw new Error('A função respondeu, mas não confirmou a criação da pessoa. Confira se owner-admin contém o código do arquivo owner-admin-painel.ts, e não o exemplo inicial do Supabase.');const check=await rpc('owner_listar');if(!check?.pessoas?.some(x=>x.id===r.data.id&&x.empresa_id===selected))throw new Error('A conta foi criada, mas não apareceu vinculada à empresa. Não repita o cadastro: confira o perfil dessa conta no banco.');}});}
function statusCompany(c){open(c.ativa?'Suspender empresa':'Reativar empresa',`<p>${c.ativa?'As pessoas desta empresa perderão acesso à operação e aos links de agenda. Os registros serão preservados.':'As pessoas com perfil ativo poderão acessar novamente.'}</p><p><b>${esc(c.nome)}</b></p>`,()=>rpc('owner_empresa_status',{p_empresa:c.id,p_ativa:!c.ativa}));}
$('logout').onclick=async()=>{await sb.auth.signOut();state={empresas:[],pessoas:[],historico:[]};selected=null;login();};
sb.auth.onAuthStateChange?.((event,session)=>{if(identityId&&(event==="SIGNED_OUT"||(event==="SIGNED_IN"&&session?.user?.id!==identityId)))location.reload();});
init();
